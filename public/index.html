  var backupStatus = { cid:null, texto:"" }; // sobrevive aos redesenhos do Painel
  var BACKUP_NOMES = { fichas:"fichas", resumos:"resumos", documentos:"documentos", documentosNotas:"notas de documentos",
    itensPool:"itens achados", criaturas:"criaturas", encontros:"encontros", encontrosMesa:"ameaças em cena", meta:"meta",
    notas:"notas do mestre", locais:"locais", rolagens:"rolagens", rolagensNpc:"rolagens de NPC", convites:"convites", pedidos:"pedidos" };
  function backupCardHtml(){
    return '<div class="card tight" id="backup-card"><h2>Backup da campanha</h2>' +
      '<p class="hint">Baixa um arquivo com tudo desta campanha: fichas (com os NPCs), documentos e notas, itens achados, criaturas, encontros, configuração, notas do mestre, locais e rolagens. Guarde de vez em quando. <b>Restaurar</b> regrava a campanha com o que está no arquivo (antes disso o site baixa um backup de agora, por segurança); o que foi criado depois do backup continua.</p>' +
      '<div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">' +
        '<button type="button" class="btn accent" data-backup="baixar">Baixar backup da campanha</button>' +
        '<label class="btn secondary" style="cursor:pointer;margin:0">Restaurar de um arquivo<input type="file" accept=".json,application/json" data-backup="arquivo" style="display:none"></label>' +
      '</div><p class="hint" id="backup-status" style="margin:8px 0 0">'+esc(backupStatus.cid === (campanhaAtual && campanhaAtual.id) ? backupStatus.texto : "")+'</p>' +
    '</div>';
  }
  // Lê a campanha aberta inteira (só leitura).
  function lerBackupCampanha(){
    var cmp = campanhaAtual; if(!FB || !cmp) return Promise.reject(new Error("nenhuma campanha aberta"));
    var out = { tipo:"backup-campanha", versao:1, geradoEm:agoraIso(), campanha:{ id:cmp.id, data:clonar(cmp) }, colecoes:{}, contagem:{}, erros:[] };
    return FB.lerDoc("/campanhas", cmp.id).then(function(d){ if(d) out.campanha.data = d; }).catch(function(){}).then(function(){
      return Promise.all(BACKUP_COLECOES.map(function(par){
        return FB.lerColecao(par[1]).then(function(l){ out.colecoes[par[0]] = l; out.contagem[par[0]] = l.length; })
          .catch(function(e){ out.colecoes[par[0]] = []; out.contagem[par[0]] = 0; out.erros.push(par[0]+": "+(e && (e.code||e.message))); });
      }));
    }).then(function(){ return out; });
  }
  function baixarJson(dados, nome){
    var blob = new Blob([JSON.stringify(dados, null, 1)], { type:"application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nome;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function nomeArquivoBackup(sufixo){
    var nome = String((campanhaAtual && campanhaAtual.nome) || "campanha").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"") || "campanha";
    var d = new Date(), p = function(n){ return (n<10?"0":"")+n; };
    return "backup-" + nome + "-" + d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"_"+p(d.getHours())+"h"+p(d.getMinutes()) + (sufixo||"") + ".json";
  }
  function baixarBackupCampanha(sufixo){
    return lerBackupCampanha().then(function(b){ baixarJson(b, nomeArquivoBackup(sufixo)); return b; });
  }
  function resumoContagem(b, soRegravaveis){
    return BACKUP_COLECOES.filter(function(par){ return (!soRegravaveis || !BACKUP_SO_GUARDA[par[0]]) && (b.colecoes[par[0]]||[]).length; })
      .map(function(par){ return (b.colecoes[par[0]]||[]).length + " " + BACKUP_NOMES[par[0]]; }).join(", ");
  }
  // Arquivo antigo (etapa anterior à G): só a lista de personagens.
  function restaurarBackupAntigo(data, rerender){
    if(!podeEditar()) return;
    if(data && !Array.isArray(data) && Array.isArray(data.personagens)) data = data.personagens;
    if(!data || !Array.isArray(data)){ alert("Esse arquivo não é um backup."); return; }
    askConfirm("Esse é um backup antigo, só com fichas. Restaurar "+data.length+" ficha(s) em \""+(campanhaAtual.nome||"")+"\"? Fichas com o mesmo código serão substituídas pela versão do arquivo.", function(){
      var list = loadChars();
      data.forEach(function(nc){
        var idx = list.findIndex(function(x){return x.id===nc.id;});
        // Backup sem vínculo de conta mantém o vínculo que a ficha já tinha aqui.
        if(idx>-1 && list[idx].donoUid && !nc.donoUid){
          nc.donoUid = list[idx].donoUid; nc.donoEmail = list[idx].donoEmail||null; nc.donoNome = list[idx].donoNome||null;
        }
        if(idx>-1) list[idx] = nc; else list.push(nc);
        marcarCharSujo(nc.id);
      });
      saveChars(list);
      clearTimeout(publishTimer); doPublish();
      rerender();
    });
  }
  function restaurarBackupCampanha(b, status){
    var cmp = campanhaAtual;
    if(b.campanha.id !== cmp.id){
      alert("Esse backup é da campanha \""+((b.campanha.data && b.campanha.data.nome) || b.campanha.id)+"\". Abra essa campanha pra restaurar.");
      return;
    }
    var quando = ""; try{ quando = new Date(b.geradoEm).toLocaleString("pt-BR"); }catch(e){}
    var oque = resumoContagem(b, true) || "nada";
    askConfirm("Restaurar o backup de "+(quando||"data desconhecida")+" em \""+(cmp.nome||"")+"\"? Vai regravar "+oque+" e a configuração da campanha com a versão do arquivo. O que foi criado depois do backup continua. Antes, o site baixa um backup de agora.", function(){
      status("Baixando o backup de agora…");
      flushPendente();
      baixarBackupCampanha("_antes-de-restaurar").then(function(){
        status("Restaurando…");
        var ops = [];
        BACKUP_COLECOES.forEach(function(par){
          if(BACKUP_SO_GUARDA[par[0]]) return;
          (b.colecoes[par[0]]||[]).forEach(function(x){
            if(x && x.id && x.data && typeof x.data === "object") ops.push({ tipo:"set", col:par[1], id:String(x.id), data:paraFirestore(x.data) });
          });
        });
        var cfg = b.campanha.data && b.campanha.data.config;
        if(cfg && typeof cfg === "object") ops.push({ tipo:"update", col:"/campanhas", id:cmp.id, data:{ config: paraFirestore(cfg) } });
        return FB.escrever(ops).then(function(){ status("Backup restaurado ("+ops.length+" registros)."); });
      }).catch(function(err){
        console.error("[Pangea] restaurar backup", err);
        status("");
        alert("Não deu pra restaurar: " + (err && (err.code || err.message) || "erro desconhecido") + ". Se algo já foi regravado, é só tentar de novo com o mesmo arquivo.");
      });
    });
  }
  function bindBackupCard(rerender){
    var raiz = app.querySelector("#backup-card"); if(!raiz) return;
    var status = function(t){ backupStatus = { cid: campanhaAtual && campanhaAtual.id, texto: t }; var el = app.querySelector("#backup-status"); if(el) el.textContent = t; };
    var baixar = raiz.querySelector('[data-backup="baixar"]');
    baixar.addEventListener("click", function(){
      baixar.disabled = true; status("Lendo a campanha…");
      flushPendente();
      baixarBackupCampanha("").then(function(b){
        status("Backup baixado: " + (resumoContagem(b, false) || "campanha vazia") + "." + (b.erros.length ? " Não deu pra ler: " + b.erros.join("; ") : ""));
      }).catch(function(err){
        status(""); alert("Não deu pra baixar o backup: " + (err && (err.code || err.message) || "erro desconhecido"));
      }).then(function(){ var bb = app.querySelector('[data-backup="baixar"]'); if(bb) bb.disabled = false; });
    });
    raiz.querySelector('[data-backup="arquivo"]').addEventListener("change", function(e){
      var f = e.target.files && e.target.files[0]; if(!f) return;
      e.target.value = "";
      var r = new FileReader();
      r.onload = function(){
        var data = null;
        try{ data = JSON.parse(String(r.result||"")); }catch(_){ alert("Esse arquivo não é um backup (não deu pra ler o .json)."); return; }
        if(data && data.tipo === "backup-campanha" && data.campanha && data.colecoes) restaurarBackupCampanha(data, status);
        else if(data && data.tipo === "backup-completo-banco") alert("Esse é o backup do banco inteiro (feito pelo Console). Ele serve de cópia de segurança e não é restaurado por aqui.");
        else if(data && data.tipo && data.tipo !== "backup-pangea") alert("Esse arquivo não é um backup de campanha (é de outro tipo: "+data.tipo+").");
        else restaurarBackupAntigo(data, rerender);
      };
      r.readAsText(f);
    });
  }

  // ----- WIZARD -----
  // Etapa C: os passos e os nomes dependem da configuração da campanha. Os índices
  // (0 a 6) continuam fixos, porque a edição da ficha reaproveita cada passo.
  function wizRotulo(step){
    var cr = cfgCriacao();
    if(step === 0) return grupoLigado() ? grupoRotulo() : "Nome";
    if(step === 2){
      if(cr.propositos === "livro") return "Propósitos";
      var pp = cr.propPers; return pp.qtd1 && pp.qtd2 ? pp.nome1+" e "+pp.nome2 : (pp.qtd1 ? pp.nome1 : pp.nome2) || "Propósitos";
    }
    if(step === 6) return cr.artefato && cr.kitInicial ? "Artefato e Equipamentos" : (cr.artefato ? "Artefato inicial" : "Equipamentos iniciais");
    return WIZ_STEPS[step];
  }
  function wizEtapas(){
    var cr = cfgCriacao();
    return [0,1,2,3,4,5,6].filter(function(st){
      if(st === 2) return cr.propositos === "livro" || (cr.propPers.qtd1 + cr.propPers.qtd2) > 0;
      if(st === 6) return !!(cr.artefato || cr.kitInicial);
      return true;
    });
  }
  function stepsBar(current){
    // A cor de todas as bolinhas vem do --camp-color herdado do wrapper (ver renderWizard); sem precisar de lógica extra aqui.
    var s = '<div class="steps">';
    var etapas = wizEtapas(), pos = etapas.indexOf(current);
    etapas.forEach(function(st, i){
      var cls = i < pos ? "done" : (i === pos ? "current" : "");
      s += '<span class="'+cls+'" data-wizir="'+st+'" title="'+esc(wizRotulo(st))+'">'+(i+1)+'</span>';
    });
    s += '</div>';
    return s;
  }

  function renderWizard(){
    var c = state.draft;
    var etapas = wizEtapas();
    if(etapas.indexOf(state.wizStep) < 0) state.wizStep = etapas.filter(function(st){ return st > state.wizStep; })[0] || etapas[etapas.length-1];
    var step = state.wizStep, pos = etapas.indexOf(step);
    var campColor = c.acampamento && CAMPS[c.acampamento] ? CAMPS[c.acampamento].cor : null;
    var html = topbar("wizard");
    html += '<div'+(campColor?' style="--camp-color:'+campColor+'"':'')+'>';
    if(modoBase && pos === 0) html += '<div class="card tight"><p class="hint" style="margin:0"><b>Ficha nova, fora de campanha.</b> Ela segue a criação padrão do livro e fica em <b>Minhas fichas</b>. Ao entrar numa campanha pelo link de convite, você escolhe esta ficha e completa só o que a campanha pedir a mais; o mestre aprova e ajusta o resto.</p></div>';
    html += '<div class="card">' + stepsBar(step) + '<h2'+(campColor?' style="color:'+campColor+'"':'')+'>Passo '+(pos+1)+': '+esc(wizRotulo(step))+'</h2>';
    html += wizardStepBody(c, step);
    html += '</div>';
    html += '<div class="btn-row">';
    html += pos>0 ? '<button class="btn secondary" data-wiz="back">Voltar</button>' : '<button class="btn secondary" data-wiz="cancel">Cancelar</button>';
    html += pos < etapas.length-1 ? '<button class="btn accent" data-wiz="next">Avançar</button>' : '<button class="btn accent" data-wiz="finish">Concluir Ficha</button>';
    html += '</div>';
    html += '</div>';
    app.innerHTML = html + caixaHtml();
    bindGlobal();
    bindWizardStep(c, step);

    app.querySelectorAll(".steps span[data-wizir]").forEach(function(el){
      el.addEventListener("click", function(){ state.wizStep = parseInt(el.getAttribute("data-wizir"),10); render(); });
    });

    app.querySelectorAll("[data-wiz]").forEach(function(el){
      el.addEventListener("click", function(){
        var action = el.getAttribute("data-wiz");
        if(action === "cancel"){ goto("roster"); return; }
        if(action === "back"){ state.wizStep = etapas[Math.max(0, pos-1)]; render(); return; }
        if(action === "next"){
          var v = validateStep(c, step);
          if(!v.ok){ alert(v.msg); return; }
          state.wizStep = etapas[Math.min(etapas.length-1, pos+1)];
          render();
          return;
        }
        if(action === "finish"){
          // Confere todos os passos da campanha (pode ter pulado algum pelas bolinhas).
          for(var ie=0; ie<etapas.length; ie++){
            var vf = validateStep(c, etapas[ie]);
            if(!vf.ok){ state.wizStep = etapas[ie]; render(); alert(vf.msg); return; }
          }
          var pend = fichaPendencias(c);
          if(pend.length && !c.__pendOk){
            askConfirm("Ainda ficou em branco: "+pend.join(", ")+". Dá pra completar depois em Editar Ficha. Concluir assim mesmo?", function(){ c.__pendOk = true; el.click(); });
            return;
          }
          delete c.__pendOk;
          if(!String(c.nomePersonagem||"").trim()) c.nomePersonagem = "";
          if(c.xpInicial == null) c.xpInicial = cfgValores().xpInicial;
          if(!podeEditar()) return;
          c.atualizadoEm = new Date().toISOString();
          // NPC é ficha da mesa: fica sem conta vinculada e só o mestre vê.
          if(caps.mode === "mesa" && usuario && !c.ehNpc){ c.donoUid = usuario.uid; c.donoEmail = usuario.email||null; c.donoNome = usuario.displayName||null; }
          if(c.ehNpc){ c.donoUid = null; c.donoEmail = null; c.donoNome = null; }
          // Etapa H: ficha criada na tela inicial = ficha-base da conta, fora de campanha.
          if(modoBase){ c.ehNpc = false; c.ehBase = true; c.campanhas = []; c.baseCriadaEm = c.atualizadoEm; c.criadaForaDeCampanha = true; }
          var list = loadChars(); list.push(c);
          if(caps.mode === "mesa") marcarCharSujo(c.id);
          saveChars(list);
          marcarComoMeu(c.id);
          goto("sheet", {charId:c.id});
        }
      });
    });
  }

  // Etapa C (pedido do Marco): nada na criação é obrigatório. A ficha pode ser
  // completada em várias etapas ou depois de pronta. validateStep só barra o que
  // passa dos limites das regras; o que ficou em branco vira pendência (fichaPendencias).
  // Característica marcada sem cumprir o requisito: bloqueia sempre (criação, refazer
  // e edição livre do Assimilador). Devolve a mensagem ou "" se estiver tudo certo.
  function caracSemRequisitoMsg(c){
    var semReq = (c.caracComp||[]).map(function(id){ return CARACTERISTICAS.filter(function(x){return x.id===id;})[0]; })
      .filter(function(d){ return d && !reqAtendido(c, d); });
    if(!semReq.length) return "";
    return '"'+semReq[0].nome+'" pede '+reqFaltando(c, semReq[0])+'. Desmarque ou ajuste os valores.';
  }
  function validateStep(c, step){
    var cr = cfgCriacao(), vals = cr.valores;
    if(step === 3){
      var alvoInst = INSTINTOS.length + vals.instintoLivres;
      var totalInst = sum(INSTINTOS.map(function(i){ return c.instintos[i[0]]||0; }));
      var badInst = INSTINTOS.filter(function(i){ var v = c.instintos[i[0]]||0; return v<1 || v>vals.instintoMax; });
      if(badInst.length) return {ok:false, msg:"Cada Instinto começa em 1 e pode ir até "+vals.instintoMax+"."};
      if(totalInst > alvoInst) return {ok:false, msg:"Os Instintos somam no máximo "+alvoInst+" (1 em cada + "+vals.instintoLivres+" pontos livres). Agora estão em "+totalInst+"."};
      return {ok:true};
    }
    if(step === 4){
      var total = conhPratPontosGastos(c), cpP = vals.cpPontos;
      if(total > cpP) return {ok:false, msg:"Você gastou "+total+" de "+cpP+" pontos. Reduza algum valor."};
      var over = CONH_PRAT.filter(function(p){ return c.conhPrat[p[0]] > vals.cpMax; });
      if(over.length) return {ok:false, msg:"Nessa etapa, o máximo por Conhecimento/Prática é "+vals.cpMax+"."};
      return {ok:true};
    }
    if(step === 5){
      var tc = caracPontosGastos(c);
      var xpCar = xpParaCaracteristicas(c);
      if(tc > xpCar) return {ok:false, msg:"Você gastou "+tc+" de "+xpCar+" Pontos de Experiência. Ajuste suas escolhas."};
      var msgReq = caracSemRequisitoMsg(c);
      if(msgReq) return {ok:false, msg:msgReq};
      return {ok:true};
    }
    if(step === 6){
      var ec = equipCusto(c);
      if(ec > escassezTetoInicial() && !temCarac(c,"reliquia")) return {ok:false, msg:"O Artefato inicial pode ter no máximo Escassez "+escassezTetoInicial()+" (agora está em "+ec+")."};
      return {ok:true};
    }
    return {ok:true};
  }
  // O que ficou em branco na ficha (não impede salvar; aparece como lembrete).
  function fichaPendencias(c){
    var cr = cfgCriacao(), vals = cr.valores, out = [], etapas = wizEtapas();
    var vazio = function(x){ return !String(x||"").trim(); };
    if(vazio(c.nomePersonagem)) out.push("nome do personagem");
    if(grupoLigado() && grupoOpcoes().length && !c.acampamento) out.push(grupoRotulo().toLowerCase());
    (cr.camposExtras||[]).forEach(function(f){ if(vazio((c.extras||{})[f.id])) out.push(f.rotulo); });
    var o = c.origem || {};
    if(vazio(o.geracao)) out.push("Geração"); if(vazio(o.evento)) out.push("Evento Marcante"); if(vazio(o.ocupacao)) out.push("Ocupação");
    if(etapas.indexOf(2) > -1){
      var pi = c.propIndividuais||[], pr = c.propRelacionais||[], k, n = 0;
      if(cr.propositos === "livro"){
        for(k=0;k<2;k++) if(vazio(pi[k])) n++;
        if(n) out.push(n+" Propósito"+(n>1?"s":"")+" Pessoa"+(n>1?"is":"l"));
        // Propósito Coletivo pode vir depois, com o grupo: não entra como pendência.
      } else {
        var pp = cr.propPers, n1 = 0, n2 = 0;
        for(k=0;k<pp.qtd1;k++) if(vazio(pi[k])) n1++;
        for(k=0;k<pp.qtd2;k++) if(vazio(pr[k])) n2++;
        if(n1) out.push(n1+" "+(n1>1?pp.nome1:pp.item1));
        if(n2) out.push(n2+" "+(n2>1?pp.nome2:pp.item2));
      }
    }
    var livresInst = sum(INSTINTOS.map(function(i){ return c.instintos[i[0]]||0; })) - INSTINTOS.length;
    if(livresInst < vals.instintoLivres) out.push((vals.instintoLivres-livresInst)+" ponto(s) de Instinto");
    var cpG = conhPratPontosGastos(c);
    if(cpG < vals.cpPontos) out.push((vals.cpPontos-cpG)+" ponto(s) de Conhecimentos e Práticas");
    var semEscolha = (c.caracComp||[]).map(function(id){ return CARACTERISTICAS.filter(function(x){return x.id===id;})[0]; })
      .filter(function(d){ return d && d.escolha && !((c.caracEscolhas||{})[d.id]); });
    semEscolha.forEach(function(d){ out.push('sentido de "'+d.nome+'"'); });
    if(c.equip && (c.equip.traits||[]).length && vazio(c.equip.nome)) out.push("nome do Artefato");
    return out;
  }

  // O Assimilador pode mudar tudo na edição de uma ficha: os tetos da criação
  // (Instinto até 3, Conhecimento/Prática até 2) sobem pra 6 e as validações
  // viram só um aviso na hora de salvar (pedido do Marco, 30/09/2026).
  function edicaoLivre(){ return state.view === "sheet" && !!state.sheetEditing && temAcessoTotal(); }
  function tetoEdicao(padrao){ return edicaoLivre() ? 6 : padrao; }
  function stepperField(kind, label, desc, id, value, min, max, disabled){
    return '<div class="field field-stepper">' +
      '<label>'+label+'</label>' +
      (desc ? '<p class="hint attr-desc" style="margin-top:-2px">'+desc+'</p>' : '') +
      '<div class="stepper">' +
        '<button type="button" class="stepper-btn" data-stepbtn="'+kind+'" data-id="'+id+'" data-dir="-1"'+(disabled?' disabled':'')+'>&minus;</button>' +
        '<input type="number" min="'+min+'" max="'+max+'" data-'+kind+'="'+id+'" value="'+value+'"'+(disabled?' disabled':'')+'>' +
        '<button type="button" class="stepper-btn" data-stepbtn="'+kind+'" data-id="'+id+'" data-dir="1"'+(disabled?' disabled':'')+'>+</button>' +
      '</div>' +
    '</div>';
  }

  // Lista de checkboxes de características de equipamento/item: compartilhada
  // entre o equipamento icônico (wizard passo 6) e itens de inventário
  // (renderItemForm), que usam a mesma estrutura com prefixos de atributo
  // diferentes ("equip" / "item").
  // Lista de características de Artefato (pág. 97-98) com a categoria de cada uma.
  // bloqueado=true mostra só as escolhidas, sem poder mudar (ver Gambiarra).
  // Livro pág. 87: só quem tem Gambiarra muda as características de um Artefato
  // existente. Na criação (e ao refazer a ficha pro sistema oficial) é livre, e o
  // Assimilador sempre pode.
  // Pedido do Marco (30/09/2026): os jogadores também editam o próprio Artefato
  // pelo "Editar Ficha", sem precisar de Gambiarra. A regra de Escassez continua
  // valendo ao salvar (o Assimilador pode salvar mesmo assim).
  function artefatoBloqueado(c){ return false; }
  function renderTraitList(selectedTraits, prefix, bloqueado){
    var html = "";
    EQUIP_TRAITS.forEach(function(t){
      var sel = selectedTraits.filter(function(s){return s.id===t.id;})[0];
      var checked = !!sel;
      if(bloqueado && !checked) return;
      html += '<label class="trait'+(checked?" checked":"")+'"><input type="checkbox" data-'+prefix+'trait="'+t.id+'" '+(checked?"checked":"")+(bloqueado?" disabled":"")+'>' +
        '<span class="cost">'+(t.custo>0?"+":"")+t.custo+'</span><span class="txt"><b>'+t.nome+'</b> <span class="hint" style="display:block;margin:1px 0 3px">Categoria '+t.cat+(t.rep?" · pode repetir":"")+'</span><span>'+iconizarTexto(t.txt)+'</span>';
      if(t.rep && checked && !bloqueado){
        var opts = ""; for(var q=1;q<=(t.repMax||2);q++){ opts += '<option value="'+q+'"'+(sel.qtd===q?" selected":"")+'>'+q+'x</option>'; }
        html += '<div class="row" style="margin-top:6px"><label style="margin:0">Quantas vezes:</label><select data-'+prefix+'traitqtd="'+t.id+'">'+opts+'</select></div>';
      }
      html += '</span></label>';
    });
    if(bloqueado && !selectedTraits.length) html += '<p class="hint">Sem características.</p>';
    return html;
  }

  // onChange dispara na marcação/troca de quantidade (não no campo de
  // aptidão, que nunca precisa re-renderizar). O equipamento icônico usa
  // onChange pra recalcular usosMax/espaço antes de re-renderizar; o
  // formulário de item novo (draft, ainda não salvo) só re-renderiza.
  function bindTraitList(prefix, traits, onChange){
    app.querySelectorAll("[data-"+prefix+"trait]").forEach(function(el){
      el.addEventListener("change", function(){
        var id = el.getAttribute("data-"+prefix+"trait");
        var idx = traits.findIndex(function(s){return s.id===id;});
        if(el.checked && idx===-1) traits.push({id:id, qtd:1});
        if(!el.checked && idx>-1) traits.splice(idx,1);
        if(onChange) onChange();
      });
    });
    app.querySelectorAll("[data-"+prefix+"traitqtd]").forEach(function(el){
      el.addEventListener("change", function(){
        var id = el.getAttribute("data-"+prefix+"traitqtd");
        var sel = traits.filter(function(s){return s.id===id;})[0];
        if(sel) sel.qtd = parseInt(el.value,10);
        if(onChange) onChange();
      });
    });
    app.querySelectorAll("[data-"+prefix+"traitapt]").forEach(function(el){
      el.addEventListener("input", function(){
        var id = el.getAttribute("data-"+prefix+"traitapt");
        var sel = traits.filter(function(s){return s.id===id;})[0];
        if(sel) sel.aptidao = el.value;
      });
    });
  }

  // Botões +/- com clamp: usado pelos steppers de Instintos, Conhecimentos &
  // Práticas, bônus de Assimilação e Rolagem Seca. get/set acessam o valor
  // porque cada chamador guarda o número num formato de objeto diferente.
  function bindStepper(kind, get, set, min, max, onChange){
    app.querySelectorAll('[data-stepbtn="'+kind+'"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        var dir = parseInt(btn.getAttribute("data-dir"),10);
        set(id, clamp((get(id)||0)+dir, min, max));
        if(onChange) onChange();
      });
    });
  }

  // Campos extras da campanha (etapa C): texto livre ou escolha entre opções.
  // Ficam em c.extras[id] e aparecem na Origem da ficha.
  function camposExtrasFormHtml(c){
    var lista = cfgCriacao().camposExtras || [];
    if(!lista.length) return '';
    var ex = c.extras || {};
    return '<div class="grid cols-2" style="margin-top:10px">' + lista.map(function(f){
      var v = ex[f.id] || "";
      var rot = esc(f.rotulo||"Campo");
      if(f.tipo === "escolha"){
        var ops = (f.opcoes||[]).filter(function(o){ return String(o).trim(); });
        return '<div class="field"><label>'+rot+'</label><select data-extra="'+esc(f.id)+'"><option value="">escolha…</option>' +
          ops.map(function(o){ return '<option value="'+esc(o)+'"'+(v===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('') +
          (v && ops.indexOf(v)<0 ? '<option value="'+esc(v)+'" selected>'+esc(v)+'</option>' : '') + '</select>' +
          (f.ajuda ? '<p class="hint" style="margin:4px 0 0">'+esc(f.ajuda)+'</p>' : '') + '</div>';
      }
      return '<div class="field"><label>'+rot+'</label><input type="text" data-extra="'+esc(f.id)+'" value="'+esc(v)+'"'+(f.ajuda?' placeholder="'+esc(f.ajuda)+'"':'')+'></div>';

  }
  function bindCamposExtras(c){
    app.querySelectorAll("[data-extra]").forEach(function(el){
      el.addEventListener(el.tagName === "SELECT" ? "change" : "input", function(){
        if(!c.extras) c.extras = {};
        c.extras[el.getAttribute("data-extra")] = el.value;
      });
    });
  }

    if(step === 6){

      html += '<div class="field"><label>Nome do Artefato</label><input type="text" data-equip="nome" value="'+esc(c.equip.nome)+'"></div>';
      html += '<div class="field"><label>Descrição / história curta</label><textarea data-equip="desc">'+esc(c.equip.desc)+'</textarea></div>';
      html += '<div class="budget '+((teto!==null && ec>teto)?"bad":"ok")+'"><span>Escassez</span><span class="num">'+ec+(teto!==null?' / '+teto:'')+' · '+(ESCASSEZ_NOMES[clamp(ec,0,6)]||"")+'</span></div>';
      html += '<div class="trait-list">' + renderTraitList(c.equip.traits, "equip", bloqueado) + '</div>';
      var espacosoWiz = espacosoBonus(c.equip.traits);
      var usosW = equipUsosMax(c);
      html += '<p class="hint" style="margin-top:10px">Qualidade inicial: <b>Padrão (3)</b> · Espaço que ocupa: <b>'+equipEspaco(c)+'</b>'+(usosW?' · <b>'+usosW+'</b> uso'+(usosW>1?'s':''):'')+(espacosoWiz>0?' · <b>+'+espacosoWiz+'</b> no teto de inventário (Espaçoso)':'')+'</p>';
      }
      if(!mostraKit) return html;
      html += '<h3 style="margin:'+(mostraArt?'20px':'0')+' 0 8px">Pacote inicial (opcional)</h3>';
      html += '<p class="hint">Escolha um pacote de equipamentos (pág. 90 do livro) pra começar o inventário. Dá pra trocar à vontade, e ajustar ou remover cada item depois, na ficha.</p>';
      html += '<div class="kit-pick">';
      html += '<button type="button" class="kit-opt'+(!c.kitInicial?' selected':'')+'" data-kit="">' +
        '<h4>Nenhum</h4><p>Só o Artefato inicial.</p></button>';
      KITS_INICIAIS.forEach(function(k){
        html += '<button type="button" class="kit-opt'+(c.kitInicial===k.id?' selected':'')+'" data-kit="'+k.id+'">' +
          '<h4>'+esc(k.nome)+'</h4>' +
          '<p>'+k.itens.map(function(it){ return esc(it[1]>1 ? it[0]+' x'+it[1] : it[0]); }).join(", ")+'</p>' +
        '</button>';
      });
      html += '</div>';
      return html;
    }
    return "";
  }

  function bindWizardStep(c, step, rerender){
    rerender = rerender || renderWizard;
    if(step === 0){
      app.querySelectorAll("[data-camp]").forEach(function(el){
        el.addEventListener("click", function(){ c.acampamento = el.getAttribute("data-camp"); rerender(); });
      });
      app.querySelectorAll("[data-basicinfo]").forEach(function(el){
        el.addEventListener("input", function(){ c[el.getAttribute("data-basicinfo")] = el.value; });
      });
      var npcWiz = app.querySelector('[data-wiznpc]');
      if(npcWiz) npcWiz.addEventListener("change", function(){ c.ehNpc = npcWiz.checked; });
    }
    if(step === 0) bindCamposExtras(c, rerender);
    if(step === 1){
      app.querySelectorAll("[data-origem]").forEach(function(el){
        el.addEventListener("input", function(){ c.origem[el.getAttribute("data-origem")] = el.value; });
      });
      app.querySelectorAll("[data-geracaoopt]").forEach(function(el){
        el.addEventListener("change", function(){ if(el.checked){ c.origem.geracao = el.getAttribute("data-geracaoopt"); rerender(); } });
      });
    }
    if(step === 2){
      app.querySelectorAll("[data-prop]").forEach(function(el){
        el.addEventListener("input", function(){
          var k = el.getAttribute("data-prop"), n = parseInt(k.slice(3),10);
          var arr = k.indexOf("ind")===0 ? (c.propIndividuais = c.propIndividuais || []) : (c.propRelacionais = c.propRelacionais || []);
          while(arr.length <= n) arr.push("");
          arr[n] = el.value;
        });
      });
    }
    if(step === 3){
      app.querySelectorAll("[data-instinto]").forEach(function(el){
        el.addEventListener("input", function(){
          c.instintos[el.getAttribute("data-instinto")] = clamp(parseInt(el.value,10),1,tetoEdicao(cfgValores().instintoMax));
          rerender();
        });
      });
      bindStepper("instinto", function(id){ return c.instintos[id]; }, function(id,v){ c.instintos[id] = v; }, 1, tetoEdicao(cfgValores().instintoMax), rerender);
    }
    if(step === 4){
      app.querySelectorAll("[data-cp]").forEach(function(el){
        el.addEventListener("input", function(){
          c.conhPrat[el.getAttribute("data-cp")] = clamp(parseInt(el.value,10),0,tetoEdicao(cfgValores().cpMax));
          rerender();
        });
      });
      bindStepper("cp", function(id){ return c.conhPrat[id]; }, function(id,v){ c.conhPrat[id] = v; }, 0, tetoEdicao(cfgValores().cpMax), rerender);
    }
    if(step === 5){
      app.querySelectorAll("[data-aumento]").forEach(function(el){
        el.addEventListener("change", function(){
          var k = el.getAttribute("data-aumento"); var v = parseInt(el.value,10);
          if(v>0){ c.caracAumentos[k] = v; } else { delete c.caracAumentos[k]; }
          rerender();
        });
      });
      app.querySelectorAll("[data-carac]").forEach(function(el){
        el.addEventListener("change", function(){
          var id = el.getAttribute("data-carac");
          var idx = c.caracComp.indexOf(id);
          if(el.checked && idx===-1) c.caracComp.push(id);
          if(!el.checked && idx>-1){ c.caracComp.splice(idx,1); if(c.caracEscolhas) delete c.caracEscolhas[id]; }
          rerender();
        });
      });
      app.querySelectorAll("[data-caracescolha]").forEach(function(el){
        el.addEventListener("change", function(){
          if(!c.caracEscolhas) c.caracEscolhas = {};
          c.caracEscolhas[el.getAttribute("data-caracescolha")] = el.value;
        });
      });
    }
    if(step === 6){
      app.querySelectorAll("[data-equip]").forEach(function(el){
        el.addEventListener("input", function(){ c.equip[el.getAttribute("data-equip")] = el.value; });
      });
      bindTraitList("equip", c.equip.traits, function(){
        c.equip.usosMax = equipUsosMax(c); c.equip.usosAtual = c.equip.usosMax; c.equip.espaco = equipEspaco(c);
        rerender();
      });
      app.querySelectorAll("[data-kit]").forEach(function(el){
        el.addEventListener("click", function(){
          aplicarKitInicial(c, el.getAttribute("data-kit") || null);
          rerender();
        });
      });
    }
  }

  // ----- SHEET (view/edit an existing character) -----
  function getChar(id){ return loadChars().filter(function(c){return c.id===id;})[0]; }
  function updateChar(c){
    if(!podeEditar()) return;
    c.atualizadoEm = new Date().toISOString();
    var list = loadChars();
    var idx = list.findIndex(function(x){return x.id===c.id;});
    if(idx>-1){
      list[idx]=c;
      if(caps.mode === "mesa") marcarCharSujo(c.id);
      saveChars(list);
    }
  }
  function deleteChar(id){
    if(!podeEditar()) return;
    var list = loadChars().filter(function(c){return c.id!==id;});
    if(caps.mode === "mesa") marcarCharExcluido(id);
    saveChars(list);
  }

  // ----- CONFIRMAÇÃO DE EDIÇÃO (Saúde, Cabo de Guerra e Equipamento/Inventário) -----
  // Esses campos mudam muitas vezes seguidas durante o jogo (ex.: um combate
  // inteiro só mexendo em Saúde), e cada clique publicando na hora - mesmo já
  // agrupado pelo debounce de schedulePublish - ainda gerava um recarregamento
  // de TODAS as abas a cada ~1,2s de pausa (ver o comentário grande acima de
  // dirtyCharIds/schedulePublish). Por isso, em modo mesa, esses campos não
  // chamam updateChar (e não publicam nada) a cada clique: só marcam que ESTE
  // personagem tem uma pendência (state.pendenteCharId, só nesta aba, nunca
  // salva) até o jogador clicar "Confirmar alterações" (pendingBannerHtml, na
  // própria ficha) - ou sair da ficha/fechar a aba, que confirmam sozinhos como
  // rede de segurança (ver goto/aoDescarregarAba). Em modo local (sem mesa),
  // cai direto pra updateChar, sem pendência nenhuma - não tem por que existir
  // sem sincronização com ninguém.
  //
  // Risco residual aceito: como QUALQUER publicação de QUALQUER jogador
  // recarrega a página inteira (ver mesmo comentário acima), se outra pessoa
  // publicar algo enquanto uma pendência local ainda não foi confirmada, essa
  // pendência pode se perder no recarregamento forçado. goto/aoDescarregarAba
  // reduzem bastante essa janela (confirmam ao sair da ficha ou fechar a aba),
  // mas não eliminam por completo - o mesmo é verdade, hoje, pro rascunho de
  // "Editar Ficha" e pro assistente de criação, que já tinham esse risco.
  // secao identifica qual card gerou a pendência ("saude"/"cabo"/"equip"/"inv") - só usado
  // pra decidir perto de qual seção mostrar o botão "Confirmar alterações"
  // (pendingSectionBannerHtml); a confirmação em si sempre publica o personagem inteiro
  // de uma vez (não dá granularidade por campo no modelo atual).
  // No site com Firebase cada ficha grava sozinha e as outras telas só atualizam
  // o necessário, então não precisa mais juntar mudanças e "Confirmar alterações"
  // (isso existia por causa do Artefato do Claude). Tudo salva automaticamente.
  function marcarPendenteOuSalvar(c, secao){
    if(!podeEditar()) return;
    updateChar(c);
    if(caps.mode === "mesa") schedulePublish();
  }
  function temPendente(c){ return state.pendenteCharId === c.id; }
  function temPendenteSecao(c, secao){ return state.pendenteCharId === c.id && !!state.pendenteSecoes[secao]; }
  function confirmarPendente(c){
    if(state.pendenteCharId !== c.id) return;
    state.pendenteCharId = null;
    state.pendenteSecoes = {};
    updateChar(c);
    clearTimeout(publishTimer);
    doPublish();
  }
  function flushPendente(){
    if(state.pendenteCharId){
      var c = getChar(state.pendenteCharId);
      if(c) confirmarPendente(c);
    }
  }
  // Botão "Confirmar alterações" compacto, injetado perto da seção específica que tem
  // a pendência (ver renderSheet/tugDeGuerraCardHtml) em vez de um aviso genérico único
  // no topo da ficha - assim fica claro ONDE está a mudança ainda não confirmada,
  // mesmo com mais de uma seção pendente ao mesmo tempo.
  function pendingSectionBannerHtml(c, secao){
    if(!temPendenteSecao(c, secao)) return "";
    return '<div class="card tight pending-banner" style="border-color:var(--accent);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px">' +
      '<p class="hint" style="margin:0">Alteração ainda não confirmada com a mesa.</p>' +
      '<button type="button" class="btn accent" data-action="confirmar-pendente">Confirmar alterações</button>' +
    '</div>';
  }

  function renderSheet(){
    var c = getChar(state.charId);
    if(!c){ goto("roster"); return; }
    // Ficha que esta conta não pode ver: volta pro início.
    if(!isCharUnlocked(c)){ goto("roster"); return; }
    // Animação de "aparecer" (uma vez só, consumida aqui).
    var playReveal = !!state.sheetRevealAnim;
    state.sheetRevealAnim = false;
    var camp = c.acampamento ? CAMPS[c.acampamento] : null;
    var html = topbar("sheet");
    html += '<div'+(playReveal?' class="sheet-reveal"':'')+(camp?' style="--camp-color:'+camp.cor+'"':'')+'>';

    if(state.deleteConfirm){
      html += '<div class="card" style="border:3px solid var(--danger);background:rgba(162,58,58,.08)">' +
        '<h2 style="color:var(--danger)">Excluir "'+esc(c.nomePersonagem||"este personagem")+'" definitivamente?</h2>' +
        '<p style="font-weight:700;font-size:15.5px">Essa ação NÃO PODE SER DESFEITA. Todos os dados dessa ficha (Instintos, Conhecimentos, Práticas, Características, Equipamento, Inventário, Notas) serão apagados desta campanha pra sempre.</p>' +
        '<p class="hint">Só dá pra recuperar por um backup da campanha baixado antes pelo mestre (Painel do Assimilador → Backup da campanha).</p>' +
        '<div class="btn-row"><button class="btn secondary" data-action="cancel-delete">Cancelar</button><button class="btn danger" data-action="confirm-delete">Sim, excluir definitivamente</button></div>' +
      '</div></div>';
      app.innerHTML = html + caixaHtml();
      bindGlobal();
      app.querySelector('[data-action="cancel-delete"]').addEventListener("click", function(){ state.deleteConfirm = false; render(); });
      app.querySelector('[data-action="confirm-delete"]').addEventListener("click", function(){ deleteChar(c.id); state.deleteConfirm = false; goto("roster"); });
      return;
    }

    if(caps.mode === "mesa" && !caps.canEdit){
      html += '<div class="card tight" style="border-color:var(--danger)"><p class="hint" style="margin:0;color:var(--danger)">Modo somente leitura: este link não tem permissão de edição.</p></div>';
    }

    html += '<div class="card" style="border-left:6px solid '+(camp?camp.cor:'var(--accent)')+'">';
    html += '<div class="row" style="justify-content:space-between">';
    html += '<div><h2 style="margin-bottom:2px">'+esc(c.nomePersonagem||"Sem nome")+npcBadgeHtml(c)+'</h2><span class="camp-tag">'+(camp?esc(camp.nome)+' · ':'')+'jogador(a): <input type="text" data-jogador value="'+esc(c.nomeJogador)+'" placeholder="seu nome" style="width:140px;display:inline-block"></span>' +
      (caps.mode === "mesa" && ehMestre() && c.donoEmail ? ' <span class="hint">· vinculada a '+esc(c.donoEmail)+'</span>' : '') +
      '</div>';
    if(camp && camp.img) html += '<img src="'+esc(camp.img)+'" alt="" style="width:88px;height:88px">';
    html += '</div></div>';

    var pendFicha = (!c.precisaRefazer && !c.ehNpc && (temAcessoTotal() || (usuario && c.donoUid === usuario.uid))) ? fichaPendencias(c) : [];
    if(pendFicha.length){
      html += '<div class="card tight ficha-pendente"><p class="hint" style="margin:0"><b>Ficha em construção.</b> Ainda em branco: '+esc(pendFicha.join(", "))+'. Dá pra completar quando quiser em <b>Editar Ficha</b>.</p></div>';
    }
    if(c.precisaRefazer){
      html += '<div class="card" style="border:2px solid var(--accent)">' +
        '<h2 style="margin-bottom:6px">Atualize a ficha pro sistema oficial</h2>' +
        '<p class="hint" style="margin-top:0">A ficha agora segue o livro de regras definitivo. A história, os Instintos, as mutações e o Cabo de Guerra foram mantidos, mas é preciso refazer: <b>Conhecimentos e Práticas</b> (7 pontos), <b>Características</b> (7 Pontos de Experiência, com requisitos) e o <b>Artefato inicial</b> (Escassez até '+escassezTetoInicial()+').</p>' +
        ((c.caracAntigas&&c.caracAntigas.length)||(c.equipAntigo&&c.equipAntigo.nome) ? '<p class="hint">Antes: '+
          ((c.caracAntigas||[]).length ? 'Características '+esc(c.caracAntigas.join(", ").replace(/_/g," "))+'. ' : '') +
          (c.equipAntigo&&c.equipAntigo.nome ? 'Equipamento "'+esc(c.equipAntigo.nome)+'"'+(c.equipAntigo.traits.length?' ('+esc(c.equipAntigo.traits.join(", "))+')':'')+'.' : '') + '</p>' : '') +
        '<div class="btn-row" style="margin-top:6px"><span></span><button class="btn accent" data-action="refazer">Refazer agora</button></div>' +
      '</div>';
    }

    html += tentarHtml("Navegação", function(){ return fichaNavHtml(c); });

    html += '<div class="grid cols-2">';

    // Origem / Propositos
    // Cada tópico é só uma linha (título + começo do texto); o texto inteiro abre
    // numa caixa ao lado (ver abrirOrigemPop), pra o cartão não crescer.
    html += sectionCard("origem", origemTitulo(),
      '<div class="lx-lista">' + origemTopicos(c).map(function(t){
        var prev = t.itens.filter(Boolean).join(" · ");
        return caixaLinha("orig", t.k, esc(t.titulo), prev ? esc(prev) : '<i>em branco</i>');
      }).join('') + '</div>');

    // Instintos (valor mostrado já inclui o Bônus de Assimilação, ver valorInstinto; a
    // divisão "base+bônus" só aparece como dica quando existe algum bônus, pra não poluir
    // a maioria das fichas, que nunca vai usar isso)
    var instintosBody = '<table><tbody>';
    INSTINTOS.forEach(function(i){
      var baseInstDisp = instintoBase(c, i[0]); // já inclui o que foi comprado com Experiência
      var bonusInstDisp = (c.instintosAssimBonus && c.instintosAssimBonus[i[0]])||0;
      instintosBody += '<tr><td>'+i[1]+'</td><td class="num">'+(baseInstDisp+bonusInstDisp)+(bonusInstDisp?' <span class="hint">('+baseInstDisp+'+'+bonusInstDisp+')</span>':'')+'</td></tr>';
    });
    instintosBody += '</tbody></table>';
    instintosBody += bonusAssimHtml(c);
    html += sectionCard("instintos", "Instintos", instintosBody);

    html += '</div>'; // end grid-2

    // Conhecimentos e praticas (mesma ideia: valor total com a dica "base+bônus" só quando há bônus)
    var cpBody = '<div class="table-wrap"><table><thead><tr><th>Conhecimentos</th><th class="num">Valor</th><th>Práticas</th><th class="num">Valor</th></tr></thead><tbody>';
    for(var i=0;i<6;i++){
      var kC = CONHECIMENTOS[i][0], kP = PRATICAS[i][0];
      var bC = (c.conhPratAssimBonus && c.conhPratAssimBonus[kC])||0, bP = (c.conhPratAssimBonus && c.conhPratAssimBonus[kP])||0;
      cpBody += '<tr><td>'+CONHECIMENTOS[i][1]+'</td><td class="num">'+valorCP(c,kC)+(bC?' <span class="hint">('+valorCPBase(c,kC)+'+'+bC+')</span>':'')+'</td>' +
        '<td>'+PRATICAS[i][1]+'</td><td class="num">'+valorCP(c,kP)+(bP?' <span class="hint">('+valorCPBase(c,kP)+'+'+bP+')</span>':'')+'</td></tr>';
    }
    cpBody += '</tbody></table></div>';
    html += sectionCard("conhprat", "Conhecimentos &amp; Práticas", cpBody);


    // Teste (rolador integrado, puxa Instinto + Prática/Conhecimento direto da ficha)
    if(!state.sheetTest || state.sheetTest.charId !== c.id){
      state.sheetTest = { charId:c.id, instintoKey:INSTINTOS[0][0], cpKey:CONH_PRAT[0][0], instinto2Key:INSTINTOS[0][0], agir:false, extraDado:false, agirSnapshot:null, extraSnapshot:null, agirUsouAssim:false, results:[], rolling:false, rollingCount:0, keepN:0, registered:false };
    }
    if(!modoBase) html += tentarHtml("Teste", function(){ return renderSheetTest(c); });

    // Caracteristicas
    // Cada Característica é uma linha (nome, custo e começo do texto); o texto inteiro
    // abre na caixa ao lado (ver CAIXAS.carac).
    var caracDetalhes = c.caracComp.map(function(id){ return CARACTERISTICAS.filter(function(x){return x.id===id;})[0]; }).filter(Boolean);
    var caracBody;
    if(caracDetalhes.length){
      caracBody = '<div class="lx-lista">' + caracDetalhes.map(function(d){
        return caixaLinha("carac", d.id, esc(d.nome), esc(d.txt), '<span class="lx-sel forte">'+d.custo+' pt</span>');
      }).join('') + '</div>';
    } else {
      caracBody = '<p class="hint">Nenhuma característica única comprada.</p>';
    }
    html += sectionCard("caracteristicas", "Características", caracBody);
    if(!c.precisaRefazer) html += tentarHtml("Evoluir", function(){ return sectionCard("evoluir", "Evoluir (Experiência)", evoluirHtml(c)); });

    // Saude e Determinacao
    var maxNivel = saudePontosMax(c);
    if(c.saudePontosAtuais==null) c.saudePontosAtuais = maxNivel;
    html += '<div class="grid cols-2">';
    var nivelS = clamp(c.saudeNivel!=null ? c.saudeNivel : 6, 0, 6);
    html += '<div class="card" data-secid="saude"><h2>Saúde</h2>' +
      pendingSectionBannerHtml(c, "saude") +
      '<p class="hint">1 + Potência + Resolução = '+maxNivel+' pontos por Nível, 6 Níveis</p>' +
      '<div class="row"><label style="margin:0">Pontos atuais no nível:</label><div class="dots" data-dots="pontos">' + diamonds(c.saudePontosAtuais, maxNivel, "dsize-lg", "c-saude") + '</div></div>' +
      '<div class="row" style="margin-top:8px"><label style="margin:0">Nível (de 6):</label><div class="dots" data-dots="nivel">' + diamonds(nivelS,6,"dsize-sm","c-saude","ns") + '</div></div>' +
      '<p style="margin:8px 0 0"><b>'+(nivelS>0?NIVEIS_SAUDE[nivelS]:"Morto")+'</b> <span class="hint">· '+iconizarTexto(PENALIDADE_SAUDE[nivelS])+'</span></p>' +
      '<div class="row" style="margin-top:10px"><button class="btn secondary" data-saude="menos">-1 ponto</button><button class="btn secondary" data-saude="mais">+1 ponto</button></div>' +
    '</div>';

    // Determinação/Assimilação (ver tugDeGuerraCardHtml): o Cabo de Guerra é
    // a única forma de calcular e mostrar isso, sempre visível na ficha.
    html += tentarHtml("Determinação", function(){ return tugDeGuerraCardHtml(c); });
    html += '</div>';

    // Assimilação: Teste de Assimilação, mutações adquiridas e Clareza de Propósito
    // (ver renderMutacoesCard) - livro definitivo, Cap. 4.
    html += tentarHtml("Assimilação", function(){ return renderMutacoesCard(c); });

    // Equipamento
    // Artefato: uma linha (nome, Escassez, Qualidade) que abre a caixa com a descrição,
    // as características e a Qualidade; os Usos ficam à mão, logo abaixo da linha.
    var equipBody;
    if(!c.equip.nome && !c.equip.traits.length){
      equipBody = '<p class="hint">Esse personagem não tem Artefato inicial.</p>';
    } else {
      var qEq = c.equip.qualidade!=null ? c.equip.qualidade : 3;
      var nomesTraitsEq = c.equip.traits.map(function(s){ var d = EQUIP_TRAITS.filter(function(x){return x.id===s.id;})[0]; return d ? d.nome+(s.qtd>1?" x"+s.qtd:"") : ""; }).filter(Boolean);
      equipBody = '<div class="lx-lista">' + caixaLinha("equip", "", esc(c.equip.nome||"(sem nome)"),
          esc(nomesTraitsEq.length ? nomesTraitsEq.join(" · ") : (c.equip.desc||"")),
          '<span class="lx-sel">Esc. '+equipCusto(c)+'</span><span class="lx-sel'+(qEq<=1?' alerta':'')+'" title="Qualidade">Q'+qEq+' · '+QUALIDADES[qEq]+'</span>') + '</div>' +
        (c.equip.usosMax ? '<div class="row" style="margin-top:10px"><label style="margin:0">Usos:</label><div class="dots" data-dots="equipusos">'+dotsRow(c.equip.usosAtual||0, c.equip.usosMax, "")+'</div>' +
          '<button class="btn secondary" data-equipuso="repor">Repor usos</button></div>' : '');
    }
    html += sectionCard("equipamento", "Artefato inicial", pendingSectionBannerHtml(c, "equip") + equipBody);

    // Inventario extra
    var totalEspaco = c.equip.espaco + sum(c.inventarioExtra.map(function(it){ return it.espaco||0; }));
    var capMax = capacidadeInventarioMax(c);
    var espacoExtra = capMax - 9;
    var invBody = '<div id="inv-list">' + renderInventario(c) + '</div>' +
      '<p class="hint" style="margin-top:8px">Espaço total ocupado: <b>'+totalEspaco+'</b> de '+capMax+' (3 no corpo + 6 na mochila'+(espacoExtra>0?' + '+espacoExtra+' de equipamento Espaçoso':'')+')</p>';
    if(state.itemDraft){
      invBody += renderItemForm(state.itemDraft);
    } else {
      invBody += '<div class="row" style="margin-top:10px"><button class="btn secondary" data-inv="add">+ adicionar item</button></div>';
    }
    html += sectionCard("inventario", "Inventário adicional", pendingSectionBannerHtml(c, "inv") + invBody);
    if(caps.mode === "mesa" && !modoBase) html += tentarHtml("Documentos", function(){ return sectionCard("documentos", "Documentos", docsFichaHtml(c)); });

    // Notas
    html += sectionCard("notas", "Notas", '<textarea data-notas style="min-height:80px">'+esc(c.notas)+'</textarea>');


    if(modoBase){
      // Etapa H: ficha-base fora de campanha. Sem testes, documentos e exclusão.
      html += '<div class="card tight"><p class="hint" style="margin:0">Esta é a sua <b>ficha-base</b>, fora de campanha. As mudanças aqui ficam só nela: as cópias que já estão em campanhas não mudam. Para levar a ficha a uma campanha, abra o link de convite do mestre.</p></div>';
      html += '<div class="btn-row"><button class="btn secondary" data-action="lobby">Voltar às campanhas</button>' +
        '<div class="row"><button class="btn accent" data-action="edit">Editar Ficha</button></div></div>';
    } else
    html += '<div class="btn-row"><button class="btn secondary" data-nav="roster">Voltar pros personagens</button>' +
      '<div class="row"><button class="btn accent" data-action="edit">Editar Ficha</button><button class="btn danger" data-action="delete">Excluir personagem</button></div></div>';

    html += '</div>';

    app.innerHTML = html + caixaHtml();
    bindGlobal();
    bindSheet(c, maxNivel);
  }

  // Cabeçalho + descrição + efeito de um item, igual no inventário e na pool.
  function itemCorpoHtml(it, extraChips){
    var chips = (it.traits||[]).map(function(s){
      var d = EQUIP_TRAITS.filter(function(x){return x.id===s.id;})[0];
      return '<span class="item-chip" title="'+esc(d ? d.txt : "")+'">'+esc(d ? d.nome+((s.qtd||1)>1?" x"+s.qtd:"") : s.id)+'</span>';
    }).join('');
    return '<div class="item-topo"><span class="item-nome">'+esc(it.nome||"Sem nome")+((it.qtd||1)>1?'<span class="item-qtd">x'+it.qtd+'</span>':'')+'</span>' +
        '<span class="item-chips">'+(extraChips||'')+chips+'</span></div>' +
      (it.desc ? '<p class="item-desc">'+esc(it.desc)+'</p>' : '') +
      (it.efeito ? '<p class="item-efeito"><b>Efeito</b>'+esc(it.efeito)+'</p>' : '');
  }
  // Inventário: cada item é uma linha (nome, quantidade, Qualidade e usos); a

  // Fileira de 10 laços (⋈) do Cabo de Guerra, um por Nível da escala 0-10: os
  // primeiros nivelDet ficam do lado de Determinação, os restantes do lado de
  // Assimilação. Reaproveitada tanto na versão grande e clicável da ficha
  // (tugDeGuerraCardHtml, clicavel=true: cada laço vira data-tuglvl e aciona

  // mini-fichas ainda mostravam o modelo antigo (barra de preenchimento única)

  function tugLacosHtml(nivelDet, clicavel){
    var lacos = "";
    for(var li=1; li<=10; li++){
      lacos += '<span class="tug-lace'+(clicavel?"":" mini")+' '+(li<=nivelDet?"det":"assim")+'"'+

      '<span class="tug-endcap'+(clicavel?"":" mini")+'" style="border-color:var(--royal)"></span>' +
      lacos +
      '<span class="tug-endcap'+(clicavel?"":" mini")+'" style="border-color:var(--assim)"></span>' +
