  // Mini-ficha de um personagem pra aba Mesa: nome, jogador, acampamento (mesma
  // decoração de cor usada na criação de personagem) e um resumo de Saúde/Determinação.
  // Não mostra a Assimilação oculta nem os Instintos/Conhecimentos - isso fica só
  // no Painel do Assimilador.
  function miniFichaCard(c, soLeitura){
    var camp = c.acampamento ? CAMPS[c.acampamento] : null;
    var cardStyle = (camp?'--camp-color:'+camp.cor+';':'')+'border-left:6px solid '+(camp?camp.cor:'var(--accent)')+';cursor:'+(soLeitura?'default':'pointer');
    var maxNivel = c.saudeMax != null ? c.saudeMax : (c.instintos ? saudePontosMax(c) : 1);
    return '<div class="char-card" style="'+cardStyle+'"'+(soLeitura?'':' data-mesaopen="'+c.id+'"')+'>' +
      (camp && camp.img ? '<img class="badge" src="'+esc(camp.img)+'" alt="">' : '') +
      '<h3>'+esc(c.nomePersonagem||"Sem nome")+npcBadgeHtml(c)+'</h3>' +
      '<div class="camp-tag">'+(camp?esc(camp.nome):(grupoLigado()?esc(grupoRotulo().toLowerCase())+" não definido":"&nbsp;"))+(c.nomeJogador?" · "+esc(c.nomeJogador):"")+'</div>' +
      '<div class="row" style="margin-top:10px;gap:16px;flex-wrap:wrap">' +
        '<div><span class="hint" style="display:block;margin-bottom:3px">Saúde (nível '+(c.saudeNivel!=null?c.saudeNivel:"?")+'/6)</span>'+diamondsMini(c.saudePontosAtuais||0, maxNivel, "c-saude")+'</div>' +
        tugMiniBarHtml(c) +
      '</div>' +
    '</div>';
  }

  function mesaFichaDados(id){
    var c = visibleChars().filter(function(x){ return x.id===id; })[0];
    if(c) return { c:c, soLeitura:false };
    var r = (shared.resumos||[]).filter(function(x){ return x.id===id && !x.ehNpc; })[0];
    return r ? { c:r, soLeitura:true } : null;
  }
  function mesaLinhaHtml(c){
    var camp = c.acampamento ? CAMPS[c.acampamento] : null;
    var maxNivel = c.saudeMax != null ? c.saudeMax : (c.instintos ? saudePontosMax(c) : 1);
    var nivelDet = c.determinacao ? nivelDetAtual(c) : 10;
    var nS = c.saudeNivel!=null ? c.saudeNivel : 6;
    var extras = '<span class="lx-sel'+(nS<=2?' alerta':'')+'" title="Saúde: nível e pontos">♥ '+nS+'/6 · '+(c.saudePontosAtuais||0)+'/'+maxNivel+'</span>' +
      '<span class="lx-sel" title="Nível de Determinação">Det. '+nivelDet+'/10</span>';
    return '<div class="mesa-lx" style="'+(camp?'--camp-color:'+camp.cor:'')+'">' +
      caixaLinha("mesa", c.id, (camp && camp.img ? '<img class="mesa-lx-img" src="'+esc(camp.img)+'" alt="">' : '')+esc(c.nomePersonagem||"Sem nome")+npcBadgeHtml(c),
        esc((camp?camp.nome:(grupoLigado()?grupoRotulo().toLowerCase()+" não definido":""))+(c.nomeJogador?(camp||grupoLigado()?" · ":"")+c.nomeJogador:"")), extras) + '</div>';
  }
  CAIXAS.mesa = function(id){
    if(state.view !== "mesa") return null;
    var d = mesaFichaDados(id); if(!d) return null;
    var c = d.c, camp = c.acampamento ? CAMPS[c.acampamento] : null;
    var maxNivel = c.saudeMax != null ? c.saudeMax : (c.instintos ? saudePontosMax(c) : 1);
    var corpo = '<p class="hint" style="margin:0 0 8px">'+(camp?esc(camp.nome):(grupoLigado()?esc(grupoRotulo().toLowerCase())+" não definido":""))+(c.nomeJogador?(camp||grupoLigado()?" · ":"")+"jogador(a): "+esc(c.nomeJogador):"")+'</p>' +
      '<div style="margin-bottom:10px"><span class="hint" style="display:block;margin-bottom:3px">Saúde (nível '+(c.saudeNivel!=null?c.saudeNivel:"?")+'/6'+(c.saudeNivel!=null&&NIVEIS_SAUDE[c.saudeNivel]?' · '+NIVEIS_SAUDE[c.saudeNivel]:'')+')</span>'+diamondsMini(c.saudePontosAtuais||0, maxNivel, "c-saude")+'</div>' +
      tugMiniBarHtml(c) +
      (d.soLeitura ? '<p class="hint" style="margin:10px 0 0">Ficha de outro jogador: só o resumo.</p>'
        : '<div class="cx-acoes"><button type="button" class="btn accent" data-mesaopen="'+c.id+'">Abrir ficha</button></div>');
    return { titulo:esc(c.nomePersonagem||"Sem nome")+npcBadgeHtml(c), tituloTexto:c.nomePersonagem||"Ficha", corpo:corpo, lado:"direita", largura:380, cor:camp?camp.cor:null };
  };
  // Aba Mesa: no lugar do antigo rolador avulso de dados. Mostra o histórico geral
  // de rolagens (funciona tanto na mesa ao vivo quanto no modo local) e uma
  // mini-ficha de cada personagem, decorada com a cor do acampamento.
  function renderMesa(){
    var chars = visibleChars();
    // Jogador no site com login: além das próprias fichas, vê o RESUMO das fichas
    // dos colegas (menos NPCs) - só leitura, sem abrir a ficha completa.
    var resumosOutros = [];
    if(caps.mode === "mesa" && !temAcessoTotal()){
      var meusSet = {}; chars.forEach(function(c){ meusSet[c.id] = true; });
      resumosOutros = (shared.resumos||[]).filter(function(r){ return !meusSet[r.id] && !r.ehNpc; })
        .sort(function(a,b){ return String(a.criadoEm||"").localeCompare(String(b.criadoEm||"")); });
    }
    var html = topbar("mesa");
    if(caps.mode === "mesa" && !temAcessoTotal()){
      html += '<div class="card tight" style="border-color:var(--accent)"><p class="hint" style="margin:0">Você edita só a sua ficha. Das fichas dos outros jogadores aparece só um resumo, sem abrir a ficha completa.</p></div>';
    }
    html += tentarHtml("Ameaças em cena", encontrosMesaHtml);
    html += testLogHtml("Histórico de Rolagens", {showClear:true});
    html += '<h2 style="margin:20px 0 10px">Personagens</h2>';
    if(!chars.length && !resumosOutros.length){
      html += '<div class="card"><p class="hint">Nenhum personagem criado ainda.</p></div>';
    } else {
      // Cada ficha é uma linha (nome, acampamento, Saúde e Determinação); o resumo
      // completo abre na caixa ao lado (ver CAIXAS.mesa).
      html += '<div class="card"><div class="lx-lista">';
      chars.forEach(function(c){ html += mesaLinhaHtml(c); });
      resumosOutros.forEach(function(r){ html += mesaLinhaHtml(r); });
      html += '</div></div>';
    }
    html += '<div class="btn-row"><span></span><button class="btn secondary" data-nav="roster">Voltar</button></div>';

    app.innerHTML = html + caixaHtml();
    bindGlobal();
    app.querySelectorAll('[data-mesaopen]').forEach(function(el){
      el.addEventListener("click", function(){ goto("sheet", {charId: el.getAttribute("data-mesaopen")}); });
    });
    var clearLogBtn = app.querySelector('[data-action="clear-rolagens"]');
    if(clearLogBtn) clearLogBtn.addEventListener("click", limparHistoricoRolagens);
  }

  // ----- GM PANEL -----
  // Grade de atributos (Instintos, Conhecimentos & Práticas) pro Painel do
  // Assimilador: uma célula por atributo, nome em cima e valor (já somando o
  // Bônus de Assimilação, ver valorInstinto/valorCP) em destaque embaixo -
  // mais fácil de escanear rápido do que uma linha corrida de texto, numa
  // mesa com vários personagens abertos ao mesmo tempo.
  function attrGridHtml(pairs){
    return '<div class="gm-attr-grid">' + pairs.map(function(p){
      return '<div class="gm-attr-cell"><div class="lbl">'+esc(p[0])+'</div><div class="v">'+p[1]+'</div></div>';
    }).join('') + '</div>';
  }
  // Características de um personagem como etiquetas (chips), com o custo em
  // pontos e a descrição completa no title (tooltip) - no lugar de uma lista
  // de nomes separada por vírgula.
  function attrCaracChipsHtml(ids){
    if(!ids || !ids.length) return '<p class="hint" style="margin:4px 0 0">Nenhuma característica única.</p>';
    return '<div class="gm-carac-list">' + ids.map(function(id){
      var d = CARACTERISTICAS.filter(function(x){return x.id===id;})[0];
      if(!d) return '<span class="gm-carac-chip">'+esc(id)+'</span>';
      return '<span class="gm-carac-chip" title="'+esc(d.txt)+'"><b>'+esc(d.nome)+'</b><span class="cost">'+d.custo+'pt</span></span>';
    }).join('') + '</div>';
  }

  // Mostra TODOS os dados rolados num teste (não só os mantidos), com os mantidos
  // destacados e os descartados apagados/riscados - pra entradas antigas do
  // histórico (sem o array de dados individuais salvo) mostra um traço no lugar.
  function diceChipsHtml(dados){
    if(!dados || !dados.length) return '<span class="hint">-</span>';
    return dados.map(function(d){
      var lbl = diceResultLabel(d);
      return '<span class="die-chip'+(d.kept?" kept":"")+'" title="'+esc(lbl)+'">d'+d.sides+':'+d.face+(lbl!=="em branco"?' <span class="die-chip-res">'+diceResultHtml(d)+'</span>':'')+'</span>';
    }).join('');
  }
  // Resultado de uma linha do histórico: entradas novas guardam os totais como
  // números (mostrados com os emblemas coloridos); entradas antigas só têm o
  // texto pronto (formato anterior), então caem de volta pra ele.
  function testeResultadoHtml(t){
    if(t.totS != null && t.totA != null && t.totP != null) return resultBadges(t.totS, t.totA, t.totP);
    return esc(t.resultado||"");
  }
  // O histórico de rolagens mostra o nome do personagem e do jogador pra
  // todo mundo - assim dá pra acompanhar a mesa inteira. O acampamento de origem continua escondido
  // aqui (nem cor, nem borda, nem o nome do acampamento em lugar nenhum
  // desta tabela): quem quiser saber o acampamento de alguém, abre a ficha.
  // title === false suprime o próprio <h2> (usado no painel flutuante, que
  // já tem seu próprio título na barrinha de cima). opts.showClear acrescenta
  // o botão "Limpar histórico de rolagens" dentro deste card (usado só na
  // aba Mesa, que é a página original do histórico).
  function testLogHtml(title, opts){
    opts = opts || {};
    var log = testLogVisivelPara(testLog());
    if(!log.length) return '<div class="card"><p class="hint">Nenhum teste rolado ainda.</p></div>';
    var showHeader = title !== false;
    var html = '<div class="card">' + (showHeader ? '<h2>'+esc(title||"Histórico de Testes")+'</h2>' : '') + '<div class="table-wrap"><table><thead><tr><th>Quando</th><th>Personagem</th><th>Teste</th><th>Dados</th><th class="num">Resultado</th></tr></thead><tbody>';
    log.forEach(function(t){
      var quando = "";
      try{ quando = new Date(t.ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }catch(e){ quando = ""; }
      var ehAssim = t.tipo === "assim", ehDest = t.tipo === "destaque";
      html += '<tr'+(ehAssim?' class="log-assim"':ehDest?' class="log-destaque"':'')+'><td>'+esc(quando)+'</td>' +
        '<td><b>'+esc(t.nomePersonagem||"?")+'</b>'+(t.nomeJogador?'<br><span class="hint">'+esc(t.nomeJogador)+'</span>':'')+'</td>' +
        '<td>'+(ehAssim?'<span class="assim-tag">Assimilação</span>':ehDest?'<span class="assim-tag destaque">Assimilador</span>':'')+esc(t.label||"")+(ehAssim&&t.cartas?'<br><span class="hint">'+esc(assimCartasTexto(t.cartas))+'</span>':'')+'</td>' +
        '<td>'+diceChipsHtml(t.dados)+'</td>' +
        '<td class="num">'+testeResultadoHtml(t)+'</td></tr>';
    });
    html += '</tbody></table></div>';
    if(opts.showClear && temAcessoTotal()){
      html += '<div class="row" style="margin-top:10px"><button type="button" class="btn secondary" data-action="clear-rolagens">Limpar histórico de rolagens</button></div>';
    }
    html += '</div>';
    return html;
  }

  // Botão "limpar histórico de rolagens" (fica na aba Mesa, a página original
  // do histórico): some com o histórico compartilhado (mesa) ou local pra
  // sempre - é uma ação destrutiva de verdade, por isso pede confirmação e
  // (no modo mesa) exige permissão de edição. Em modo mesa publica NA HORA
  // (sem esperar o debounce padrão) e tenta de novo se perder uma corrida
  // contra a rolagem de outro jogador, em vez de só torcer pra dar certo.
  function limparHistoricoRolagens(){
    if(!podeEditar() || !temAcessoTotal()) return;
    askConfirm("Apagar TODO o histórico de rolagens pra sempre? Isso não pode ser desfeito.", function(){
      if(caps.mode === "mesa") publicarAgoraComRetry(function(sh){ sh.testLog = []; });
    });
  }


  // Versão compacta de UMA linha do histórico, só pro painel flutuante (a
  // aba Mesa e o Painel do Assimilador continuam com a tabela cheia de
  // testLogHtml). Larga a tabela larga (que obrigava a rolar pro lado) e o
  // nome do jogador (só o nome do personagem aparece, pra economizar
  // espaço), e resume cada dado individual só ao que ele converteu em
  // Sucesso/Adaptação/Pressão (sem mostrar o tipo/valor do dado em si) -
  // dados descartados ficam apagados/riscados, os mantidos em destaque.
  // Por fim mostra a soma só dos dados mantidos, com os mesmos emblemas
  // coloridos usados no resto da ficha.
  function rollFeedEntryHtml(t){
    var quando = "";
    try{ quando = new Date(t.ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }catch(e){ quando = ""; }
    var diceHtml = (t.dados||[]).map(function(d){
      var lbl = diceResultLabel(d);
      return '<span class="rf-die'+(d.kept?" kept":"")+'">'+(lbl==="em branco"?"-":diceResultHtml(d))+'</span>';
    }).join('');
    var ehAssim = t.tipo === "assim", ehDest = t.tipo === "destaque";
    return '<div class="rollfeed-entry'+(ehAssim?' assim':ehDest?' destaque':'')+'">' +
      '<div class="rollfeed-entry-head"><b>'+esc(t.nomePersonagem||"?")+'</b><span class="hint">'+esc(quando)+'</span></div>' +
      '<div class="rollfeed-entry-label">'+(ehAssim?'<span class="assim-tag">Assimilação</span>':ehDest?'<span class="assim-tag destaque">Assimilador</span>':'')+esc(t.label||"")+(ehAssim&&t.cartas?' · '+esc(assimCartasTexto(t.cartas)):'')+'</div>' +
      (diceHtml ? '<div class="rollfeed-dice">'+diceHtml+'</div>' : '') +
      '<div class="rollfeed-total">'+testeResultadoHtml(t)+'</div>' +
    '</div>';
  }

  // Painel flutuante do Histórico de Rolagens: renderizado num <div> à parte
  // (fora do #app), pra continuar visível em cima de QUALQUER tela - Personagens,
  // criação de ficha, a própria ficha aberta, Mesa ou Painel do Assimilador -
  // sem que o jogador precise sair do que está fazendo pra ver as rolagens
  // de todo mundo. Chamado pelo render() principal e também na mão sempre
  // que um teste novo é registrado (ver registrarTeste), já que muitas telas
  // se re-renderizam sem passar pelo render() principal. É só um resumo pra
  // consulta rápida: os botões de limpar ficam nas telas originais (aba Mesa
  // e tela de Personagens), não aqui.
  function renderRollFeed(){
    var feed = document.getElementById("rollfeed");
    if(!feed) return;
    if(modoBase){ feed.innerHTML = ""; return; } // etapa H: fora de campanha não há rolagens
    var log = testLogVisivelPara(testLog());
    var collapsed = state.rollFeedCollapsed;
    var listHtml = log.length
      ? log.map(rollFeedEntryHtml).join('')
      : '<p class="hint" style="margin:4px 0">Nenhum teste rolado ainda.</p>';
    var html = '<div class="rollfeed'+(collapsed?' collapsed':'')+'">' +
      '<button type="button" class="rollfeed-toggle" data-rollfeed="toggle">' +
        '<span>🎲 Histórico de Rolagens'+(log.length?' ('+log.length+')':'')+'</span><span>'+(collapsed?'▸':'▾')+'</span>' +
      '</button>' +
      '<div class="rollfeed-list">'+rollFeedCenaHtml()+listHtml+'</div>' +
    '</div>';
    feed.innerHTML = html;
    bindRollFeed();
  }

  // Ameaças em cena (só o que o Assimilador decidiu mostrar), no topo do painel flutuante.
  function rollFeedCenaHtml(){
    var lista = (typeof encontrosMesaLista === "function") ? encontrosMesaLista() : [];
    if(!lista.length) return '';
    return '<div class="rollfeed-cena" style="margin:-8px -12px 6px"><p class="hint" style="margin:0 0 4px">Ameaças em cena</p>'+lista.map(function(e){ return encontroMesaCardHtml(e, true); }).join('')+'</div>';
  }
  function bindRollFeed(){
    var feed = document.getElementById("rollfeed");
    if(!feed) return;
    var toggleBtn = feed.querySelector('[data-rollfeed="toggle"]');
    if(toggleBtn) toggleBtn.addEventListener("click", function(){
      state.rollFeedCollapsed = !state.rollFeedCollapsed;
      saveLS("pangea:rollfeed:collapsed", state.rollFeedCollapsed);
      renderRollFeed();
    });
  }

  // ----- ROLAGEM SECA (só o Assimilador vê, nunca entra no Histórico) -----
  // Pensada pra criaturas e NPCs, que não têm ficha/Instintos guardados:
  // o Assimilador escolhe quantos d6/d10/d12 entram na pilha e quantos ficam
  // mantidos, rola, e pode soltar/manter dados manualmente igual no testador
  // da ficha de um jogador - só que esse resultado nunca chama registrarTeste,
  // então nunca toca o testLog (nem o local, nem o compartilhado da mesa) e
  // nunca aparece pra mais ninguém, nem no painel flutuante. Fica só na
  // memória desta aba (state.gmDryRoll): some ao recarregar a página.
  function renderGmDryRoll(){
    if(!state.gmDryRoll) state.gmDryRoll = { label:"", d6:2, d10:0, d12:0, results:[], rolling:false, rollingCount:0 };
    var t = state.gmDryRoll;
    var totalDados = (t.d6||0)+(t.d10||0)+(t.d12||0);
    // Exibição de resultados: símbolos (Sucesso/Adaptação/Pressão) ou só o número
    // que caiu em cada dado, como um dado comum (pedido do Marco, 01/10/2026).
    if(!t.exibicao) t.exibicao = loadLS("pangea:gm:exibicao", "simbolos");
    var numeros = t.exibicao === "numeros";
    var body = '<div class="row" style="gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap"><span class="hint" style="margin:0">Exibição dos resultados:</span>' +
      '<button type="button" class="btn '+(numeros?'secondary':'accent')+' doc-btn" data-gmdryexib="simbolos">Símbolos</button>' +
      '<button type="button" class="btn '+(numeros?'accent':'secondary')+' doc-btn" data-gmdryexib="numeros">Números dos dados</button></div>';
    body += '<div class="field" style="max-width:320px"><input type="text" data-gmdry="label" value="'+esc(t.label)+'" placeholder="ex: Lobo Mutante - Mordida" '+(t.rolling?"disabled":"")+'></div>';
    body += '<div class="grid cols-3">';
    body += stepperField("gmdry", "Dados d6", "", "d6", t.d6, 0, 12, t.rolling);
    body += stepperField("gmdry", "Dados d10", "", "d10", t.d10, 0, 12, t.rolling);
    body += stepperField("gmdry", "Dados d12", "", "d12", t.d12, 0, 12, t.rolling);
    body += '</div>';
    body += '<div class="btn-row" style="margin-top:0"><button class="btn accent" data-gmdryaction="roll" '+((totalDados<=0||t.rolling)?"disabled":"")+'>'+(t.rolling?"Rolando…":"Rolar")+'</button>' +
      (t.results.length ? '<button class="btn secondary" data-gmdryaction="clear">Limpar resultado</button>' : '<span></span>') +
    '</div>';
    if(t.rolling){
      var n = Math.max(1, t.rollingCount||1);
      var spins = "";
      for(var k=0;k<n;k++){ spins += '<span class="die-spin">?</span>'; }
      body += '<div class="dice-anim">'+spins+'</div>';
    } else if(t.results.length){
      var kept = t.results.filter(function(d){ return d.kept; });
      var totS = sum(kept.map(function(d){return d.s;}));
      var totA = sum(kept.map(function(d){return d.a;}));
      var totP = sum(kept.map(function(d){return d.p;}));
      body += '<div style="margin-top:14px">' +
        '<p class="hint">Todos os dados contam por padrão. Clique num dado pra soltá-lo (ou clicar de novo pra mantê-lo).</p>' +
        '<div class="row" style="flex-wrap:wrap;gap:8px">';
      t.results.forEach(function(d, idx){
        body += '<button type="button" class="btn secondary" data-gmdrytoggle="'+idx+'" style="font-family:\'IBM Plex Mono\',monospace'+(d.kept?'':';opacity:.4;text-decoration:line-through')+'">d'+d.sides+': <b>'+d.face+'</b>'+(numeros?'':' ('+diceResultHtml(d)+')')+'</button>';
      });
      body += '</div>';
      var somaFaces = sum(kept.map(function(d){ return d.face; }));
      body += '<div class="budget ok" style="margin-top:12px"><span>'+(t.mostrado?'Resultado (mostrado para a mesa)':'Resultado (só você vê)')+'</span><span class="num">'+(numeros ? 'Mantidos: '+(kept.map(function(d){ return d.face; }).join(", ")||"-")+' · Soma '+somaFaces : resultBadges(totS,totA,totP))+'</span></div>';
      body += '<div class="row" style="gap:8px;align-items:center;flex-wrap:wrap"><button type="button" class="btn accent" data-gmdryaction="mostrar"'+(t.mostrado?' disabled':'')+'>'+(t.mostrado?'Mostrado para a mesa ✓':'📣 Mostrar para a mesa')+'</button>' +
        '<span class="hint" style="margin:0">Abre a animação no centro da tela de todo mundo e entra no Histórico de Rolagens. Solte os dados que não contam antes de mostrar.</span></div>';
      body += '</div>';
    }
    return sectionCard("gmdryroll", "Rolagem Seca (Criaturas e NPCs)", body);
  }

  function bindGmDryRoll(){
    var t = state.gmDryRoll;
    if(!t) return;
    if(t.rolling){ iniciarTickerDados(); }
    var labelInput = app.querySelector('[data-gmdry="label"]');
    if(labelInput) labelInput.addEventListener("input", function(){ t.label = labelInput.value; });
    bindStepper("gmdry", function(id){ return t[id]; }, function(id,v){ t[id] = v; }, 0, 99, renderGm);
    app.querySelectorAll('[data-gmdry]').forEach(function(el){
      if(el.tagName === "INPUT" && el.type === "number"){
        el.addEventListener("input", function(){
          var id = el.getAttribute("data-gmdry");
          t[id] = clamp(parseInt(el.value,10)||0, 0, 99);
        });
      }
    });
    var rollBtn = app.querySelector('[data-gmdryaction="roll"]');
    if(rollBtn) rollBtn.addEventListener("click", function(){
      var total = (t.d6||0)+(t.d10||0)+(t.d12||0);
      if(total<=0) return;
      pararAnimacaoDados();
      t.rolling = true;
      t.rollingCount = total;
      t.results = []; t.mostrado = false;
      renderGm();
      diceAnimTimeout = setTimeout(function(){
        diceAnimTimeout = null;
        pararAnimacaoDados();
        var results = [];
        var i;
        for(i=0;i<(t.d6||0);i++) results.push(rollDie(6));
        for(i=0;i<(t.d10||0);i++) results.push(rollDie(10));
        for(i=0;i<(t.d12||0);i++) results.push(rollDie(12));
        // Sem sugestão de "melhores dados" aqui: todos nascem mantidos, então o resultado
        // exibido já soma a pilha inteira (ver renderGmDryRoll); só o clique manual em
        // data-gmdrytoggle solta um dado específico.
        results.forEach(function(d){ d.kept = true; });
        t.results = results;
        t.rolling = false;
        renderGm();
      }, 650);
    });
    app.querySelectorAll('[data-gmdrytoggle]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var idx = parseInt(btn.getAttribute("data-gmdrytoggle"),10);
        t.results[idx].kept = !t.results[idx].kept;
        renderGm();
      });
    });
    app.querySelectorAll('[data-gmdryexib]').forEach(function(b){
      b.addEventListener("click", function(){ t.exibicao = b.getAttribute("data-gmdryexib"); saveLS("pangea:gm:exibicao", t.exibicao); renderGm(); });
    });
    var clearBtn = app.querySelector('[data-gmdryaction="clear"]');
    if(clearBtn) clearBtn.addEventListener("click", function(){
      t.results = []; t.mostrado = false;
      renderGm();
    });
    // Mostrar para a mesa: por drama ou impacto, o Assimilador revela uma rolagem
    // do Painel com a mesma animação central dos Testes de Assimilação.
    var mostrarBtn = app.querySelector('[data-gmdryaction="mostrar"]');
    if(mostrarBtn) mostrarBtn.addEventListener("click", function(){
      if(t.mostrado || !t.results.length) return;
      t.mostrado = true; mostrarBtn.disabled = true;
      var kept = t.results.filter(function(d){ return d.kept; });
      var qtd = {}; t.results.forEach(function(d){ qtd[d.sides] = (qtd[d.sides]||0) + 1; });
      var pilha = [6,10,12].filter(function(n){ return qtd[n]; }).map(function(n){ return qtd[n]+"d"+n; }).join(" + ");
      var titulo = String(t.label||"").trim();
      var entrada = { tipo:"destaque", nomePersonagem: titulo || "Rolagem do Assimilador", nomeJogador:"",
        label: (titulo ? titulo+" · " : "")+pilha+(kept.length < t.results.length ? " (mantém "+kept.length+")" : ""),
        subtitulo: pilha+(kept.length < t.results.length ? " · mantém "+kept.length : ""),
        totS: sum(kept.map(function(d){return d.s;})), totA: sum(kept.map(function(d){return d.a;})), totP: sum(kept.map(function(d){return d.p;})),
        dados: t.results.map(function(d){ return {sides:d.sides, face:d.face, s:d.s, a:d.a, p:d.p, kept:!!d.kept}; }) };
      entrada.resultado = entrada.totS+" Suc · "+entrada.totA+" Adap · "+entrada.totP+" Press";
      if(t.exibicao === "numeros"){
        entrada.exibicao = "numeros";
        entrada.somaFaces = sum(kept.map(function(d){ return d.face; }));
      }
      mostrarAnimAssim(entrada, function(){
        registrarTeste(entrada);
        assimVistos[entrada.id] = true;
        if(caps.mode==="mesa"){ clearTimeout(publishTimer); doPublish(); }
        if(state.view === "gm") renderGm();
      });
    });
  }

  // ---------- BESTIÁRIO (só o Assimilador) ----------
  // Pedido do Marco (01/10/2026): catálogo das criaturas de Pangea no Painel, a
  // partir de claude_Lista_de_Criaturas_Pangea.md (revisão de balanceamento de
  // 01/10). Os gimmicks NÃO são automatizados: ficam só descritos no texto, e
  // quem interpreta e ativa é o Assimilador. Custos: s = Sucesso, a = Adaptação,
  // p = Pressão (no livro: A, B e C). "desc" é o que os jogadores leem quando a
  // criatura é revelada (dá pra editar antes de revelar).
  // Etapa D (08/10/2026): o catálogo saiu do código. Cada campanha tem as suas
  // criaturas em campanhas/{cid}/criaturas (só o mestre lê e grava), criadas no
  // formulário do Painel ou importadas de um arquivo (Importar catálogo).
  // Formato de uma criatura: id, nome, categoria, ordem, sub, perfil, desc (o que os
  // jogadores leem ao revelar), nota, pilha{d6,d10,d12}, suc, cond[{n,t}],
  // trilhas[{nome,alvo}], fases[{ate,nome}], grupos[{titulo?,tipo:ameaca|adapt|abert,
  // fase?, itens[{n, c{s,a,p}, x?, t, trilha?, ganho?}]}], desgaste[{m,n,t,fase?}].
  function criaturasLista(){
    return (shared.criaturas||[]).slice().sort(function(a,b){
      var oa = a.ordem!=null ? a.ordem : 9999, ob = b.ordem!=null ? b.ordem : 9999;
      return oa !== ob ? oa - ob : String(a.nome||"").localeCompare(String(b.nome||""), "pt");
    });
  }
  function bestCriatura(id){ return (shared.criaturas||[]).filter(function(b){ return b.id===id; })[0] || null; }
  // Criatura de um encontro: a cópia guardada quando entrou em cena (editar ou apagar
  // a criatura do catálogo não bagunça quem já está em cena); encontros antigos usam o catálogo.
  function encCri(enc){ return (enc && enc.criatura) || (enc && bestCriatura(enc.criaturaId)) || null; }
  function bestCategorias(){
    var vistas = [];
    criaturasLista().forEach(function(c){ var k = String(c.categoria||"").trim() || "Sem categoria"; if(vistas.indexOf(k) < 0) vistas.push(k); });
    return vistas;
  }
  function bestPilhaTexto(p){
    return [6,10,12].filter(function(n){ return (p||{})["d"+n]; }).map(function(n){ return p["d"+n]+"d"+n; }).join(" + ") || "—";
  }
  function bestCustoHtml(c, extra){
    c = c || {};
    var partes = [];
    ["s","a","p"].forEach(function(k){ if(c[k]) partes.push('<span class="best-custo-parte">'+c[k]+' '+dadoHtml(k)+'</span>'); });
    var txt = partes.length ? partes.join(" ") : '<span class="best-custo-parte">sem custo</span>';
    return '<span class="best-custo">'+txt+(extra?'<span class="best-custo-x">'+esc(extra)+'</span>':'')+'</span>';
  }
  // Rola as expressões de dano do texto (1d6/2, 1d6, 1d10, 1d12): cada uma vira
  // um botãozinho; o resultado fica ao lado até rolar de novo. Só um número, não
  // mexe em nada da ficha (o Assimilador aplica o dano onde for o caso).
  function bestTextoHtml(txt, chave){
    var n = 0;
    var html = esc(txt).replace(/(\d+)d(6|10|12)(\/2)?/g, function(m){
      var k = chave+"-"+(n++), r = (state.bestDano||{})[k];
      return '<button type="button" class="best-dano" data-bdano="'+m+'" data-bdkey="'+esc(k)+'" title="Rolar dano">🎲 '+m+(r!=null?' <b>= '+r+'</b>':'')+'</button>';
    });
    return iconizarTexto(html);
  }
  function bestRolarExpr(expr){
    var m = /^(\d+)d(\d+)(\/2)?$/.exec(expr); if(!m) return 0;
    var tot = 0; for(var i=0;i<parseInt(m[1],10);i++) tot += 1 + Math.floor(Math.random()*parseInt(m[2],10));
    return m[3] ? Math.ceil(tot/2) : tot;
  }
  function bestRolarPilha(p){
    var dados = [];
    [6,10,12].forEach(function(n){ for(var i=0;i<((p||{})["d"+n]||0);i++) dados.push(rollDie(n)); });
    return dados;
  }
  function bestTotais(dados){
    return { s:sum(dados.map(function(d){ return d.s; })), a:sum(dados.map(function(d){ return d.a; })), p:sum(dados.map(function(d){ return d.p; })) };
  }
  function bestRolagemHtml(rol, attrMostrar, attrFechar){
    if(!rol || !rol.dados || !rol.dados.length) return "";
    var t = bestTotais(rol.dados);
    return '<div class="best-rolagem">' +
      '<div class="row" style="gap:6px;flex-wrap:wrap">' + rol.dados.map(function(d){
        return '<span class="best-dado">d'+d.sides+' · <b>'+d.face+'</b> '+(diceResultHtml(d)==="em branco"?'<span class="hint" style="margin:0">—</span>':diceResultHtml(d))+'</span>';
      }).join('') + '</div>' +
      '<div class="row" style="gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px">'+resultBadges(t.s,t.a,t.p) +
        '<button type="button" class="btn secondary doc-btn" '+attrMostrar+(rol.mostrado?' disabled':'')+'>'+(rol.mostrado?'Mostrado para a mesa ✓':'📣 Mostrar para a mesa')+'</button>' +
        (attrFechar ? '<button type="button" class="btn secondary doc-btn" '+attrFechar+' title="Esconder esta rolagem (os pontos já somados continuam)">✕ Fechar</button>' : '') + '</div>' +
    '</div>';
  }
  // Mesma animação central da Rolagem Seca ("destaque"), com o nome da criatura
  // só se ela já foi revelada; senão aparece como "Ameaça".
  function bestMostrarRolagem(titulo, pilhaTxt, dados, depois){
    var t = bestTotais(dados);
    var entrada = { tipo:"destaque", nomePersonagem:titulo, nomeJogador:"",
      label:titulo+" · Ativação "+pilhaTxt, subtitulo:"Ativação · "+pilhaTxt,
      totS:t.s, totA:t.a, totP:t.p,
      dados:dados.map(function(d){ return {sides:d.sides, face:d.face, s:d.s, a:d.a, p:d.p, kept:true}; }) };
    entrada.resultado = t.s+" Suc · "+t.a+" Adap · "+t.p+" Press";
    mostrarAnimAssim(entrada, function(){
      registrarTeste(entrada);
      assimVistos[entrada.id] = true;
      if(caps.mode==="mesa"){ clearTimeout(publishTimer); doPublish(); }
      if(depois) depois();
    });
  }
  function bestFaseAtual(cri, suc){
    if(!cri || !cri.fases) return null;
    for(var i=0;i<cri.fases.length;i++){ if(suc <= cri.fases[i].ate) return cri.fases[i]; }
    return cri.fases[cri.fases.length-1];
  }

  // ----- Encontros (criaturas em cena) -----
  // "encontros": estado completo, só o Assimilador lê. "encontrosMesa": só o que
  // ele decidiu mostrar (nome/descrição se revelada, Sucessos se o progresso
  // estiver visível). Sem nada visível, o documento público é apagado.
  function encontrosLista(){
    return (shared.encontros||[]).slice().sort(function(a,b){ return String(a.criadoEm||"").localeCompare(String(b.criadoEm||"")); });
  }
  function encontroGet(id){ return (shared.encontros||[]).filter(function(e){ return e.id===id; })[0] || null; }
  function encontroPublico(enc){
    if(!enc.revelada && !enc.progresso) return null;
    return { id:enc.id, revelada:!!enc.revelada, reveladaEm:enc.reveladaEm||null, progresso:!!enc.progresso,
      nome:enc.revelada ? (enc.nome||"") : "", desc:enc.revelada ? (enc.descMesa||"") : "",
      suc:enc.progresso ? (enc.suc||0) : null, alvo:enc.progresso ? (enc.alvo||0) : null,
      trilhas:enc.progresso ? (enc.trilhas||[]).filter(function(t){ return t.mostrar; }).map(function(t){ return {nome:t.nome, alvo:t.alvo, atual:t.atual}; }) : [],
      criadoEm:enc.criadoEm||"", ts:new Date().toISOString() };
  }
  function gravarEncontro(enc, apagar){
    var lista = (shared.encontros||[]).filter(function(e){ return e.id!==enc.id; });
    if(!apagar){ enc.atualizadoEm = new Date().toISOString(); lista.push(enc); }
    shared.encontros = lista;
    var pub = apagar ? null : encontroPublico(enc);
    var ops = [ apagar ? { tipo:"del", col:"encontros", id:enc.id } : { tipo:"set", col:"encontros", id:enc.id, data:JSON.parse(JSON.stringify(enc)) },
      pub ? { tipo:"set", col:"encontrosMesa", id:enc.id, data:pub } : { tipo:"del", col:"encontrosMesa", id:enc.id } ];
    if(!FB) return;
    FB.escrever(ops).catch(function(e){ console.error("[Pangea] bestiário", e); alert("Não consegui salvar a criatura em cena. Confira a conexão e se as regras do Firestore têm os blocos encontros e encontrosMesa."); });
  }
  // Descrição personalizada de uma criatura (o que os jogadores leem ao revelar):
  // fica guardada em "documentosNotas" com o id "bestdesc_<criatura>", coleção que
  // só o Assimilador lê. Vale como padrão pra toda vez que ela entrar em cena.
  function bestDescMesa(cri){ return cri.desc || ""; }
  // Grava a criatura no catálogo da campanha.
  function gravarCriatura(cri, apagar){
    var lista = (shared.criaturas||[]).filter(function(x){ return x.id !== cri.id; });
    if(!apagar){ cri.atualizadoEm = new Date().toISOString(); lista.push(cri); }
    shared.criaturas = lista;
    if(!FB) return Promise.resolve();
    return FB.escrever([ apagar ? { tipo:"del", col:"criaturas", id:cri.id } : { tipo:"set", col:"criaturas", id:cri.id, data:JSON.parse(JSON.stringify(cri)) } ])
      .catch(function(e){ console.error("[Pangea] criaturas", e); alert("Não consegui salvar a criatura. Confira a conexão e se as regras do Firestore têm o bloco criaturas."); });
  }
  function gravarBestDesc(criId, texto){
    var cri = bestCriatura(criId); if(!cri) return;
    cri = JSON.parse(JSON.stringify(cri)); cri.desc = texto || "";
    gravarCriatura(cri);
  }
  function encontroNovo(cri){
    var mesmos = (shared.encontros||[]).filter(function(e){ return e.criaturaId===cri.id; }).length;
    return { id:uid(), criaturaId:cri.id, nome:cri.nome+(mesmos?" "+(mesmos+1):""), suc:0, alvo:cri.suc,
      trilhas:(cri.trilhas||[]).map(function(t){ return { nome:t.nome, alvo:t.alvo, atual:0, mostrar:false }; }),
      pontos:{s:0,a:0,p:0}, revelada:false, progresso:false, descMesa:bestDescMesa(cri), rolagem:null,
      criatura:JSON.parse(JSON.stringify(cri)),
      criadoEm:new Date().toISOString() };
  }

  var BEST_TIPO_TIT = { ameaca:"Ativações de Ameaça", adapt:"Ativações de Adaptação", abert:"Aberturas (Sucesso)" };
  // Índice (1, 2, 3...) da fase atual de uma criatura com fases (Líder do Conselho).
  function bestFaseNum(cri, suc){
    if(!cri || !cri.fases) return 0;
    var f = bestFaseAtual(cri, suc);
    return cri.fases.indexOf(f) + 1;
  }
  // Pontos já represados numa Ativação incompleta (encontro em cena).
  function bestRepresado(enc, gi, ai){ return ((enc && enc.represado) || {})[gi+"-"+ai] || null; }
  function bestFalta(enc, gi, ai, c){
    var r = bestRepresado(enc, gi, ai) || {};
    var f = {}; ["s","a","p"].forEach(function(k){ f[k] = Math.max(0, (c[k]||0) - (r[k]||0)); });
    return f;
  }
  function bestAtivacoesHtml(cri, chave, enc){
    var html = '';
    var faseNum = enc ? bestFaseNum(cri, enc.suc||0) : 0;
    var temTipos = (cri.grupos||[]).some(function(g){ return g.tipo && g.tipo !== "ameaca"; });
    (cri.grupos||[]).forEach(function(g, gi){
      if(enc && g.fase && faseNum && g.fase !== faseNum) return; // em cena: só a fase atual
      var tipo = g.tipo || "ameaca";
      var tit = g.titulo || (temTipos ? BEST_TIPO_TIT[tipo] : "");
      if(tit) html += '<p class="best-grupo-tit best-tipo-'+tipo+'">'+esc(tit)+'</p>';
      g.itens.forEach(function(a, ai){
        var c = a.c||{}, temCusto = !!(c.s||c.a||c.p);
        var rep = enc ? bestRepresado(enc, gi, ai) : null;
        var falta = enc ? bestFalta(enc, gi, ai, c) : null;
        var pode = enc && temCusto && ["s","a","p"].every(function(k){ return (enc.pontos[k]||0) >= falta[k]; });
        var podeRepresar = enc && temCusto && !pode && ["s","a","p"].some(function(k){ return falta[k] > 0 && (enc.pontos[k]||0) > 0; });
        var repTxt = '';
        if(rep && (rep.s||rep.a||rep.p)){
          repTxt = '<span class="best-represa" title="Pontos já investidos nesta Ativação (ficam represados pra próxima rodada)">represado: ' +
            ["s","a","p"].filter(function(k){ return c[k]; }).map(function(k){ return (rep[k]||0)+'/'+c[k]+' '+dadoHtml(k); }).join(' ') +
            '<button type="button" class="best-mini" data-bdesrepresar="'+enc.id+'" data-bg="'+gi+'" data-ba="'+ai+'" title="Devolver os pontos represados">↩</button></span>';
        }
        html += '<div class="best-ativ best-ativ-'+tipo+'"><div class="best-ativ-cab"><b>'+esc(a.n)+'</b>'+bestCustoHtml(c, a.x) + repTxt +
          (enc && temCusto ? '<span class="best-ativ-acoes">' +
            (podeRepresar ? '<button type="button" class="btn secondary doc-btn" data-brepresar="'+enc.id+'" data-bg="'+gi+'" data-ba="'+ai+'" title="Investe o que der agora; o resto fica pra próxima rodada">Represar</button>' : '') +
            '<button type="button" class="btn '+(pode?'accent':'secondary')+' doc-btn best-pagar" data-bpagar="'+enc.id+'" data-bg="'+gi+'" data-ba="'+ai+'"'+(pode?'':' disabled')+' title="Desconta o custo (usa primeiro o que já está represado)">Pagar</button></span>' : '') +
          '</div><p>'+bestTextoHtml(a.t, chave+"-"+gi+"-"+ai)+'</p></div>';
      });
    });
    return html;
  }
  // Desgaste: trilha cumulativa de Sucessos rolados pela criatura (inclusive os gastos em
  // Aberturas). Marcos tiram parte do gimmick até o fim do conflito. No Líder, cada fase tem
  // o próprio marco e a trilha zera na troca de fase.
  function bestDesgasteLista(cri, faseNum){
    return (cri.desgaste||[]).filter(function(d){ return !d.fase || !faseNum || d.fase === faseNum; });
  }
  function bestDesgasteHtml(cri, enc, chave){
    var faseNum = enc ? bestFaseNum(cri, enc.suc||0) : 0;
    var lista = bestDesgasteLista(cri, faseNum);
    if(!lista.length) return '';
    var atual = enc ? (enc.desgaste||0) : null;
    var html = '<div class="best-desg"><p class="best-grupo-tit best-tipo-desg" style="margin-top:0">Desgaste'+(faseNum?' (fase '+faseNum+')':'')+'</p>';
    if(enc){
      html += '<div class="row" style="gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><span>Sucessos rolados pela criatura: <b>'+atual+'</b></span>' +
        '<button type="button" class="best-mini" data-bdesg="'+enc.id+'" data-bv="-1"'+(atual<=0?' disabled':'')+'>−</button>' +
        '<button type="button" class="best-mini" data-bdesg="'+enc.id+'" data-bv="1">+</button>' +
        '<span class="hint" style="margin:0">(soma sozinho a cada Rolar Ativação)</span></div>';
    }
    lista.forEach(function(d, i){
      var feito = enc && atual >= d.m;
      html += '<div class="best-marco'+(feito?' feito':'')+'"><span class="best-marco-n">'+d.m+'</span><span><b>'+esc(d.n)+(feito?' ✓':'')+'</b> '+bestTextoHtml(d.t, chave+"-d"+i)+'</span></div>';
    });
    return html + '</div>';
  }
  function bestCondHtml(cri, chave){
    if(!(cri.cond||[]).length) return '';
    return '<div class="best-cond">' + cri.cond.map(function(c, i){
      return '<p><b>'+esc(c.n)+':</b> '+bestTextoHtml(c.t, chave+"-c"+i)+'</p>';
    }).join('') + '</div>';
  }
  function bestContadorHtml(rotulo, atual, alvo, attrs, mostrarAttr, mostrando){
    var pct = alvo ? Math.min(100, Math.round(100*atual/alvo)) : 0;
    var feito = alvo && atual >= alvo;
    return '<div class="best-cont'+(feito?' feito':'')+'">' +
      '<div class="best-cont-cab"><span>'+esc(rotulo)+'</span><span class="best-cont-num">'+atual+' / '+
        '<input type="number" min="1" max="99" value="'+alvo+'" '+attrs+' data-balvo title="Total necessário"></span></div>' +
      '<div class="best-barra"><span style="width:'+pct+'%"></span></div>' +
      '<div class="row" style="gap:4px;align-items:center;flex-wrap:wrap;margin-top:6px">' +
        '<button type="button" class="btn secondary doc-btn" '+attrs+' data-bdelta="-1"'+(atual<=0?' disabled':'')+'>−1</button>' +
        '<button type="button" class="btn secondary doc-btn" '+attrs+' data-bdelta="1">+1</button>' +
        '<button type="button" class="btn secondary doc-btn" '+attrs+' data-bdelta="2">+2</button>' +
        '<button type="button" class="btn secondary doc-btn" '+attrs+' data-bdelta="3">+3</button>' +
        (feito ? '<span class="item-chip esc" style="margin-left:4px">'+(rotulo.indexOf("Neutralizar")===0?'Neutralizada':'Concluída')+'</span>' : '') +
        (mostrarAttr ? '<label class="best-check"><input type="checkbox" '+mostrarAttr+(mostrando?' checked':'')+'> mostrar aos jogadores</label>' : '') +
      '</div></div>';
  }
  function bestEncontroHtml(enc){
    var cri = encCri(enc);
    if(!cri) return '<div class="item-card"><p class="hint">Criatura desconhecida ('+esc(enc.criaturaId)+').</p><button type="button" class="btn secondary doc-btn" data-bencerrar="'+enc.id+'">Tirar de cena</button></div>';
    var fase = bestFaseAtual(cri, enc.suc||0);
    var p = enc.pontos || {s:0,a:0,p:0};
    var aberto = !(state.bestEncFechado||{})[enc.id];
    var html = '<details class="item-card best-enc" data-benc="'+enc.id+'"'+(aberto?' open':'')+'><summary class="best-enc-cab">' +
      '<span class="best-enc-nome">'+esc(enc.nome)+'</span>' +
      '<span class="item-chips"><span class="item-chip">'+bestPilhaTexto(cri.pilha)+'</span>' +

    if(fase) html += '<p class="best-fase">'+esc(fase.nome)+'</p>';
    html += bestContadorHtml("Neutralizar Ameaça", enc.suc||0, enc.alvo, 'data-bcont="'+enc.id+'" data-btrilha="-1"', null, false);
    (enc.trilhas||[]).forEach(function(t, ti){
      html += bestContadorHtml(t.nome, t.atual||0, t.alvo, 'data-bcont="'+enc.id+'" data-btrilha="'+ti+'"', 'data-btrmostrar="'+enc.id+'" data-btrilha="'+ti+'"', t.mostrar);
    });
    // Pontos da Ameaça (o que sobrou das rolagens de Ativação, represado)
    html += '<div class="best-pontos"><span class="hint" style="margin:0">Pontos da Ameaça:</span>' +
      ["s","a","p"].map(function(k){

  // Limpa o rascunho antes de gravar: números, custos vazios, listas vazias.
  function criaturaLimpa(c){
    c = JSON.parse(JSON.stringify(c));
    var n = function(v, mn){ v = parseInt(v,10); return isNaN(v) ? null : Math.max(mn||0, v); };
    c.nome = String(c.nome||"").trim(); c.categoria = String(c.categoria||"").trim();
    ["sub","perfil","desc","nota"].forEach(function(k){ c[k] = String(c[k]||"").trim(); if(!c[k]) delete c[k]; });
    c.pilha = { d6:n(c.pilha&&c.pilha.d6)||0, d10:n(c.pilha&&c.pilha.d10)||0, d12:n(c.pilha&&c.pilha.d12)||0 };
    ["d6","d10","d12"].forEach(function(k){ if(!c.pilha[k]) delete c.pilha[k]; });
    c.suc = n(c.suc, 1) || 1;
    c.fases = (c.fases||[]).map(function(f){ return { ate:n(f.ate,1)||1, nome:String(f.nome||"").trim() }; }).sort(function(a,b){ return a.ate-b.ate; });
    c.trilhas = (c.trilhas||[]).map(function(t){ return { nome:String(t.nome||"").trim(), alvo:n(t.alvo,1)||1 }; }).filter(function(t){ return t.nome; });
    c.cond = (c.cond||[]).map(function(x){ return { n:String(x.n||"").trim(), t:String(x.t||"").trim() }; }).filter(function(x){ return x.n || x.t; });
    var nf = c.fases.length;
    c.grupos = (c.grupos||[]).map(function(g){
      var o = { tipo:g.tipo||"ameaca", itens:(g.itens||[]).map(function(a){
        var r = { n:String(a.n||"").trim(), c:{}, t:String(a.t||"").trim() };
        ["s","a","p"].forEach(function(k){ var v = n(a.c && a.c[k]); if(v) r.c[k] = v; });
        if(String(a.x||"").trim()) r.x = String(a.x).trim();
        var tr = n(a.trilha); if(g.tipo === "abert" && tr != null && tr < c.trilhas.length){ r.trilha = tr; r.ganho = n(a.ganho,1) || 1; }
        return r;
      }).filter(function(a){ return a.n || a.t; }) };
      if(String(g.titulo||"").trim()) o.titulo = String(g.titulo).trim();
      var fs = n(g.fase); if(fs && fs <= nf) o.fase = fs;
      return o;
    }).filter(function(g){ return g.itens.length; });
    c.desgaste = (c.desgaste||[]).map(function(d){
      var o = { m:n(d.m,1)||1, n:String(d.n||"").trim(), t:String(d.t||"").trim() };
      var fs = n(d.fase); if(fs && fs <= nf) o.fase = fs;
      return o;
    }).filter(function(d){ return d.n || d.t; });
    ["fases","trilhas","cond","desgaste"].forEach(function(k){ if(!c[k].length) delete c[k]; });
    delete c.atualizadoEm;
    return c;

    return id;

  function criaturaExportavel(c){ var x = JSON.parse(JSON.stringify(c)); delete x.atualizadoEm; return x; }
  function exportarCatalogo(){
    var dados = { tipo:"catalogo-criaturas-assimilacao", versao:1, origem:(campanhaAtual && campanhaAtual.nome) || "", exportadoEm:new Date().toISOString(),
      criaturas:criaturasLista().map(criaturaExportavel) };
    var blob = new Blob([JSON.stringify(dados, null, 1)], { type:"application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "criaturas_"+String((campanhaAtual && campanhaAtual.nome) || "campanha").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"_")+".json";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);

  // Lê o arquivo e grava as criaturas na campanha aberta. Mesmo id = substitui.
  // Descrições já editadas nesta campanha pelo jeito antigo (documentosNotas
  // "bestdesc_<id>") passam para a criatura importada.
  // Arquivo (Importar catálogo) ou código colado (Colar código, que aceita também o
  // "Copiar código" de uma criatura). aoConfirmar roda logo depois de confirmar.
  function importarCatalogo(texto, rerender, comoCodigo, aoConfirmar){
    var oque = comoCodigo ? "código" : "arquivo";
    var lista = lerListaArquivo(texto, "catalogo-criaturas-assimilacao", "criaturas", "criaturas", comoCodigo); if(!lista) return;
    var validas = lista.filter(function(c){ return c && typeof c === "object" && String(c.nome||"").trim() && (c.pilha || c.grupos || c.suc != null || c.categoria || c.cat); });
    if(!validas.length){ if(!avisoTipoProvavel(lista, "criaturas", comoCodigo)) alert("Não achei criaturas com nome nesse "+oque+"."); return; }
    var existentes = validas.filter(function(c){ return c.id && bestCriatura(c.id); }).length;
    var nomeCmp = (campanhaAtual && campanhaAtual.nome) || "esta campanha";
    var uma = validas.length === 1 && validas[0].nome;
    askConfirm((uma ? 'Importar a criatura "'+uma+'" para '+nomeCmp+'?' : "Importar "+validas.length+" criatura"+(validas.length>1?"s":"")+" para "+nomeCmp+"?")+(existentes?(uma ? " Ela já existe com o mesmo nome interno e será substituída." : " "+existentes+" já existe"+(existentes>1?"m":"")+" com o mesmo nome interno e ser"+(existentes>1?"ão":"á")+" substituída"+(existentes>1?"s":"")+"."):""), function(){
      if(aoConfirmar) aoConfirmar();
      var base = criaturasLista().reduce(function(m, x){ return Math.max(m, x.ordem||0); }, 0);
      var ops = [], novas = [];
      validas.forEach(function(orig, k){
        var c = criaturaLimpa(Object.assign(criaturaNova(), orig, { grupos:orig.grupos||[], cond:orig.cond||[], trilhas:orig.trilhas||[], fases:orig.fases||[], desgaste:orig.desgaste||[] }));
        if(!c.categoria && orig.cat) c.categoria = orig.cat;
        c.id = (orig.id && /^[a-z0-9_-]{1,60}$/i.test(orig.id)) ? orig.id : slugCriatura(c.nome);
        var antiga = (shared.documentosNotas||[]).filter(function(x){ return x.id === "bestdesc_"+c.id; })[0];
        if(antiga && typeof antiga.descMesa === "string") c.desc = antiga.descMesa;
        var jaTinha = bestCriatura(c.id);
        c.ordem = orig.ordem != null ? orig.ordem : (jaTinha && jaTinha.ordem != null ? jaTinha.ordem : base + k + 1);
        c.importadaEm = new Date().toISOString();
        novas.push(c);
        ops.push({ tipo:"set", col:"criaturas", id:c.id, data:c });
      });
      var ids = novas.map(function(c){ return c.id; });
      shared.criaturas = (shared.criaturas||[]).filter(function(x){ return ids.indexOf(x.id) < 0; }).concat(novas);
      rerender();
      if(FB) FB.escrever(ops).then(function(){ alert(novas.length+" criatura"+(novas.length>1?"s importadas":" importada")+"."); })
        .catch(function(e){ console.error("[Pangea] importar criaturas", e); alert("Não deu pra importar: " + (e && (e.code || e.message) || "erro desconhecido") + ". Confira se as regras do Firestore têm o bloco criaturas."); });
    });
  }

  // ----- CONFLITOS (só o Assimilador vê) -----
  // Pedido do Marco, 27/09/2026: uma forma simples de montar um "conflito"
  // (uma cena de tensão prolongada, tipo uma perseguição ou um cerco, que se
  // resolve acumulando Sucessos ao longo de vários testes, e não num teste
  // só) só indicando quantos Sucessos ele exige pra ser resolvido e ir
  // contabilizando conforme os jogadores rolam. Fica salvo só neste
  // navegador (localStorage, "pangea:gm:conflitos"), igual o Registro do
  // Assimilador em modo local avulso - não é um dado de personagem nem
  // precisa ser sincronizado com a mesa, é só uma anotação de mesa do
  // próprio Assimilador. Nada complexo de propósito: não guarda quem
  // contribuiu com qual Sucesso, nem categoriza o tipo de conflito - é só um
  // nome opcional, uma meta de Sucessos e uma contagem que sobe/desce.
  function renderGmConflitos(){
    var conflitos = loadLS("pangea:gm:conflitos", []);
    var body = '<p class="hint">Monte um conflito (perseguição, cerco, negociação prolongada...) indicando quantos Sucessos ele exige pra ser resolvido, e vá somando o placar conforme os testes acontecem na mesa.</p>';
    body += '<div class="row" style="gap:8px;flex-wrap:wrap;align-items:flex-end">' +
      '<div class="field" style="max-width:220px;margin:0"><label>Nome do conflito (opcional)</label><input type="text" id="conflito-nome" placeholder="ex: Fuga do posto avançado"></div>' +
      '<div class="field" style="max-width:150px;margin:0"><label>Sucessos p/ resolver</label><input type="number" id="conflito-alvo" min="1" max="99" value="5"></div>' +
      '<button type="button" class="btn accent" data-action="conflito-add">Criar conflito</button>' +
    '</div>';
    if(!conflitos.length){
      body += '<p class="hint" style="margin-top:10px">Nenhum conflito em andamento.</p>';
    } else {
      body += '<div class="trait-list" style="margin-top:10px">';
      conflitos.forEach(function(cf){
        var resolvido = cf.atual >= cf.alvo;
        body += '<div class="trait'+(resolvido?" checked":"")+'" style="cursor:default;align-items:center">' +
          '<span class="txt"><b>'+esc(cf.nome||"Conflito")+'</b><span>'+cf.atual+' / '+cf.alvo+' Sucessos'+(resolvido?' — resolvido!':'')+'</span></span>' +
          '<div class="row" style="gap:4px;flex-wrap:nowrap;flex:none">' +
            '<button type="button" class="btn secondary" data-conflito="menos" data-id="'+cf.id+'" style="padding:2px 8px" '+(cf.atual<=0?"disabled":"")+'>&minus;</button>' +
            '<button type="button" class="btn secondary" data-conflito="mais" data-id="'+cf.id+'" style="padding:2px 8px" '+(cf.atual>=cf.alvo?"disabled":"")+'>+</button>' +
            '<button type="button" class="btn secondary" data-conflito="remover" data-id="'+cf.id+'" style="padding:2px 8px">remover</button>' +
          '</div>' +
        '</div>';
      });
      body += '</div>';
    }
    return sectionCard("gmconflitos", "Conflitos", body);
  }

  function bindGmConflitos(){
    var addBtn = app.querySelector('[data-action="conflito-add"]');
    if(addBtn) addBtn.addEventListener("click", function(){
      var nomeEl = app.querySelector('#conflito-nome');
      var alvoEl = app.querySelector('#conflito-alvo');
      var alvo = clamp(parseInt(alvoEl.value,10)||1, 1, 99);
      var conflitos = loadLS("pangea:gm:conflitos", []);
      conflitos.push({ id: uid(), nome: (nomeEl.value||"").trim(), alvo: alvo, atual: 0 });
      saveLS("pangea:gm:conflitos", conflitos);
      renderGm();
    });
    app.querySelectorAll('[data-conflito]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var acao = btn.getAttribute("data-conflito");
        var id = btn.getAttribute("data-id");
        var conflitos = loadLS("pangea:gm:conflitos", []);
        if(acao === "remover"){
          conflitos = conflitos.filter(function(c){ return c.id!==id; });
        } else {
          var cf = conflitos.filter(function(c){ return c.id===id; })[0];
          if(cf){
            if(acao === "mais") cf.atual = clamp(cf.atual+1, 0, cf.alvo);
            if(acao === "menos") cf.atual = clamp(cf.atual-1, 0, cf.alvo);
          }
        }
        saveLS("pangea:gm:conflitos", conflitos);
        renderGm();
      });
    });
  }

  function xpMotivoOptions(){
    return XP_MOTIVOS.map(function(m){ return '<option value="'+m[0]+'" data-qtd="'+m[2]+'">'+m[1]+'</option>'; }).join('');

  // ---------- ITENS ACHÁVEIS (pool do Assimilador) ----------
  // Pedido do Marco (01/10/2026): uma pool de itens que o grupo pode achar,
  // organizada por local e por Escassez, com sorteio. Ao entregar, o item entra
  // direto no Inventário adicional do personagem. A coleção "itensPool" só o
  // Assimilador lê e escreve (nada vaza pros jogadores antes da entrega).
  function itensPoolLista(){ return (shared.itensPool||[]).slice().sort(function(a,b){ return String(a.nome||"").localeCompare(String(b.nome||"")); }); }
  function itemPoolEscassez(it){
    if(it.escassez !== null && it.escassez !== undefined && it.escassez !== "") return clamp(parseInt(it.escassez,10)||0, 0, 6);
    return clamp(itemCusto(it.traits||[]), 0, 6);
  }
  function itemPoolTraitsTexto(traits){
    return (traits||[]).map(function(s){ var d = EQUIP_TRAITS.filter(function(x){ return x.id===s.id; })[0]; return d ? d.nome+((s.qtd||1)>1?" x"+s.qtd:"") : s.id; }).join(", ");
  }
  function normalizarTraits(arr){
    return (arr||[]).map(function(t){ return typeof t === "string" ? {id:t, qtd:1} : {id:t.id, qtd:t.qtd||1}; })
      .filter(function(t){ return EQUIP_TRAITS.some(function(x){ return x.id===t.id; }); });
  }
  function itemPoolDados(it){
    return { id:it.id, nome:it.nome||"", desc:it.desc||"", efeito:it.efeito||"", nota:it.nota||"", local:it.local||"",
      escassez:(it.escassez===null||it.escassez===undefined||it.escassez==="") ? null : clamp(parseInt(it.escassez,10)||0,0,6),
      traits:normalizarTraits(it.traits), qtd:Math.max(1, parseInt(it.qtd,10)||1), entregues:(it.entregues||[]).slice(),
      qualidade:(it.qualidade===null||it.qualidade===undefined||it.qualidade==="") ? null : clamp(parseInt(it.qualidade,10)||0,0,6),
      criadoEm:it.criadoEm||new Date().toISOString(), atualizadoEm:new Date().toISOString() };
  }
  // Estado em que o item é achado (Qualidade 0-6, pág. 95). Itens marcantes têm
  // Qualidade fixa; os outros sorteiam pela tendência do local: ruínas e lugares
  // abandonados dão itens gastos, acampamentos dão itens Padrão ou melhores.
  var ITEM_QUAL_LOCAL = {
    abandonado: [[1,25],[2,40],[3,30],[4,5]],
    acampamento:[[2,10],[3,65],[4,20],[5,5]],
    geral:      [[1,10],[2,35],[3,45],[4,10]]
  };
  // Etapa C: a tendência de cada local vem da configuração da campanha (Painel →
  // Configuração da campanha → Locais). Local fora da lista: tendência geral.
  function itemQualTendencia(local){
    var l = locaisConfig().filter(function(x){ return x.nome === local; })[0];
    return l && ITEM_QUAL_LOCAL[l.tendencia] ? l.tendencia : "geral";
  }
  function itemQualSortear(local){
    if(!autoLigada("qualidadePorLocal")) return 3;
    var tab = ITEM_QUAL_LOCAL[itemQualTendencia(local)], r = Math.random()*100, acc = 0;
    for(var i=0;i<tab.length;i++){ acc += tab[i][1]; if(r < acc) return tab[i][0]; }
    return 3;
  }
  function itemQualTexto(it){
    if(it.qualidade!=null) return it.qualidade+' · '+QUALIDADES[it.qualidade];
    if(!autoLigada("qualidadePorLocal")) return '3 · '+QUALIDADES[3]+' (sem sorteio nesta campanha)';
    var t = itemQualTendencia(it.local);
    return 'sorteada ('+(t==="acampamento"?"acampamento: em geral Padrão ou melhor":t==="abandonado"?"abandonado: em geral gasto":"em geral Comprometido ou Padrão")+')';
  }
  // Itens: o arquivo leva nome, textos, nota, local, Escassez, Qualidade,
  // características e quantidade. Não leva a quem foi entregue.
  function itemExportavel(it){
    return { id:it.id, nome:it.nome||"", desc:it.desc||"", efeito:it.efeito||"", nota:it.nota||"", local:it.local||"",
      escassez:(it.escassez===undefined ? null : it.escassez), qualidade:(it.qualidade===undefined ? null : it.qualidade),
      traits:normalizarTraits(it.traits), qtd:it.qtd||1 };
  }
  function exportarItensPool(){
    var itens = itensPoolLista().map(itemExportavel);
    baixarJson({ tipo:"itens-assimilacao", versao:1, origem:(campanhaAtual && campanhaAtual.nome) || "", exportadoEm:new Date().toISOString(), itens:itens }, nomeArquivoCampanha("itens"));
  }
  // Mesmo id = substitui o item, mas mantém a quem já foi entregue.
  function itensOpsImportar(arr){
    var ops = [], existentes = 0;
    arr.forEach(function(x){
      if(!x || typeof x !== "object" || !String(x.nome||"").trim()) return;
      var id = idSeguro(x.id, "it_");
      var existente = itensPoolLista().filter(function(y){ return y.id===id; })[0];
      if(existente) existentes++;
      var d = itemPoolDados({ id:id, nome:x.nome, desc:x.desc, efeito:x.efeito, qualidade:x.qualidade, nota:x.nota, local:x.local, escassez:x.escassez, traits:x.traits, qtd:x.qtd,
        entregues: existente ? existente.entregues : [], criadoEm: existente ? existente.criadoEm : null });
      ops.push({ tipo:"set", col:"itensPool", id:id, data:d });
    });
    return { ops:ops, n:ops.length, existentes:existentes };
  }
  function importarItensArquivo(texto, rerender, comoCodigo, aoConfirmar){
    var lista = lerListaArquivo(texto, "itens-assimilacao", "itens", "itens", comoCodigo); if(!lista) return;
    var r = itensOpsImportar(lista);
    if(!r.ops.length){ if(!avisoTipoProvavel(lista, "itens", comoCodigo)) alert("Não achei itens com nome nesse "+(comoCodigo?"código":"arquivo")+"."); return; }
    var nome = (campanhaAtual && campanhaAtual.nome) || "esta campanha";
    var um = r.n === 1 && lista.length === 1 && lista[0].nome;
    askConfirm((um ? 'Importar o item "'+um+'" para '+nome+'?' : "Importar "+r.n+" ite"+(r.n>1?"ns":"m")+" para "+nome+"?")+(r.existentes?(um ? " Ele já existe e será substituído (quem já recebeu continua com o seu)." : " "+r.existentes+" já existe"+(r.existentes>1?"m":"")+" e ser"+(r.existentes>1?"ão substituídos":"á substituído")+" (quem já recebeu continua com o seu)."):""), function(){
      if(aoConfirmar) aoConfirmar();
      var p = gravarItensPool(r.ops);
      if(p && p.then) p.then(function(){ if(rerender) rerender(); });
    });
  }
  function gravarItensPool(ops){
    if(!FB) return Promise.resolve();
    return FB.escrever(ops).catch(function(e){ console.error("[Pangea] itens", e); alert("Não consegui salvar o item. Confira a conexão e se as regras do Firestore têm o bloco itensPool."); });
  }
  function itensPoolFiltrados(){
    var f = state.itemFiltro || {};
    return itensPoolLista().filter(function(it){
      if(f.local && (it.local||"Sem local") !== f.local) return false;
      if(f.esc !== undefined && f.esc !== "" && itemPoolEscassez(it) !== parseInt(f.esc,10)) return false;
      if(f.naoEntregues && (it.entregues||[]).length) return false;
      return true;
    });
  }

    var html = '<div class="card" id="gm-itens"><h2>Itens achados</h2>';
    var ed = state.itemPoolEdit;
    if(ed){

        '<div class="grid cols-2"><div class="field"><label>Escassez</label><select data-ipf="escassez"><option value=""'+((ed.escassez===null||ed.escassez===undefined||ed.escassez==="")?' selected':'')+'>Automática pelas características ('+escAuto+' · '+ESCASSEZ_NOMES[escAuto]+')</option>' +

  function bindGmItens(rerender){
    var raiz = comCaixa(app.querySelector("#gm-itens")); if(!raiz) return; // inclui a caixa do item aberto
    var ed = state.itemPoolEdit;
    var arqItens = raiz.querySelector("[data-ipimpfile]");
    if(arqItens) arqItens.addEventListener("change", function(){
      var f = arqItens.files && arqItens.files[0]; if(!f) return;
      var leitor = new FileReader();
      leitor.onload = function(){ importarItensArquivo(String(leitor.result||""), rerender); };
      leitor.readAsText(f);
    });
    raiz.querySelectorAll("[data-ipf]").forEach(function(el){
      el.addEventListener(el.tagName==="SELECT" ? "change" : "input", function(){ ed[el.getAttribute("data-ipf")] = el.value; });
    });
    if(ed) bindTraitList("pitem", ed.traits, rerender);
    raiz.querySelectorAll("[data-ipfiltro]").forEach(function(el){
      el.addEventListener("change", function(){
        var k = el.getAttribute("data-ipfiltro");
        state.itemFiltro[k] = el.type === "checkbox" ? el.checked : el.value;
        state.itemSorteado = null; rerender();
      });
    });
    raiz.querySelectorAll("[data-ipgrupo]").forEach(function(el){
      el.addEventListener("toggle", function(){ state.itemGruposAbertos[el.getAttribute("data-ipgrupo")] = el.open; });
    });
    raiz.querySelectorAll("[data-ipentregar]").forEach(function(b){ b.addEventListener("click", function(){
      var id = b.getAttribute("data-ipentregar"), it = itensPoolLista().filter(function(x){ return x.id===id; })[0];
      state.itemEntregar = id;
      state.itemEntregarQual = it ? (it.qualidade!=null ? it.qualidade : itemQualSortear(it.local)) : 3;
      rerender();
    }); });
    var qualSel = raiz.querySelector("[data-ipqual]");
    if(qualSel) qualSel.addEventListener("change", function(){ state.itemEntregarQual = parseInt(qualSel.value,10); });
    raiz.querySelectorAll("[data-ipeditar]").forEach(function(b){ b.addEventListener("click", function(){
      var it = itensPoolLista().filter(function(x){ return x.id===b.getAttribute("data-ipeditar"); })[0]; if(!it) return;
      state.itemPoolEdit = JSON.parse(JSON.stringify(it)); state.itemPoolEdit.traits = normalizarTraits(it.traits); rerender();
    }); });
    raiz.querySelectorAll("[data-ipcopiar]").forEach(function(b){ b.addEventListener("click", function(){
      var it = itensPoolLista().filter(function(x){ return x.id===b.getAttribute("data-ipcopiar"); })[0]; if(!it) return;
      copiarTexto(codigoDeUm("itens-assimilacao", "itens", itemExportavel(it)), b);
    }); });
    raiz.querySelectorAll("[data-ipexcluir]").forEach(function(b){ b.addEventListener("click", function(){
      var id = b.getAttribute("data-ipexcluir"), it = itensPoolLista().filter(function(x){ return x.id===id; })[0];
      askConfirm('Excluir "'+((it&&it.nome)||"este item")+'" da pool? (Quem já recebeu continua com ele no inventário.)', function(){ gravarItensPool([{ tipo:"del", col:"itensPool", id:id }]); });
    }); });
    raiz.querySelectorAll("[data-ipacao]").forEach(function(b){
      b.addEventListener("click", function(){
        var acao = b.getAttribute("data-ipacao");
        if(acao === "novo"){ state.itemPoolEdit = { id:"it_"+uid(), nome:"", desc:"", efeito:"", qualidade:"", nota:"", local:(state.itemFiltro||{}).local||"", escassez:"", traits:[], qtd:1, entregues:[] }; state.itemImportar = false; rerender(); }
        else if(acao === "cancelar"){ state.itemPoolEdit = null; rerender(); }
        else if(acao === "salvar"){
          if(!String(ed.nome||"").trim()){ alert("Dê um nome ao item."); return; }
          var existente = itensPoolLista().filter(function(x){ return x.id===ed.id; })[0];
          if(existente){ ed.entregues = existente.entregues||[]; ed.criadoEm = existente.criadoEm; }
          gravarItensPool([{ tipo:"set", col:"itensPool", id:ed.id, data:itemPoolDados(ed) }]);
          state.itemPoolEdit = null; rerender();
        }
        else if(acao === "importar"){ state.itemImportar = !state.itemImportar; rerender(); }
        else if(acao === "importar-arq"){ var arqI = raiz.querySelector("[data-ipimpfile]"); if(arqI){ arqI.value = ""; arqI.click(); } }
        else if(acao === "exportar"){ exportarItensPool(); }
        else if(acao === "importar-cancelar"){ state.itemImportar = false; rerender(); }
        else if(acao === "importar-ok"){
          var txt = String((raiz.querySelector("#item-import")||{}).value || "").trim();
          if(!txt){ alert("Cole o código primeiro."); return; }
          importarItensArquivo(txt, rerender, true, function(){ state.itemImportar = false; });
        }
        else if(acao === "sortear"){
          var lista = itensPoolFiltrados();
          if(!lista.length){ alert("Nenhum item com esses filtros pra sortear."); return; }
          state.itemSorteado = lista[Math.floor(Math.random()*lista.length)].id;
          state.itemEntregar = null; rerender();
        }
        else if(acao === "entregar-cancelar"){ state.itemEntregar = null; rerender(); }
        else if(acao === "ressortear"){
          var itR = itensPoolLista().filter(function(x){ return x.id===state.itemEntregar; })[0];
          if(itR) state.itemEntregarQual = itemQualSortear(itR.local); rerender();
        }
        else if(acao === "entregar-ok"){
          var it = itensPoolLista().filter(function(x){ return x.id===state.itemEntregar; })[0]; if(!it) return;
          var sel = raiz.querySelector("[data-ippara]:checked"); if(!sel) return;
          var c = getChar(sel.getAttribute("data-ippara")); if(!c) return;
          var traits = normalizarTraits(it.traits);
          var novo = novoItem(it.nome, it.desc, traits, { qtd:it.qtd||1, achadoId:it.id, efeito:it.efeito||"" });
          if(!traits.length) novo.escassez = itemPoolEscassez(it);
          novo.qualidade = clamp(state.itemEntregarQual!=null ? state.itemEntregarQual : 3, 0, 6);
          c.inventarioExtra = (c.inventarioExtra||[]).concat([novo]);
          updateChar(c);
          if(caps.mode==="mesa"){ clearTimeout(publishTimer); doPublish(); }
          gravarItensPool([{ tipo:"update", col:"itensPool", id:it.id, data:{ entregues:(it.entregues||[]).concat([{ charId:c.id, ts:new Date().toISOString() }]), atualizadoEm:new Date().toISOString() } }]);
          state.itemEntregar = null; state.itemSorteado = null; rerender();
        }
      });
    });
  }

  function bindGmXp(){
    function motivoTexto(chave){
      var sel = app.querySelector('[data-gmxpmotivo="'+chave+'"]'), det = app.querySelector('[data-gmxpdet="'+chave+'"]');
      var m = XP_MOTIVOS.filter(function(x){ return x[0]===sel.value; })[0];
      var t = m ? m[1] : "Experiência";
      if(det && det.value.trim()) t += ": " + det.value.trim();
      return t;
    }
    app.querySelectorAll('[data-gmxpmotivo]').forEach(function(sel){
      sel.addEventListener("change", function(){
        var m = XP_MOTIVOS.filter(function(x){ return x[0]===sel.value; })[0];
        var q = app.querySelector('[data-gmxpqtd="'+sel.getAttribute("data-gmxpmotivo")+'"]');
        if(m && q) q.value = m[2];
      });
    });
    app.querySelectorAll('[data-gmxpdar]').forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        if(!temAcessoTotal()) return;
        var chave = btn.getAttribute("data-gmxpdar");
        var qtd = Math.abs(parseInt(app.querySelector('[data-gmxpqtd="'+chave+'"]').value, 10)||0);
        if(!qtd) return;
        if(btn.getAttribute("data-gmxpsinal") === "-1") qtd = -qtd;
        var motivo = (qtd<0?'Retirado · ':'') + motivoTexto(chave);
        var ids = chave === "todos"
          ? Array.prototype.slice.call(app.querySelectorAll('[data-gmxptodos]')).filter(function(el){ return el.checked; }).map(function(el){ return el.getAttribute("data-gmxptodos"); })
          : [chave];
        if(!ids.length) return;
        var nomes = ids.map(function(id){ var c = getChar(id); return c ? c.nomePersonagem : ""; }).filter(Boolean);
        askConfirm((qtd>0?'Dar ':'Retirar ')+Math.abs(qtd)+' de Experiência ('+motivo+')'+(qtd>0?' pra: ':' de: ')+nomes.join(", ")+'?'+(qtd<0?' Se o saldo de alguém ficar negativo, desfaça compras na seção Evoluir da ficha.':''), function(){
          ids.forEach(function(id){ var c = getChar(id); if(c){ darExperiencia(c, qtd, motivo); updateChar(c); } });
          if(caps.mode==="mesa"){ clearTimeout(publishTimer); doPublish(); }
          renderGmMesa();
        });
      });
    });
    app.querySelectorAll('[data-gmxpinst]').forEach(function(el){
      el.addEventListener("click", function(e){ e.stopPropagation(); });
      el.addEventListener("change", function(){
        if(!temAcessoTotal()) return;
        var c = getChar(el.getAttribute("data-gmxpinst")); if(!c) return;
        var x = xpDados(c); x.liberarInstinto = el.checked; c.xp = x;
        updateChar(c);
        if(caps.mode==="mesa"){ clearTimeout(publishTimer); doPublish(); }
      });
    });
  }
