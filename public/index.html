    }
    html += '<p class="hint" id="conv-status" style="font-weight:600;margin:10px 0 0"></p>' +
      '<div class="row" style="gap:8px;margin-top:10px"><button type="button" class="btn accent" data-conv="enviar"'+(lobby.ocupado?' disabled':'')+'>Pedir para entrar</button><button type="button" class="btn secondary" data-conv="dispensar">Dispensar</button></div></div>';
    lobby.formOpcoes = opcoes; lobby.formPedeAcamp = pedeAcamp; lobby.formPedeExtras = pedeExtras.map(function(x){ return x.id; });
    return html;
  }

  // ---------- LEVAR UMA FICHA PARA UMA CAMPANHA EM QUE JÁ JOGO (etapa H2) ----------
  // Igual ao convite, mas sem link: a conta já é membro. Vira um pedido (membro:true)
  // que o mestre aprova no Painel; a regra do Firestore aceita esse pedido de quem já
  // está em "membros".
  function lobbyLevarHtml(){
    var lv = lobby.levar; if(!lv) return "";
    var cmp = campanhaDoLobby(lv.cid);
    if(!cmp || cmp.donoUid === usuario.uid){ lobby.levar = null; return ""; }
    var cr = completarConfig(cmp.config, configBase(cmp)).criacao;
    var opsGrupo = cr.acampamento ? (cr.grupo.opcoes||[]).filter(function(o){ return o && o.id; }) : [];
    // Como no convite: campanha com grupo ligado e sem lista própria usa os acampamentos da Pangea.
    if(cr.acampamento && !opsGrupo.length) opsGrupo = Object.keys(CAMPS_PANGEA).map(function(k){ return { id:k, nome:CAMPS_PANGEA[k].nome }; });
    var rot = cr.grupo.rotulo || "Acampamento";
    var naMesa = (lobby.copias[cmp.id]||[]).map(function(c){ return c.baseId || c.id; });
    var opcoes = [];
    (lobby.bases||[]).forEach(function(b){
      (lobby.guardadas[b.id]||[]).filter(function(x){ return x.campanhaId === cmp.id; }).forEach(function(x){
        opcoes.push({ valor:"g:"+b.id+":"+x.id, titulo:x.nomePersonagem||b.nomePersonagem||"Sem nome", detalhe:"volta com a ficha guardada desta campanha, do jeito que estava quando saiu", base:b, guardada:x });
      });
      if(naMesa.indexOf(b.id) > -1) return; // essa ficha já tem cópia nesta mesa
      opcoes.push({ valor:"b:"+b.id, titulo:b.nomePersonagem||"Sem nome", detalhe:(b.nomeJogador?esc(b.nomeJogador)+" · ":"")+(b.acampamento && CAMPS[b.acampamento] ? CAMPS[b.acampamento].nome : "sem acampamento")+" · leva a ficha-base como está", base:b });
    });
    var html = '<div class="card" id="lobby-levar" style="border-color:var(--accent)"><h2>Levar uma ficha para '+esc(cmp.nome||"a campanha")+'</h2>';
    if(!opcoes.length){
      return html + '<p class="hint" style="margin:0 0 12px">Todas as suas fichas já estão nesta mesa. Crie uma nova em <b>+ Criar ficha</b> e volte aqui.</p>' +
        '<div class="row" style="gap:8px;flex-wrap:wrap"><button type="button" class="btn accent" data-lobby="criar-ficha">+ Criar ficha</button><button type="button" class="btn secondary" data-lev="cancelar">Cancelar</button></div></div>';
    }
    if(!lv.escolha || !opcoes.some(function(o){ return o.valor === lv.escolha; })) lv.escolha = opcoes[0].valor;
    var esc0 = opcoes.filter(function(o){ return o.valor === lv.escolha; })[0];
    var levaBase = !!(esc0.base && !esc0.guardada);
    var pedeGrupo = levaBase && opsGrupo.length > 0 && !opsGrupo.some(function(o){ return o.id === esc0.base.acampamento; });
    var pedeExtras = levaBase ? (cr.camposExtras||[]).filter(function(x){ return x && x.id && !String(((esc0.base.extras)||{})[x.id]||"").trim(); }) : [];
    html += '<p class="hint" style="margin:0 0 10px">Escolha a ficha. A campanha recebe uma cópia própria dela e a sua ficha-base continua na sua conta. A ficha só entra na mesa depois que o mestre aprovar.</p><div class="lobby-opcoes">';
    opcoes.forEach(function(o){
      html += '<label class="lobby-opcao'+(o.valor===lv.escolha?' sel':'')+'"><input type="radio" name="lev-ficha" value="'+esc(o.valor)+'"'+(o.valor===lv.escolha?' checked':'')+'>' +
        '<span><b>'+esc(o.titulo)+'</b><br><span class="hint">'+o.detalhe+'</span></span></label>';
    });
    html += '</div>';
    if(pedeGrupo){
      html += '<div class="field" style="margin-top:10px"><label>'+esc(rot)+' (a ficha ainda não tem um que valha nesta campanha; dá pra escolher depois)</label><select data-lev="acampamento"><option value="">escolha…</option>' +
        opsGrupo.map(function(o){ return '<option value="'+esc(o.id)+'"'+(lv.acampamento===o.id?' selected':'')+'>'+esc(o.nome||o.id)+'</option>'; }).join("") + '</select></div>';
    }
    if(pedeExtras.length){
      var fx = lv.extras || (lv.extras = {});
      html += '<p class="hint" style="margin:12px 0 0"><b>Esta campanha pede também</b> (dá pra completar depois na ficha):</p><div class="grid cols-2 conv-extras">' + pedeExtras.map(function(x){
        var v = fx[x.id] || "", r = esc(x.rotulo || "Campo");
        if(x.tipo === "escolha"){
          var ops = (x.opcoes||[]).filter(function(o){ return String(o).trim(); });
          return '<div class="field"><label>'+r+'</label><select data-levextra="'+esc(x.id)+'"><option value="">escolha…</option>' +
            ops.map(function(o){ return '<option value="'+esc(o)+'"'+(v===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('') + '</select>' +
            (x.ajuda ? '<p class="hint" style="margin:4px 0 0">'+esc(x.ajuda)+'</p>' : '') + '</div>';
        }
        return '<div class="field"><label>'+r+'</label><input type="text" maxlength="200" data-levextra="'+esc(x.id)+'" value="'+esc(v)+'"'+(x.ajuda?' placeholder="'+esc(x.ajuda)+'"':'')+'></div>';
      }).join('') + '</div>';
    } else if(levaBase && !pedeGrupo){
      html += '<p class="hint" style="margin:10px 0 0">A campanha não pede nada a mais para esta ficha.</p>';
    }
    html += '<p class="hint" id="lev-status" style="font-weight:600;margin:10px 0 0"></p>' +
      '<div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap"><button type="button" class="btn accent" data-lev="enviar"'+(lobby.ocupado?' disabled':'')+'>Pedir ao mestre</button><button type="button" class="btn secondary" data-lev="cancelar">Cancelar</button></div></div>';
    lv.opcoes = opcoes; lv.pedeGrupo = pedeGrupo; lv.pedeExtras = pedeExtras.map(function(x){ return x.id; });
    return html;
  }
  function enviarPedidoLevar(){
    var lv = lobby.levar, cmp = campanhaDoLobby(lv.cid);
    var o = (lv.opcoes||[]).filter(function(x){ return x.valor === lv.escolha; })[0];
    if(!cmp || !o) return Promise.reject(new Error("escolha uma ficha"));
    var comp = {};
    if(lv.pedeGrupo && lv.acampamento) comp.acampamento = lv.acampamento;
    var ex = {}, tem = false;
    (lv.pedeExtras||[]).forEach(function(id){ var v = String(((lv.extras)||{})[id]||"").trim(); if(v){ ex[id] = v.slice(0, 200); tem = true; } });
    if(tem) comp.extras = ex;
    var p = {
      uid: usuario.uid, email: usuario.email || null, nome: usuario.displayName || null,
      membro: true, codigo: null, campanhaId: cmp.id, campanhaNome: cmp.nome || "",
      criadoEm: agoraIso(), status: "pendente",
      fichaBaseId: o.base ? o.base.id : null,
      fichaNome: o.guardada ? (o.guardada.nomePersonagem||"") : (o.base ? (o.base.nomePersonagem||"") : null),
      retorno: !!o.guardada, guardadaId: o.guardada ? o.guardada.id : null,
      ficha: (o.base && !o.guardada) ? paraFirestore(o.base) : null,
      complemento: comp
    };
    return FB.escrever([{ tipo:"set", col:"/campanhas/"+cmp.id+"/pedidos", id:usuario.uid, data:paraFirestore(p) }]).then(function(){
      var lista = pedidosGuardados().filter(function(x){ return x.cid !== cmp.id; });
      lista.push({ cid:cmp.id, uid:usuario.uid, nome:p.campanhaNome });
      salvarPedidos(lista);
      lobby.pedidos[cmp.id] = p;
      lobby.levar = null;
    });
  }

  function lobbyPedidosHtml(){
    var lista = pedidosGuardados().filter(function(p){ return lobby.pedidos[p.cid]; });
    if(!lista.length) return "";
    var html = '<div class="card tight"><h2>Pedidos enviados</h2>';
    lista.forEach(function(p){
      var d = lobby.pedidos[p.cid];
      var nome = esc(d.campanhaNome || p.nome || "campanha");
      if(d.status === "recusado"){
        html += '<div class="row" style="justify-content:space-between;gap:8px;margin:6px 0"><span>O mestre de <b>'+nome+'</b> recusou o pedido.</span><button type="button" class="btn secondary" data-pedido-ok="'+esc(p.cid)+'">OK</button></div>';
      } else {
        html += '<div class="row" style="justify-content:space-between;gap:8px;margin:6px 0"><span>Aguardando o mestre de <b>'+nome+'</b> aprovar'+(d.fichaNome?' (ficha: '+esc(d.fichaNome)+')':'')+'.</span><button type="button" class="btn secondary" data-pedido-cancelar="'+esc(p.cid)+'">Cancelar pedido</button></div>';
      }
    });
    return html + '</div>';
  }

  function lobbyFichasHtml(){
    var bases = lobby.bases || [];
    var html = '<div class="row" style="justify-content:space-between;align-items:center;margin:24px 0 6px"><h2 style="margin:0">Minhas fichas</h2></div>' +
      '<p class="hint" style="margin:0 0 12px">A ficha-base fica na sua conta. Cada campanha recebe uma cópia própria dela. Para levar uma ficha a uma campanha nova, abra o link de convite do mestre; para uma campanha em que você já joga, use <b>Levar uma ficha</b> no cartão dela.</p>';
    if(!bases.length){
      return html + '<div class="card"><p class="hint" style="margin:0">Nenhuma ficha-base ainda. Use <b>+ Criar ficha</b> para criar um personagem fora de campanha, ou crie um personagem dentro de uma campanha (a ficha-base nasce sozinha).</p></div>';
    }
    html += '<div class="roster-grid">';
    bases.forEach(function(b){
      var camp = b.acampamento ? CAMPS[b.acampamento] : null;
      var emCampanhas = (lobby.campanhas||[]).filter(function(cmp){
        return (lobby.copias[cmp.id]||[]).some(function(c){ return c.baseId === b.id; });
      }).map(function(cmp){ return esc(cmp.nome||""); });
      var guard = (lobby.guardadas[b.id]||[]).map(function(g){ return esc(g.campanhaNome || g.campanhaId || ""); });
      html += '<div class="char-card" style="--camp-color:'+(camp?camp.cor:'var(--accent)')+';cursor:default">' +
        (camp && camp.img ? '<img class="badge" src="'+esc(camp.img)+'" alt="">' : '') +
        '<h3>'+esc(b.nomePersonagem||"Sem nome")+'</h3>' +
        '<div class="camp-tag">'+(camp?camp.nome:"sem acampamento")+(b.nomeJogador?" · "+esc(b.nomeJogador):"")+'</div>' +
        '<div class="hint" style="margin-top:6px">'+(emCampanhas.length ? 'Em: <b>'+emCampanhas.join(", ")+'</b>' : 'Fora de campanhas no momento')+'</div>' +
        (guard.length ? '<div class="hint">Guardada de: '+guard.join(", ")+'</div>' : '') +
        '<div class="row" style="margin-top:12px;gap:8px"><button type="button" class="btn secondary" data-abrirbase="'+esc(b.id)+'">Abrir</button></div>' +
      '</div>';
    });
    return html + '</div>';
  }

  function renderLobby(){
    if(!lobby || campanhaAtual) return;
    var ativo = document.activeElement;
    var digitando = ativo && app.contains(ativo) && (ativo.tagName === "TEXTAREA" || (ativo.tagName === "INPUT" && !/^(radio|checkbox|button)$/i.test(ativo.type||"")));
    if(digitando){ lobbyRenderAdiado = true; return; }
    var nomeCurto = esc(((usuario && (usuario.displayName || usuario.email)) || "").split(" ")[0]);
    var html = '<header class="top"><div class="brand"><h1 id="brand-title">Fichas · Assimilação RPG</h1><small>suas campanhas e fichas · '+esc((usuario&&usuario.email)||"")+'</small></div>' +
      '<nav class="tabs"><button type="button" class="btn secondary" data-action="sair">Sair ('+nomeCurto+')</button></nav></header>';
    if(avisoLobby){
      html += '<div class="card tight" style="border-color:var(--accent)"><div class="row" style="justify-content:space-between;gap:8px"><span>'+esc(avisoLobby)+'</span><button type="button" class="btn secondary" data-lobby="fechar-aviso">OK</button></div></div>';
    }
    if(lobby.campanhas === null || lobby.bases === null || !lobby.extras){
      app.innerHTML = html + '<p class="empty">Carregando suas campanhas…</p>';
      ligarLobby();
      return;
    }
    html += lobbyConviteHtml();
    html += lobbyLevarHtml();
    html += lobbyPedidosHtml();
    var mestro = lobby.campanhas.filter(function(c){ return c.donoUid === usuario.uid; });
    var jogo = lobby.campanhas.filter(function(c){ return c.donoUid !== usuario.uid; });
    html += '<div class="row" style="justify-content:space-between;align-items:center;margin:20px 0 10px;gap:8px"><h2 style="margin:0">Minhas campanhas</h2>' +
      '<div class="row lobby-criar" style="gap:8px">' +
        '<button type="button" class="btn secondary" data-lobby="criar-ficha" title="Cria um personagem fora de campanha, com a criação do livro">+ Criar ficha</button>' +
        (podeCriarCampanha() && !lobby.criando ? '<button type="button" class="btn secondary" data-lobby="criar">+ Criar campanha</button>' : '') +
      '</div></div>';
    if(lobby.criando){
      html += '<div class="card"><h2>Nova campanha</h2>' +
        '<div class="field"><label>Nome da campanha</label><input type="text" maxlength="60" data-lobby="nome-nova" placeholder="ex.: Pangea"></div>' +
        '<p class="hint">Começa vazia, com você como mestre. Documentos, itens e criaturas são criados depois pelo Painel. Os jogadores entram por link de convite.</p>' +
        '<p class="hint" id="criar-status" style="font-weight:600"></p>' +
        '<div class="row" style="gap:8px"><button type="button" class="btn accent" data-lobby="confirmar-criar"'+(lobby.ocupado?' disabled':'')+'>Criar</button><button type="button" class="btn secondary" data-lobby="cancelar-criar">Cancelar</button></div></div>';
    }
    if(!lobby.campanhas.length){
      html += '<div class="card"><p class="hint" style="margin:0">Você ainda não participa de nenhuma campanha. Para entrar numa mesa, peça ao mestre um link de convite e abra o link aqui.</p></div>';
    }
    if(mestro.length){
      html += '<h3 class="lobby-sub">Como mestre</h3><div class="roster-grid">' + mestro.map(function(c){ return lobbyCardCampanhaHtml(c, true); }).join("") + '</div>';
    }
    if(jogo.length){
      html += '<h3 class="lobby-sub">Como jogador</h3><div class="roster-grid">' + jogo.map(function(c){ return lobbyCardCampanhaHtml(c, false); }).join("") + '</div>';
    }
    html += lobbyFichasHtml();
    html += '<div class="footer-note" style="margin-top:28px">'+avisoFanMadeHtml()+'</div>';
    app.innerHTML = html;
    ligarLobby();
  }

  function ligarLobby(){
    var sairBtn = app.querySelector('[data-action="sair"]');
    if(sairBtn) sairBtn.addEventListener("click", function(){ if(FB) FB.sair(); });
    var fa = app.querySelector('[data-lobby="fechar-aviso"]');
    if(fa) fa.addEventListener("click", function(){ avisoLobby = null; renderLobby(); });
    app.querySelectorAll("[data-abrircmp]").forEach(function(el){
      el.addEventListener("click", function(e){
        if(el.classList.contains("lobby-cmp") && e.target.closest("button")) return;
        e.stopPropagation();
        var cmp = campanhaDoLobby(el.getAttribute("data-abrircmp"));
        if(cmp){ if(lobby && lobby.convite && lobby.convite.cid === cmp.id) esquecerConvite(); entrarNaCampanha(cmp); }
      });
    });
    app.querySelectorAll("[data-saircmp]").forEach(function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        var cmp = campanhaDoLobby(el.getAttribute("data-saircmp")); if(!cmp) return;
        askConfirm('Sair da campanha "'+(cmp.nome||"")+'"? Sua ficha desta mesa fica guardada na sua conta, com tudo (XP, inventário, mutações), e volta assim se você entrar de novo.', function(){
          el.disabled = true;
          sairDaCampanha(cmp).then(function(){
            avisoLobby = 'Você saiu de "'+(cmp.nome||"")+'". A ficha ficou guardada na sua conta.';
            carregarExtrasLobby();
          }).catch(function(err){
            console.error("[Pangea] sair da campanha", err);
            alert("Não deu pra sair da campanha agora: " + (err && (err.code || err.message) || "erro desconhecido") + ". Nada foi apagado.");
            renderLobby();
          });
        });
      });
    });
    app.querySelectorAll('[data-lobby="criar-ficha"]').forEach(function(criarFicha){
      criarFicha.addEventListener("click", function(){ lobby.levar = null; abrirModoBase({}); });
    });
    // Levar uma ficha (etapa H2)
    app.querySelectorAll("[data-levarcmp]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        lobby.levar = { cid:b.getAttribute("data-levarcmp"), escolha:null, acampamento:"", extras:{} };
        renderLobby();
        var el = app.querySelector("#lobby-levar"); if(el && el.scrollIntoView) el.scrollIntoView({ block:"start" });
      });
    });
    app.querySelectorAll('input[name="lev-ficha"]').forEach(function(r){
      r.addEventListener("change", function(){ if(lobby.levar){ lobby.levar.escolha = r.value; renderLobby(); } });
    });
    var levAc = app.querySelector('[data-lev="acampamento"]');
    if(levAc) levAc.addEventListener("change", function(){ if(lobby.levar) lobby.levar.acampamento = levAc.value; });
    app.querySelectorAll("[data-levextra]").forEach(function(el){
      el.addEventListener(el.tagName === "SELECT" ? "change" : "input", function(){
        if(!lobby.levar) return;
        if(!lobby.levar.extras) lobby.levar.extras = {};
        lobby.levar.extras[el.getAttribute("data-levextra")] = el.value;
      });
    });
    var levCancel = app.querySelector('[data-lev="cancelar"]');
    if(levCancel) levCancel.addEventListener("click", function(){ lobby.levar = null; renderLobby(); });
    var levEnv = app.querySelector('[data-lev="enviar"]');
    if(levEnv) levEnv.addEventListener("click", function(){
      var st = app.querySelector("#lev-status");
      lobby.ocupado = true; levEnv.disabled = true; st.textContent = "Enviando…";
      enviarPedidoLevar().then(function(){
        lobby.ocupado = false;
        carregarExtrasLobby();
      }).catch(function(err){
        lobby.ocupado = false; levEnv.disabled = false;
        console.error("[Pangea] levar ficha", err);
        st.textContent = (err && err.code === "permission-denied") ? "O pedido não foi aceito (talvez você não esteja mais nesta campanha)." : "Não deu certo: " + (err && (err.code || err.message) || "erro desconhecido");
      });
    });
    app.querySelectorAll("[data-abrirbase]").forEach(function(b){
      b.addEventListener("click", function(){ abrirModoBase({ id: b.getAttribute("data-abrirbase") }); });
    });
    app.querySelectorAll("[data-convextra]").forEach(function(el){
      el.addEventListener(el.tagName === "SELECT" ? "change" : "input", function(){
        if(!lobby.form.extras) lobby.form.extras = {};
        lobby.form.extras[el.getAttribute("data-convextra")] = el.value;
      });
    });
    var criar = app.querySelector('[data-lobby="criar"]');
    if(criar) criar.addEventListener("click", function(){ lobby.criando = true; renderLobby(); var i = app.querySelector('[data-lobby="nome-nova"]'); if(i) i.focus(); });
    var cancelarCriar = app.querySelector('[data-lobby="cancelar-criar"]');
    if(cancelarCriar) cancelarCriar.addEventListener("click", function(){ lobby.criando = false; renderLobby(); });
    var confirmarCriar = app.querySelector('[data-lobby="confirmar-criar"]');
    if(confirmarCriar) confirmarCriar.addEventListener("click", function(){
      var nome = (app.querySelector('[data-lobby="nome-nova"]').value || "").trim();
      var st = app.querySelector("#criar-status");
      if(!nome){ st.textContent = "Dê um nome à campanha."; return; }
      lobby.ocupado = true; confirmarCriar.disabled = true; st.textContent = "Criando…";
      criarCampanha(nome).then(function(cmp){
        lobby.ocupado = false;
        entrarNaCampanha(cmp);
      }).catch(function(err){
        lobby.ocupado = false; confirmarCriar.disabled = false;
        console.error("[Pangea] criar campanha", err);
        st.textContent = "Não deu certo: " + (err && (err.code || err.message) || "erro desconhecido");
      });
    });
    // convite
    app.querySelectorAll('input[name="conv-ficha"]').forEach(function(r){
      r.addEventListener("change", function(){ lobby.form.escolha = r.value; renderLobby(); });
    });
    var ac = app.querySelector('[data-conv="acampamento"]');
    if(ac) ac.addEventListener("change", function(){ lobby.form.acampamento = ac.value; });
    var disp = app.querySelector('[data-conv="dispensar"]');
    if(disp) disp.addEventListener("click", function(){ esquecerConvite(); lobby.convite = null; renderLobby(); });
    var env = app.querySelector('[data-conv="enviar"]');
    if(env) env.addEventListener("click", function(){
      var st = app.querySelector("#conv-status");
      lobby.ocupado = true; env.disabled = true; st.textContent = "Enviando…";
      enviarPedido().then(function(){
        lobby.ocupado = false;
        carregarExtrasLobby();
      }).catch(function(err){
        lobby.ocupado = false; env.disabled = false;
        console.error("[Pangea] pedido", err);
        st.textContent = (err && err.code === "permission-denied") ? "O convite não foi aceito (talvez o mestre tenha desativado o link)." : "Não deu certo: " + (err && (err.code || err.message) || "erro desconhecido");
      });
    });
    app.querySelectorAll("[data-pedido-cancelar],[data-pedido-ok]").forEach(function(b){
      b.addEventListener("click", function(){
        var cid = b.getAttribute("data-pedido-cancelar") || b.getAttribute("data-pedido-ok");
        b.disabled = true;
        FB.escrever([{ tipo:"del", col:"/campanhas/"+cid+"/pedidos", id:usuario.uid }]).catch(function(e){ console.warn("[Pangea] apagar pedido", e); })
          .then(function(){ salvarPedidos(pedidosGuardados().filter(function(p){ return p.cid !== cid; })); delete lobby.pedidos[cid]; renderLobby(); });
      });
    });
  }

  function criarCampanha(nome){
    var cid = "c" + codigoAleatorio(12);
    var cmp = {
      id: cid, nome: nome, sistema: "assimilacao",
      donoUid: usuario.uid, donoEmail: usuario.email || null, donoNome: usuario.displayName || null,
      membros: [usuario.uid], membrosInfo: {}, criadaEm: agoraIso(), config: clonar(CONFIG_PADRAO)
    };
    return FB.escrever([{ tipo:"set", col:"/campanhas", id:cid, data:cmp }]).then(function(){ return cmp; });
  }

  // O que o jogador preencheu no convite além da ficha: grupo e campos extras (etapa H).
  function complementoDoPedido(){
    var comp = {};
    if(lobby.formPedeAcamp && lobby.form.acampamento) comp.acampamento = lobby.form.acampamento;
    var ex = {}, tem = false;
    (lobby.formPedeExtras||[]).forEach(function(id){
      var v = String(((lobby.form.extras)||{})[id]||"").trim();
      if(v){ ex[id] = v.slice(0, 200); tem = true; }
    });
    if(tem) comp.extras = ex;
    return comp;
  }
  function enviarPedido(){
    var cv = lobby.convite, d = cv.doc;
    var o = (lobby.formOpcoes||[]).filter(function(x){ return x.valor === lobby.form.escolha; })[0] || { valor:"nenhuma" };
    var p = {
      uid: usuario.uid, email: usuario.email || null, nome: usuario.displayName || null,
      codigo: cv.codigo, campanhaId: cv.cid, campanhaNome: d.campanhaNome || "",
      criadoEm: agoraIso(), status: "pendente",
      fichaBaseId: o.base ? o.base.id : null,
      fichaNome: o.guardada ? (o.guardada.nomePersonagem||"") : (o.base ? (o.base.nomePersonagem||"") : null),
      retorno: !!o.guardada, guardadaId: o.guardada ? o.guardada.id : null,
      ficha: (o.base && !o.guardada) ? paraFirestore(o.base) : null,
      complemento: complementoDoPedido()
    };
    return FB.escrever([{ tipo:"set", col:"/campanhas/"+cv.cid+"/pedidos", id:usuario.uid, data:paraFirestore(p) }]).then(function(){
      var lista = pedidosGuardados().filter(function(x){ return x.cid !== cv.cid; });
      lista.push({ cid:cv.cid, uid:usuario.uid, nome:p.campanhaNome });
      salvarPedidos(lista);
      esquecerConvite();
      lobby.convite = null; lobby.form = { escolha:null, acampamento:"", extras:{} };
    });
  }

  // O jogador deixa a campanha: cada ficha dele ali vira uma "guardada" na
  // ficha-base (com tudo), as cópias saem da mesa e a conta sai dos membros.
  function sairDaCampanha(cmp){
    var u = usuario, cid = cmp.id;
    var bases = {}; (lobby && lobby.bases || []).forEach(function(b){ bases[b.id] = true; });
    return FB.lerConsulta("/campanhas/"+cid+"/fichas", ["donoUid", u.uid]).then(function(l){
      var copias = l.map(function(x){ return x.data; });
      var guardar = [], remover = [];
      copias.forEach(function(c){
        var bid = c.baseId && bases[c.baseId] ? c.baseId : null;
        if(!bid){ bid = c.id; if(!bases[bid]) guardar.push({ tipo:"set", col:"/fichas", id:bid, data:paraFirestore(baseDaCopia(c, cid)) }); }
        var g = clonar(c); g.campanhaId = cid; g.campanhaNome = cmp.nome || ""; g.guardadaEm = agoraIso(); g.baseId = bid;
        guardar.push({ tipo:"set", col:"/fichas/"+bid+"/guardadas", id:c.id, data:paraFirestore(g) });
        remover.push({ tipo:"del", col:"/campanhas/"+cid+"/fichas", id:c.id });
        remover.push({ tipo:"del", col:"/campanhas/"+cid+"/resumos", id:c.id });
      });
      return FB.escrever(guardar).then(function(){ return FB.escrever(remover); });
    }).then(function(){
      return FB.lerDoc("/campanhas", cid);
    }).then(function(atual){
      var membros = ((atual && atual.membros) || []).filter(function(x){ return x !== u.uid; });
      return FB.escrever([{ tipo:"update", col:"/campanhas", id:cid, data:{ membros: membros } }]);
    });
  }

  // ---------- FICHA-BASE FORA DE CAMPANHA (etapa H) ----------
  // "Criar ficha" (tela inicial) abre o assistente com a criação padrão do livro;
  // "Abrir" em Minhas fichas abre a ficha-base para ver e editar. Grava só em
  // fichas/{id} da própria conta (a regra de fichas-base já permite: donoUid = a conta).
  function abrirModoBase(opts){
    if(!FB || !usuario) return;
    opts = opts || {};
    var u = usuario;
    var base = (opts.id && lobby && lobby.bases) ? lobby.bases.filter(function(b){ return b.id === opts.id; })[0] : null;
    // A ficha que nasceu numa campanha continua com a configuração da criação de lá.
    var cmp = (base && base.origemCampanha) ? (campanhaDoLobby(base.origemCampanha) || { id: base.origemCampanha }) : null;
    pararLobby(); lobby = null;
    pararOuvintes();
    limparMesaLocal();
    campanhaAtual = null; FB.abrirCampanha(null);
    try{ sessionStorage.removeItem(CAMPANHA_ABERTA_KEY); }catch(e){}
    modoBase = { cmp: cmp, saindo: false }; cfgCache.chave = null;
    caps.isOwner = false; appPronto = false; state.campanhaDaTela = null;
    state.charId = null; state.sheetEditing = false; state.sheetDraft = null;
    document.getElementById("rollfeed").innerHTML = "";
    app.innerHTML = '<p class="empty">Abrindo…</p>';
    var primeira = true;
    ouvintes.push(FB.ouvir("/fichas", function(lista){
      if(usuario !== u || !modoBase) return;
      aplicarSnapshotPersonagens(lista);
      if(primeira){
        primeira = false; appPronto = true;
        if(opts.id){
          if(getChar(opts.id)) goto("sheet", { charId: opts.id });
          else { avisoLobby = "Essa ficha não foi encontrada."; sairModoBase(); }
        } else {
          goto("wizard", { wizStep: 0, draft: newCharacter() });
        }
        return;
      }
      agendarRender();
    }, function(e){
      console.warn("[Pangea] fichas-base", e);
      if(usuario === u && modoBase){ avisoLobby = "Não deu pra abrir as suas fichas agora."; mostrarLobby(); }
    }, ["donoUid", u.uid]));
  }
  function sairModoBase(){
    if(!modoBase || modoBase.saindo) return;
    modoBase.saindo = true;
    flushPendente();
    var p = temPendencias() ? (clearTimeout(publishTimer), doPublish()) : null;
    Promise.resolve(p).then(function(){
      if(!modoBase) return;
      if(state.syncFalhou){
        modoBase.saindo = false;
        alert("A última mudança ainda não foi salva no servidor. Espere a conexão voltar antes de sair da ficha.");
        if(state.charId && getChar(state.charId)) goto("sheet", { charId: state.charId });
        return;
      }
      state.view = "roster"; state.charId = null;
      mostrarLobby();
    });
  }

  // ---------- DENTRO DA CAMPANHA ----------
  function entrarNaCampanha(cmp){
    if(!FB || !usuario || !cmp) return;
    pararLobby(); lobby = null;
    pararOuvintes();
    limparMesaLocal();
    modoBase = null; cfgCache.chave = null;
    campanhaAtual = cmp;
    if(!ehMembro()){ campanhaAtual = null; avisoLobby = "Você não participa mais dessa campanha."; mostrarLobby(); return; }
    FB.abrirCampanha(cmp.id);
    try{ sessionStorage.setItem(CAMPANHA_ABERTA_KEY, cmp.id); }catch(e){}
    var conhecidas = loadLS(CONHECIDAS_KEY, []) || [];
    if(conhecidas.indexOf(cmp.id) < 0){ conhecidas.push(cmp.id); saveLS(CONHECIDAS_KEY, conhecidas.slice(-20)); }
    appPronto = false;
    if(state.campanhaDaTela !== cmp.id){ state.view = "roster"; state.charId = null; }
    state.campanhaDaTela = cmp.id;
    document.getElementById("rollfeed").innerHTML = "";
    app.innerHTML = '<p class="empty">Abrindo a campanha…</p>';
    ligarMesa(FB, usuario);
  }
  function voltarAoLobby(){
    if(modoBase){ sairModoBase(); return; }
    flushPendente();
    var p = temPendencias() ? (clearTimeout(publishTimer), doPublish()) : null;
    Promise.resolve(p).then(function(){
      if(state.syncFalhou){ alert("A última mudança ainda não foi salva no servidor. Espere a conexão voltar antes de trocar de campanha."); return; }
      state.view = "roster"; state.charId = null;
      mostrarLobby();
    });
  }

  // ---------- PAINEL DO MESTRE: jogadores, pedidos e convites ----------
  function nomeDoMembro(uidM){
    var info = (campanhaAtual && campanhaAtual.membrosInfo || {})[uidM] || {};
    var ficha = loadChars().filter(function(c){ return c.donoUid === uidM; })[0];
    return {
      nome: info.nome || (ficha && ficha.donoNome) || null,
      email: info.email || (ficha && ficha.donoEmail) || null
    };
  }
  function descricaoPedido(p){
    var partes = [];
    if(p.membro) partes.push('<b>Já está na mesa</b> e quer trazer mais uma ficha');
    if(p.retorno) partes.push('Volta com a ficha guardada desta campanha: <b>'+esc(p.fichaNome||"")+'</b> (do jeito que estava quando saiu)');
    else if(p.ficha){
      var f = p.ficha, camp = f.acampamento && CAMPS[f.acampamento];
      partes.push('Leva a ficha-base <b>'+esc(f.nomePersonagem||"Sem nome")+'</b>'+(f.nomeJogador?' ('+esc(f.nomeJogador)+')':'')+
        ' · '+(camp?camp.nome:'sem acampamento')+' · XP recebida: '+(xpDados(f).recebida||0)+' · Saúde '+(f.saudeNivel!=null?f.saudeNivel:6)+'/6');
    } else partes.push('Sem ficha por enquanto (vai criar o personagem na mesa)');
    if(p.complemento && p.complemento.acampamento && CAMPS[p.complemento.acampamento]) partes.push(esc(grupoRotulo())+' escolhido agora: <b>'+esc(CAMPS[p.complemento.acampamento].nome)+'</b>');
    if(p.complemento && p.complemento.extras && typeof p.complemento.extras === "object"){
      var defs = cfgCriacao().camposExtras || [];
      Object.keys(p.complemento.extras).forEach(function(k){
        var d = defs.filter(function(x){ return x.id === k; })[0];
        partes.push(esc(d ? (d.rotulo||"Campo") : k)+' (preenchido agora): <b>'+esc(String(p.complemento.extras[k]||""))+'</b>');
      });
    }
    return partes.join('<br>');
  }

    return /^#[0-9a-f]{6}$/i.test(cor) ? cor : "#8a7a5c";

  // Confere e arruma o rascunho antes de gravar.
  function limparConfig(d){
    var cfg = clonar(d), cr = cfg.criacao;
    cr.grupo.rotulo = String(cr.grupo.rotulo||"").trim() || "Grupo";
    cr.grupo.opcoes = (cr.grupo.opcoes||[]).map(function(o){ o.nome = String(o.nome||"").trim(); o.cor = String(o.cor||"").trim(); o.img = String(o.img||"").trim(); return o; });
    if(cr.acampamento && cr.grupo.opcoes.some(function(o){ return !o.nome; })) return { erro:"Dê um nome a todas as opções do campo \""+cr.grupo.rotulo+"\" (ou remova as vazias)." };
    if(cr.acampamento && !cr.grupo.opcoes.length) return { erro:"O campo \""+cr.grupo.rotulo+"\" está ligado mas não tem nenhuma opção. Adicione opções ou desligue o campo." };
    var corOk = /^(#[0-9a-f]{3,8}|var\(--[a-z0-9-]+\)|[a-z]+)$/i;
    var corRuim = cr.grupo.opcoes.filter(function(o){ return o.cor && !corOk.test(o.cor); })[0];
    if(corRuim) return { erro:"A cor de \""+corRuim.nome+"\" não é válida. Use o seletor de cor." };
    var imgRuim = cr.grupo.opcoes.filter(function(o){ return o.img && /^\s*javascript:/i.test(o.img); })[0];
    if(imgRuim) return { erro:"O endereço da imagem de \""+imgRuim.nome+"\" não é válido." };
    if(cr.propositos === "personalizado"){
      var pp = cr.propPers || {};
      ["1","2"].forEach(function(n){ pp["nome"+n] = String(pp["nome"+n]||"").trim(); pp["item"+n] = String(pp["item"+n]||"").trim(); });
      if(pp.qtd1 > 0 && (!pp.nome1 || !pp.item1)) return { erro:"Dê o nome da 1ª parte dos Propósitos e de cada item dela." };
      if(pp.qtd2 > 0 && (!pp.nome2 || !pp.item2)) return { erro:"Dê o nome da 2ª parte dos Propósitos e de cada item dela (ou deixe 0)." };
    }
    cr.camposExtras = (cr.camposExtras||[]).map(function(f){ f.rotulo = String(f.rotulo||"").trim(); return f; });
    if(cr.camposExtras.some(function(f){ return !f.rotulo; })) return { erro:"Dê um nome a todos os campos extras (ou remova os vazios)." };
    var semOps = cr.camposExtras.filter(function(f){ return f.tipo === "escolha" && !(f.opcoes||[]).length; })[0];
    if(semOps) return { erro:"O campo \""+semOps.rotulo+"\" é de escolha mas não tem opções." };
    cfg.locais = (cfg.locais||[]).map(function(l){ return { nome:String(l.nome||"").trim(), tendencia:l.tendencia||"geral" }; });
    if(cfg.locais.some(function(l){ return !l.nome; })) return { erro:"Dê um nome a todos os locais (ou remova os vazios)." };
    var vistos = {}, dup = cfg.locais.filter(function(l){ var k = l.nome.toLowerCase(); if(vistos[k]) return true; vistos[k] = 1; return false; })[0];
    if(dup) return { erro:"O local \""+dup.nome+"\" aparece duas vezes." };
    return { cfg: cfg };
  }

  function aprovarPedido(p){
    var cid = campanhaAtual.id;
    var dono = { uid:p.uid, email:p.email, nome:p.nome };
    var leitura = p.retorno ? FB.lerDoc("/fichas/"+p.fichaBaseId+"/guardadas", p.guardadaId) : Promise.resolve(null);
    return leitura.then(function(g){
      var ops = [], copia = null;
      if(p.retorno){
        if(!g) throw new Error("a ficha guardada não foi encontrada na conta do jogador");
        copia = clonar(g);
        delete copia.guardadaEm; delete copia.campanhaNome;
        copia.campanhaId = cid; copia.ehNpc = false;
        copia.donoUid = dono.uid; copia.donoEmail = dono.email || null; copia.donoNome = dono.nome || null;
        copia.atualizadoEm = agoraIso();
        ops.push({ tipo:"del", col:"/fichas/"+p.fichaBaseId+"/guardadas", id:p.guardadaId });
      } else if(p.ficha){
        copia = copiaDaBase(p.ficha, cid, dono, p.complemento);
        copia.baseId = p.fichaBaseId || p.ficha.id;
      }
      if(copia){
        copia = paraFirestore(copia);
        ops.push({ tipo:"set", col:"personagens", id:copia.id, data:copia });
        ops.push({ tipo:"set", col:"resumos", id:copia.id, data:montarResumo(copia) });
      }
      var membros = (campanhaAtual.membros||[]).slice();
      // Etapa H2: quem já está na mesa só traz a ficha; não mexe em membros nem na data de entrada.
      if(membros.indexOf(p.uid) < 0){
        membros.push(p.uid);
        var dados = { membros: membros };
        dados["membrosInfo." + p.uid] = { nome: p.nome || null, email: p.email || null, entrouEm: agoraIso() };
        ops.push({ tipo:"update", col:"/campanhas", id:cid, data:dados });
      }
      ops.push({ tipo:"del", col:"pedidos", id:p.uid });
      return FB.escrever(ops);
    });
  }
  // Etapa G: o mestre passa uma ficha da mesa (NPC ou ficha de jogador sem conta) para
  // um jogador que já entrou na campanha. Ela deixa de ser NPC, fica na conta dele e
  // ganha uma ficha-base nova (id novo, com "copiaId" apontando para a ficha da mesa:
  // é o que a regra do Firestore confere). Nada é apagado.
  function passarParaJogador(id, m){
    var c = getChar(id);
    if(!c || !campanhaAtual) return Promise.reject(new Error("ficha não encontrada"));
    if((campanhaAtual.membros||[]).indexOf(m) < 0 || m === campanhaAtual.donoUid) return Promise.reject(new Error("essa conta não é jogador desta campanha"));
    var cid = campanhaAtual.id, q = nomeDoMembro(m), agora = agoraIso(), baseId = uid();
    var mud = { ehNpc:false, donoUid:m, donoEmail:q.email||null, donoNome:q.nome||null, baseId:baseId, passadaPeloMestreEm:agora, atualizadoEm:agora };
    var copia = clonar(c); Object.keys(mud).forEach(function(k){ copia[k] = mud[k]; });
    var base = baseDaCopia(copia, cid); base.id = baseId; base.copiaId = c.id;
    copia = paraFirestore(copia);
    return FB.escrever([
      { tipo:"set", col:"personagens", id:c.id, data:copia },
      { tipo:"set", col:"resumos", id:c.id, data:montarResumo(copia) },
      { tipo:"set", col:"/fichas", id:baseId, data:paraFirestore(base) }
    ]).then(function(){
      // O espelho local acompanha, pra uma gravação pendente não desfazer a passagem.
      var atual = getChar(id); if(atual) Object.keys(mud).forEach(function(k){ atual[k] = mud[k]; });
    });
  }
  // Fichas de jogador que estão sem conta (nem NPC): o mestre decide o que fazer.
  function fichasSemConta(){ return loadChars().filter(function(c){ return !c.ehNpc && !c.donoUid; }); }
  function jogadoresDaCampanha(){ return campanhaAtual ? (campanhaAtual.membros||[]).filter(function(x){ return x !== campanhaAtual.donoUid; }) : []; }
  function passarParaHtml(c){
    var jog = jogadoresDaCampanha();
    if(!jog.length) return '<span class="hint" style="margin:0;font-size:12px">sem jogadores pra receber</span>';
    return '<select data-gmpassar="'+esc(c.id)+'" title="Passar esta ficha para um jogador da campanha" style="width:auto;max-width:100%;font-size:12px;padding:4px 6px">' +
      '<option value="">Passar para um jogador…</option>' +
      jog.map(function(m){ var q = nomeDoMembro(m); return '<option value="'+esc(m)+'">'+esc(q.nome||q.email||"Conta sem nome")+'</option>'; }).join('') +

  function removerJogador(m){
    var cid = campanhaAtual.id;
    var copias = loadChars().filter(function(c){ return c.donoUid === m && !c.ehNpc; });
    var guardar = [], remover = [];
    copias.forEach(function(c){
      var bid = c.baseId;
      if(!bid){ bid = c.id; guardar.push({ tipo:"set", col:"/fichas", id:bid, data:paraFirestore(baseDaCopia(c, cid)) }); }
      var g = clonar(c); g.campanhaId = cid; g.campanhaNome = campanhaAtual.nome || ""; g.guardadaEm = agoraIso(); g.baseId = bid;
      guardar.push({ tipo:"set", col:"/fichas/"+bid+"/guardadas", id:c.id, data:paraFirestore(g) });
      remover.push({ tipo:"del", col:"personagens", id:c.id });
      remover.push({ tipo:"del", col:"resumos", id:c.id });
    });
    var membros = (campanhaAtual.membros||[]).filter(function(x){ return x !== m; });
    var dados = { membros: membros };
    dados["membrosInfo." + m] = null;
    remover.push({ tipo:"update", col:"/campanhas", id:cid, data:dados });
    return FB.escrever(guardar).then(function(){ return FB.escrever(remover); });
  }

  // Tela de erro quando não dá pra falar com o banco (ex.: sem internet, ou o login

  function stashViewForReload(){

      }
      if(state.view === "wizard"){ payload.draft = state.draft; payload.wizStep = state.wizStep; }

  function clamp(n,min,max){ n = isNaN(n) ? min : n; return Math.max(min, Math.min(max, n)); }
  function sum(arr){ return arr.reduce(function(a,b){return a+b;},0); }
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }


  // ---------- CHARACTER FACTORY ----------
  function newCharacter(){
    var c = {
      id: uid(), criadoEm: new Date().toISOString(), atualizadoEm: new Date().toISOString(),
      // Sistema oficial do livro definitivo (ver converterParaSistemaOficial).
      sistema:"oficial", precisaRefazer:false,
      nomeJogador:"", nomePersonagem:"", acampamento:null,
      origem:{ geracao:"", evento:"", ocupacao:"" },
      propIndividuais:["",""], propRelacionais:["",""], extras:{},
      // Livro pág. 80: todo Instinto começa em 1, e há mais 3 pontos livres (máx. 3 por Instinto).
      instintos:{ reacao:1,percepcao:1,sagacidade:1,potencia:1,influencia:1,resolucao:1 },
      // Bônus de Assimilação: Instintos/Conhecimentos/Práticas que uma Assimilação aumenta
      // além do normal. Fica separado da base e fora do orçamento da criação.
      instintosAssimBonus:{ reacao:0,percepcao:0,sagacidade:0,potencia:0,influencia:0,resolucao:0 },
      conhPrat:{}, caracComp:[], caracAumentos:{}, caracEscolhas:{}, conhPratAssimBonus:{},
      // Saúde: 6 Níveis (6 = Saudável), cada um com 1 + Potência + Resolução pontos.
      saudeNivel:6, saudePontosAtuais:null,
      // Cabo de Guerra (pág. 81): começa com Determinação 9 e Assimilação 1.
      determinacao:{ caixaAtual:2, pontosAtual:9, suscetivel:false },
      // Artefato inicial (pág. 90/96): opcional, Escassez = soma das categorias (teto 3).
      equip:{ nome:"", desc:"", traits:[], qualidade:3, pressao:0, usosMax:null, usosAtual:null, espaco:1 },
      inventarioExtra:[],
      kitInicial:null,
      notas:"",
      // Começar com Nível de Assimilação exige um Teste de Assimilação (pág. 81).
      testesAssimPendentes:1,
      assimTesteAtual:null,
      mutAdquiridas:[],
      assimPerdido:false,
      ehNpc:false
    };
    CONH_PRAT.forEach(function(p){ c.conhPrat[p[0]] = 0; c.conhPratAssimBonus[p[0]] = 0; });

  // Valor "de verdade" de um Instinto pra tudo que é jogo (testes, Saúde, Painel do
  // Assimilador): a base da criação (0-3) mais o bônus de Assimilação (ver newCharacter),
  // que não tem teto. Sem bônus salvo (fichas antigas, migradas em migrateChar), cai pra 0.
  // Instinto base = o da criação, ou o nível comprado depois com Experiência (instintosEvol).
  function instintoBase(c, key){
    return Math.max((c.instintos && c.instintos[key])||0, (c.instintosEvol && c.instintosEvol[key])||0);
  }
  function valorInstinto(c, key){
    return instintoBase(c, key) + ((c.instintosAssimBonus && c.instintosAssimBonus[key])||0);
  }
  function bestSaudeAttr(c){
    return valorInstinto(c,"resolucao") > valorInstinto(c,"potencia") ? "resolucao" : "potencia";
  }
  function saudePontosMax(c){ return 1 + valorInstinto(c,"potencia") + valorInstinto(c,"resolucao"); }

  // Funções genéricas de item: usadas tanto pro equipamento icônico quanto pros itens extras do inventário.
  // Escassez de um Artefato = soma das categorias das características (pág. 97).
  // O Uso Único que vem junto com Explosivo não desconta.
  function itemCusto(traits){
    var t = 0;
    var temExplosivo = (traits||[]).some(function(s){ return s.id==="explosivo"; });
    (traits||[]).forEach(function(sel){
      var def = EQUIP_TRAITS.filter(function(e){return e.id===sel.id;})[0];
      if(!def) return;
      if(def.id==="uso_unico" && temExplosivo) return;
      t += def.custo * (sel.qtd||1);
    });
    return t;
  }
  // Usos próprios do item (Restaurador/Adrenalina/Medicinal: 6; Uso Único/Explosivo: 1).
  // Itens sem nada disso não têm contador de usos - o desgaste é pela Qualidade.
  function itemUsosMax(traits){
    var usos = null, unico = false;
    (traits||[]).forEach(function(sel){
      var def = EQUIP_TRAITS.filter(function(e){return e.id===sel.id;})[0];
      if(!def) return;
      if(def.id==="uso_unico" || def.id==="explosivo") unico = true;
      else if(def.usos) usos = Math.max(usos||0, def.usos);
    });
    if(unico) return 1;
    return usos;
  }
  // O espaço que cada item ocupa (mochila/corpo) é sempre 1; "Espaçoso" nunca entra
  // aqui - ver espacosoBonus/capacidadeInventarioMax logo abaixo, que usam essa
  // característica pra aumentar o TETO total de inventário, não o espaço de um item.
  // Espaço que o item ocupa: 1 por padrão, 0 se Discreto, 2 se Pesado (pág. 97).
  function itemEspaco(traits){
    var ids = (traits||[]).map(function(s){ return s.id; });
    if(ids.indexOf("discreto")>-1) return 0;
    if(ids.indexOf("pesado")>-1) return 2;
    return 1;
  }
  // Quanto uma lista de características de item aumenta o TETO de inventário do
  // personagade (não o espaço que o próprio item ocupa - ver itemEspaco acima).
  function espacosoBonus(traits){
    var bonus = 0;
    (traits||[]).forEach(function(sel){
      if(sel.id === "espacoso"){ bonus += 2*(sel.qtd||1); }
    });
    return bonus;
  }
  // Teto total de espaço de inventário do personagem: os 8 clássicos (2 no corpo + 6 na
  // mochila) mais qualquer bônus de "Espaçoso"/"Muito Espaçoso", vindo tanto do equipamento
  // icônico quanto de qualquer item do Inventário adicional que tenha essa característica.
  // Teto de inventário (pág. 94): 3 espaços no corpo + 6 na mochila, mais +2 por Espaçoso.
  function capacidadeInventarioMax(c){
    var base = 9;
    var bonus = espacosoBonus(c.equip.traits);
    (c.inventarioExtra||[]).forEach(function(it){ bonus += espacosoBonus(it.traits); });
    return base + bonus;
  }
  function equipCusto(c){ return itemCusto(c.equip.traits); }
  function equipUsosMax(c){ return itemUsosMax(c.equip.traits); }
  function equipEspaco(c){ return itemEspaco(c.equip.traits); }

  // Aplica (ou remove, com key=null) um kit de itens iniciais no Inventário adicional, sem mexer nos itens que o jogador já adicionou à mão.
  // Pacotes de equipamento inicial (pág. 90): todos os itens começam em Qualidade Padrão (3).
  function aplicarKitInicial(c, key){
    if(!c.inventarioExtra) c.inventarioExtra = [];
    c.inventarioExtra = c.inventarioExtra.filter(function(it){ return !it.kitKey; });
    c.kitInicial = key || null;
    if(key){
      var kit = KITS_INICIAIS.filter(function(k){return k.id===key;})[0];
      if(kit){
        kit.itens.forEach(function(it){
          c.inventarioExtra.push(novoItem(it[0], "", [], { qtd:it[1], kitKey:key }));
        });
      }
    }
  }
  function novoItem(nome, desc, traits, extra){
    var usos = itemUsosMax(traits);
    var it = { nome:nome, desc:desc||"", traits:traits||[], qualidade:3, pressao:0, usosMax:usos, usosAtual:usos, espaco:itemEspaco(traits) };
    if(extra) Object.keys(extra).forEach(function(k){ it[k] = extra[k]; });
    return it;
  }
  // Quantas Pressões o Assimilador precisa investir pra o item cair um nível de
  // Qualidade (pág. 95): igual ao nível atual; Frágil -1, Durável +1.
  function qualidadeLimiar(item){
    var ids = (item.traits||[]).map(function(s){ return s.id; });
    var n = item.qualidade!=null ? item.qualidade : 3;
    if(ids.indexOf("fragil")>-1) n -= 1;
    if(ids.indexOf("duravel")>-1) n += 1;
    return Math.max(1, n);
  }
  function investirPressaoItem(item, delta){
    if(!autoLigada("qualidadeCaiComPressao")) return;
    if(item.qualidade==null) item.qualidade = 3;
    if(!item.pressao) item.pressao = 0;
    if(item.qualidade <= 0 && delta > 0) return;
    item.pressao = Math.max(0, item.pressao + delta);
    // Frágil já Defeituoso: quebra no próximo uso.
    var ids = (item.traits||[]).map(function(s){ return s.id; });
    if(ids.indexOf("fragil")>-1 && item.qualidade===1 && item.pressao>0){ item.qualidade = 0; item.pressao = 0; return; }
    while(item.qualidade > 0 && item.pressao >= qualidadeLimiar(item)){
      item.pressao -= qualidadeLimiar(item);
      item.qualidade -= 1;
    }
    if(item.qualidade <= 0) item.pressao = 0;
  }
  function qualidadeHtml(item, attrPrefix, idx){
    var q = item.qualidade!=null ? item.qualidade : 3;
    var dataIdx = idx!=null ? ' data-idx="'+idx+'"' : '';
    return '<div class="row" style="gap:6px;align-items:center;flex-wrap:wrap">' +
      '<span class="hint" style="margin:0">Qualidade:</span>' +
      '<button type="button" class="btn secondary" data-'+attrPrefix+'q="menos"'+dataIdx+' style="padding:1px 7px;font-size:11px" '+(q<=0?"disabled":"")+'>&minus;</button>' +
      '<b style="min-width:120px;text-align:center">'+q+' · '+QUALIDADES[q]+'</b>' +
      '<button type="button" class="btn secondary" data-'+attrPrefix+'q="mais"'+dataIdx+' style="padding:1px 7px;font-size:11px" '+(q>=6?"disabled":"")+'>+</button>' +
      (q>0 && autoLigada("qualidadeCaiComPressao") ? '<span class="hint" style="margin:0">'+icoPressaoTxt(item)+'</span>' +
        '<button type="button" class="btn secondary" data-'+attrPrefix+'p="mais"'+dataIdx+' style="padding:1px 7px;font-size:11px" title="O Assimilador investiu uma Pressão neste item">+1 '+dadoHtml("p")+'</button>' : '') +
    '</div>' + (QUALIDADE_BONUS[q] ? '<p class="hint" style="margin:2px 0 0">'+QUALIDADE_BONUS[q]+'</p>' : '');
  }
  function icoPressaoTxt(item){
    return (item.pressao||0)+' de '+qualidadeLimiar(item)+' '+dadoHtml("p")+' pra cair um nível';
  }

  // Custo de subir um Conhecimento/Prática de "atual" até "final": cada degrau custa
  // o próprio valor final daquele degrau, e o custo é cumulativo (soma de todos os
  // degraus no caminho). Ex.: de 0 até 3 custa 1+2+3=6, não só 3.
  function triangular(n){ return n*(n+1)/2; }
  // Livro pág. 83: subir um Conhecimento/Prática custa o DOBRO do nível desejado, por
  // degrau (ex.: de 2 pra 3 custa 6 XP; de 0 pra 2 custa 2+4 = 6 XP).
  function custoAumento(atual, final){
    var t = 0;
    for(var v=atual+1; v<=final; v++) t += 2*v;
    return t;
  }
  function temCarac(c, id){ return (c.caracComp||[]).indexOf(id) > -1; }
  // Valor de um atributo pra checar Requisitos de Característica: Instinto, Conhecimento/
  // Prática (já com o que foi comprado com XP) ou o Nível de Assimilação.
  function valorRequisito(c, attr){
    if(attr === "assimilacao") return nivelAssimAtual(c);
    if(INSTINTOS.some(function(i){ return i[0]===attr; })) return valorInstinto(c, attr);
    return valorCP(c, attr);
  }
  function nomeAtributo(attr){
    if(attr === "assimilacao") return "Assimilação";
    var a = INSTINTOS.concat(CONH_PRAT).filter(function(x){ return x[0]===attr; })[0];
    return a ? a[1] : attr;
  }
  function reqAtendido(c, def){
    return (def.req||[]).every(function(alts){
      return alts.some(function(a){ return valorRequisito(c, a[0]) >= a[1]; });
    });
  }
  function reqGrupoTexto(alts, varios){
    var t = alts.map(function(a){ return nomeAtributo(a[0])+" "+a[1]+"+"; }).join(" ou ");
    return (varios && alts.length > 1) ? "("+t+")" : t;
  }
  function reqTexto(def){
    if(!def.req || !def.req.length) return "Sem requisito";
    var varios = def.req.length > 1;
    return "Requisito: " + def.req.map(function(alts){ return reqGrupoTexto(alts, varios); }).join(" e ");
  }
  // O que ainda falta pra cumprir o requisito, com o valor atual do personagem.
  function reqFaltando(c, def){
    return (def.req||[]).filter(function(alts){
      return !alts.some(function(a){ return valorRequisito(c, a[0]) >= a[1]; });
    }).map(function(alts){
      return alts.map(function(a){ return nomeAtributo(a[0])+" "+a[1]+"+ (tem "+valorRequisito(c, a[0])+")"; }).join(" ou ");
    }).join(" e ");
  }
  // ----- EXPERIÊNCIA GANHA EM JOGO (livro pág. 247-248) -----
  // c.xp é escrito SÓ pelo Assimilador (as regras do Firestore recusam qualquer
  // mudança nele vinda da conta do jogador): { recebida, historico:[{ts,qtd,motivo}],
  // liberarInstinto }. Nunca criamos c.xp com valor padrão pelo lado do jogador -
  // sempre lemos por xpDados(c).
  var XP_MOTIVOS = [
    ["sessao","Sessão jogada",1],["proposito","Propósito alcançado",2],["conflito","Conflito resolvido",1],
    ["refugio","Avanço no Refúgio",1],["arco","Conclusão de arco",2],["descoberta","Grande descoberta",1],
    ["interpretacao","Interpretação inspirada",1],["ajuste","Ajuste do Assimilador",1],["outro","Outro motivo",1]
  ];
  function xpDados(c){
    var x = c.xp || {};
    return { recebida: x.recebida||0, historico: x.historico||[], liberarInstinto: !!x.liberarInstinto };
  }
  function xpTotal(c){ return xpInicialDe(c) + xpDados(c).recebida; }
  // Instintos: o TRIPLO do nível que vai atingir, por degrau (2->3 custa 9).
  function custoAumentoInstinto(atual, final){
    var t = 0;
    for(var v=atual+1; v<=final; v++) t += 3*v;
    return t;
  }
  function instintosEvolGasto(c){
    var t = 0;
    Object.keys(c.instintosEvol||{}).forEach(function(k){
      t += custoAumentoInstinto((c.instintos && c.instintos[k])||0, c.instintosEvol[k]);
    });
    return t;
  }
  function xpGasto(c){ return caracPontosGastos(c) + instintosEvolGasto(c); }
  function xpSaldo(c){ return xpTotal(c) - xpGasto(c); }
  // Quanto sobra pra Características/Aptidões (o que já foi pra Instintos sai do total).
  function xpParaCaracteristicas(c){ return xpTotal(c) - instintosEvolGasto(c); }
  function darExperiencia(c, qtd, motivo){
    // qtd negativo retira Experiência (ajuste do Assimilador). A recebida nunca
    // fica abaixo de 0; o histórico guarda o quanto realmente mudou.
    var x = xpDados(c);
    var novo = Math.max(0, x.recebida + qtd), real = novo - x.recebida;
    if(!real) return 0;
    x.recebida = novo;
    x.historico = x.historico.concat([{ ts:new Date().toISOString(), qtd:real, motivo:motivo }]);
    c.xp = x;
    return real;
  }
  function carDef(id){ return CARACTERISTICAS.filter(function(x){return x.id===id;})[0]; }

  // Pontos de Experiência gastos (pág. 83): Características + aumentos de Conhecimento/Prática.
  function caracPontosGastos(c){
    var t = 0;
    Object.keys(c.caracAumentos||{}).forEach(function(k){
      var atual = (c.conhPrat && c.conhPrat[k]) || 0;
      t += custoAumento(atual, c.caracAumentos[k]);
    });
    (c.caracComp||[]).forEach(function(id){
      var def = CARACTERISTICAS.filter(function(x){return x.id===id;})[0];
      if(def) t += def.custo;
    });
    return t;
  }
  function conhPratPontosGastos(c){ return sum(Object.keys(c.conhPrat).map(function(k){return c.conhPrat[k];})); }
  // Valor "de criação" de um Conhecimento/Prática, sem o Bônus de Assimilação: se
  // caracAumentos guarda um valor final comprado por característica (até 3), esse
  // valor vale; senão, é a base (0-2) escolhida no Passo 4.
  function valorCPBase(c, key){
    var aum = (c.caracAumentos||{})[key];
    return aum ? aum : ((c.conhPrat && c.conhPrat[key]) || 0);
  }
  function valorCP(c, key){
    // Bônus de Assimilação (ver newCharacter/valorInstinto): soma por cima da base
    // (criação + característica), sem teto - pedido do Marco, 21/09/2026.
    return valorCPBase(c,key) + ((c.conhPratAssimBonus && c.conhPratAssimBonus[key])||0);
  }

  // Card com título + botão de minimizar/expandir (lembra o estado entre renders e recarregamentos).
  // ---------- FAIXA DE NAVEGAÇÃO DA FICHA ----------
  // Miniaturas das seções no alto da ficha, grudadas no topo da tela ao rolar.
  // Clique (ou toque) rola até a seção e abre se estiver minimizada. No
  // computador, a casa sob o mouse cresce com efeito 3D e as vizinhas crescem
  // um pouco menos (desligado em "Animações reduzidas").
  var FNAV_COLS = 5;
  // Hifenização opcional (&shy;) pros nomes longos caberem em 5 colunas no celular.
  var FNAV_ROT_HTML = { caracteristicas:"Caracte&shy;rísticas", assimilacao:"Assimi&shy;lações", documentos:"Docu&shy;mentos", inventario:"Inven&shy;tário", instintos:"Instin&shy;tos" };
  // Ícones das abas: só o traço (icones/aba_*_traco.png, sem fundo), usado como
  // máscara; a cor vem de --fnav-tinta: preto nos temas claros, branco nos escuros
  // (ver fnavAtualizarTinta). As versões com disco branco (aba_*.png) ficam guardadas.
  function fnavIco(nome){ var u = 'url(icones/aba_'+nome+'_traco.png)'; return '<span class="fnav-img" style="-webkit-mask-image:'+u+';mask-image:'+u+'" aria-hidden="true"></span>'; }
  function fnavAtualizarTinta(){
    try{
      var raiz = document.documentElement;

      var r, g, b, m;
      if((m = v.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i))){
        var h = m[1].length === 3 ? m[1].replace(/./g, "$&$&") : m[1];
        r = parseInt(h.slice(0,2),16); g = parseInt(h.slice(2,4),16); b = parseInt(h.slice(4,6),16);
      } else if((m = v.match(/rgba?\(\s*(\d+)[ ,]+(\d+)[ ,]+(\d+)/))){ r = +m[1]; g = +m[2]; b = +m[3]; }

  var fnavObs = null, fnavScroll = null;

    try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches || animacoesReduzidas(); }catch(_){ return false; }
  }
  function fnavIrPara(id){
    var alvo = app.querySelector('[data-secid="'+id+'"]');

    alvo.scrollIntoView({ behavior: fnavMovimentoReduzido() ? "auto" : "smooth", block:"start" });
    if(!fnavMovimentoReduzido()){

  function bindFichaNav(){
    if(fnavObs){ try{ fnavObs.disconnect(); }catch(_){} fnavObs = null; }
    if(fnavScroll){ window.removeEventListener("scroll", fnavScroll); fnavScroll = null; }
    var nav = app.querySelector(".fnav");
    if(!nav) return;
    fnavAtualizarTinta();
    var casas = Array.prototype.slice.call(nav.querySelectorAll(".fnav-casa"));
    nav.style.setProperty("--fnav-n", casas.length);
    nav.style.setProperty("--fnav-meia", Math.ceil(casas.length / 2));
    function colunas(){ try{ return getComputedStyle(nav).gridTemplateColumns.split(" ").length || FNAV_COLS; }catch(_){ return FNAV_COLS; } }
    function medir(){ document.documentElement.style.setProperty("--fnav-h", (nav.offsetHeight + 12) + "px"); }
    medir();
    // Grudada: um marcador invisível logo acima da faixa sai da tela quando ela gruda.
    var sent = app.querySelector(".fnav-sentinela");
    if(sent && "IntersectionObserver" in window){
      fnavObs = new IntersectionObserver(function(ents){
        var grudou = !ents[0].isIntersecting && ents[0].boundingClientRect.top < 0;
        if(nav.classList.contains("grudada") !== grudou){

          // altura da página não mudar (senão, perto do fim da página, o navegador puxa a
          // rolagem pra cima, a faixa desgruda e fica piscando).
          var hAntes = nav.offsetHeight;

          medir();

    }

    function limpar(){ casas.forEach(function(b){ b.classList.remove("foco","viz"); }); }
    casas.forEach(function(b, i){
      b.addEventListener("mouseenter", function(){
        limpar();
        if(fnavMovimentoReduzido()) return;
        b.classList.add("foco");
        var nc = colunas(), lin = Math.floor(i / nc), col = i % nc;
        casas.forEach(function(o, j){
          if(j===i) return;

    var ticking = false;
    function atualizarAtual(){
      ticking = false;
      if(!nav.isConnected) return;
      var lim = nav.getBoundingClientRect().bottom + 40, atual = null, topoAtual = -Infinity;
      casas.forEach(function(b){
        var el = app.querySelector('[data-secid="'+b.getAttribute("data-fnav")+'"]');

  // ---------- CAIXA AO LADO (componente único) ----------
  // Uma linha clicável (data-caixa="tipo|arg") abre uma caixa com o conteúdo completo.
  // Só existe uma caixa aberta por vez (state.caixa). A caixa é desenhada junto com a
  // tela (caixaHtml no fim do app.innerHTML), então os botões dentro dela recebem as
  // mesmas ligações da tela; depois de cada desenho, posicionarCaixa a coloca no lugar.
  // Posição: do lado escolhido do cartão (só se ali for margem livre, fora da coluna
  // de conteúdo); senão do outro lado; senão logo abaixo (ou acima) da linha; no
  // celular, centralizada. Tudo é medido na tela, então funciona com o zoom do
  // "Tamanho do texto" (Grande/Maior) e nunca sai da tela.
  var CAIXAS = {};
  var caixaRaf = 0;
  function caixaAttr(tipo, arg){ return 'data-caixa="'+esc(tipo+"|"+(arg==null?"":arg))+'"'; }
  function caixaAberta(tipo, arg){ return !!state.caixa && state.caixa === tipo+"|"+(arg==null?"":arg); }
  // Linha padrão: título, prévia (texto cortado com "…"), selos opcionais e a seta.
  function caixaLinha(tipo, arg, titulo, previa, extras, classe){
    return '<button type="button" class="lx'+(classe?' '+classe:'')+(caixaAberta(tipo,arg)?' aberto':'')+'" '+caixaAttr(tipo,arg)+' aria-haspopup="dialog" aria-expanded="'+caixaAberta(tipo,arg)+'">' +
      '<span class="lx-tit">'+titulo+'</span>' +
      '<span class="lx-prev">'+(previa||'')+'</span>' +
      (extras ? '<span class="lx-extra">'+extras+'</span>' : '') +
      '<span class="lx-seta" aria-hidden="true">›</span></button>';
  }
  function caixaDados(){
    if(!state.caixa) return null;
    var i = state.caixa.indexOf("|"), tipo = state.caixa.slice(0, i), arg = state.caixa.slice(i+1);
    var fn = CAIXAS[tipo]; if(!fn) return null;
    var d = null;
    try{ d = fn(arg); }catch(e){ console.warn("[Pangea] caixa", e); d = null; }
    return d;
  }
  function caixaHtml(){
    var d = caixaDados();
    if(!d){ state.caixa = null; return ''; }
    if(!d.cor && state.view === "sheet"){ var cf = fichaAtual(); if(cf && cf.acampamento && CAMPS[cf.acampamento]) d.cor = CAMPS[cf.acampamento].cor; }
    if(caixaRaf) cancelAnimationFrame(caixaRaf);
    caixaRaf = requestAnimationFrame(function(){ caixaRaf = 0; posicionarCaixa(); });
    return '<div class="caixa-fundo" id="caixa-fundo" hidden></div>' +
      '<div id="caixa" class="caixa'+(d.classe?' '+d.classe:'')+'" role="dialog" aria-label="'+esc(d.tituloTexto||String(d.titulo).replace(/<[^>]+>/g,""))+'" style="visibility:hidden'+(d.cor?';--camp-color:'+d.cor:'')+'">' +
      '<div class="caixa-cab"><b>'+d.titulo+'</b><button type="button" class="caixa-x" aria-label="Fechar">×</button></div>' +
      '<div class="caixa-corpo">'+d.corpo+'</div></div>';
  }
  function fecharCaixa(){
    state.caixa = null; state.caixaAnim = null;
    ["caixa","caixa-fundo"].forEach(function(id){ var el = document.getElementById(id); if(el) el.remove(); });
    if(typeof app !== "undefined" && app) app.querySelectorAll("[data-caixa].aberto").forEach(function(b){ b.classList.remove("aberto"); b.setAttribute("aria-expanded","false"); });
  }
  function abrirCaixa(chave){
    state.caixa = chave;
    render();

    if(state.caixa && !document.getElementById("caixa")) app.insertAdjacentHTML("beforeend", caixaHtml());
  }
  // Escala da tela (zoom do Tamanho do texto): px "de CSS" dentro da caixa x px na tela.
  function caixaEscala(el){
    el.style.width = "400px";
    var w = el.getBoundingClientRect().width;
    return w > 0 ? w / 400 : 1;
  }
  function posicionarCaixa(){
    var el = document.getElementById("caixa"), fundo = document.getElementById("caixa-fundo");
    if(!el || !state.caixa) return;
    var ancora = null;
    app.querySelectorAll("[data-caixa]").forEach(function(b){ if(b.getAttribute("data-caixa") === state.caixa) ancora = b; });
    if(!ancora || !ancora.getClientRects().length){ fecharCaixa(); return; }
    var d = caixaDados() || {};
    app.querySelectorAll("[data-caixa]").forEach(function(b){ var on = b === ancora; b.classList.toggle("aberto", on); b.setAttribute("aria-expanded", String(on)); });
    var M = 12, GAP = 12;
    var vw = document.documentElement.clientWidth, vh = window.innerHeight;
    var primeira = state.caixaAnim !== state.caixa;
    // Não deixa a caixa embaixo da faixa de navegação grudada no topo.
    var topo = M, faixa = app.querySelector(".fnav");
    if(faixa){ var rf = faixa.getBoundingClientRect(); if(rf.top <= 2 && rf.bottom > 0) topo = Math.max(M, rf.bottom + 6); }
    el.classList.remove("centro","lado-direita","lado-esquerda","abaixo","acima");
    el.style.left = "0px"; el.style.top = "0px"; el.style.maxHeight = "";
    var s = caixaEscala(el);
    var prefCss = d.largura || 420;
    if(vw <= 640){
      // Celular: centralizada, com o fundo escurecido.
      el.classList.add("centro");
      if(fundo) fundo.hidden = false;
      el.style.width = ((vw - 2*M) / s) + "px";
      el.style.maxHeight = ((vh * 0.8) / s) + "px";
      var r0c = el.getBoundingClientRect();
      var hc = r0c.height;
      el.style.left = ((M - r0c.left) / s) + "px";
      el.style.top = (((vh - hc) / 2 - r0c.top) / s) + "px";
    } else {
      if(fundo) fundo.hidden = true;
      var ref = (d.ref && ancora.closest(d.ref)) || ancora.closest(".card") || ancora;
      var rc = ref.getBoundingClientRect(), ra = ancora.getBoundingClientRect(), rw = app.getBoundingClientRect();
      var minV = 260 * s;
      // Margem livre de cada lado: só conta se o cartão encosta na borda da coluna
      // (assim a caixa nunca cobre o cartão vizinho).
      var livreDir = rc.right >= rw.right - 40 ? vw - M - (rc.right + GAP) : 0;
      var livreEsq = rc.left <= rw.left + 40 ? rc.left - GAP - M : 0;
      var ordem = d.lado === "esquerda" ? ["esquerda","direita"] : ["direita","esquerda"];
      var lado = null;
      ordem.some(function(l){ if((l === "direita" ? livreDir : livreEsq) >= minV){ lado = l; return true; } return false; });
      var maxH = Math.min(vh * 0.8, vh - M - topo);
      el.style.maxHeight = (maxH / s) + "px";
      var X, Y, larg;
      if(lado){
        larg = Math.min(prefCss * s, lado === "direita" ? livreDir : livreEsq);
        el.style.width = (larg / s) + "px";
        var h = el.getBoundingClientRect().height;
        X = lado === "direita" ? rc.right + GAP : rc.left - GAP - larg;
        Y = Math.max(topo, Math.min(ra.top - 8, vh - M - h));
        el.classList.add("lado-"+lado);
      } else {
        larg = Math.min(Math.max(prefCss, 460) * s, rc.width - 16, vw - 2*M);
        el.style.width = (larg / s) + "px";
        var h2 = el.getBoundingClientRect().height;
        X = Math.max(M, Math.min(ra.left, vw - M - larg));
        if(ra.bottom + 6 + h2 > vh - M && ra.top - 6 - h2 < topo && primeira){
          // Não cabe embaixo nem em cima: rola a página (só ao abrir) pra caber embaixo.
          var falta = (ra.bottom + 6 + h2) - (vh - M), folga = ra.top - topo;
          var rolar = Math.max(0, Math.min(falta, folga));
          if(rolar > 0){ window.scrollBy(0, rolar); ra = ancora.getBoundingClientRect(); }
        }
        if(ra.bottom + 6 + h2 <= vh - M){ Y = ra.bottom + 6; el.classList.add("abaixo"); }
        else if(ra.top - 6 - h2 >= topo){ Y = ra.top - 6 - h2; el.classList.add("acima"); }
        else { Y = Math.max(topo, Math.min(ra.bottom + 6, vh - M - h2)); el.classList.add("abaixo"); }
      }
      var r0 = el.getBoundingClientRect();
      el.style.left = ((X - r0.left) / s) + "px";
      el.style.top = ((Y - r0.top) / s) + "px";
      // Conferência final: nunca deixa a caixa passar da borda da tela.
      var r1 = el.getBoundingClientRect(), dx = 0;
      if(r1.right > vw - M) dx = (vw - M) - r1.right;
      if(r1.left + dx < M) dx = M - r1.left;
      if(dx) el.style.left = (parseFloat(el.style.left) + dx / s) + "px";
    }
    if(state.caixaAnim !== state.caixa){ el.classList.add("entra"); state.caixaAnim = state.caixa; }
    el.style.visibility = "";
    if(!el._ligada){
      el._ligada = true;
      if(typeof d.bind === "function"){ try{ d.bind(el); }catch(e){ console.warn("[Pangea] caixa", e); } }
      var x = el.querySelector(".caixa-x");
      if(x) x.addEventListener("click", function(ev){ ev.stopPropagation(); fecharCaixa(); });
    }
    if(fundo) fundo.onclick = fecharCaixa;
  }
  // Raiz de ligações que também enxerga os botões dentro da caixa aberta (para os
  // cartões do Painel, que ligam os botões só dentro do próprio cartão).
  function comCaixa(raiz){
    if(!raiz) return raiz;
    function lista(sel){
      var a = Array.prototype.slice.call(raiz.querySelectorAll(sel));
      var cx = document.getElementById("caixa");
      if(cx && !raiz.contains(cx)) a = a.concat(Array.prototype.slice.call(cx.querySelectorAll(sel)));
      return a;
    }
    return {
      querySelectorAll: lista,
      querySelector: function(sel){ return lista(sel)[0] || null; },
      contains: function(n){ var cx = document.getElementById("caixa"); return raiz.contains(n) || !!(cx && cx.contains(n)); }
    };
  }
  document.addEventListener("click", function(ev){
    var alvo = ev.target && ev.target.closest ? ev.target.closest("[data-caixa]") : null;
    if(alvo && app.contains(alvo)){
      ev.preventDefault();
      var chave = alvo.getAttribute("data-caixa");
      if(state.caixa === chave) fecharCaixa(); else { state.caixaAnim = null; abrirCaixa(chave); }
      return;
    }
    if(!state.caixa) return;
    // Clique dentro da caixa (mesmo que a tela tenha sido redesenhada pelo clique).
    var caminho = ev.composedPath ? ev.composedPath() : [];
    if(caminho.some(function(n){ return n && (n.id === "caixa" || n.id === "confirm-overlay"); })) return;
    var cx = document.getElementById("caixa");
    if(cx && cx.contains(ev.target)) return;

    }

  window.addEventListener("resize", function(){ if(state.caixa) posicionarCaixa(); });

  // ---------- ORIGEM EM TÓPICOS ----------
  function origemTopicos(c){
    var o = c.origem || {}, pi = c.propIndividuais || [], pr = c.propRelacionais || [];
    var cr = cfgCriacao(), ex = c.extras || {};
    var lista = [];
    (cr.camposExtras||[]).forEach(function(f){ lista.push({ k:"x_"+f.id, titulo:f.rotulo||"Campo", itens:[ex[f.id]] }); });
    lista.push(
      { k:"geracao", titulo:"Geração", itens:[o.geracao] },
      { k:"evento", titulo:"Evento Marcante", itens:[o.evento] },
      { k:"ocupacao", titulo:"Ocupação", itens:[o.ocupacao] }
    );
    if(cr.propositos === "livro"){
      lista.push({ k:"propositos", titulo:"Propósitos pessoais", itens:[pi[0], pi[1]], lista:true });
      lista.push({ k:"conexoes", titulo:"Propósito coletivo", itens:[pr[0]].concat(pr[1] ? [pr[1]] : []), lista:true });
    } else {
      var pp = cr.propPers;
      if(pp.qtd1 || pi.some(Boolean)) lista.push({ k:"propositos", titulo:pp.nome1 || "Propósitos", itens:pi.slice(0, Math.max(pp.qtd1, pi.filter(Boolean).length)), lista:true });
      if(pp.qtd2 || pr.some(Boolean)) lista.push({ k:"conexoes", titulo:pp.nome2 || "Outros", itens:pr.slice(0, Math.max(pp.qtd2, pr.filter(Boolean).length)), lista:true });
    }
    return lista;
  }
  function origemTitulo(){
    var cr = cfgCriacao();
    if(cr.propositos === "livro") return "Origem &amp; Propósitos";
    var pp = cr.propPers, partes = [];
    if(pp.qtd1 && pp.nome1) partes.push(esc(pp.nome1));
    if(pp.qtd2 && pp.nome2) partes.push(esc(pp.nome2));
    if(!partes.length) return "Origem";
    return "Origem, " + partes.join(" &amp; ");
  }
  function fichaAtual(){ return state.view === "sheet" && state.charId ? getChar(state.charId) : null; }
  CAIXAS.orig = function(k){
    var c = fichaAtual(); if(!c) return null;
    var t = origemTopicos(c).filter(function(x){ return x.k===k; })[0]; if(!t) return null;
    var corpo;
    if(t.lista){
      var itens = t.itens.filter(function(x){ return x && String(x).trim(); });
      corpo = itens.length ? '<ol>'+itens.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ol>' : '<p class="hint">Em branco.</p>';
    } else {
      corpo = (t.itens[0] && String(t.itens[0]).trim()) ? '<p class="cx-pre">'+esc(t.itens[0])+'</p>' : '<p class="hint">Em branco.</p>';
    }
    return { titulo:esc(t.titulo), corpo:corpo, lado:"esquerda", largura:380 };
  };

  // ---------- BÔNUS DE ASSIMILAÇÃO (linha no cartão de Instintos) ----------
  // Quando uma Assimilação aumenta um Instinto/Conhecimento/Prática além do normal.
  // Soma direto na base em todo lugar (valorInstinto/valorCP). No cartão fica só uma

      ctx.clearRect(0, 0, W, H);
      var s = t/1000;
      pecas.forEach(function(p){
        var x = p.x + Math.sin(s*p.freq*6.28 + p.fase)*p.amp;
        ctx.save();
        ctx.globalAlpha = Math.min(1, p.alfa);
        ctx.translate(x, p.y); ctx.rotate(p.rot + Math.sin(s*p.fOsc + p.fase)*p.oscila);
        ctx.drawImage(p.sp.img, -p.sp.tam/2, -p.sp.tam/2, p.sp.tam, p.sp.tam);
        ctx.restore();
      });
    }
    function passo(t){
      raf = 0;
      if(!rodando) return;
      var dt = ultimo ? Math.min(0.1, (t - ultimo)/1000) : 0;
      if(t - ultimo >= 32 || !ultimo){ // ~30 quadros por segundo
        ultimo = t;
        pecas.forEach(function(p){
          p.y += p.vy*dt;
          if(p.y < -p.sp.tam) reposicionar(p);
        });
        desenhar(t);
      }
      raf = requestAnimationFrame(passo);
    }
    function parar(){ rodando = false; if(raf){ cancelAnimationFrame(raf); raf = 0; } }
    function iniciar(){
      if(rodando) return;
      rodando = true; ultimo = 0;
      raf = requestAnimationFrame(passo);
    }
    function montar(){
      if(!cv) return;
      parar();
      medir();
      cores = { ink:corDoTema("--ink", [42,35,24]), acc:corDoTema("--accent", [181,80,44]),
        good:corDoTema("--good", [76,122,76]), danger:corDoTema("--danger", [162,58,58]) };
      criar();
      if(movimentoReduzido() || document.hidden){ desenhar(performance.now()); return; }
      iniciar();
    }
    // Troca suave: some, redesenha e volta (o canvas tem transição de opacidade no CSS).
    function trocarSuave(){
      if(!cv) return;
      clearTimeout(tTroca);
      cv.style.opacity = "0";
      tTroca = setTimeout(function(){ if(!cv) return; criar(); if(!rodando) desenhar(performance.now()); cv.style.opacity = ""; }, 600);
    }
    function atualizar(){
      modo = modoAtual();
      if(modo === "desligado"){
        parar();
        if(cv){ cv.remove(); cv = null; ctx = null; }
        return;
      }
      if(!cv){
        cv = document.createElement("canvas");
        cv.id = "fundo-poros"; cv.setAttribute("aria-hidden", "true");
        document.body.insertBefore(cv, document.body.firstChild);
        ctx = cv.getContext("2d");
      }
      carregarImagens(montar);
    }
    // Easter egg: 2+ Pressões mantidas → só máscaras de Pressão por DURACAO_PRESSAO.
    // Respeita o "Desligado" (não liga o fundo só pra isso).
    function pressao(){
      var ja = emPressao();
      soPressaoAte = Date.now() + DURACAO_PRESSAO;
      clearTimeout(tPressao);
      tPressao = setTimeout(function(){ soPressaoAte = 0; trocarSuave(); }, DURACAO_PRESSAO);
      if(!ja && cv) carregarImagens(trocarSuave);
    }
    var tResize = 0;
    window.addEventListener("resize", function(){
      if(!cv) return;
      clearTimeout(tResize);
      tResize = setTimeout(function(){ var w0 = W; medir(); if(Math.abs(W - w0) > 120) criar(); if(!rodando) desenhar(performance.now()); }, 150);
    });
    document.addEventListener("visibilitychange", function(){
      if(!cv) return;
      if(document.hidden) parar(); else if(!movimentoReduzido()) iniciar();
    });
    if(window.matchMedia){
      var mqr = window.matchMedia("(prefers-reduced-motion: reduce)");
      if(mqr.addEventListener) mqr.addEventListener("change", function(){ if(cv) atualizar(); });
    }
    return { atualizar:atualizar, pressao:pressao, emPressao:emPressao };
  })();

  function lerPref(k, padrao){ try{ return localStorage.getItem(k) || padrao; }catch(e){ return padrao; } }

      return '<button type="button" data-tema="'+o[0]+'" aria-pressed="'+(t===o[0])+'"><span class="aparencia-amostra">'+o[2].map(function(c){ return '<i style="background:'+c+'"></i>'; }).join('')+'</span>'+o[1]+'</button>';
    }

      var t = lerPref("pangea:tema","auto");

          }).join('') + '</div>';

  // Se um pedaço da ficha quebrar com os dados de algum personagem, o resto da

  // ficha cortava tudo o que vinha depois sem avisar (relato do Marco, 30/09/2026).
  function avisarErro(onde, e){
    var msg = (e && e.message) ? e.message : String(e);
    try{ console.error("[Pangea] " + onde + ":", e); }catch(_){}
    var el = document.getElementById("erro-banner");
    if(!el){
      el = document.createElement("div"); el.id = "erro-banner";
      el.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:10000;background:var(--danger);color:#fff;padding:10px 14px;border-radius:8px;font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,.35)";
      document.body.appendChild(el);
    }
    el.innerHTML = '<b>Algo deu errado em "' + esc(onde) + '":</b> ' + esc(msg) +
      '<br><span style="opacity:.9">O resto da página continua funcionando. Tire um print desta mensagem e mande pro Claude.</span> ' +
      '<button type="button" style="margin-left:8px;background:#fff;color:#000;border:0;border-radius:4px;padding:2px 8px;cursor:pointer" onclick="this.parentNode.remove()">fechar</button>';
  }
  function tentar(onde, fn){ try{ fn(); }catch(e){ avisarErro(onde, e); } }

    }
  }
