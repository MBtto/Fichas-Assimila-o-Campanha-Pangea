    app.querySelectorAll('[data-action="confirmar-pendente"]').forEach(function(btn){
      btn.addEventListener("click", function(){ confirmarPendente(c); renderSheet(); });
    });

    // Bônus de Assimilação (ver seção "assimbonus" em renderSheet): steppers +/- e digitação
    // direta, sem teto fixo (só o mínimo de 0 - Assimilação não devolve pontos abaixo da base).
    if(!c.instintosAssimBonus) c.instintosAssimBonus = {};
    if(!c.conhPratAssimBonus) c.conhPratAssimBonus = {};
    bindStepper("instbonus", function(id){ return c.instintosAssimBonus[id]; }, function(id,v){ c.instintosAssimBonus[id] = v; }, 0, 99, function(){ updateChar(c); renderSheet(); });
    app.querySelectorAll('[data-instbonus]').forEach(function(el){
      // Mesma ideia do nome do jogador/Notas acima: só grava local a cada
      // tecla, só publica (updateChar) no "change" (ao sair do campo), pra
      // não recarregar a página no meio da digitação de um número.
      el.addEventListener("input", function(){
        c.instintosAssimBonus[el.getAttribute("data-instbonus")] = clamp(parseInt(el.value,10)||0, 0, 99);
      });
      el.addEventListener("change", function(){ updateChar(c); renderSheet(); });
    });
    bindStepper("cpbonus", function(id){ return c.conhPratAssimBonus[id]; }, function(id,v){ c.conhPratAssimBonus[id] = v; }, 0, 99, function(){ updateChar(c); renderSheet(); });
    app.querySelectorAll('[data-cpbonus]').forEach(function(el){
      el.addEventListener("input", function(){
        c.conhPratAssimBonus[el.getAttribute("data-cpbonus")] = clamp(parseInt(el.value,10)||0, 0, 99);
      });
      el.addEventListener("change", function(){ updateChar(c); renderSheet(); });
    });

    // Clicar num laço da trilha do Cabo de Guerra (ver tugDeGuerraCardHtml)
    // ajusta o Nível de Determinação/Assimilação direto pro laço clicado (11
    // posições de verdade, Nível 0 a 10 - ver nivelDetAtual/caixaAtual/
    // DET_CAIXA_FLOOR), enchendo os pontos dos dois lados de novo, igual a
    // regra da fonte manda sempre que um Nível sobe ou desce. Substitui o
    // controle de arrastar-e-soltar de antes (mais fiel ao visual da ficha
    // oficial, ver imagem anexada pelo Marco em 27/09/2026) - e, por ser um
    // clique único em vez de um gesto de arrasto, não tem a classe de bug do
    // "rollback" que existia com pointercancel em arrastos rápidos.
    app.querySelectorAll('[data-tuglvl]').forEach(function(el){
      el.addEventListener("click", function(){
        var novoNivelDet = parseInt(el.getAttribute("data-tuglvl"),10);
        var novoCaixa = clamp(novoNivelDet - 7, DET_CAIXA_FLOOR, 3);
        if(novoCaixa === c.determinacao.caixaAtual) return;
        c.determinacao.caixaAtual = novoCaixa;
        c.determinacao.pontosAtual = nivelDetAtual(c);
        c.determinacao.assimPontosAtual = null;
        updateChar(c);
        renderSheet();
      });
    });
    app.querySelectorAll('[data-tugpts]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var acao = btn.getAttribute("data-tugpts");
        if(acao === "det-menos"){ if(gastarDeterminacao(c,1)) marcarFlashSuscetivel(c); }
        else if(acao === "det-mais") devolverDeterminacaoNivel(c,1);
        else if(acao === "assim-menos") gastarAssimilacao(c,1);
        else if(acao === "assim-mais") devolverAssimilacao(c,1);
        marcarPendenteOuSalvar(c, "cabo"); renderSheet();
      });
    });

    app.querySelectorAll('[data-dots="nivel"] .diamond').forEach(function(dot){
      dot.addEventListener("click", function(){ c.saudeNivel = clamp(parseInt(dot.getAttribute("data-dotval"),10),0,5); marcarPendenteOuSalvar(c, "saude"); renderSheet(); });
    });
    app.querySelectorAll('[data-dots="pontos"] .diamond').forEach(function(dot){
      dot.addEventListener("click", function(){ c.saudePontosAtuais = clamp(parseInt(dot.getAttribute("data-dotval"),10),0,maxNivel); marcarPendenteOuSalvar(c, "saude"); renderSheet(); });
    });
    var bMenos = app.querySelector('[data-saude="menos"]'), bMais = app.querySelector('[data-saude="mais"]');
    if(bMenos) bMenos.addEventListener("click", function(){
      c.saudePontosAtuais = clamp((c.saudePontosAtuais||maxNivel)-1,0,maxNivel);
      if(c.saudePontosAtuais===0 && c.saudeNivel>0){ c.saudeNivel -= 1; c.saudePontosAtuais = maxNivel; }
      marcarPendenteOuSalvar(c, "saude"); renderSheet();
    });
    if(bMais) bMais.addEventListener("click", function(){
      c.saudePontosAtuais = clamp((c.saudePontosAtuais||0)+1,0,maxNivel); marcarPendenteOuSalvar(c, "saude"); renderSheet();
    });

    app.querySelectorAll('[data-dots="equipusos"] .dot').forEach(function(dot){
      dot.addEventListener("click", function(){ c.equip.usosAtual = clamp(parseInt(dot.getAttribute("data-dotval"),10),0,c.equip.usosMax); marcarPendenteOuSalvar(c, "equip"); renderSheet(); });
    });
    var repor = app.querySelector('[data-equipuso="repor"]');
    if(repor) repor.addEventListener("click", function(){ c.equip.usosAtual = c.equip.usosMax; marcarPendenteOuSalvar(c, "equip"); renderSheet(); });

    var addInv = app.querySelector('[data-inv="add"]');
    if(addInv) addInv.addEventListener("click", function(){ state.itemDraft = newItemDraft(); renderSheet(); });
    if(state.itemDraft) bindItemForm(c, state.itemDraft);
    app.querySelectorAll('[data-inv="del"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        c.inventarioExtra.splice(parseInt(btn.getAttribute("data-idx"),10),1);
        marcarPendenteOuSalvar(c, "inv"); renderSheet();
      });
    });
    app.querySelectorAll('[data-invuso="menos"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var it = c.inventarioExtra[parseInt(btn.getAttribute("data-idx"),10)];
        if(it) it.usosAtual = clamp((it.usosAtual||0)-1, 0, it.usosMax);
        marcarPendenteOuSalvar(c, "inv"); renderSheet();
      });
    });
    app.querySelectorAll('[data-invuso="mais"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var it = c.inventarioExtra[parseInt(btn.getAttribute("data-idx"),10)];
        if(it) it.usosAtual = clamp((it.usosAtual||0)+1, 0, it.usosMax);
        marcarPendenteOuSalvar(c, "inv"); renderSheet();
      });
    });
    app.querySelectorAll('[data-invuso="repor"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var it = c.inventarioExtra[parseInt(btn.getAttribute("data-idx"),10)];
        if(it) it.usosAtual = it.usosMax;
        marcarPendenteOuSalvar(c, "inv"); renderSheet();
      });
    });

    var copyBtn = app.querySelector('[data-action="copy"]');
    if(copyBtn) copyBtn.addEventListener("click", function(){
      var box = app.querySelector('#export-code');
      box.select();
      try{ navigator.clipboard.writeText(box.value); copyBtn.textContent = "Copiado!"; setTimeout(function(){copyBtn.textContent="Copiar código";},1500); }
      catch(e){ document.execCommand('copy'); }
    });
    var editBtn = app.querySelector('[data-action="edit"]');
    if(editBtn) editBtn.addEventListener("click", function(){
      state.sheetEditing = true;
      state.sheetDraft = JSON.parse(JSON.stringify(c));
      render();
    });
    var delBtn = app.querySelector('[data-action="delete"]');
    if(delBtn) delBtn.addEventListener("click", function(){ state.deleteConfirm = true; render(); });

    bindSheetTest(c);
    bindMutacoesCard(c);
  }

  // ----- TESTE INTEGRADO NA FICHA (Instinto + Prática/Conhecimento) -----
  function pickBestIndices(results, n){
    var idxs = results.map(function(_,i){ return i; });
    idxs.sort(function(a,b){
      var A = results[a], B = results[b];
      if(B.s !== A.s) return B.s - A.s;
      if(B.a !== A.a) return B.a - A.a;
      return A.p - B.p;
    });
    return idxs.slice(0, n);
  }

  // Timers da animação de rolagem: guardados fora do state pra dar pra limpar
  // com segurança se o jogador navegar pra outro lugar no meio da animação.
  var diceAnimTimer = null;
  var diceAnimTimeout = null;
  function pararAnimacaoDados(){
    if(diceAnimTimer){ clearInterval(diceAnimTimer); diceAnimTimer = null; }
    if(diceAnimTimeout){ clearTimeout(diceAnimTimeout); diceAnimTimeout = null; }
  }
  // Liga o ticker que troca as faces exibidas nos dados "girando" a cada
  // 90ms, direto no DOM (sem re-renderizar a tela inteira). Usado tanto no
  // teste da ficha (bindSheetTest) quanto na Rolagem Seca do Assimilador
  // (bindGmDryRoll).
  function iniciarTickerDados(){
    clearInterval(diceAnimTimer);
    diceAnimTimer = setInterval(function(){
      app.querySelectorAll('.die-spin').forEach(function(el){
        el.textContent = String(1 + Math.floor(Math.random()*12));
      });
    }, 90);
  }

  function renderSheetTest(c){
    var t = state.sheetTest;
    var instintoDado = t.agir ? 12 : 6;
    var baseInst = t.instintoKey ? valorInstinto(c,t.instintoKey) : 0;
    var baseInst2 = (t.agir && t.instinto2Key) ? valorInstinto(c,t.instinto2Key) : 0;
    var dInst = baseInst + baseInst2;
    var d10 = (!t.agir && t.cpKey) ? valorCP(c,t.cpKey) : 0;
    // Só bloqueia MARCAR uma caixa nova sem recurso pra ela - uma caixa já
    // marcada (o ponto já foi reservado na hora, ver bindSheetTest) continua
    // ativa e clicável mesmo que o recurso tenha zerado depois.
    var agirIndisponivel = !t.agir && !agirPorInstintoDisponivel(c);
    var extraIndisponivel = !t.extraDado && !extraDadoDisponivel(c);
    var extraLabel = "Manter +1 dado extra nesta rolagem — Empenho (declare antes de rolar; gasta 1 ponto de Determinação)";
    var body = pendingSectionBannerHtml(c, "teste");
    body += '<p class="hint">Escolha o Instinto e a Prática/Conhecimento do teste: a pilha de dados é montada automaticamente com os valores da ficha (1d6 por ponto de Instinto, 1d10 por ponto de Prática/Conhecimento). Ao Agir por Instinto, escolha dois Instintos no lugar de Instinto + Prática/Conhecimento (pode repetir o mesmo Instinto nos dois); os dados desses Instintos viram d12. Pra manter um dado a mais nessa rolagem, declare isso antes de rolar (abaixo): depois que os dados caírem só dá pra escolher entre os que já foram rolados, não pra manter mais um.</p>';
    body += '<div class="grid cols-2">';
    body += '<div class="field"><label>Instinto</label><select data-test="instinto" '+(t.rolling?"disabled":"")+'>' +
      INSTINTOS.map(function(i){ return '<option value="'+i[0]+'"'+(t.instintoKey===i[0]?" selected":"")+'>'+i[1]+' ('+valorInstinto(c,i[0])+')</option>'; }).join('') +
      '</select></div>';
    body += '<div class="field"><label>'+(t.agir?"Segundo Instinto":"Prática ou Conhecimento")+'</label><select data-test="segundo" '+(t.rolling?"disabled":"")+'>' +
      (t.agir ?
        INSTINTOS.map(function(i){ return '<option value="'+i[0]+'"'+(t.instinto2Key===i[0]?" selected":"")+'>'+i[1]+' ('+valorInstinto(c,i[0])+')</option>'; }).join('') :
        CONH_PRAT.map(function(p){ return '<option value="'+p[0]+'"'+(t.cpKey===p[0]?" selected":"")+'>'+p[1]+' ('+valorCP(c,p[0])+')</option>'; }).join('')) +
      '</select></div>';
    body += '</div>';
    body += '<label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;margin-bottom:10px"><input type="checkbox" style="width:auto" data-test="agir"'+(t.agir?" checked":"")+((t.rolling||agirIndisponivel)?" disabled":"")+'> Agir por Instinto — Rolagem Assimilada (usa dois Instintos no lugar de Instinto + Prática/Conhecimento; os dados desses Instintos viram d12 e mantém 1 dado a mais; gasta 1 ponto de Assimilação, ou 2 de Determinação em substituição caso não haja Assimilação disponível)</label>';
    body += '<label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;margin-bottom:10px"><input type="checkbox" style="width:auto" data-test="extra"'+(t.extraDado?" checked":"")+((t.rolling||extraIndisponivel)?" disabled":"")+'> '+extraLabel+'</label>';
    body += '<div class="budget ok"><span>Pilha calculada</span><span class="num">'+dInst+' d'+instintoDado+(d10?' + '+d10+' d10':'')+'</span></div>';
    body += '<div class="btn-row" style="margin-top:0"><button class="btn accent" data-testaction="roll" '+(t.rolling?'disabled':'')+'>'+(t.rolling?"Rolando…":"Rolar Teste")+'</button></div>';
    if(!t.rolling && (agirIndisponivel || extraIndisponivel)) body += '<p class="hint">Os pontos de Agir por Instinto/dado extra já são gastos assim que a caixa é marcada (só voltam se for desmarcada antes de rolar) - por isso alguma dessas opções pode estar bloqueada se não sobrar recurso pra ela. Esse gasto só é sincronizado com a mesa quando o teste for confirmado no botão "Confirmar escolha e registrar no histórico".</p>';

    if(t.rolling){
      var n = Math.max(1, t.rollingCount||1);
      var spins = "";
      for(var k=0;k<n;k++){ spins += '<span class="die-spin">?</span>'; }
      body += '<div class="dice-anim">'+spins+'</div>';
    } else if(t.results.length){
      var kept = t.results.filter(function(d){ return d.kept; });
      var totS = sum(kept.map(function(d){return d.s;}));
      var totA = sum(kept.map(function(d){return d.a;}));
      var totP = sum(kept.map(function(d){return d.p;}));
      var keepN = t.keepN || (t.agir?2:1);
      body += '<div style="margin-top:14px">' +
        '<p class="hint">Mantém por padrão '+keepN+' dado'+(keepN===1?"":"s")+' (conforme declarado antes da rolagem)'+(t.registered?'':'; clique num dado pra manter ou soltar outro (ex.: tensionando uma Origem), depois confirme pra registrar no histórico')+'.</p>' +
        '<div class="row" style="flex-wrap:wrap;gap:8px">';
      t.results.forEach(function(d, idx){
        body += '<button type="button" class="btn secondary" data-testtoggle="'+idx+'" '+(t.registered?'disabled':'')+' style="font-family:\'IBM Plex Mono\',monospace'+(d.kept?'':';opacity:.4;text-decoration:line-through')+(t.registered?';cursor:default':'')+'">d'+d.sides+':'+d.face+' ('+diceResultHtml(d)+')</button>';
      });
      body += '</div>';
      body += '<div class="budget ok" style="margin-top:12px"><span>Resultado '+(t.registered?"registrado":"mantido (ainda não registrado)")+'</span><span class="num">'+resultBadges(totS,totA,totP)+'</span></div>';
      if(t.registered){
        body += '<p class="hint" style="margin-top:8px">✓ Este resultado já foi registrado no Histórico de Testes.</p>';
      } else {
        body += '<div class="row" style="margin-top:10px"><button class="btn accent" data-testaction="confirm">Confirmar escolha e registrar no histórico</button></div>';
      }
      body += '</div>';
    }
    return sectionCard("testar", "Testar", body);
  }

  function bindSheetTest(c){
    var t = state.sheetTest;
    if(t.rolling){ iniciarTickerDados(); }
    var instSel = app.querySelector('[data-test="instinto"]');
    if(instSel) instSel.addEventListener("change", function(){ t.instintoKey = instSel.value; t.results = []; t.registered = false; renderSheet(); });
    var segSel = app.querySelector('[data-test="segundo"]');
    if(segSel) segSel.addEventListener("change", function(){
      if(t.agir) t.instinto2Key = segSel.value; else t.cpKey = segSel.value;
      t.results = [];
      t.registered = false;
      renderSheet();
    });
    // "Agir por Instinto" e "Manter +1 dado extra": o(s) ponto(s) de recurso
    // são gastos (ou devolvidos) NA HORA que a caixa é marcada/desmarcada,
    // pra já refletir no HUD desta aba e bloquear gasto duplo - mas isso fica
    // só como PENDÊNCIA local (marcarPendenteOuSalvar, o mesmo mecanismo já
    // usado por Saúde/Cabo de Guerra/Equipamento), nunca sincronizado com a
    // mesa nesse momento. Só quando o teste é de fato confirmado (ver
    // confirmBtn abaixo) é que esse gasto é publicado - junto com a entrada
    // nova no Histórico de Testes, numa publicação só. Isso evita que só
    // marcar/desmarcar essas caixas (ou rolar, ou trocar qual dado fica
    // mantido) já dispare uma atualização/recarregamento pra mesa inteira
    // antes do jogador terminar de decidir o teste. A pendência tem a mesma
    // rede de segurança das outras seções: sair da ficha ou fechar a aba
    // confirma sozinho (ver goto/aoDescarregarAba).
    // Um "snapshot" de antes do gasto é guardado em t.agirSnapshot/extraSnapshot
    // pra permitir desfazer com exatidão (inclusive uma caixa de Determinação
    // que tenha virado no meio do caminho) se a pessoa desmarcar antes de
    // rolar; rolar de fato limpa esses snapshots (ver rollBtn abaixo), o que
    // OFICIALIZA o gasto localmente - a partir daí desmarcar não devolve mais
    // nada (mas a sincronização com a mesa continua esperando o confirmar).
    // Gastar 1 ponto de Determinação por essas caixas é o mesmo gasto do botão
    // "-1 ponto" do Cabo de Guerra (gastarDeterminacao, que cascateia o Nível
    // e sinaliza pra marcarFlashSuscetivel quando isso acontece).
    // Agir por Instinto (Rolagem Assimilada, livro definitivo pág. 41/60): custa 1
    // ponto de Assimilação primeiro; sem nenhum sobrando, cai pra 2 pontos de
    // Determinação em substituição - ver agirPorInstintoDisponivel. Corrigido em
    // 27/09/2026 (antes gastava sempre 1 de Determinação, sem nunca tocar
    // Assimilação - o oposto da regra oficial).
    var agirChk = app.querySelector('[data-test="agir"]');
    if(agirChk) agirChk.addEventListener("change", function(){
      var ligar = agirChk.checked;
      if(ligar){
        if(!agirPorInstintoDisponivel(c)){ agirChk.checked = false; alert("Sem Pontos de Assimilação nem de Determinação: não dá pra Agir por Instinto agora."); return; }
        if(assimilacaoDisponivel(c)){
          t.agirUsouAssim = true;
          gastarAssimilacao(c,1);
        } else {
          t.agirUsouAssim = false;
          t.agirSnapshot = { caixaAtual:c.determinacao.caixaAtual, pontosAtual:c.determinacao.pontosAtual };
          if(gastarDeterminacao(c,2)) marcarFlashSuscetivel(c);
        }
      } else {
        if(t.agirUsouAssim){ devolverAssimilacao(c,1); }
        else if(t.agirSnapshot){ c.determinacao.caixaAtual = t.agirSnapshot.caixaAtual; c.determinacao.pontosAtual = t.agirSnapshot.pontosAtual; }
        t.agirSnapshot = null;
      }
      marcarPendenteOuSalvar(c, "teste");
      t.agir = ligar; t.results = []; t.registered = false; renderSheet();
    });
    // Manter +1 dado extra é o Empenho (livro definitivo pág. 59): só gasta
    // Determinação, nunca Assimilação - ver extraDadoDisponivel.
    var extraChk = app.querySelector('[data-test="extra"]');
    if(extraChk) extraChk.addEventListener("change", function(){
      var ligar = extraChk.checked;
      if(ligar){
        if(!extraDadoDisponivel(c)){ extraChk.checked = false; alert("Sem pontos de Determinação: não dá pra manter um dado extra agora."); return; }
        t.extraSnapshot = { caixaAtual:c.determinacao.caixaAtual, pontosAtual:c.determinacao.pontosAtual };
        if(gastarDeterminacao(c,1)) marcarFlashSuscetivel(c);
      } else if(t.extraSnapshot){
        c.determinacao.caixaAtual = t.extraSnapshot.caixaAtual;
        c.determinacao.pontosAtual = t.extraSnapshot.pontosAtual;
        t.extraSnapshot = null;
      }
      marcarPendenteOuSalvar(c, "teste");
      t.extraDado = ligar; renderSheet();
    });
    var rollBtn = app.querySelector('[data-testaction="roll"]');
    if(rollBtn) rollBtn.addEventListener("click", function(){
      var instintoDado = t.agir ? 12 : 6;
      var baseInst = t.instintoKey ? valorInstinto(c,t.instintoKey) : 0;
      var baseInst2 = (t.agir && t.instinto2Key) ? valorInstinto(c,t.instinto2Key) : 0;
      var dInst = baseInst + baseInst2;
      var d10 = (!t.agir && t.cpKey) ? valorCP(c,t.cpKey) : 0;
      if(dInst+d10 <= 0){ alert("Esse Instinto (e Prática/Conhecimento, se não for Agir por Instinto) está em 0: não há dados pra rolar."); return; }
      // O número de dados mantidos (keepN) é decidido AQUI, antes da rolagem: base de
      // 1 (ou 2, Agir por Instinto) mais 1 se "manter +1 dado extra" foi declarado
      // antes de rolar. Isso é o que o jogador vai poder ajustar (trocar QUAIS dados,
      // não QUANTOS) depois que os dados caírem, antes de confirmar pro histórico.
      var keepN = (t.agir ? 2 : 1) + (t.extraDado ? 1 : 0);
      // Os pontos de "Agir por Instinto"/"dado extra" já foram gastos
      // localmente (mas ainda como pendência, não sincronizados com a mesa -
      // ver os handlers de "agir"/"extra" acima) no momento em que as caixas
      // foram marcadas. Rolar de fato só OFICIALIZA esse gasto localmente:
      // limpa os snapshots, então desmarcar essas caixas depois daqui não
      // devolve mais nada - mas a sincronização com a mesa continua esperando
      // o "Confirmar escolha e registrar no histórico" (ver confirmBtn abaixo).
      t.agirSnapshot = null;
      t.extraSnapshot = null;
      t.agirUsouAssim = false;
      t.keepN = keepN;
      t.extraDado = false;
      t.registered = false;
      pararAnimacaoDados();
      t.rolling = true;
      t.rollingCount = dInst + d10;
      renderSheet();
      diceAnimTimeout = setTimeout(function(){
        diceAnimTimeout = null;
        pararAnimacaoDados();
        var results = [];
        var i;
        for(i=0;i<dInst;i++) results.push(rollDie(instintoDado));
        for(i=0;i<d10;i++) results.push(rollDie(10));
        results.forEach(function(d){ d.kept = false; });
        pickBestIndices(results, Math.min(keepN, results.length)).forEach(function(idx){ results[idx].kept = true; });
        t.results = results;
        t.rolling = false;
        renderSheet();
      }, 650);
    });
    app.querySelectorAll('[data-testtoggle]').forEach(function(btn){
      btn.addEventListener("click", function(){
        if(t.registered) return;
        var idx = parseInt(btn.getAttribute("data-testtoggle"),10);
        t.results[idx].kept = !t.results[idx].kept;
        renderSheet();
      });
    });
    // Só quando o jogador confirma a escolha final de quais dados ficam mantidos
    // é que o teste entra pro Histórico de Testes - nunca automaticamente assim
    // que os dados caem (pra dar tempo de tensionar uma Origem, trocar qual dado
    // fica, etc. antes de registrar de vez). Esse clique também é o ÚNICO
    // momento em que o teste inteiro (a entrada no Histórico e, se for o caso,
    // o gasto de Agir por Instinto/Empenho ainda pendente neste personagem -
    // ver marcarPendenteOuSalvar acima) é de fato sincronizado com a mesa,
    // numa publicação só: nem marcar/desmarcar as caixas, nem rolar, nem
    // trocar qual dado fica mantido disparam nenhuma atualização por conta
    // própria (pedido do Marco em 27/09/2026, pra parar de atualizar a mesa
    // inteira a cada ação declarada durante um teste).
    var confirmBtn = app.querySelector('[data-testaction="confirm"]');
    if(confirmBtn) confirmBtn.addEventListener("click", function(){
      var keptNow = t.results.filter(function(d){return d.kept;});
      var totS = sum(keptNow.map(function(d){return d.s;}));
      var totA = sum(keptNow.map(function(d){return d.a;}));
      var totP = sum(keptNow.map(function(d){return d.p;}));
      var instLbl = (INSTINTOS.filter(function(i){return i[0]===t.instintoKey;})[0]||[null,t.instintoKey])[1];
      var segLbl = t.agir
        ? (INSTINTOS.filter(function(i){return i[0]===t.instinto2Key;})[0]||[null,t.instinto2Key])[1]
        : (CONH_PRAT.filter(function(p){return p[0]===t.cpKey;})[0]||[null,t.cpKey])[1];
      registrarTeste({
        charId: c.id, nomePersonagem: c.nomePersonagem, nomeJogador: c.nomeJogador,
        acampamento: c.acampamento,
        label: instLbl+" + "+segLbl+(t.agir?" (Agir por Instinto)":""),
        resultado: totS+" Suc · "+totA+" Adap · "+totP+" Press",
        totS: totS, totA: totA, totP: totP,
        dados: t.results.map(function(d){ return {sides:d.sides, face:d.face, s:d.s, a:d.a, p:d.p, kept:d.kept}; })
      });
      // registrarTeste já marcou o teste como pendência (schedulePublish, modo
      // mesa) - se este personagem também tinha um gasto de Agir por
      // Instinto/Empenho ainda pendente (marcarPendenteOuSalvar acima),
      // confirmarPendente publica os dois juntos agora, na hora, em vez de
      // esperar o debounce de schedulePublish. Sem gasto pendente, força a
      // mesma publicação imediata (em vez de esperar até 1,2s) - confirmar é
      // uma ação deliberada, não precisa de debounce.
      if(temPendente(c)){ confirmarPendente(c); }
      else { clearTimeout(publishTimer); doPublish(); }
      t.registered = true;
      renderSheet();
    });
  }

  // ----- SHEET EDIT MODE (reaproveita a UI do assistente pra Instintos/Conh.Prat/Caracteristicas/Equipamento) -----
  function renderSheetEdit(){
    var draft = state.sheetDraft;
    if(!draft){ goto("sheet"); return; }
    if(!isCharUnlocked(draft)){ goto("sheet", {charId: draft.id}); return; }
    var camp = draft.acampamento ? CAMPS[draft.acampamento] : null;
    var html = topbar("sheet");
    html += '<div'+(camp?' style="--camp-color:'+camp.cor+'"':'')+'>';
    html += '<div class="card"><h2>Editando: '+esc(draft.nomePersonagem||"personagem")+'</h2>' +
      '<div class="field" style="max-width:320px"><label>Nome do personagem</label><input type="text" data-editnome value="'+esc(draft.nomePersonagem)+'"></div>' +
      '<label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;margin-bottom:0"><input type="checkbox" style="width:auto" data-editnpc'+(draft.ehNpc?" checked":"")+'> É um NPC (personagem controlado pelo Assimilador): as rolagens dele ficam escondidas dos outros jogadores no Histórico de Rolagens e no painel flutuante — o Assimilador continua vendo tudo normalmente.</label>' +
    '</div>';

    [3,4,5,6].forEach(function(step){
      html += '<div class="card"><h2>'+WIZ_STEPS[step]+'</h2>' + wizardStepBody(draft, step) + '</div>';
    });

    html += '<div class="btn-row"><button class="btn secondary" data-editaction="cancel">Cancelar edição</button><button class="btn accent" data-editaction="save">Salvar alterações</button></div>';
    html += '</div>';

    app.innerHTML = html;
    bindGlobal();

    app.querySelector('[data-editnome]').addEventListener("input", function(e){ draft.nomePersonagem = e.target.value; });
    app.querySelector('[data-editnpc]').addEventListener("change", function(e){ draft.ehNpc = e.target.checked; });
    [3,4,5,6].forEach(function(step){ bindWizardStep(draft, step, renderSheetEdit); });

    app.querySelector('[data-editaction="cancel"]').addEventListener("click", function(){
      var id = draft.id;
      state.sheetEditing = false; state.sheetDraft = null;
      goto("sheet", {charId:id});
    });
    app.querySelector('[data-editaction="save"]').addEventListener("click", function(){
      for(var s=3;s<=6;s++){
        var v = validateStep(draft, s);
        if(!v.ok){ alert(v.msg); return; }
      }
      draft.atributoSaude = bestSaudeAttr(draft);
      updateChar(draft);
      var id = draft.id;
      state.sheetEditing = false; state.sheetDraft = null;
      goto("sheet", {charId:id});
    });
  }

  // ----- ROLADOR DE DADOS -----
  function rollDie(sides){
    var face = 1 + Math.floor(Math.random()*sides);
    var conv = DICE_TABLE[sides][face] || {s:0,a:0,p:0};
    return { sides:sides, face:face, s:conv.s, a:conv.a, p:conv.p, kept:true };
  }
  function diceResultLabel(d){
    var parts = [];
    if(d.s) parts.push("✓"+d.s);
    if(d.a) parts.push("⟳"+d.a);
    if(d.p) parts.push("⚠"+d.p);
    return parts.length ? parts.join(" ") : "em branco";
  }
  // Emblemas coloridos de Sucesso/Adaptação/Pressão: usados em vez de só números
  // soltos sempre que mostramos o resultado de uma rolagem (na ficha e no histórico).
  function resultBadges(totS, totA, totP){
    return '<span class="result-badges">' +
      '<span class="rbadge rb-s" title="Sucesso">'+dadoHtml("s")+' '+totS+'</span>' +
      '<span class="rbadge rb-a" title="Adaptação">'+dadoHtml("a")+' '+totA+'</span>' +
      '<span class="rbadge rb-p" title="Pressão">'+dadoHtml("p")+' '+totP+'</span>' +
    '</span>';
  }
  // Losangos pequenos e só decorativos (sem clique) pra mini-ficha da aba Mesa.
  function diamondsMini(atual, max, colorClass){
    return '<div class="dots mini">' + diamonds(atual, max, "", colorClass) + '</div>';
  }

  // Trilha compacta e só-leitura (sem clique) do Cabo de Guerra, mesmo visual
  // de laços do livro usado no Painel do Assimilador (ver gmCharCardBody) e na
  // ficha principal (tugDeGuerraCardHtml) - usada nos cards da tela de
  // Personagens e na mini-ficha da aba Mesa no lugar da antiga barra de
  // preenchimento única, já que desde a versão 332 o Cabo de Guerra é a única
  // forma de calcular Determinação/Assimilação (ver tugLacosHtml).
  function tugMiniBarHtml(c){
    var nivelDet = c.determinacao ? nivelDetAtual(c) : 10;
    return '<div>' +
      '<span class="hint" style="display:block;margin-bottom:3px">Determinação/Assimilação (Nível '+nivelDet+'/10)</span>' +
      tugLacosHtml(nivelDet, false) +
    '</div>';
  }

  // Mini-ficha de um personagem pra aba Mesa: nome, jogador, acampamento (mesma
  // decoração de cor usada na criação de personagem) e um resumo de Saúde/Determinação.
  // Não mostra a Assimilação oculta nem os Instintos/Conhecimentos - isso fica só
  // no Painel do Assimilador.
  function miniFichaCard(c){
    var camp = c.acampamento ? CAMPS[c.acampamento] : null;
    var cardStyle = (camp?'--camp-color:'+camp.cor+';':'')+'border-left:6px solid '+(camp?camp.cor:'var(--accent)')+';cursor:pointer';
    var maxNivel = c.instintos ? (valorInstinto(c, c.atributoSaude||"potencia")+2) : 1;
    return '<div class="char-card" style="'+cardStyle+'" data-mesaopen="'+c.id+'">' +
      (camp ? '<img class="badge" src="'+camp.img+'" alt="">' : '') +
      '<h3>'+esc(c.nomePersonagem||"Sem nome")+npcBadgeHtml(c)+'</h3>' +
      '<div class="camp-tag">'+(camp?camp.nome:"acampamento não definido")+(c.nomeJogador?" · "+esc(c.nomeJogador):"")+'</div>' +
      '<div class="row" style="margin-top:10px;gap:16px;flex-wrap:wrap">' +
        '<div><span class="hint" style="display:block;margin-bottom:3px">Saúde (nível '+(c.saudeNivel!=null?c.saudeNivel:"?")+'/5)</span>'+diamondsMini(c.saudePontosAtuais||0, maxNivel, "c-saude")+'</div>' +
        tugMiniBarHtml(c) +
      '</div>' +
    '</div>';
  }

  // Aba Mesa: no lugar do antigo rolador avulso de dados. Mostra o histórico geral
  // de rolagens (funciona tanto na mesa ao vivo quanto no modo local) e uma
  // mini-ficha de cada personagem, decorada com a cor do acampamento.
  function renderMesa(){
    var chars = visibleChars();
    var html = topbar("mesa");
    if(caps.mode === "mesa" && !temAcessoTotal()){
      html += '<div class="card tight" style="border-color:var(--accent)"><p class="hint" style="margin:0">🔒 Personagens de outros jogadores ficam escondidos até a senha certa (nome do personagem + nome do jogador) ser digitada em qualquer lugar da página.</p></div>';
    }
    html += testLogHtml("Histórico de Rolagens", {showClear:true});
    html += '<h2 style="margin:20px 0 10px">Personagens</h2>';
    if(!chars.length){
      html += '<div class="card"><p class="hint">Nenhum personagem criado ainda.</p></div>';
    } else {
      html += '<div class="roster-grid">';
      chars.forEach(function(c){ html += miniFichaCard(c); });
      html += '</div>';
    }
    html += '<div class="btn-row"><span></span><button class="btn secondary" data-nav="roster">Voltar</button></div>';

    app.innerHTML = html;
    bindGlobal();
    app.querySelectorAll('[data-mesaopen]').forEach(function(el){
      el.addEventListener("click", function(){ goto("sheet", {charId: el.getAttribute("data-mesaopen")}); });
    });
    var clearLogBtn = app.querySelector('[data-action="clear-rolagens"]');
    if(clearLogBtn) clearLogBtn.addEventListener("click", limparHistoricoRolagens);
  }

  // ----- GM PANEL -----
  // Grade de atributos (Instintos, Conhecimentos & Práticas) pro Painel do
  // Assimilador: uma célula por atributo, nome em cima e valor (já somando o
  // Bônus de Assimilação, ver valorInstinto/valorCP) em destaque embaixo -
  // mais fácil de escanear rápido do que uma linha corrida de texto, numa
  // mesa com vários personagens abertos ao mesmo tempo.
  function attrGridHtml(pairs){
    return '<div class="gm-attr-grid">' + pairs.map(function(p){
      return '<div class="gm-attr-cell"><div class="lbl">'+esc(p[0])+'</div><div class="v">'+p[1]+'</div></div>';
    }).join('') + '</div>';
  }
  // Características de um personagem como etiquetas (chips), com o custo em
  // pontos e a descrição completa no title (tooltip) - no lugar de uma lista
  // de nomes separada por vírgula.
  function attrCaracChipsHtml(ids){
    if(!ids || !ids.length) return '<p class="hint" style="margin:4px 0 0">Nenhuma característica única.</p>';
    return '<div class="gm-carac-list">' + ids.map(function(id){
      var d = CARACTERISTICAS.filter(function(x){return x.id===id;})[0];
      if(!d) return '<span class="gm-carac-chip">'+esc(id)+'</span>';
      return '<span class="gm-carac-chip" title="'+esc(d.txt)+'"><b>'+esc(d.nome)+'</b><span class="cost">'+d.custo+'pt</span></span>';
    }).join('') + '</div>';
  }

  // Mostra TODOS os dados rolados num teste (não só os mantidos), com os mantidos
  // destacados e os descartados apagados/riscados - pra entradas antigas do
  // histórico (sem o array de dados individuais salvo) mostra um traço no lugar.
  function diceChipsHtml(dados){
    if(!dados || !dados.length) return '<span class="hint">-</span>';
    return dados.map(function(d){
      var lbl = diceResultLabel(d);
      return '<span class="die-chip'+(d.kept?" kept":"")+'" title="'+esc(lbl)+'">d'+d.sides+':'+d.face+(lbl!=="em branco"?' <span class="die-chip-res">'+diceResultHtml(d)+'</span>':'')+'</span>';
    }).join('');
  }
  // Resultado de uma linha do histórico: entradas novas guardam os totais como
  // números (mostrados com os emblemas coloridos); entradas antigas só têm o
  // texto pronto (formato anterior), então caem de volta pra ele.
  function testeResultadoHtml(t){
    if(t.totS != null && t.totA != null && t.totP != null) return resultBadges(t.totS, t.totA, t.totP);
    return esc(t.resultado||"");
  }
  // O histórico de rolagens mostra o nome do personagem e do jogador pra
  // todo mundo (não depende mais de a senha da ficha já ter sido digitada
  // neste navegador) - assim dá pra acompanhar a mesa inteira sem precisar
  // destrancar ficha nenhuma. O acampamento de origem continua escondido
  // aqui (nem cor, nem borda, nem o nome do acampamento em lugar nenhum
  // desta tabela): quem quiser saber o acampamento de alguém, abre a ficha.
  // title === false suprime o próprio <h2> (usado no painel flutuante, que
  // já tem seu próprio título na barrinha de cima). opts.showClear acrescenta
  // o botão "Limpar histórico de rolagens" dentro deste card (usado só na
  // aba Mesa, que é a página original do histórico).
  function testLogHtml(title, opts){
    opts = opts || {};
    var log = testLogVisivelPara(testLog());
    if(!log.length) return '<div class="card"><p class="hint">Nenhum teste rolado ainda.</p></div>';
    var showHeader = title !== false;
    var html = '<div class="card">' + (showHeader ? '<h2>'+esc(title||"Histórico de Testes")+'</h2>' : '') + '<div class="table-wrap"><table><thead><tr><th>Quando</th><th>Personagem</th><th>Teste</th><th>Dados</th><th class="num">Resultado</th></tr></thead><tbody>';
    log.forEach(function(t){
      var quando = "";
      try{ quando = new Date(t.ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }catch(e){ quando = ""; }
      html += '<tr><td>'+esc(quando)+'</td>' +
        '<td><b>'+esc(t.nomePersonagem||"?")+'</b>'+(t.nomeJogador?'<br><span class="hint">'+esc(t.nomeJogador)+'</span>':'')+'</td>' +
        '<td>'+esc(t.label||"")+'</td>' +
        '<td>'+diceChipsHtml(t.dados)+'</td>' +
        '<td class="num">'+testeResultadoHtml(t)+'</td></tr>';
    });
    html += '</tbody></table></div>';
    if(opts.showClear){
      html += '<div class="row" style="margin-top:10px"><button type="button" class="btn secondary" data-action="clear-rolagens">Limpar histórico de rolagens</button></div>';
    }
    html += '</div>';
    return html;
  }

  // Botão "limpar histórico de rolagens" (fica na aba Mesa, a página original
  // do histórico): some com o histórico compartilhado (mesa) ou local pra
  // sempre - é uma ação destrutiva de verdade, por isso pede confirmação e
  // (no modo mesa) exige permissão de edição. Em modo mesa publica NA HORA
  // (sem esperar o debounce padrão) e tenta de novo se perder uma corrida
  // contra a rolagem de outro jogador, em vez de só torcer pra dar certo.
  function limparHistoricoRolagens(){
    if(!podeEditar()) return;
    askConfirm("Apagar TODO o histórico de rolagens pra sempre? Isso não pode ser desfeito.", function(){
      if(caps.mode === "mesa"){
        publicarAgoraComRetry(function(sh){ sh.testLog = []; });
      } else {
        saveLS("pangea:testLog", []);
        render();
      }
    });
  }

  // Botão "limpar personagens" (fica na tela inicial/Personagens): NÃO apaga
  // nada de ninguém. Só esvazia, neste navegador, a lista de personagens já
  // destravados por senha (pangea:meus), voltando todos a ficarem escondidos
  // até a senha ser digitada de novo. É uma ação puramente local (não
  // publica nada), por isso não precisa de permissão de edição.
  function limparPersonagensDesbloqueados(){
    askConfirm('Isso vai esconder de novo os personagens que você já destravou com a senha neste navegador. Nada é apagado - é só digitar a senha de novo (nome do personagem + nome do jogador) pra ver de novo. Continuar?', function(){
      saveLS("pangea:meus", []);
      goto("roster");
    });
  }

  // Versão compacta de UMA linha do histórico, só pro painel flutuante (a
  // aba Mesa e o Painel do Assimilador continuam com a tabela cheia de
  // testLogHtml). Larga a tabela larga (que obrigava a rolar pro lado) e o
  // nome do jogador (só o nome do personagem aparece, pra economizar
  // espaço), e resume cada dado individual só ao que ele converteu em
  // Sucesso/Adaptação/Pressão (sem mostrar o tipo/valor do dado em si) -
  // dados descartados ficam apagados/riscados, os mantidos em destaque.
  // Por fim mostra a soma só dos dados mantidos, com os mesmos emblemas
  // coloridos usados no resto da ficha.
  function rollFeedEntryHtml(t){
    var quando = "";
    try{ quando = new Date(t.ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }catch(e){ quando = ""; }
    var diceHtml = (t.dados||[]).map(function(d){
      var lbl = diceResultLabel(d);
      return '<span class="rf-die'+(d.kept?" kept":"")+'">'+(lbl==="em branco"?"-":diceResultHtml(d))+'</span>';
    }).join('');
    return '<div class="rollfeed-entry">' +
      '<div class="rollfeed-entry-head"><b>'+esc(t.nomePersonagem||"?")+'</b><span class="hint">'+esc(quando)+'</span></div>' +
      '<div class="rollfeed-entry-label">'+esc(t.label||"")+'</div>' +
      (diceHtml ? '<div class="rollfeed-dice">'+diceHtml+'</div>' : '') +
      '<div class="rollfeed-total">'+testeResultadoHtml(t)+'</div>' +
    '</div>';
  }

  // Painel flutuante do Histórico de Rolagens: renderizado num <div> à parte
  // (fora do #app), pra continuar visível em cima de QUALQUER tela - Personagens,
  // criação de ficha, a própria ficha aberta, Mesa ou Painel do Assimilador -
  // sem que o jogador precise sair do que está fazendo pra ver as rolagens
  // de todo mundo. Chamado pelo render() principal e também na mão sempre
  // que um teste novo é registrado (ver registrarTeste), já que muitas telas
  // se re-renderizam sem passar pelo render() principal. É só um resumo pra
  // consulta rápida: os botões de limpar ficam nas telas originais (aba Mesa
  // e tela de Personagens), não aqui.
  function renderRollFeed(){
    var feed = document.getElementById("rollfeed");
    if(!feed) return;
    var log = testLogVisivelPara(testLog());
    var collapsed = state.rollFeedCollapsed;
    var listHtml = log.length
      ? log.map(rollFeedEntryHtml).join('')
      : '<p class="hint" style="margin:4px 0">Nenhum teste rolado ainda.</p>';
    var html = '<div class="rollfeed'+(collapsed?' collapsed':'')+'">' +
      '<button type="button" class="rollfeed-toggle" data-rollfeed="toggle">' +
        '<span>🎲 Histórico de Rolagens'+(log.length?' ('+log.length+')':'')+'</span><span>'+(collapsed?'▸':'▾')+'</span>' +
      '</button>' +
      '<div class="rollfeed-list">'+listHtml+'</div>' +
    '</div>';
    feed.innerHTML = html;
    bindRollFeed();
  }

  function bindRollFeed(){
    var feed = document.getElementById("rollfeed");
    if(!feed) return;
    var toggleBtn = feed.querySelector('[data-rollfeed="toggle"]');
    if(toggleBtn) toggleBtn.addEventListener("click", function(){
      state.rollFeedCollapsed = !state.rollFeedCollapsed;
      saveLS("pangea:rollfeed:collapsed", state.rollFeedCollapsed);
      renderRollFeed();
    });
  }

  // ----- ROLAGEM SECA (só o Assimilador vê, nunca entra no Histórico) -----
  // Pensada pra criaturas e NPCs, que não têm ficha/Instintos guardados:
  // o Assimilador escolhe quantos d6/d10/d12 entram na pilha e quantos ficam
  // mantidos, rola, e pode soltar/manter dados manualmente igual no testador
  // da ficha de um jogador - só que esse resultado nunca chama registrarTeste,
  // então nunca toca o testLog (nem o local, nem o compartilhado da mesa) e
  // nunca aparece pra mais ninguém, nem no painel flutuante. Fica só na
  // memória desta aba (state.gmDryRoll): some ao recarregar a página.
  function renderGmDryRoll(){
    if(!state.gmDryRoll) state.gmDryRoll = { label:"", d6:2, d10:0, d12:0, results:[], rolling:false, rollingCount:0 };
    var t = state.gmDryRoll;
    var totalDados = (t.d6||0)+(t.d10||0)+(t.d12||0);
    var body = '<div class="field" style="max-width:320px"><input type="text" data-gmdry="label" value="'+esc(t.label)+'" placeholder="ex: Lobo Mutante - Mordida" '+(t.rolling?"disabled":"")+'></div>';
    body += '<div class="grid cols-3">';
    body += stepperField("gmdry", "Dados d6", "", "d6", t.d6, 0, 12, t.rolling);
    body += stepperField("gmdry", "Dados d10", "", "d10", t.d10, 0, 12, t.rolling);
    body += stepperField("gmdry", "Dados d12", "", "d12", t.d12, 0, 12, t.rolling);
    body += '</div>';
    body += '<div class="btn-row" style="margin-top:0"><button class="btn accent" data-gmdryaction="roll" '+((totalDados<=0||t.rolling)?"disabled":"")+'>'+(t.rolling?"Rolando…":"Rolar")+'</button>' +
      (t.results.length ? '<button class="btn secondary" data-gmdryaction="clear">Limpar resultado</button>' : '<span></span>') +
    '</div>';
    if(t.rolling){
      var n = Math.max(1, t.rollingCount||1);
      var spins = "";
      for(var k=0;k<n;k++){ spins += '<span class="die-spin">?</span>'; }
      body += '<div class="dice-anim">'+spins+'</div>';
    } else if(t.results.length){
      var kept = t.results.filter(function(d){ return d.kept; });
      var totS = sum(kept.map(function(d){return d.s;}));
      var totA = sum(kept.map(function(d){return d.a;}));
      var totP = sum(kept.map(function(d){return d.p;}));
      body += '<div style="margin-top:14px">' +
        '<p class="hint">Todos os dados contam por padrão. Clique num dado pra soltá-lo (ou clicar de novo pra mantê-lo).</p>' +
        '<div class="row" style="flex-wrap:wrap;gap:8px">';
      t.results.forEach(function(d, idx){
        body += '<button type="button" class="btn secondary" data-gmdrytoggle="'+idx+'" style="font-family:\'IBM Plex Mono\',monospace'+(d.kept?'':';opacity:.4;text-decoration:line-through')+'">d'+d.sides+':'+d.face+' ('+diceResultHtml(d)+')</button>';
      });
      body += '</div>';
      body += '<div class="budget ok" style="margin-top:12px"><span>Resultado (não vai pro histórico)</span><span class="num">'+resultBadges(totS,totA,totP)+'</span></div>';
      body += '</div>';
    }
    return sectionCard("gmdryroll", "Rolagem Seca (Criaturas e NPCs)", body);
  }

  function bindGmDryRoll(){
    var t = state.gmDryRoll;
    if(!t) return;
    if(t.rolling){ iniciarTickerDados(); }
    var labelInput = app.querySelector('[data-gmdry="label"]');
    if(labelInput) labelInput.addEventListener("input", function(){ t.label = labelInput.value; });
    bindStepper("gmdry", function(id){ return t[id]; }, function(id,v){ t[id] = v; }, 0, 99, renderGm);
    app.querySelectorAll('[data-gmdry]').forEach(function(el){
      if(el.tagName === "INPUT" && el.type === "number"){
        el.addEventListener("input", function(){
          var id = el.getAttribute("data-gmdry");
          t[id] = clamp(parseInt(el.value,10)||0, 0, 99);
        });
      }
    });
    var rollBtn = app.querySelector('[data-gmdryaction="roll"]');
    if(rollBtn) rollBtn.addEventListener("click", function(){
      var total = (t.d6||0)+(t.d10||0)+(t.d12||0);
      if(total<=0) return;
      pararAnimacaoDados();
      t.rolling = true;
      t.rollingCount = total;
      t.results = [];
      renderGm();
      diceAnimTimeout = setTimeout(function(){
        diceAnimTimeout = null;
        pararAnimacaoDados();
        var results = [];
        var i;
        for(i=0;i<(t.d6||0);i++) results.push(rollDie(6));
        for(i=0;i<(t.d10||0);i++) results.push(rollDie(10));
        for(i=0;i<(t.d12||0);i++) results.push(rollDie(12));
        // Sem sugestão de "melhores dados" aqui: todos nascem mantidos, então o resultado
        // exibido já soma a pilha inteira (ver renderGmDryRoll); só o clique manual em
        // data-gmdrytoggle solta um dado específico.
        results.forEach(function(d){ d.kept = true; });
        t.results = results;
        t.rolling = false;
        renderGm();
      }, 650);
    });
    app.querySelectorAll('[data-gmdrytoggle]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var idx = parseInt(btn.getAttribute("data-gmdrytoggle"),10);
        t.results[idx].kept = !t.results[idx].kept;
        renderGm();
      });
    });
    var clearBtn = app.querySelector('[data-gmdryaction="clear"]');
    if(clearBtn) clearBtn.addEventListener("click", function(){
      t.results = [];
      renderGm();
    });
  }

  // ----- CONFLITOS (só o Assimilador vê) -----
  // Pedido do Marco, 27/09/2026: uma forma simples de montar um "conflito"
  // (uma cena de tensão prolongada, tipo uma perseguição ou um cerco, que se
  // resolve acumulando Sucessos ao longo de vários testes, e não num teste
  // só) só indicando quantos Sucessos ele exige pra ser resolvido e ir
  // contabilizando conforme os jogadores rolam. Fica salvo só neste
  // navegador (localStorage, "pangea:gm:conflitos"), igual o Registro do
  // Assimilador em modo local avulso - não é um dado de personagem nem
  // precisa ser sincronizado com a mesa, é só uma anotação de mesa do
  // próprio Assimilador. Nada complexo de propósito: não guarda quem
  // contribuiu com qual Sucesso, nem categoriza o tipo de conflito - é só um
  // nome opcional, uma meta de Sucessos e uma contagem que sobe/desce.
  function renderGmConflitos(){
    var conflitos = loadLS("pangea:gm:conflitos", []);
    var body = '<p class="hint">Monte um conflito (perseguição, cerco, negociação prolongada...) indicando quantos Sucessos ele exige pra ser resolvido, e vá somando o placar conforme os testes acontecem na mesa.</p>';
    body += '<div class="row" style="gap:8px;flex-wrap:wrap;align-items:flex-end">' +
      '<div class="field" style="max-width:220px;margin:0"><label>Nome do conflito (opcional)</label><input type="text" id="conflito-nome" placeholder="ex: Fuga do posto avançado"></div>' +
      '<div class="field" style="max-width:150px;margin:0"><label>Sucessos p/ resolver</label><input type="number" id="conflito-alvo" min="1" max="99" value="5"></div>' +
      '<button type="button" class="btn accent" data-action="conflito-add">Criar conflito</button>' +
    '</div>';
    if(!conflitos.length){
      body += '<p class="hint" style="margin-top:10px">Nenhum conflito em andamento.</p>';
    } else {
      body += '<div class="trait-list" style="margin-top:10px">';
      conflitos.forEach(function(cf){
        var resolvido = cf.atual >= cf.alvo;
        body += '<div class="trait'+(resolvido?" checked":"")+'" style="cursor:default;align-items:center">' +
          '<span class="txt"><b>'+esc(cf.nome||"Conflito")+'</b><span>'+cf.atual+' / '+cf.alvo+' Sucessos'+(resolvido?' — resolvido!':'')+'</span></span>' +
          '<div class="row" style="gap:4px;flex-wrap:nowrap;flex:none">' +
            '<button type="button" class="btn secondary" data-conflito="menos" data-id="'+cf.id+'" style="padding:2px 8px" '+(cf.atual<=0?"disabled":"")+'>&minus;</button>' +
            '<button type="button" class="btn secondary" data-conflito="mais" data-id="'+cf.id+'" style="padding:2px 8px" '+(cf.atual>=cf.alvo?"disabled":"")+'>+</button>' +
            '<button type="button" class="btn secondary" data-conflito="remover" data-id="'+cf.id+'" style="padding:2px 8px">remover</button>' +
          '</div>' +
        '</div>';
      });
      body += '</div>';
    }
    return sectionCard("gmconflitos", "Conflitos", body);
  }

  function bindGmConflitos(){
    var addBtn = app.querySelector('[data-action="conflito-add"]');
    if(addBtn) addBtn.addEventListener("click", function(){
      var nomeEl = app.querySelector('#conflito-nome');
      var alvoEl = app.querySelector('#conflito-alvo');
      var alvo = clamp(parseInt(alvoEl.value,10)||1, 1, 99);
      var conflitos = loadLS("pangea:gm:conflitos", []);
      conflitos.push({ id: uid(), nome: (nomeEl.value||"").trim(), alvo: alvo, atual: 0 });
      saveLS("pangea:gm:conflitos", conflitos);
      renderGm();
    });
    app.querySelectorAll('[data-conflito]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var acao = btn.getAttribute("data-conflito");
        var id = btn.getAttribute("data-id");
        var conflitos = loadLS("pangea:gm:conflitos", []);
        if(acao === "remover"){
          conflitos = conflitos.filter(function(c){ return c.id!==id; });
        } else {
          var cf = conflitos.filter(function(c){ return c.id===id; })[0];
          if(cf){
            if(acao === "mais") cf.atual = clamp(cf.atual+1, 0, cf.alvo);
            if(acao === "menos") cf.atual = clamp(cf.atual-1, 0, cf.alvo);
          }
        }
        saveLS("pangea:gm:conflitos", conflitos);
        renderGm();
      });
    });
  }

  // Corpo do card de personagem no Painel do Assimilador: usado tanto no modo
  // local (renderGm) quanto no modo mesa (renderGmMesa) - só o wrapper externo
  // (cabeçalho com nome/botão) muda entre os dois. Determinação/Assimilação
  // usam a mesma leitura em Nível do Cabo de Guerra que a própria ficha do
  // jogador mostra (não é mais uma "Assimilação oculta" à parte); Instintos,
  // Conhecimentos & Práticas e Características ganham layouts próprios (ver
  // attrGridHtml/attrCaracChipsHtml) no lugar de uma linha corrida de texto.
  function gmCharCardBody(c){
    var nivelDetGm = c.determinacao ? nivelDetAtual(c) : 10;
    var nivelAssimGm = c.determinacao ? nivelAssimAtual(c) : 0;
    var ptsDetGm = c.determinacao ? clamp(c.determinacao.pontosAtual!=null?c.determinacao.pontosAtual:10, 0, nivelDetGm) : nivelDetGm;
    var ptsAssimGm = c.determinacao ? assimPontosAtuais(c) : 0;
    var assimClass = nivelAssimGm >= 6 ? " warn" : "";
    var attr = c.atributoSaude || "potencia";
    var pontosPorNivel = c.instintos ? valorInstinto(c,attr) + 2 : 0;
    var pressaoGm = pressaoTotal(c);
    var perdidoGm = perdidoParaAssimilacao(c);
    var pendentesGm = c.testesAssimPendentes||0;
    var html = '<div class="gm-hud">' +
      '<div class="stat'+assimClass+'" style="flex:1 1 100%">' +
        '<div class="label">Determinação / Assimilação</div>' +
        '<div style="margin-top:4px">'+tugLacosHtml(nivelDetGm, false)+'</div>' +
        '<div class="hint" style="margin:4px 0 0">Determinação '+icoHtml("nd")+' '+nivelDetGm+' '+icoHtml("pd")+' '+ptsDetGm+'/'+nivelDetGm+' · Assimilação '+icoHtml("na")+' '+nivelAssimGm+' '+icoHtml("pa")+' '+ptsAssimGm+'/'+nivelAssimGm+'</div>' +
      '</div>' +
      '<div class="stat"><div class="label">Saúde</div><div class="val">Nível '+(c.saudeNivel!=null?c.saudeNivel:"?")+'</div><div class="dots mini">'+diamonds(c.saudeNivel||0,5,"","c-saude","ns")+'</div></div>' +
      '<div class="stat"><div class="label">Pts/nível · total</div><div class="val">'+pontosPorNivel+' · '+(pontosPorNivel*5)+'</div></div>' +
      '<div class="stat'+(pressaoGm>=7?" warn":"")+'"><div class="label">Pressão (Inoportunas)</div><div class="val">'+pressaoGm+' / 10</div>'+(perdidoGm?'<div class="hint" style="color:var(--danger)">perdido(a) p/ Assimilação</div>':(pendentesGm?'<div class="hint">'+pendentesGm+' Teste(s) de Assimilação pendente(s)</div>':''))+'</div>' +
    '</div>';
    if((c.mutAdquiridas||[]).length){
      html += '<p class="hint" style="margin-top:10px;margin-bottom:2px">Mutações de Assimilação ('+c.mutAdquiridas.length+')</p><div class="gm-carac-list">' +
        c.mutAdquiridas.map(function(m){
          var card = MUT_DECKS[m.cat][m.cardIdx], tier = card[2][m.tierIdx];
          return '<span class="gm-carac-chip" title="'+formatEfeito(tier[2], false)+'"><b>'+esc(card[0]+" — "+tier[1])+'</b><span class="cost">'+MUT_SIGLA[m.cat]+' '+custoSimbolosTexto(m.custo)+'</span></span>';
        }).join('') +
      '</div>';
    }
    if(c.instintos){
      html += '<p class="hint" style="margin-top:12px;margin-bottom:2px">Instintos</p>' +
        attrGridHtml(INSTINTOS.map(function(i){ return [i[1], valorInstinto(c,i[0])]; }));
    }
    if(c.conhPrat){
      html += '<p class="hint" style="margin-top:10px;margin-bottom:2px">Conhecimentos &amp; Práticas</p>' +
        attrGridHtml(CONH_PRAT.map(function(p){ return [p[1], valorCP(c,p[0])]; }));
    }
    html += '<p class="hint" style="margin-top:12px;margin-bottom:2px">Características</p>' +
      attrCaracChipsHtml(c.caracComp);
    return html;
  }

  function renderGm(){
    if(caps.mode === "mesa"){ return renderGmMesa(); }
    var roster = loadLS("pangea:gm:roster", []).map(migrateChar);
    var html = topbar("gm");
    html += renderGmDryRoll();
    html += renderGmConflitos();
    html += '<div class="card"><h2>Importar ficha</h2>' +
      '<textarea class="code-box" id="gm-import" placeholder="cole aqui o código recebido"></textarea>' +
      '<div class="row" style="margin-top:8px"><button class="btn accent" data-gm="import">Importar / atualizar</button></div>' +
    '</div>';

    html += '<h2 style="margin:20px 0 10px">Registro do Assimilador</h2>';
    if(!roster.length){
      html += '<div class="card"><p class="hint">Nada importado ainda.</p></div>';
    } else {
      roster.forEach(function(c, idx){
        var camp = c.acampamento ? CAMPS[c.acampamento] : null;
        var cardStyle = (camp?'--camp-color:'+camp.cor+';':'')+'border-left:6px solid '+(camp?camp.cor:'var(--accent)')+';margin-bottom:12px';
        html += '<div class="card" style="'+cardStyle+'">';
        html += '<div class="row" style="justify-content:space-between;align-items:flex-start">' +
          '<div><h3 style="color:'+(camp?camp.cor:'var(--ink)')+';font-size:17px;margin-bottom:2px">'+esc(c.nomePersonagem||"Sem nome")+npcBadgeHtml(c)+'</h3>' +
          '<span class="camp-tag">jogador(a): '+esc(c.nomeJogador||"não informado")+' · '+(camp?camp.nome:"acampamento não definido")+'</span></div>' +
          '<button class="btn secondary" data-gmdel="'+idx+'" style="padding:4px 10px;font-size:11px">remover</button>' +
        '</div>';
        html += gmCharCardBody(c);
        html += '</div>';
      });
    }
    html += '<div class="btn-row"><button class="btn secondary" data-nav="roster">Voltar</button></div>';

    app.innerHTML = html;
    bindGlobal();
    bindGmDryRoll();
    bindGmConflitos();
    app.querySelector('[data-gm="import"]').addEventListener("click", function(){
      var code = app.querySelector('#gm-import').value;
      var data = importCode(code);
      if(!data || !data.id){ alert("Código inválido. Confira se copiou tudo certinho."); return; }
      var list = loadLS("pangea:gm:roster", []).map(migrateChar);
      var idx = list.findIndex(function(x){return x.id===data.id;});
      if(idx>-1) list[idx] = data; else list.push(data);
      saveLS("pangea:gm:roster", list);
      renderGm();
    });
    app.querySelectorAll('[data-gmdel]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var list = loadLS("pangea:gm:roster", []).map(migrateChar);
        list.splice(parseInt(btn.getAttribute("data-gmdel"),10),1);
        saveLS("pangea:gm:roster", list);
        renderGm();
      });
    });
  }

  // Painel do Assimilador no modo mesa: lê a lista compartilhada de verdade (ao
  // vivo, sem precisar de código de importação). O Histórico de Rolagens não
  // aparece mais aqui (já tem seu lugar de sempre na aba Mesa e no painel
  // flutuante) - o Painel do Assimilador foca só nas fichas dos personagens.
  function renderGmMesa(){
    var roster = loadChars();
    var html = topbar("gm");
    html += renderGmDryRoll();
    html += renderGmConflitos();
    html += '<h2 style="margin:20px 0 10px">Personagens da Mesa</h2>';
    if(!roster.length){
      html += '<div class="card"><p class="hint">Nenhum personagem criado ainda nesta mesa.</p></div>';
    } else {
      roster.forEach(function(c){
        var camp = c.acampamento ? CAMPS[c.acampamento] : null;
        var cardStyle = (camp?'--camp-color:'+camp.cor+';':'')+'border-left:6px solid '+(camp?camp.cor:'var(--accent)')+';margin-bottom:12px;cursor:pointer';
        html += '<div class="card" style="'+cardStyle+'" data-gmopen="'+c.id+'">';
        html += '<div class="row" style="justify-content:space-between;align-items:flex-start">' +
          '<div><h3 style="color:'+(camp?camp.cor:'var(--ink)')+';font-size:17px;margin-bottom:2px">'+esc(c.nomePersonagem||"Sem nome")+npcBadgeHtml(c)+'</h3>' +
          '<span class="camp-tag">jogador(a): '+esc(c.nomeJogador||"não informado")+' · '+(camp?camp.nome:"acampamento não definido")+'</span></div>' +
          (caps.canEdit ? '<button class="btn secondary" data-gmdelmesa="'+c.id+'" style="padding:4px 10px;font-size:11px">excluir</button>' : '') +
        '</div>';
        html += gmCharCardBody(c);
        html += '</div>';
      });
    }
    html += '<div class="btn-row"><button class="btn secondary" data-nav="roster">Voltar</button></div>';

    app.innerHTML = html;
    bindGlobal();
    bindGmDryRoll();
    bindGmConflitos();
    app.querySelectorAll('[data-gmopen]').forEach(function(el){
      el.addEventListener("click", function(e){
        if(e.target.closest('[data-gmdelmesa]')) return;
        goto("sheet", {charId: el.getAttribute("data-gmopen")});
      });
    });
    app.querySelectorAll('[data-gmdelmesa]').forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        if(!podeEditar()) return;
        var id = btn.getAttribute("data-gmdelmesa");
        var c = getChar(id);
        askConfirm('Excluir "'+(c?c.nomePersonagem:"este personagem")+'" da mesa pra sempre?', function(){
          deleteChar(id);
          renderGmMesa();
        });
      });
    });
  }

  // ---------- GLOBAL NAV BINDING ----------
  function bindGlobal(){
    app.querySelectorAll("[data-nav]").forEach(function(el){
      el.addEventListener("click", function(){
        var target = el.getAttribute("data-nav");
        if(target === "wizard-new"){ goto("wizard", {wizStep:0, draft:newCharacter()}); return; }
        goto(target);
      });
    });
    var refreshBtn = app.querySelector('[data-action="refresh-mesa"]');
    if(refreshBtn) refreshBtn.addEventListener("click", function(){ stashViewForReload(); location.reload(); });
    var previewBtn = app.querySelector('[data-action="toggle-gm-preview"]');
    if(previewBtn) previewBtn.addEventListener("click", function(){
      state.gmPreviewJogador = !state.gmPreviewJogador;
      saveLS("pangea:gm:previewJogador", state.gmPreviewJogador);
      // Sai pra tela de Personagens ao alternar: evita ficar preso numa tela
      // (ex.: Painel do Assimilador) que deixou de fazer sentido pro modo novo.
      goto("roster");
    });
    app.querySelectorAll('[data-collapse-toggle]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-collapse-toggle");
        state.collapsed[id] = !state.collapsed[id];
        saveLS("pangea:collapsed", state.collapsed);
        render();
      });
    });
  }

  // ---------- INICIALIZAÇÃO ----------
  // Descobre se esta página está publicada como artifact com sincronização ao vivo
  // (modo mesa) ou rodando avulsa (modo local, como sempre funcionou). Nunca trava
  // a tela esperando a plataforma responder: depois de um tempo, segue do jeito
  // que já sabe (e se a resposta chegar depois, só re-renderiza com o que mudou).
  function boot(){
    var resumed = popStashedView();
    if(resumed && resumed.view){
      state.view = resumed.view; state.charId = resumed.charId;
      if(resumed.sheetTest && resumed.sheetTest.charId === resumed.charId){
        state.sheetTest = resumed.sheetTest;
        // Uma publicação de qualquer jogador recarrega a página inteira, mesmo no meio
        // da animação de "rolando"; sem isso, o campo "rolling" restaurado do
        // sessionStorage ficaria travado em true pra sempre. Como o JS reiniciou do
        // zero, nunca há rolagem de verdade em andamento após um reload, então é
        // sempre seguro voltar rolling pra false aqui.
        if(state.sheetTest.rolling){ state.sheetTest.rolling = false; state.sheetTest.rollingCount = 0; }
      }
      if(resumed.view === "sheet" && resumed.sheetEditing && resumed.sheetDraft && resumed.sheetDraft.id === resumed.charId){
        state.sheetEditing = true; state.sheetDraft = resumed.sheetDraft;
      }
      if(resumed.view === "wizard"){
        if(resumed.draft){ state.draft = resumed.draft; state.wizStep = resumed.wizStep || 0; }
        else { state.view = "roster"; } // sem rascunho salvo pra retomar, evita tela quebrada
      }
    } else if(caps.mode === "mesa" && !temAcessoTotal()){
      var meus = meusIds();
      var mine = loadChars().filter(function(c){ return meus.indexOf(c.id) > -1; });
      if(mine.length === 1){ state.view = "sheet"; state.charId = mine[0].id; }
    }
    render();
  }

  function initCapabilities(){
    var iniciou = false;
    function comFB(fb){
      if(iniciou) return;
      iniciou = true;
      fb.pronto.then(function(){
        FB = fb;
        caps.artifact = fb;
        caps.mode = "mesa";
        caps.canEdit = true;
        caps.isOwner = false;
        var chegou = { p:false, r:false };
        var primeiraVezP = true;
        function talvezRevelar(){
          if(appPronto || !chegou.p || !chegou.r) return;
          appPronto = true;
          boot();
        }
        fb.ouvir("personagens", function(lista){
          if(primeiraVezP){ primeiraVezP = false; if(!lista.length) semearSeVazio(); }
          aplicarSnapshotPersonagens(lista);
          chegou.p = true; talvezRevelar(); agendarRender();
        }, mostrarErroConexao);
        fb.ouvirRolagens(60, function(lista){
          aplicarSnapshotRolagens(lista);
          chegou.r = true; talvezRevelar(); agendarRender();
        }, mostrarErroConexao);
      }).catch(mostrarErroConexao);
    }
    if(window.PANGEA_FB){ comFB(window.PANGEA_FB); return; }
    if(window.PANGEA_FB_ERRO){ mostrarErroConexao(window.PANGEA_FB_ERRO); return; }
    app.innerHTML = '<p class="empty">Conectando à mesa…</p>';
    window.addEventListener("pangea-fb-ready", function(){ comFB(window.PANGEA_FB); });
    window.addEventListener("pangea-fb-erro", function(){ mostrarErroConexao(window.PANGEA_FB_ERRO); });
    setTimeout(function(){ if(!iniciou) mostrarErroConexao(null); }, 20000);
  }

  setupEasterEgg();
  setupSheetPasswordListener();
  initCapabilities();
})();
</script>
<script type="module">
// Ponte com o Firebase (site ficha-pangea.web.app). A ficha em si (script acima)
// só enxerga window.PANGEA_FB e nunca importa nada do Firebase diretamente.
const V = "10.12.2";
try {
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const { getAuth, signInAnonymously, onAuthStateChanged } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const { getFirestore, collection, doc, onSnapshot, writeBatch, getDocs, getDoc, query, orderBy, limit } =
    await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);

  const firebaseConfig = {
    apiKey: "AIzaSyB4RpPYOuPe87Pw98aBNjjYPAMZtz3V0gI",
    authDomain: "ficha-pangea.firebaseapp.com",
    projectId: "ficha-pangea",
    storageBucket: "ficha-pangea.firebasestorage.app",
    messagingSenderId: "476574641686",
    appId: "1:476574641686:web:f078f9859ebe49af89cf37"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Login anônimo: o jogador não vê nada disso, mas só quem abre a ficha
  // consegue ler/gravar no banco (ver regras do Firestore).
  const pronto = new Promise((resolve, reject) => {
    const parar = onAuthStateChanged(auth, (u) => { if (u) { parar(); resolve(u); } });
    signInAnonymously(auth).catch((e) => { parar(); reject(e); });
  });

  const lista = (snap) => snap.docs.map((d) => d.data());

  window.PANGEA_FB = {
    pronto,
    ouvir(col, cb, erro) {
      return onSnapshot(collection(db, col), (snap) => cb(lista(snap)), erro);
    },
    ouvirRolagens(n, cb, erro) {
      const q = query(collection(db, "rolagens"), orderBy("ts", "desc"), limit(n));
      return onSnapshot(q, (snap) => cb(lista(snap)), erro);
    },
    async lerDoc(col, id) {
      const s = await getDoc(doc(db, col, id));
      return s.exists() ? s.data() : null;
    },
    // ops: [{tipo:"set"|"del", col, id, data}] — gravadas em lotes de até 400.
    async escrever(ops) {
      for (let i = 0; i < ops.length; i += 400) {
        const b = writeBatch(db);
        ops.slice(i, i + 400).forEach((o) => {
          const ref = doc(db, o.col, o.id);
          if (o.tipo === "del") b.delete(ref); else b.set(ref, o.data);
        });
        await b.commit();
      }
    },
    async limparColecao(col) {
      const snap = await getDocs(collection(db, col));
      await this.escrever(snap.docs.map((d) => ({ tipo: "del", col, id: d.id })));
    }
  };
  window.dispatchEvent(new Event("pangea-fb-ready"));
} catch (e) {
  console.error("[Pangea] Firebase não carregou", e);
  window.PANGEA_FB_ERRO = e;
  window.dispatchEvent(new Event("pangea-fb-erro"));
}
</script>
