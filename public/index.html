<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Fichas de Pangea</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
  :root{
    --bg:#efe7d3;
    --surface:#f8f3e6;
    --surface-2:#e6dbba;
    --ink:#2a2318;
    --ink-muted:#6d6250;
    --border:#c3b28a;
    --border-strong:#8f7f5c;
    --accent:#b5502c;
    --accent-ink:#fff8ee;
    --danger:#a23a3a;
    --good:#4c7a4c;
    --blood:#8f1d1d;
    --royal:#2547c9;
    --assim:#74841c;
    --suscet:#0891a8;
    --suscet-rgb:8,145,168;
    --c-reverie:#6a5b9e;
    --c-traum:#b5502c;
    --c-mriya:#6f8c3e;
    --c-yugen:#1f8a8d;
    --shadow: 3px 3px 0 rgba(42,35,24,0.18);
    --radius: 3px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161209;
      --surface:#211b12;
      --surface-2:#2c2416;
      --ink:#efe4cc;
      --ink-muted:#ab9c7e;
      --border:#4d4128;
      --border-strong:#6e5d38;
      --accent:#d97a4a;
      --accent-ink:#241505;
      --danger:#e08a8a;
      --good:#8fc48f;
      --blood:#e2564f;
      --royal:#7d93ff;
      --assim:#c3d873;
      --suscet:#4de8f5;
      --suscet-rgb:77,232,245;
      --c-reverie:#9c8bd6;
      --c-traum:#d97a4a;
      --c-mriya:#9cc46a;
      --c-yugen:#4fc3c6;
      --shadow: 3px 3px 0 rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161209;
    --surface:#211b12;
    --surface-2:#2c2416;
    --ink:#efe4cc;
    --ink-muted:#ab9c7e;
    --border:#4d4128;
    --border-strong:#6e5d38;
    --accent:#d97a4a;
    --accent-ink:#241505;
    --danger:#e08a8a;
    --good:#8fc48f;
    --blood:#e2564f;
    --royal:#7d93ff;
    --assim:#c3d873;
    --suscet:#4de8f5;
    --suscet-rgb:77,232,245;
    --c-reverie:#9c8bd6;
    --c-traum:#d97a4a;
    --c-mriya:#9cc46a;
    --c-yugen:#4fc3c6;
    --shadow: 3px 3px 0 rgba(0,0,0,0.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:15px;
    line-height:1.55;
  }
  .wrap{ max-width:920px; margin:0 auto; padding-inline:16px; padding-block:20px 60px; }
  h1,h2,h3{ font-family:"Oswald", "Arial Narrow", sans-serif; text-transform:uppercase; letter-spacing:.03em; text-wrap:balance; margin:0; }
  h1{ font-size:26px; font-weight:700; }
  h2{ font-size:19px; font-weight:600; margin-bottom:10px;}
  h3{ font-size:14px; font-weight:600; color:var(--ink-muted); letter-spacing:.08em; }
  a{ color:var(--accent); }
  p{ margin:0 0 10px; max-width:65ch; }
  button, input, select, textarea{ font-family:inherit; font-size:14px; color:var(--ink); }
  button{ cursor:pointer; }
  ::selection{ background:var(--accent); color:var(--accent-ink); }

  .stamp{
    display:inline-block;
    background:var(--ink);
    color:var(--bg);
    padding:6px 14px;
    transform:rotate(-1deg);
    box-shadow:var(--shadow);
    font-family:"Oswald",sans-serif;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
  }
  :root[data-theme="dark"] .stamp, @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .stamp{ background:var(--accent); color:var(--accent-ink);} }

  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding-block:6px 18px; flex-wrap:wrap;
    border-bottom:2px solid var(--border-strong);
    margin-bottom:22px;
  }
  .gm-corner-btn{
    position:fixed; top:10px; right:10px; z-index:50;
    width:18px; height:18px; border-radius:50%; padding:0;
    border:1px solid var(--border); background:var(--surface);
    color:var(--ink-muted); font-size:10px; line-height:1;
    cursor:default; opacity:.35; transition:opacity .15s, transform .15s;
  }
  .gm-corner-btn.unlocked{
    cursor:pointer; opacity:1; width:22px; height:22px; font-size:12px;
    border:2px solid var(--accent); color:var(--accent); background:var(--surface-2);
    box-shadow:0 0 0 3px rgba(0,0,0,.04);
  }
  .gm-corner-btn.unlocked:hover{ transform:scale(1.15); }
  header.top .brand{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  header.top .brand small{ color:var(--ink-muted); font-size:12px; letter-spacing:.06em; }
  nav.tabs{ display:flex; gap:8px; flex-wrap:wrap; }
  nav.tabs button{
    background:var(--surface); border:2px solid var(--border-strong); border-radius:var(--radius);
    padding:8px 14px; font-family:"Oswald",sans-serif; font-weight:600; text-transform:uppercase;
    letter-spacing:.04em; font-size:12.5px; color:var(--ink);
  }
  nav.tabs button[aria-current="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow); margin-bottom:16px;
  }
  .card.tight{ padding:12px 14px; }
  .card-headrow{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .card-headrow h2{ margin-bottom:0; }
  .card-toggle{
    flex:none; width:28px; height:28px; padding:0; display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); border:1px solid var(--border-strong); border-radius:var(--radius);
    color:var(--ink); font-size:13px; cursor:pointer;
  }
  .card-toggle:hover{ border-color:var(--accent); color:var(--accent); }
  .grid{ display:grid; gap:14px; }
  .grid.cols-2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .grid.cols-3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  .grid.cols-4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
  @media (max-width:640px){ .grid.cols-2,.grid.cols-3,.grid.cols-4{ grid-template-columns:1fr; } }

  .roster-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .char-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; box-shadow:var(--shadow); cursor:pointer; position:relative; overflow:hidden;
    border-left:6px solid var(--camp-color, var(--accent));
  }
  .char-card:hover{ border-color:var(--border-strong); }
  .char-card h3{ color:var(--camp-color, var(--ink)); font-size:16px; margin-bottom:2px; }
  .char-card .camp-tag{ font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.06em; }
  .char-card .stat-row{ display:flex; gap:14px; margin-top:10px; font-size:12px; color:var(--ink-muted); }
  .char-card img.badge{ position:absolute; right:8px; top:8px; width:60px; height:60px; opacity:.85; }

  label{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); margin-bottom:4px; }
  input[type="text"], input[type="number"], select, textarea{
    width:100%; background:var(--bg); border:1px solid var(--border-strong); border-radius:var(--radius);
    padding:8px 10px; color:var(--ink);
  }
  textarea{ min-height:56px; resize:vertical; }
  input[type="number"]{ font-variant-numeric:tabular-nums; }
  .field{ margin-bottom:12px; }
  .hint{ font-size:12px; color:var(--ink-muted); margin-top:3px; }
  .hint.attr-desc{ min-height:2.6em; line-height:1.3; }

  .btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--ink); color:var(--bg);
    border:none; border-radius:var(--radius); padding:10px 16px; font-family:"Oswald",sans-serif;
    font-weight:600; text-transform:uppercase; letter-spacing:.04em; font-size:13px;
  }
  .btn.secondary{ background:transparent; color:var(--ink); border:2px solid var(--border-strong); }
  .btn.accent{ background:var(--camp-color, var(--accent)); color:var(--accent-ink); }
  .btn.danger{ background:var(--danger); color:#fff; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-row{ display:flex; gap:10px; justify-content:space-between; margin-top:18px; flex-wrap:wrap; }

  .stepper{ display:flex; align-items:stretch; gap:6px; }
  .stepper input{ text-align:center; }
  .stepper-btn{
    width:34px; flex:none; background:var(--surface-2); border:1px solid var(--border-strong); border-radius:var(--radius);
    font-family:"Oswald",sans-serif; font-weight:700; font-size:16px; line-height:1; color:var(--ink);
  }
  .stepper-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .budget{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface-2); border:1px solid var(--border-strong); border-radius:var(--radius);
    padding:10px 14px; margin-bottom:16px; font-family:"Oswald",sans-serif; font-weight:600;
    letter-spacing:.03em; flex-wrap:wrap;
  }
  .budget .num{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  .budget.ok{ border-color:var(--good); }
  .budget.bad{ border-color:var(--danger); color:var(--danger); }

  .steps{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .steps span{
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--camp-color, var(--border-strong)); font-size:12px; font-weight:600; color:var(--ink-muted); cursor:pointer;
  }
  .steps span.done{ background:var(--camp-color, var(--good)); border-color:var(--camp-color, var(--good)); color:var(--bg); }
  .steps span.current{ background:var(--camp-color, var(--ink)); border-color:var(--camp-color, var(--ink)); color:var(--bg); box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--camp-color, var(--ink)); }

  .camp-pick{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (max-width:640px){ .camp-pick{ grid-template-columns:1fr; } }
  .camp-opt{
    text-align:left; background:var(--surface); border:2px solid var(--border); border-radius:var(--radius);
    padding:14px; display:flex; gap:12px; align-items:flex-start; box-shadow:var(--shadow);
  }
  .camp-opt img{ width:46px; height:46px; flex:none; }
  .camp-opt.selected{ border-color:var(--camp-color); background:var(--surface-2); }
  .camp-opt h3{ color:var(--camp-color); font-size:16px; margin-bottom:4px; }
  .camp-opt p{ font-size:12.5px; color:var(--ink-muted); margin-bottom:4px; }

  .kit-pick{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px; }
  @media (max-width:640px){ .kit-pick{ grid-template-columns:1fr; } }
  .kit-opt{ text-align:left; background:var(--surface); border:2px solid var(--border); border-radius:var(--radius); padding:10px 12px; }
  .kit-opt.selected{ border-color:var(--accent); background:var(--surface-2); }
  .kit-opt h4{ font-family:"Oswald",sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; color:var(--ink); }
  .kit-opt p{ font-size:12px; color:var(--ink-muted); margin:0; }

  .trait-list{ display:flex; flex-direction:column; gap:8px; }
  .trait{
    display:flex; gap:10px; align-items:flex-start; border:1px solid var(--border); border-radius:var(--radius);
    padding:10px 12px; background:var(--bg);
  }
  .trait.checked{ border-color:var(--accent); background:var(--surface-2); }
  .trait input{ margin-top:3px; width:auto; }
  .trait .cost{ font-family:"Oswald",sans-serif; font-weight:700; color:var(--accent); min-width:34px; text-align:center; }
  .trait .txt b{ display:block; }
  .trait .txt span{ font-size:12.5px; color:var(--ink-muted); }
  .trait select{ margin-top:6px; }

  .dots{ display:flex; gap:5px; flex-wrap:wrap; }
  .dot{
    width:20px; height:20px; border-radius:50%; border:2px solid var(--border-strong); background:var(--bg);
  }
  .dot.filled{ background:var(--accent); border-color:var(--accent); }
  .dot.level{ width:26px;height:26px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ border:1px solid var(--border); padding:6px 8px; text-align:left; }
  th{ background:var(--surface-2); font-family:"Oswald",sans-serif; text-transform:uppercase; font-size:11.5px; letter-spacing:.04em; }
  .table-wrap{ overflow-x:auto; }
  td.num, th.num{ font-variant-numeric:tabular-nums; }

  .gm-hud{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .gm-hud .stat{ flex:1; min-width:130px; background:var(--surface-2); border-radius:var(--radius); padding:8px 10px; border:1px solid var(--border); }
  .gm-hud .stat .label{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); margin-bottom:5px; }
  .gm-hud .stat .val{ font-family:"Oswald",sans-serif; font-weight:700; font-size:19px; color:var(--ink); }
  .gm-hud .stat.warn .val{ color:var(--danger); }
  .dots.mini{ gap:3px; margin-top:4px; }
  .dots.mini .dot{ width:9px; height:9px; border-width:1px; }
  .diamond{ font-size:19px; line-height:1; color:var(--border-strong); opacity:.4; cursor:pointer; user-select:none; }
  .diamond.filled{ color:var(--accent); opacity:1; }
  .dots.mini .diamond{ font-size:11px; }
  .diamond.dsize-lg{ font-size:34px; }
  .diamond.dsize-sm{ font-size:15px; }
  .diamond.c-saude.filled{ color:var(--blood); }
  .diamond.c-det.filled{ color:var(--royal); }

  @keyframes dieSpin{
    0%{ transform:rotate(0deg) scale(1); }
    50%{ transform:rotate(180deg) scale(0.85); }
    100%{ transform:rotate(360deg) scale(1); }
  }
  .dice-anim{ display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
  .dice-anim .die-spin{
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); border:2px solid var(--accent); border-radius:6px;
    font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:15px; color:var(--accent);
    animation: dieSpin 0.5s linear infinite;
  }
  .die-chip{
    display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:11px;
    padding:2px 6px; border:1px solid var(--border-strong); border-radius:4px;
    margin:1px 2px 1px 0; opacity:.45; text-decoration:line-through; white-space:nowrap;
  }
  .die-chip.kept{ opacity:1; text-decoration:none; border-color:var(--accent); background:var(--surface-2); font-weight:700; }
  .die-chip-res{ opacity:.85; margin-left:2px; }
  .result-badges{ display:inline-flex; gap:8px; flex-wrap:nowrap; }
  .rbadge{
    display:inline-flex; align-items:center; gap:4px; font-weight:700;
    padding:3px 9px; border-radius:99px; border:1.5px solid var(--border-strong);
    font-family:"IBM Plex Mono",monospace; font-size:13px; background:var(--surface);
  }
  .rbadge.rb-s{ color:var(--good); border-color:var(--good); }
  .rbadge.rb-a{ color:var(--accent); border-color:var(--accent); }
  .rbadge.rb-p{ color:var(--danger); border-color:var(--danger); }
  .gm-compact-line{ font-size:12.5px; line-height:1.7; color:var(--ink); }
  .gm-compact-line b{ font-variant-numeric:tabular-nums; }
  .badge-pill{ display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .badge-pill.good{ background:rgba(76,122,76,.18); color:var(--good); }
  .badge-pill.warn{ background:rgba(162,58,58,.18); color:var(--danger); }

  .footer-note{ margin-top:36px; padding-top:14px; border-top:1px solid var(--border); font-size:12px; color:var(--ink-muted); display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .gm-link{ font-size:11.5px; color:var(--ink-muted); text-decoration:underline; background:none; border:none; padding:0; }

  .empty{ text-align:center; padding:40px 20px; color:var(--ink-muted); }
  .code-box{ width:100%; min-height:90px; font-family:"IBM Plex Mono",monospace; font-size:12px; }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .spacer{ flex:1; }
  [hidden]{ display:none!important; }

  /* Ficha "aparecendo" depois da senha certa ser digitada em qualquer lugar
     da página (ver setupSheetPasswordListener): um brilho rápido seguido de
     um leve zoom + fade, pra dar a sensação de presente/recompensa em vez de
     uma troca de tela comum. Toca uma vez só, na hora que a ficha surge. */
  @keyframes sheetRevealPop{
    0%{ opacity:0; transform:scale(.94) translateY(14px); filter:brightness(1); }
    55%{ opacity:1; transform:scale(1.01) translateY(0); filter:brightness(1.25); }
    100%{ opacity:1; transform:scale(1) translateY(0); filter:brightness(1); }
  }
  @keyframes sheetRevealGlow{
    0%{ box-shadow:0 0 0 0 var(--camp-color, var(--accent)), var(--shadow); opacity:.5; }
    35%{ box-shadow:0 0 0 6px var(--camp-color, var(--accent)), var(--shadow); opacity:1; }
    100%{ box-shadow:0 0 0 0 var(--camp-color, var(--accent)), var(--shadow); opacity:1; }
  }
  .sheet-reveal{ animation:sheetRevealPop .6s cubic-bezier(.2,.8,.3,1); }
  .sheet-reveal > .card:first-child{ animation:sheetRevealGlow 1.1s ease-out; }

  /* Painel flutuante do Histórico de Rolagens: fica fixo no canto da tela em
     QUALQUER aba (Personagens, ficha, Mesa, Painel do Assimilador), pra dar
     acesso às rolagens de todo mundo sem precisar sair da própria ficha
     aberta. Não tem tratamento especial pra celular por enquanto. É só um
     resumo pra consulta rápida - os botões de limpar ficam nas telas
     originais (aba Mesa e tela de Personagens), não aqui. Cada rolagem usa
     um formato compacto (sem tabela larga) pra caber tudo na largura padrão
     do painel, sem precisar arrastar pro lado: nome do personagem (o nome
     do jogador fica de fora, pra economizar espaço), o teste feito, um
     resumo de Sucesso/Adaptação/Pressão de cada dado (mantido ou
     descartado) e, por fim, a soma só dos dados mantidos. */
  .rollfeed{
    position:fixed; right:14px; bottom:14px; z-index:45;
    width:320px; max-width:calc(100vw - 28px);
    background:var(--surface); border:2px solid var(--border-strong); border-radius:var(--radius);
    box-shadow:var(--shadow);
    display:flex; flex-direction:column;
    max-height:min(70vh,560px);
  }
  .rollfeed-toggle{
    width:100%; flex:none; display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--ink); color:var(--bg); border:none; border-radius:1px;
    padding:10px 14px; font-family:"Oswald",sans-serif; font-weight:600; text-transform:uppercase;
    letter-spacing:.04em; font-size:12.5px;
  }
  .rollfeed.collapsed{ max-height:none; }
  .rollfeed.collapsed .rollfeed-list{ display:none; }
  .rollfeed-list{ overflow-y:auto; padding:8px 12px; flex:1 1 auto; min-height:0; }
  .rollfeed-entry{ padding:7px 0; border-bottom:1px solid var(--border); }
  .rollfeed-entry:last-child{ border-bottom:none; }
  .rollfeed-entry-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .rollfeed-entry-head b{ font-size:13px; }
  .rollfeed-entry-head .hint{ font-size:10px; white-space:nowrap; margin:0; }
  .rollfeed-entry-label{ font-size:11.5px; color:var(--ink-muted); margin:1px 0 5px; }
  .rollfeed-dice{ display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
  .rf-die{
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; padding:1px 6px;
    border:1px solid var(--border-strong); border-radius:99px; white-space:nowrap;
    opacity:.4; text-decoration:line-through;
  }
  .rf-die.kept{ opacity:1; text-decoration:none; border-color:var(--accent); background:var(--surface-2); font-weight:600; }
  .rollfeed-total .result-badges{ gap:5px; }
  .rollfeed-total .rbadge{ font-size:11px; padding:2px 7px; }

  /* Animação de clique: um "afundar" rápido em qualquer botão/opção clicável
     da ficha, pra dar retorno tátil de que o clique foi registrado. */
  .btn, .rollfeed-toggle, .stepper-btn, .card-toggle, .camp-opt, .kit-opt, .gm-link, .gm-corner-btn.unlocked{
    transition: transform .08s ease;
  }
  .btn:active:not(:disabled), .rollfeed-toggle:active, .stepper-btn:active:not(:disabled),
  .card-toggle:active, .camp-opt:active, .kit-opt:active, .gm-link:active, .gm-corner-btn.unlocked:active{
    transform: scale(.94);
  }

  /* Modal de confirmação próprio da ficha, no lugar do confirm() nativo do
     navegador: dentro do iframe sandboxed onde o artifact roda, confirm()
     pode ser bloqueado silenciosamente (sem mostrar nada e sem avisar) -
     era provavelmente por isso que os botões "Limpar" (e o de excluir
     personagem da mesa, no Painel do Assimilador) pareciam não fazer nada
     ao clicar: a confirmação nunca aparecia e a função simplesmente parava
     ali, achando que o jogador cancelou. Esse modal roda inteiramente
     dentro da própria página, sem depender de nenhuma API do navegador. */
  .confirm-overlay{
    position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    background:rgba(20,17,10,.55); padding:16px;
  }
  .confirm-box{
    background:var(--surface); border:2px solid var(--border-strong); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px 20px; max-width:420px; width:100%;
  }
  .confirm-box p{ margin:0 0 16px; }
  .confirm-box .btn-row{ margin-top:0; }

  /* Cabo de Guerra (ver tugDeGuerraCardHtml): única forma de calcular e
     mostrar Determinação/Assimilação, sempre visível na ficha - não é mais
     um modo opcional/alternável. */
  .tug-card{ border-color:var(--assim); }
  .tug-row{ display:flex; align-items:center; gap:8px; margin-top:10px; }
  .tug-row .tug-tag{
    font-family:"Oswald",sans-serif; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; font-size:11px; white-space:nowrap; flex:none;
  }
  /* Trilha em "cabo de guerra" com laçadas (ver referência do livro de regras
     anexada pelo Marco em 27/09/2026, mais parecida com a ficha oficial que o
     controle deslizante de antes): uma argola em cada ponta (Determinação/
     Assimilação) e uma fileira de 10 laços (⋈), um por Nível da escala 0-10.
     Clicar num laço ajusta o Nível direto pro laço clicado - mais parecido
     com marcar uma posição numa ficha impressa do que arrastar livremente.
     Os laços do lado de Determinação (à esquerda da posição atual) e do lado
     de Assimilação (à direita) ficam coloridos; o resto fica apagado. */
  .tug-track{
    display:flex; align-items:center; gap:6px; flex:1; min-width:0; padding:2px 0;
  }
  .tug-endcap{
    flex:none; width:18px; height:18px; border-radius:50%;
    border:3px solid var(--border-strong); background:var(--surface);
  }
  .tug-lace{
    flex:1 1 0; min-width:0; text-align:center; font-size:20px; line-height:1;
    color:var(--border-strong); opacity:.3; cursor:pointer; user-select:none;
    transition:color .15s, opacity .15s, transform .1s;
  }
  .tug-lace:hover{ transform:scale(1.25); }
  .tug-lace.det{ color:var(--royal); opacity:1; }
  .tug-lace.assim{ color:var(--assim); opacity:1; }
  .tug-nums{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-muted); margin-top:3px; font-variant-numeric:tabular-nums; }
  .tug-lvl-dot{ width:13px; height:13px; border-radius:50%; display:inline-block; }
  .tug-lvl-dot.det{ background:var(--royal); }
  .tug-lvl-dot.assim{ background:var(--assim); }

  /* Efeito "Suscetível" (ver determinacaoZerada/marcarFlashSuscetivel/
     detZeroEffectHtml): o card do Cabo de Guerra ganha uma borda ciano
     estilizada com brilho pulsante e um carimbo diagonal "SUSCETÍVEL" por
     cima das informações em dois casos - (1) o personagem está no piso
     absoluto da escala (Nível 0 de Determinação, ver DET_CAIXA_FLOOR),
     estado persistente que só some quando a Determinação sobe de novo; ou
     (2) um "flash" temporário (alguns segundos, ver state.detFlash) toda vez
     que os pontos do Nível atual zeram e cascateiam pro próximo Nível cheio
     (gastarDeterminacao já faz essa troca de Nível na mesma ação, então sem
     esse flash o "zerou" nunca ficaria visível). A "chacoalhada" de entrada
     toca só na primeira vez que o card aparece zerado (ver state.detShakeSeen). */
  .card.det-zerada{
    position:relative; overflow:hidden;
    border:3px solid var(--suscet);
    animation:detPulseGlow 2.4s ease-in-out infinite;
  }
  .card.det-zerada.det-shake{
    animation:detChacoalha .55s ease-in-out 1, detPulseGlow 2.4s ease-in-out infinite .55s;
  }
  @keyframes detPulseGlow{
    0%,100%{ box-shadow:0 0 0 3px rgba(var(--suscet-rgb),.22), 0 0 14px rgba(var(--suscet-rgb),.45); }
    50%{ box-shadow:0 0 0 3px rgba(var(--suscet-rgb),.42), 0 0 26px rgba(var(--suscet-rgb),.8); }
  }
  @keyframes detChacoalha{
    0%{ transform:translateX(0) rotate(0); }
    15%{ transform:translateX(-7px) rotate(-1.2deg); }
    30%{ transform:translateX(6px) rotate(1.2deg); }
    45%{ transform:translateX(-5px) rotate(-1deg); }
    60%{ transform:translateX(4px) rotate(1deg); }
    75%{ transform:translateX(-2px) rotate(0); }
    100%{ transform:translateX(0) rotate(0); }
  }
  .det-stamp{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-24deg);
    font-family:"Oswald",sans-serif; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    font-size:clamp(24px,6.5vw,42px); color:var(--suscet); opacity:.42;
    border:4px double var(--suscet); border-radius:8px; padding:2px 20px;
    white-space:nowrap; pointer-events:none; z-index:5; text-align:center;
  }

  /* Painel do Assimilador (ver gmCharCardBody): mini trilha de laços do Cabo de
     Guerra (ver tugLacosHtml) no lugar dos dois números soltos de antes, e uma
     grade de células pra Instintos/Conhecimentos & Práticas no lugar de uma
     linha corrida de texto - mais fácil de escanear numa mesa com vários
     personagens abertos. Características viram etiquetas (chips) com o custo
     em pontos. A partir de 27/09/2026 essa mesma trilha em miniatura (versão
     "mini" de .tug-track/.tug-lace/.tug-endcap, ver tugLacosHtml) também é
     usada no card de cada personagem na tela de Personagens e na mini-ficha
     da aba Mesa (tugMiniBarHtml), no lugar da barrinha de preenchimento única
     que ainda não tinha sido atualizada pro visual "laços entre dois anéis"
     do resto da ficha, a pedido do Marco. */
  .tug-track.mini{ gap:3px; }
  .tug-endcap.mini{ width:10px; height:10px; border-width:2px; }
  .tug-lace.mini{ font-size:13px; cursor:default; }
  .tug-lace.mini:hover{ transform:none; }
  .gm-attr-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:6px; margin-top:6px; }
  .gm-attr-cell{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:5px 8px; text-align:center; }
  .gm-attr-cell .lbl{ font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gm-attr-cell .v{ font-family:"Oswald",sans-serif; font-weight:700; font-size:16px; color:var(--ink); }
  .gm-carac-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .gm-carac-chip{ display:inline-flex; align-items:baseline; gap:6px; background:var(--surface-2); border:1px solid var(--border-strong); border-radius:99px; padding:3px 11px 3px 12px; font-size:12px; }
  /* Ícones oficiais de Nível (círculo) e Pontos (triângulo) de Determinação,
     Assimilação e Saúde (Fase 2 do site, 28/09/2026 - ver claude/Icones_Oficiais_Ficha.md).
     Cada um tem uma versão "_escuro" com o contorno claro, pro tema escuro. O
     tamanho acompanha o font-size (em), então os mesmos ícones servem nos
     medidores grandes da ficha, nas mini-fichas e no meio dos textos. */
  .ico{ display:inline-block; vertical-align:middle; background:center/contain no-repeat; width:1.15em; height:1.05em; flex:none; font-size:20px; }
  /* Tamanho mínimo: 20px (o mesmo dos ícones ao lado de "Nível 9"), em qualquer lugar. */
  .ico.tri{ width:.9em; }
  .ico-nd{ background-image:url(icones/nivel_determinacao.png); }
  .ico-pd{ background-image:url(icones/pontos_determinacao.png); }
  .ico-na{ background-image:url(icones/nivel_assimilacao.png); }
  .ico-pa{ background-image:url(icones/pontos_assimilacao.png); }
  .ico-ns{ background-image:url(icones/nivel_saude.png); }
  .ico-ps{ background-image:url(icones/pontos_saude.png); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .ico-nd{ background-image:url(icones/nivel_determinacao_escuro.png); }
    :root:not([data-theme="light"]) .ico-pd{ background-image:url(icones/pontos_determinacao_escuro.png); }
    :root:not([data-theme="light"]) .ico-na{ background-image:url(icones/nivel_assimilacao_escuro.png); }
    :root:not([data-theme="light"]) .ico-pa{ background-image:url(icones/pontos_assimilacao_escuro.png); }
    :root:not([data-theme="light"]) .ico-ns{ background-image:url(icones/nivel_saude_escuro.png); }
    :root:not([data-theme="light"]) .ico-ps{ background-image:url(icones/pontos_saude_escuro.png); }
  }
  :root[data-theme="dark"] .ico-nd{ background-image:url(icones/nivel_determinacao_escuro.png); }
  :root[data-theme="dark"] .ico-pd{ background-image:url(icones/pontos_determinacao_escuro.png); }
  :root[data-theme="dark"] .ico-na{ background-image:url(icones/nivel_assimilacao_escuro.png); }
  :root[data-theme="dark"] .ico-pa{ background-image:url(icones/pontos_assimilacao_escuro.png); }
  :root[data-theme="dark"] .ico-ns{ background-image:url(icones/nivel_saude_escuro.png); }
  :root[data-theme="dark"] .ico-ps{ background-image:url(icones/pontos_saude_escuro.png); }
  /* Medidores (antes losangos ♦): apagado = cinza e transparente; marcado = cor cheia. */
  .diamond.ico{ opacity:.25; filter:grayscale(1); margin-right:2px; }
  .diamond.ico.filled{ opacity:1; filter:none; }
  .diamond.ico.dsize-lg{ font-size:30px; }
  .diamond.ico.dsize-sm{ font-size:22px; }
  .dots.mini .diamond.ico{ font-size:20px; cursor:default; }
  .tug-nums .ico{ font-size:20px; }
  /* Trilha maior e com os laços mais espaçados: os nomes Determinação/Assimilação
     ficam numa linha própria acima, e a trilha usa a largura inteira do card. */
  .tug-row{ flex-wrap:wrap; justify-content:space-between; row-gap:8px; }
  .tug-row .tug-track:not(.mini){ order:3; flex:1 1 100%; }
  .trait .txt span.ico{ font-size:20px; }
  /* Ícones de dado do livro (Sucesso = besouro, Adaptação = cervo, Pressão =
     máscara). São silhuetas: a imagem vira máscara e a cor vem do texto em
     volta (currentColor), então funcionam no tema claro, no escuro e dentro
     dos selos coloridos de resultado. Mínimo de 20px, como os outros ícones. */
  .dado{ display:inline-block; vertical-align:middle; width:1.1em; height:1.05em; font-size:20px; flex:none;
    background-color:currentColor;
    -webkit-mask:center/contain no-repeat; mask:center/contain no-repeat; }
  .dado-s{ -webkit-mask-image:url(icones/dado_sucesso.png); mask-image:url(icones/dado_sucesso.png); color:var(--good); }
  .dado-a{ -webkit-mask-image:url(icones/dado_adaptacao.png); mask-image:url(icones/dado_adaptacao.png); color:var(--accent); }
  .dado-p{ -webkit-mask-image:url(icones/dado_pressao.png); mask-image:url(icones/dado_pressao.png); color:var(--danger); }
  .trait .txt span.dado{ font-size:20px; }
  .trait .txt span.dado-s{ color:var(--good); }
  .trait .txt span.dado-a{ color:var(--accent); }
  .trait .txt span.dado-p{ color:var(--danger); }
  .die-chip .dado, .rf-die .dado{ font-size:20px; }
  .gm-compact-line .ico{ font-size:20px; }
  .gm-carac-chip .cost{ font-size:10.5px; color:var(--accent); font-weight:700; }
</style>

  // Conta quantos A/B/C tem numa string de custo (ex.: "BBA" -> {s:1,a:2,p:0}).
  function custoSimbolos(str){
    var s=0,a=0,p=0;
    (str||"").split("").forEach(function(ch){ if(ch==="A") s++; else if(ch==="B") a++; else if(ch==="C") p++; });
    return {s:s,a:a,p:p};
  }
  // Mesma leitura de custoSimbolos, mas em texto puro (sem HTML) com os mesmos
  // ✓/⟳/⚠ usados em custoChipHtml - pra usar dentro de <option> de <select>,
  // onde markup não renderiza (ex.: o seletor de nível no registro manual de
  // mutação, que antes mostrava a string de código crua tipo "BA").
  function custoSimbolosTexto(str){
    var s = custoSimbolos(str);
    var parts = [];
    if(s.s) parts.push("✓"+s.s);
    if(s.a) parts.push("⟳"+s.a);
    if(s.p) parts.push("⚠"+s.p);
    return parts.join(" ");
  }

  // ---- Símbolos nos TEXTOS DE EFEITO das cartas de Assimilação (MUT_DECKS) ----
  // custoSimbolos/custoSimbolosTexto (acima) já cuidam da string de CUSTO de cada
  // tier (ex. "BBA"), mas o texto do EFEITO em si (tier[2], livre, ex. "Some B
  // numa face de dado mantido...") ainda citava as mesmas letras A/B/C soltas, e
  // também "d"/"e" pros Pontos de Determinação/Assimilação que o livro definitivo
  // usa como atalho - a pedido do Marco (27/09/2026), agora viram os mesmos
  // símbolos/cores do resto da ficha em vez de letras. Duas letras exigem cuidado
  // extra pra não estragar frases comuns em português:
  // - "d"/"e" nunca podem casar com uma letra dentro de outra palavra (ex. "dúvida",
  //   "então") nem com uma unidade como "°C" - por isso as expressões abaixo usam a
  //   faixa de acentos do português (PT_LETRA) como fronteira, em vez do \b padrão
  //   do JS, que só entende [A-Za-z0-9_] e trataria "d" de "dúvida" como palavra
  //   solta.
  // - "e" sozinho (sem número na frente, tipo "1e") é ambíguo com a conjunção "e"
  //   ("e") que aparece o tempo todo no texto normal - não dá pra distinguir com uma
  //   regra geral sem arriscar trocar um "e" comum por um losango. Por isso, essa
  //   função só troca "e" isolado quando vem colado a um número (ex. "2e") ou
  //   quando o próprio MUT_DECKS já marca o ponto com "[E]" no lugar da letra (só
  //   nos ~10 casos genuínos identificados manualmente, tipo "Gasta todos os [E]");
  //   a conjunção "e" nunca é tocada. Já "d" sozinho é seguro de trocar sempre - não
  //   existe palavra de uma letra só "d" em português (exceto a contração "d'água",
  //   por isso o lookahead exclui apóstrofo).
  var PT_LETRA = "A-Za-zÀ-ÖØ-öø-ÿ";
  var RE_EFEITO_ABC = new RegExp("(?<![" + PT_LETRA + "0-9°])[ABCP]{1,6}(?![" + PT_LETRA + "0-9])", "g");
  // Nota: essas expressões rodam DEPOIS do esc() (ver formatEfeito), que já
  // converteu qualquer apóstrofo literal em "&#39;" - por isso a exclusão de
  // contrações tipo "d'água" testa "&" (início da entidade), não o apóstrofo
  // em si, que a essa altura já não existe mais no texto.
  var RE_EFEITO_DIGITO_DE = new RegExp("(?<![" + PT_LETRA + "0-9])(\\d+)([de])(?![" + PT_LETRA + "0-9&])", "g");
  var RE_EFEITO_D_SOLTO = new RegExp("(?<![" + PT_LETRA + "0-9])d(?![" + PT_LETRA + "0-9&])", "g");
  // Troca, num texto de descrição JÁ ESCAPADO (HTML), as menções a Nível e
  // Pontos de Determinação/Assimilação/Saúde pelos ícones oficiais (ver icoHtml).
  // "caixa de Saúde" é o mesmo que ponto de Saúde na ficha. O número na frente
  // ("1 Ponto de Determinação") fica, só a expressão vira ícone.
  var RE_ICO_TEXTO = [
    [/(Níveis|Nível|níveis|nível) de Determinação/g, "nd"],
    [/(Níveis|Nível|níveis|nível) de Assimilação/g, "na"],
    [/(Níveis|Nível|níveis|nível) de Saúde/g, "ns"],
    [/(Pontos|Ponto|pontos|ponto|Pts|pts|pt) de Determinação/g, "pd"],
    [/(Pontos|Ponto|pontos|ponto) de Assimilação/g, "pa"],
    [/(Pontos|Ponto|pontos|ponto|caixas|caixa) de Saúde/g, "ps"],
    [/(?<![A-Za-zÀ-ÿ])(Sucessos|Sucesso)(?![A-Za-zÀ-ÿ])/g, "ds"],
    [/(?<![A-Za-zÀ-ÿ])(Adaptações|Adaptação)(?![A-Za-zÀ-ÿ])/g, "da"],
    [/(?<![A-Za-zÀ-ÿ])(Pressões|Pressão)(?![A-Za-zÀ-ÿ])/g, "dp"]
  ];
  var DADO_TITULOS = { s:"Sucesso", a:"Adaptação", p:"Pressão" };
  function dadoHtml(k){
    return '<span class="dado dado-'+k+'" title="'+DADO_TITULOS[k]+'" role="img" aria-label="'+DADO_TITULOS[k]+'"></span>';
  }
  // Resultado de um dado com os ícones (ex.: [besouro]2 [cervo]1), pra botões,
  // chips e o painel de rolagens. diceResultLabel continua existindo pro texto puro.
  function diceResultHtml(d){
    var parts = [];
    if(d.s) parts.push(dadoHtml("s")+d.s);
    if(d.a) parts.push(dadoHtml("a")+d.a);
    if(d.p) parts.push(dadoHtml("p")+d.p);
    return parts.length ? parts.join(" ") : "em branco";
  }
  function iconizarTexto(html){
    // Só mexe no TEXTO, nunca dentro de tags já existentes (ex.: o title de um
    // ícone já inserido também diz "Pontos de Determinação").
    return String(html==null?"":html).split(/(<[^>]*>)/).map(function(parte){
      if(parte.charAt(0) === "<") return parte;
      var marcado = parte;
      RE_ICO_TEXTO.forEach(function(r){ marcado = marcado.replace(r[0], "\u0001"+r[1]+"\u0001"); });
      return marcado.replace(/\u0001(\w\w)\u0001/g, function(_, k){ return k.charAt(0)==="d" && DADO_TITULOS[k.charAt(1)] ? dadoHtml(k.charAt(1)) : icoHtml(k); });
    }).join("");
  }
  function formatEfeito(txt, htmlColor){
    function sym(color, ch){ return htmlColor ? '<span style="color:'+color+'">'+ch+'</span>' : ch; }
    // Pontos de Determinação ("d") e de Assimilação ("e"/[E]) viram os ícones
    // oficiais (triângulos) no HTML; no texto puro continuam sendo ♦.
    function symPts(k){ return htmlColor ? icoHtml(k) : "♦"; }
    var out = esc(txt);
    out = out.split("[E]").join(symPts("pa"));
    out = out.replace(RE_EFEITO_ABC, function(run){
      return run.split("").map(function(ch){
        if(ch==="A") return htmlColor ? dadoHtml("s") : "✓";
        if(ch==="B") return htmlColor ? dadoHtml("a") : "⟳";
        return htmlColor ? dadoHtml("p") : "⚠"; // C ou P (Pressão)
      }).join("");
    });
    out = out.replace(RE_EFEITO_DIGITO_DE, function(_, n, letra){
      return n + symPts(letra==="d" ? "pd" : "pa");
    });
    out = out.replace(RE_EFEITO_D_SOLTO, function(){ return symPts("pd"); });
    if(htmlColor) out = iconizarTexto(out);
    return out;
  }

  // ---------- STORAGE ----------
  function loadLS(key, fallback){
    try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  }
  function saveLS(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch(e){ return false; }
  }
  // Converte fichas salvas com Determinação em escala única de 0 a 10 pro formato
  // atual (3 caixas de 10 pontos cada, 0 a 30), preservando o preenchimento relativo.
  function migrateChar(c){
    if(c && c.determinacao && (c.determinacao.caixaAtual===undefined || c.determinacao.pontosAtual===undefined)){
      var oldMax = c.determinacao.max || 10;
      var oldAtual = c.determinacao.atual != null ? c.determinacao.atual : oldMax;
      var totalNovo = clamp(Math.round((oldAtual/oldMax)*30), 0, 30);
      var caixaAtual = totalNovo<=0 ? 0 : Math.ceil(totalNovo/10);
      var pontosAtual = caixaAtual<=0 ? 0 : totalNovo - (caixaAtual-1)*10;
      c.determinacao = { caixaAtual: caixaAtual, pontosAtual: pontosAtual };
    }
    // Fichas de antes do Bônus de Assimilação (21/09/2026, ver newCharacter/valorInstinto/
    // valorCP) não têm esses campos: preenche com 0 em tudo, sem mexer em nada que já exista.
    if(c){
      if(!c.instintosAssimBonus) c.instintosAssimBonus = {};
      INSTINTOS.forEach(function(i){ if(c.instintosAssimBonus[i[0]]==null) c.instintosAssimBonus[i[0]] = 0; });
      if(!c.conhPratAssimBonus) c.conhPratAssimBonus = {};
      CONH_PRAT.forEach(function(p){ if(c.conhPratAssimBonus[p[0]]==null) c.conhPratAssimBonus[p[0]] = 0; });
      // Recalcula o espaço de cada item (itemEspaco é sempre 1; "Espaçoso" só aumenta o
      // teto total via capacidadeInventarioMax, nunca o espaço do próprio item) toda vez
      // que a ficha carrega, pra fichas antigas se corrigirem sozinhas sem reabrir "Editar Ficha".
      if(c.equip) c.equip.espaco = itemEspaco(c.equip.traits);
      if(Array.isArray(c.inventarioExtra)){
        c.inventarioExtra.forEach(function(it){ it.espaco = itemEspaco(it.traits); });
      }
      // Fichas de antes do sistema de Assimilações/mutações (27/09/2026, ver
      // newCharacter/MUT_DECKS/renderMutacoesCard): preenche os campos novos sem
      // mexer em nada que já exista.
      if(c.testesAssimPendentes == null) c.testesAssimPendentes = 0;
      if(c.assimTesteAtual === undefined) c.assimTesteAtual = null;
      if(!Array.isArray(c.mutAdquiridas)) c.mutAdquiridas = [];
      if(c.assimPerdido == null) c.assimPerdido = false;
      // Fichas de antes da tag "NPC" (27/09/2026, ver newCharacter/testLogVisivelPara): sem
      // marcação salva, o personagem é tratado como jogador comum (rolagens visíveis a todos).
      if(c.ehNpc == null) c.ehNpc = false;
    }
    return c;
  }
  // ---------- MODO MESA (Firebase) ----------
  // Versão do site próprio (ficha-pangea.web.app), 28/09/2026: os dados moram no
  // Firestore, UM DOCUMENTO POR PERSONAGEM (coleção "personagens") e um por rolagem
  // (coleção "rolagens"). Cada mudança grava só o documento do personagem mexido -
  // nunca mais a página inteira - e todo mundo com a ficha aberta recebe a mudança
  // em tempo real (onSnapshot), sem recarregar nada. Isso substitui o mecanismo
  // antigo do Claude Artifact (republicar o HTML inteiro a cada salvamento), que era
  // a causa dos dados sumindo/corrompendo quando dois jogadores mexiam juntos.
  //  - modo local: só usado se a página abrir sem o Firebase (nunca deveria no site).
  //  - modo mesa: Firebase conectado. "shared" é só o espelho em memória do banco.
  var caps = { artifact:null, mode:"local", isOwner:false, canEdit:true };

  // Bloco de dados embutido no HTML: no site novo ele só serve de SEMENTE - na
  // primeiríssima vez que o banco é aberto (vazio e sem a marca meta/migracao), os
  // personagens daqui são copiados pro Firestore uma única vez (ver semearSeVazio).
  function readEmbeddedShared(){
    var el = document.getElementById("pangea-data");
    var data = null;
    try{ data = el ? JSON.parse(el.textContent) : null; }catch(e){ data = null; }
    if(!data || typeof data !== "object") data = {};
    if(!Array.isArray(data.characters)) data.characters = [];
    if(!Array.isArray(data.testLog)) data.testLog = [];
    data.characters = data.characters.map(migrateChar);
    return data;
  }
  var shared = { characters:[], testLog:[] }; // espelho em memória do banco (modo mesa)

  function loadChars(){
    if(caps.mode === "mesa"){ return shared.characters; }
    return loadLS("pangea:characters", []).map(migrateChar);
  }
  function saveChars(list){
    if(caps.mode === "mesa"){ shared.characters = list; schedulePublish(); return; }
    saveLS("pangea:characters", list);
  }
  function getShared(){ return shared; }
  // Histórico de rolagens: no modo mesa vem da coleção "rolagens" (todo mundo
  // vê); no modo local fica só neste navegador, do mesmo jeito que os personagens.
  function testLog(){
    if(caps.mode === "mesa") return shared.testLog;
    return loadLS("pangea:testLog", []);
  }
  function registrarTeste(entry){
    entry.id = uid(); entry.ts = new Date().toISOString();
    if(caps.mode === "mesa"){
      var log = shared.testLog;
      log.unshift(entry);
      if(log.length > 60) log.length = 60;
      dirtyTestLogEntries.push(entry);
      schedulePublish();
    } else {
      var localLog = loadLS("pangea:testLog", []);
      localLog.unshift(entry);
      if(localLog.length > 60) localLog.length = 60;
      saveLS("pangea:testLog", localLog);
    }
    renderRollFeed();
  }

  // Personagens marcados como NPC (ver newCharacter/renderSheetEdit): suas
  // rolagens somem do Histórico de Rolagens (aba Mesa) e do painel flutuante
  // pra quem não tem acesso total à mesa (jogadores comuns) - o Assimilador
  // continua vendo tudo normalmente nos dois lugares (temAcessoTotal). Usa
  // sempre a lista COMPLETA de personagens (loadChars, não visibleChars):
  // o que decide aqui é a marcação NPC do personagem, não se este navegador
  // já destravou aquela ficha por senha. Uma entrada cujo personagem não é
  // mais encontrado (por exemplo, já excluído) continua visível normalmente.
  function testLogVisivelPara(log){
    if(temAcessoTotal()) return log;
    var chars = loadChars();
    return log.filter(function(t){
      var c = chars.filter(function(x){ return x.id === t.charId; })[0];
      return !(c && c.ehNpc);
    });
  }
  // Etiqueta "NPC" pra mostrar ao lado do nome em qualquer card/cabeçalho que
  // já exibe c.nomePersonagem (tela de Personagens, mini-ficha da Mesa, ficha
  // aberta, Painel do Assimilador) - só um lembrete visual de que as rolagens
  // desse personagem estão escondidas dos outros jogadores (ver testLogVisivelPara).
  function npcBadgeHtml(c){
    if(!c || !c.ehNpc) return "";
    return ' <span class="badge-pill" style="background:var(--surface-2);color:var(--ink-muted);border:1px solid var(--border-strong);vertical-align:middle" title="NPC: as rolagens deste personagem ficam escondidas dos outros jogadores no Histórico de Rolagens e no painel flutuante">NPC</span>';
  }

  // Ids de personagens "reivindicados" por este navegador: além da etiqueta "seu"
  // na interface, é o que a ficha usa pra saber se este navegador já provou dono
  // de quem via senha (ver isCharUnlocked/senhaFicha logo abaixo).
  function meusIds(){ return loadLS("pangea:meus", []); }
  function marcarComoMeu(id){
    var list = meusIds();
    if(list.indexOf(id) === -1){ list.push(id); saveLS("pangea:meus", list); }
  }

  // ----- SENHA DA FICHA: não é uma trava de segurança de verdade, só evita que um
  // jogador abra sem querer a ficha de outra pessoa numa mesa com o link compartilhado.
  // Não fica guardada em lugar nenhum: é calculada na hora a partir de nome do
  // personagem + nome do jogador já salvos na própria ficha. Digitada em qualquer
  // lugar da página (igual o código MB1403); nenhum personagem trancado aparece em
  // lugar nenhum (card, contagem) até a senha certa ser digitada. -----
  // Normaliza pra digitar sem se preocupar com maiúsculas, acentos ou espaços.
  function normalizeSenha(s){
    return (s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
  }
  function senhaFicha(c){
    return normalizeSenha(c.nomePersonagem) + normalizeSenha(c.nomeJogador);
  }
  // Acesso total (vê e mexe em tudo, sem trava nenhuma): modo local avulso,
  // o dono de verdade do artifact, OU quem já destravou o Painel do
  // Assimilador com o código MB1403 - esse último já enxerga tudo por lá
  // mesmo, então escondê-lo dos cards/histórico seria só inconsistente.
  // Exceção: o próprio Assimilador pode ligar o "Ver como Jogador" (abaixo)
  // pra testar a experiência de um jogador comum sem sair da própria conta;
  // enquanto isso estiver ligado, ele perde o acesso total (mas continua
  // podendo desligar a qualquer momento pelo botão que só ele vê).
  function temAcessoTotal(){
    if(caps.mode !== "mesa") return true;
    if(caps.isOwner && state.gmPreviewJogador) return false;
    return caps.isOwner || state.gmUnlocked;
  }
  // Pros outros jogadores, só destrava depois de acertar a senha em qualquer
  // lugar da página (o que também marca o personagem como "meu" nesse navegador).
  function isIdUnlocked(id){
    if(temAcessoTotal()) return true;
    return meusIds().indexOf(id) > -1;
  }
  function isCharUnlocked(c){ return isIdUnlocked(c.id); }
  // Lista de personagens que este navegador tem permissão de ver: em modo
  // mesa, pra quem não tem acesso total, só os já destravados (nunca mostra
  // os trancados, nem como card cinza, nem na contagem do total).
  function visibleChars(){
    var chars = loadChars();
    if(temAcessoTotal()) return chars;
    var meus = meusIds();
    return chars.filter(function(c){ return meus.indexOf(c.id) > -1; });
  }

  function podeEditar(){
    if(caps.mode !== "mesa") return true;
    if(!caps.canEdit){ alert("Este link é só de visualização: peça ao Assimilador um link com permissão de edição pra poder mexer nas fichas."); return false; }
    return true;
  }

  // ---------- GRAVAÇÃO NO FIRESTORE ----------
  // FB = ponte pro Firebase criada pelo script de módulo no fim da página
  // (window.PANGEA_FB). Cada gravação manda SÓ os documentos que esta aba mudou:
  // personagens tocados (dirtyCharIds), personagens excluídos (dirtyDeletedCharIds)
  // e rolagens novas (dirtyTestLogEntries). Como cada personagem é um documento
  // separado, a mudança de um jogador nunca apaga a de outro.
  var FB = null;
  var publishTimer = null;
  var dirtyCharIds = {};
  var dirtyDeletedCharIds = {};
  var dirtyTestLogEntries = [];
  var retryTimer = null;
  function temPendencias(){
    return Object.keys(dirtyCharIds).length>0 || Object.keys(dirtyDeletedCharIds).length>0 || dirtyTestLogEntries.length>0;
  }
  function marcarCharSujo(id){ dirtyCharIds[id] = true; delete dirtyDeletedCharIds[id]; }
  function marcarCharExcluido(id){ delete dirtyCharIds[id]; dirtyDeletedCharIds[id] = true; }
  function schedulePublish(){
    clearTimeout(publishTimer);
    publishTimer = setTimeout(doPublish, 500);
  }
  // O Firestore não aceita "undefined" em nenhum campo: a ida e volta por JSON
  // remove esses campos (e qualquer outra coisa que não seja dado puro).
  function paraFirestore(obj){ return JSON.parse(JSON.stringify(obj)); }
  function doPublish(){
    publishTimer = null;
    if(!FB || caps.mode !== "mesa") return;
    if(!temPendencias()) return;
    var idsChars = Object.keys(dirtyCharIds);
    var idsDel = Object.keys(dirtyDeletedCharIds);
    var entries = dirtyTestLogEntries.slice();
    var ops = [];
    idsChars.forEach(function(id){
      var c = shared.characters.filter(function(x){ return x.id===id; })[0];
      if(c) ops.push({ tipo:"set", col:"personagens", id:id, data:paraFirestore(c) });
    });
    idsDel.forEach(function(id){ ops.push({ tipo:"del", col:"personagens", id:id }); });
    entries.forEach(function(e){ ops.push({ tipo:"set", col:"rolagens", id:e.id, data:paraFirestore(e) }); });
    // Tira da fila já na hora (o Firestore guarda e reenvia sozinho se a rede
    // oscilar); só volta pra fila se o servidor RECUSAR de verdade a gravação.
    idsChars.forEach(function(id){ delete dirtyCharIds[id]; });
    idsDel.forEach(function(id){ delete dirtyDeletedCharIds[id]; });
    dirtyTestLogEntries = dirtyTestLogEntries.filter(function(e){ return entries.indexOf(e) === -1; });
    FB.escrever(ops).then(function(){
      if(state.syncFalhou){ state.syncFalhou = false; renderSyncBanner(); }
    }).catch(function(err){
      console.error("[Pangea] falha ao gravar no Firestore", err);
      idsChars.forEach(function(id){ if(!dirtyDeletedCharIds[id]) dirtyCharIds[id] = true; });
      idsDel.forEach(function(id){ if(!dirtyCharIds[id]) dirtyDeletedCharIds[id] = true; });
      entries.forEach(function(e){ if(dirtyTestLogEntries.indexOf(e) === -1) dirtyTestLogEntries.push(e); });
      state.syncFalhou = true;
      renderSyncBanner();
      clearTimeout(retryTimer);
      retryTimer = setTimeout(doPublish, 5000);
    });
  }
  // Aplica uma mudança "em bloco" (hoje só o Limpar Histórico de Rolagens) e grava
  // na hora. Personagens que sumiram da lista viram exclusões; se o histórico ficou
  // vazio, apaga a coleção "rolagens" inteira no banco.
  function publicarAgoraComRetry(mutateFn){
    if(!FB || caps.mode !== "mesa") return;
    var idsAntes = shared.characters.map(function(c){ return c.id; });
    var logAntes = shared.testLog.map(function(e){ return e.id; });
    mutateFn(shared);
    var idsDepois = {}; shared.characters.forEach(function(c){ idsDepois[c.id] = true; });
    idsAntes.forEach(function(id){ if(!idsDepois[id]) marcarCharExcluido(id); });
    var p;
    if(!shared.testLog.length && logAntes.length){
      dirtyTestLogEntries = [];
      p = FB.limparColecao("rolagens");
    } else {
      p = Promise.resolve();
    }
    p.then(function(){ doPublish(); render(); }).catch(function(err){
      console.error("[Pangea] falha ao limpar", err);
      alert("Não deu pra confirmar essa limpeza com o servidor agora. Tente de novo em alguns segundos.");
      render();
    });
  }

  // ---------- RECEBENDO MUDANÇAS EM TEMPO REAL ----------
  var appPronto = false;
  var renderAdiado = false;
  function estaDigitando(){
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  }
  // Re-renderiza quando chega mudança de outra pessoa, mas nunca no meio de uma
  // digitação (espera o campo perder o foco).
  function agendarRender(){
    if(!appPronto) return;
    if(estaDigitando()){ renderAdiado = true; return; }
    renderAdiado = false;
    render();
  }
  document.addEventListener("focusout", function(){
    setTimeout(function(){ if(renderAdiado && !estaDigitando()) agendarRender(); }, 50);
  });
  // Personagens vindos do banco. Os que ESTA aba ainda está mexendo (pendência de
  // Saúde/Cabo de Guerra/Equipamento não confirmada, ou gravação na fila) mantêm a
  // versão local, pra uma mudança de outra pessoa não atropelar o que está sendo
  // feito aqui.
  function aplicarSnapshotPersonagens(lista){
    var locais = {};
    shared.characters.forEach(function(c){ locais[c.id] = c; });
    var protegidos = {};
    Object.keys(dirtyCharIds).forEach(function(id){ protegidos[id] = true; });
    if(state.pendenteCharId) protegidos[state.pendenteCharId] = true;
    var nova = lista.map(function(c){
      return (protegidos[c.id] && locais[c.id]) ? locais[c.id] : migrateChar(c);
    });
    Object.keys(protegidos).forEach(function(id){
      if(locais[id] && !nova.some(function(x){ return x.id===id; })) nova.push(locais[id]);
    });
    nova = nova.filter(function(c){ return !dirtyDeletedCharIds[c.id]; });
    nova.sort(function(a,b){ return String(a.criadoEm||"").localeCompare(String(b.criadoEm||"")); });
    shared.characters = nova;
  }
  function aplicarSnapshotRolagens(lista){
    var ids = {};
    lista.forEach(function(e){ ids[e.id] = true; });
    var extras = dirtyTestLogEntries.filter(function(e){ return !ids[e.id]; });
    var nova = extras.concat(lista);
    nova.sort(function(a,b){ return String(b.ts||"").localeCompare(String(a.ts||"")); });
    if(nova.length > 60) nova.length = 60;
    shared.testLog = nova;
  }
  // Semente única: se o banco está vazio e nunca foi semeado, copia pra lá os
  // personagens embutidos neste HTML (backup do artefato antigo) e marca meta/migracao.
  function semearSeVazio(){
    FB.lerDoc("meta", "migracao").then(function(m){
      if(m) return;
      var emb = readEmbeddedShared();
      var ops = emb.characters.map(function(c){ return { tipo:"set", col:"personagens", id:c.id, data:paraFirestore(c) }; });
      ops.push({ tipo:"set", col:"meta", id:"migracao", data:{ em:new Date().toISOString(), personagens:emb.characters.length } });
      return FB.escrever(ops);
    }).catch(function(err){ console.error("[Pangea] falha na semente", err); });
  }
  // Tela de erro quando não dá pra falar com o banco (ex.: sem internet, ou o login
  // anônimo desativado no console do Firebase). Mostra o código técnico pra ajudar.
  function mostrarErroConexao(err){
    var cod = err && (err.code || err.message) ? String(err.code || err.message) : "tempo esgotado";
    app.innerHTML = '<div class="card" style="margin-top:40px;border:2px solid var(--danger)">' +
      '<h2 style="color:var(--danger)">Não deu pra conectar à mesa</h2>' +
      '<p>A ficha não conseguiu falar com o banco de dados. Confira sua internet e tente recarregar a página.</p>' +
      '<p class="hint">Se continuar, mande este código pro Assimilador: <b>'+esc(cod)+'</b></p>' +
      '<div class="btn-row"><button class="btn" onclick="location.reload()">Recarregar</button></div>' +
    '</div>';
  }
  function startLivePolling(){ /* não é mais necessário: o Firestore avisa sozinho */ }

  // Guarda a tela atual (e rascunhos) ao recarregar/fechar a aba, pra voltar do
  // jeitinho que estava se a pessoa recarregar a página.
  function stashViewForReload(){
    try{
      var payload = { view: state.view, charId: state.charId };
      if(state.view === "sheet" && state.sheetTest){ payload.sheetTest = state.sheetTest; }
      if(state.view === "sheet" && state.sheetEditing && state.sheetDraft){
        payload.sheetEditing = true; payload.sheetDraft = state.sheetDraft;
      }
      if(state.view === "wizard"){ payload.draft = state.draft; payload.wizStep = state.wizStep; }
      sessionStorage.setItem("pangea:resume", JSON.stringify(payload));
    }catch(e){}
  }
  function popStashedView(){
    try{
      var raw = sessionStorage.getItem("pangea:resume");
      if(!raw) return null;
      sessionStorage.removeItem("pangea:resume");
      return JSON.parse(raw);
    }catch(e){ return null; }
  }
  function aoDescarregarAba(){ flushPendente(); stashViewForReload(); }
  window.addEventListener("pagehide", aoDescarregarAba);
  window.addEventListener("beforeunload", aoDescarregarAba);

  function uid(){ return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
  function clamp(n,min,max){ n = isNaN(n) ? min : n; return Math.max(min, Math.min(max, n)); }
  function sum(arr){ return arr.reduce(function(a,b){return a+b;},0); }
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  // Codificação dos códigos de backup/importação: usada tanto pra um
  // personagem só (exportCode/importCode) quanto pra lista inteira
  // (exportAllCode/importAllCode).
  function encodeAsBackupCode(obj){
    try{ return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }
    catch(e){ return "(erro ao gerar código)"; }
  }
  function decodeBackupCode(code){
    try{ return JSON.parse(decodeURIComponent(escape(atob(code.trim())))); }
    catch(e){ return null; }
  }

  // ---------- CHARACTER FACTORY ----------
  function newCharacter(){
    var c = {
      id: uid(), criadoEm: new Date().toISOString(), atualizadoEm: new Date().toISOString(),
      nomeJogador:"", nomePersonagem:"", acampamento:null,
      origem:{ geracao:"", evento:"", ocupacao:"" },
      propIndividuais:["",""], propRelacionais:["",""],
      instintos:{ reacao:0,percepcao:0,sagacidade:0,potencia:0,influencia:0,resolucao:0 },
      // Bônus de Assimilação: cobre Instintos/Conhecimentos/Práticas que uma Assimilação
      // aumenta além do teto normal de criação. Guardado separado da base, sem limite fixo
      // e fora do orçamento de pontos da criação; valorInstinto/valorCP somam isso à base
      // em todo lugar que importa (testes, Painel do Assimilador, Saúde). Editável direto
      // na ficha (seção "Bônus de Assimilação" em renderSheet), não no assistente de criação.
      instintosAssimBonus:{ reacao:0,percepcao:0,sagacidade:0,potencia:0,influencia:0,resolucao:0 },
      conhPrat:{}, caracComp:[], caracAumentos:{}, conhPratAssimBonus:{},
      atributoSaude:"potencia",
      saudeNivel:5, saudePontosAtuais:null,
      determinacao:{ caixaAtual:3, pontosAtual:10 },
      equip:{ nome:"", desc:"", traits:[], usosMax:4, usosAtual:4, espaco:1 },
      inventarioExtra:[],
      kitInicial:null,
      notas:"",
      // Assimilação (mutações, ver MUT_DECKS/pressaoTotal/renderMutacoesCard): testesAssimPendentes
      // conta quantos Testes de Assimilação ainda faltam rolar (um Nível de Determinação caiu sem
      // resolver a mutação decorrente); assimTesteAtual guarda a rolagem em andamento (pool de
      // símbolos ainda não gastos, ver iniciarTesteAssimilacao); adquiridas guarda cada mutação
      // já comprada; assimPerdido marca perda de controle definitiva ao acumular 10 C (nunca some).
      testesAssimPendentes:0,
      assimTesteAtual:null,
      mutAdquiridas:[],
      assimPerdido:false,
      // NPC (27/09/2026, pedido do Marco): marca esta ficha como um personagem
      // controlado pelo Assimilador, não por um jogador comum. A única diferença
      // de comportamento é que as rolagens registradas por essa ficha somem do
      // Histórico de Rolagens (aba Mesa) e do painel flutuante pra quem não tem
      // acesso total à mesa (ver testLogVisivelPara) - o Assimilador continua
      // vendo tudo normalmente nos dois lugares. Editável em "Editar Ficha" por
      // quem já pode editar aquela ficha (mesma permissão de sempre); não muda
      // mais nada além disso (a ficha continua aparecendo normalmente nos cards
      // e na Mesa, só com uma etiqueta "NPC" ao lado do nome).
      ehNpc:false
    };
    CONH_PRAT.forEach(function(p){ c.conhPrat[p[0]] = 0; c.conhPratAssimBonus[p[0]] = 0; });
    return c;
  }

  // Valor "de verdade" de um Instinto pra tudo que é jogo (testes, Saúde, Painel do
  // Assimilador): a base da criação (0-3) mais o bônus de Assimilação (ver newCharacter),
  // que não tem teto. Sem bônus salvo (fichas antigas, migradas em migrateChar), cai pra 0.
  function valorInstinto(c, key){
    return (c.instintos[key]||0) + ((c.instintosAssimBonus && c.instintosAssimBonus[key])||0);
  }
  function bestSaudeAttr(c){
    return valorInstinto(c,"resolucao") > valorInstinto(c,"potencia") ? "resolucao" : "potencia";
  }
  function saudePontosMax(c){ var attr = bestSaudeAttr(c); return valorInstinto(c,attr) + 2; }

  // Funções genéricas de item: usadas tanto pro equipamento icônico quanto pros itens extras do inventário.
  function itemCusto(traits){
    var t = 0;
    traits.forEach(function(sel){
      var def = EQUIP_TRAITS.filter(function(e){return e.id===sel.id;})[0];
      if(def) t += def.custo * (sel.qtd||1);
    });
    return t;
  }
  function itemUsosMax(traits){
    var base = 4, consumivel = false;
    traits.forEach(function(sel){
      var def = EQUIP_TRAITS.filter(function(e){return e.id===sel.id;})[0];
      if(!def) return;
      if(def.id === "consumivel"){ consumivel = true; }
      if(def.id === "fragil"){ base -= 1*(sel.qtd||1); }
      if(def.id === "duravel"){ base += 2*(sel.qtd||1); }
    });
    if(consumivel) return 1;
    return Math.max(0, base);
  }
  // O espaço que cada item ocupa (mochila/corpo) é sempre 1; "Espaçoso" nunca entra
  // aqui - ver espacosoBonus/capacidadeInventarioMax logo abaixo, que usam essa
  // característica pra aumentar o TETO total de inventário, não o espaço de um item.
  function itemEspaco(traits){
    return 1;
  }
  // Quanto uma lista de características de item aumenta o TETO de inventário do
  // personagade (não o espaço que o próprio item ocupa - ver itemEspaco acima).
  function espacosoBonus(traits){
    var bonus = 0;
    (traits||[]).forEach(function(sel){
      if(sel.id === "espacoso"){ bonus += 2*(sel.qtd||1); }
    });
    return bonus;
  }
  // Teto total de espaço de inventário do personagem: os 8 clássicos (2 no corpo + 6 na
  // mochila) mais qualquer bônus de "Espaçoso"/"Muito Espaçoso", vindo tanto do equipamento
  // icônico quanto de qualquer item do Inventário adicional que tenha essa característica.
  function capacidadeInventarioMax(c){
    var base = 8;
    var bonus = espacosoBonus(c.equip.traits);
    (c.inventarioExtra||[]).forEach(function(it){ bonus += espacosoBonus(it.traits); });
    return base + bonus;
  }
  function equipCusto(c){ return itemCusto(c.equip.traits); }
  function equipUsosMax(c){ return itemUsosMax(c.equip.traits); }
  function equipEspaco(c){ return itemEspaco(c.equip.traits); }

  // Aplica (ou remove, com key=null) um kit de itens iniciais no Inventário adicional, sem mexer nos itens que o jogador já adicionou à mão.
  function aplicarKitInicial(c, key){
    if(!c.inventarioExtra) c.inventarioExtra = [];
    c.inventarioExtra = c.inventarioExtra.filter(function(it){ return !it.kitKey; });
    c.kitInicial = key || null;
    if(key){
      var kit = KITS_INICIAIS.filter(function(k){return k.id===key;})[0];
      if(kit){
        kit.itens.forEach(function(it){
          c.inventarioExtra.push({ nome:it[0], desc:"", traits:[], usosMax:4, usosAtual:4, espaco:1, qtd:it[1], kitKey:key });
        });
      }
    }
  }

  // Custo de subir um Conhecimento/Prática de "atual" até "final": cada degrau custa
  // o próprio valor final daquele degrau, e o custo é cumulativo (soma de todos os
  // degraus no caminho). Ex.: de 0 até 3 custa 1+2+3=6, não só 3.
  function triangular(n){ return n*(n+1)/2; }
  function custoAumento(atual, final){
    if(final <= atual) return 0;
    return triangular(final) - triangular(atual);
  }
  function caracPontosGastos(c){
    var t = 0;
    Object.keys(c.caracAumentos||{}).forEach(function(k){
      var atual = (c.conhPrat && c.conhPrat[k]) || 0;
      t += custoAumento(atual, c.caracAumentos[k]);
    });
    c.caracComp.forEach(function(id){
      var def = CARACTERISTICAS.filter(function(x){return x.id===id;})[0];
      if(def) t += def.custo;
    });
    return t;
  }
  function conhPratPontosGastos(c){ return sum(Object.keys(c.conhPrat).map(function(k){return c.conhPrat[k];})); }
  // Valor "de criação" de um Conhecimento/Prática, sem o Bônus de Assimilação: se
  // caracAumentos guarda um valor final comprado por característica (até 3), esse
  // valor vale; senão, é a base (0-2) escolhida no Passo 4.
  function valorCPBase(c, key){
    var aum = (c.caracAumentos||{})[key];
    return aum ? aum : ((c.conhPrat && c.conhPrat[key]) || 0);
  }
  function valorCP(c, key){
    // Bônus de Assimilação (ver newCharacter/valorInstinto): soma por cima da base
    // (criação + característica), sem teto - pedido do Marco, 21/09/2026.
    return valorCPBase(c,key) + ((c.conhPratAssimBonus && c.conhPratAssimBonus[key])||0);
  }

  // ---------- APP STATE ----------
  var state = { view:"roster", charId:null, wizStep:0, draft:null, gmUnlocked:loadLS("pangea:gm:codeUnlocked", false),
    sheetEditing:false, sheetDraft:null, itemDraft:null, deleteConfirm:false,
    sheetTest:null, sheetRevealAnim:false,
    // Id do personagem com mudanças de Saúde/Cabo de Guerra/Equipamento-Inventário
    // ainda não confirmadas com a mesa (ver marcarPendenteOuSalvar/pendingSectionBannerHtml,
    // logo depois de updateChar/deleteChar) - nunca salvo, só desta aba, só um de
    // cada vez (só dá pra editar uma ficha aberta por vez). pendenteSecoes marca QUAIS
    // seções desse mesmo personagem têm pendência ("saude"/"cabo"/"equip"/"inv"), pra
    // mostrar o botão "Confirmar alterações" perto de cada seção específica que mudou,
    // em vez de um aviso genérico único no topo da ficha.
    pendenteCharId: null,
    pendenteSecoes: {},
    gmPreviewJogador: loadLS("pangea:gm:previewJogador", false),
    collapsed: loadLS("pangea:collapsed", {}),
    rollFeedCollapsed: loadLS("pangea:rollfeed:collapsed", true),
    // detShakeSeen guarda, por personagem, se a "chacoalhada" de Determinação
    // zerada já tocou nesta aba (ver detZeroEffectHtml). detFlash/detFlashTimers
    // são locais também (nunca salvos): marcam, por personagem, que o efeito
    // Suscetível deve aparecer por alguns segundos porque os pontos do Nível
    // atual acabaram de zerar e cascatear (ver gastarDeterminacao/
    // marcarFlashSuscetivel) - sem isso, esse instante nunca ficaria visível.
    detShakeSeen: {}, detFlash: {}, detFlashTimers: {},
    // true quando a última tentativa de publicar falhou mesmo após as
    // tentativas automáticas de novo (ver publicarComMerge/publicarAgoraComRetry);
    // liga o aviso fixo no topo (renderSyncBanner).
    syncFalhou: false };

  // Card com título + botão de minimizar/expandir (lembra o estado entre renders e recarregamentos).
  function sectionCard(id, title, bodyHtml){
    var collapsed = !!state.collapsed[id];
    return '<div class="card">' +
      '<div class="card-headrow">' +
        '<h2>'+title+'</h2>' +
        '<button type="button" class="card-toggle" data-collapse-toggle="'+id+'" title="'+(collapsed?"Expandir":"Minimizar")+'">'+(collapsed?"▸":"▾")+'</button>' +
      '</div>' +
      (collapsed ? '' : bodyHtml) +
    '</div>';
  }

  function goto(view, extra){
    // Sair da ficha (ou de qualquer tela) confirma sozinha uma pendência de
    // Saúde/Cabo de Guerra/Equipamento-Inventário ainda não confirmada (ver
    // marcarPendenteOuSalvar) - assim ela nunca fica esquecida pra trás.
    flushPendente();
    pararAnimacaoDados();
    state.view = view;
    state.sheetEditing = false;
    state.sheetDraft = null;
    state.itemDraft = null;
    state.deleteConfirm = false;
    state.sheetTest = null;
    state.sheetRevealAnim = false;
    if(extra) Object.assign(state, extra);
    render();
    window.scrollTo(0,0);
  }

  // ---------- RENDER ----------
  var app = document.getElementById("app");

  function render(){
    if(state.view === "roster") renderRoster();
    else if(state.view === "wizard") renderWizard();
    else if(state.view === "sheet"){ if(state.sheetEditing) renderSheetEdit(); else renderSheet(); }
    else if(state.view === "gm") renderGm();
    else if(state.view === "mesa") renderMesa();
    renderRollFeed();
    renderConfirmOverlay();
    renderSyncBanner();
  }

  // Aviso fixo no topo quando uma publicação falhou mesmo depois de tentar de
  // novo (ver publicarComMerge/publicarAgoraComRetry): a mudança está salva
  // só neste navegador até a conexão voltar, então o jogador precisa saber
  // que ainda não é seguro fechar a aba.
  function renderSyncBanner(){
    var el = document.getElementById("sync-banner");
    if(!el) return;
    if(!state.syncFalhou){ el.innerHTML = ""; return; }
    el.innerHTML = '<div style="position:fixed;top:0;left:0;right:0;z-index:9999;' +
      'background:var(--danger);color:#fff;padding:8px 14px;font-size:14px;' +
      'text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.3)">' +
      'Não deu pra sincronizar sua última mudança com o servidor. Ela está salva só '+
      'neste navegador por enquanto, tentando de novo automaticamente. Evite fechar a aba.' +
      '</div>';
  }

  // ---------- MODAL DE CONFIRMAÇÃO PRÓPRIO (substitui o confirm() nativo) ----------
  // Usado por qualquer ação destrutiva/importante da ficha (limpar histórico,
  // limpar personagens destravados, excluir personagem da mesa pelo Painel do
  // Assimilador): pede confirmação com um cartão desenhado na própria página,
  // em vez do confirm() do navegador, que pode não aparecer de jeito nenhum
  // dentro do iframe onde o artifact roda (nesse caso a chamada volta como se
  // o jogador tivesse cancelado, sem nenhum aviso visual - o que combina
  // exatamente com o botão "parecendo não fazer nada" ao clicar).
  var confirmDialog = null; // { mensagem, aoConfirmar }
  function askConfirm(mensagem, aoConfirmar){
    confirmDialog = { mensagem: mensagem, aoConfirmar: aoConfirmar };
    renderConfirmOverlay();
  }
  function renderConfirmOverlay(){
    var el = document.getElementById("confirm-overlay");
    if(!el) return;
    if(!confirmDialog){ el.innerHTML = ""; return; }
    el.innerHTML = '<div class="confirm-overlay"><div class="confirm-box">' +
      '<p>'+esc(confirmDialog.mensagem)+'</p>' +
      '<div class="btn-row"><button type="button" class="btn secondary" data-confirmdlg="cancel">Cancelar</button><button type="button" class="btn danger" data-confirmdlg="ok">Confirmar</button></div>' +
    '</div></div>';
    el.querySelector('[data-confirmdlg="cancel"]').addEventListener("click", function(){ confirmDialog = null; renderConfirmOverlay(); });
    el.querySelector('[data-confirmdlg="ok"]').addEventListener("click", function(){
      var fn = confirmDialog ? confirmDialog.aoConfirmar : null;
      confirmDialog = null;
      renderConfirmOverlay();
      if(fn) fn();
    });
  }

  function topbar(active){
    // "Dono de verdade com acesso total ligado": usado pra decidir o que só o
    // Assimilador de fato vê (a própria aba do Painel, o botão de alternar
    // pra visão de jogador). Enquanto o "Ver como Jogador" estiver ligado,
    // ele deixa de contar como acesso total aqui (mesma regra de
    // temAcessoTotal), pra ver a tela exatamente como um jogador comum veria.
    var donoAtivo = caps.isOwner && !state.gmPreviewJogador;
    var showGm = donoAtivo || state.gmUnlocked;
    var html = "";
    if(!(caps.mode === "mesa" && donoAtivo)){
      // No modo mesa, o dono já ganha uma aba de verdade (abaixo); esse "pontinho" no canto
      // continua existindo só como atalho discreto pro modo local ou pra quem digitou o código.
      html += '<button type="button" class="gm-corner-btn'+(showGm?' unlocked':'')+'" data-nav="gm" '+(showGm?'':'disabled')+' title="'+(showGm?"Área do Assimilador":"Área bloqueada")+'">'+(showGm?"◉":"○")+'</button>';
    }
    html += '<header class="top">' +
      '<div class="brand"><h1 id="brand-title">Fichas de Pangea</h1><small>calculadora de personagens · Assimilação adaptado'+(caps.mode==="mesa"?" · mesa ao vivo":"")+(state.gmPreviewJogador?" · vendo como jogador":"")+'</small></div>' +
      '<nav class="tabs">' +
        '<button data-nav="roster" aria-current="'+(active==="roster")+'">'+(caps.mode==="mesa"?"Personagens da Mesa":"Meus Personagens")+'</button>' +
        '<button data-nav="wizard-new" aria-current="'+(active==="wizard")+'">Criar Personagem</button>' +
        '<button data-nav="mesa" aria-current="'+(active==="mesa")+'">Mesa</button>' +
        (showGm ? '<button data-nav="gm" aria-current="'+(active==="gm")+'">Painel do Assimilador</button>' : "") +
        (caps.mode==="mesa" && caps.isOwner ? '<button type="button" class="btn secondary" data-action="toggle-gm-preview" title="Alterna entre ver a mesa com acesso total (Assimilador) e ver exatamente como um jogador comum veria, sem destravar nada">'+(state.gmPreviewJogador?"🎭 Voltar ao Assimilador":"👁 Ver como Jogador")+'</button>' : "") +
        (caps.mode==="mesa" ? '<button type="button" class="btn secondary" data-action="refresh-mesa" title="Recarrega a página com os dados mais recentes da mesa">↻ Atualizar</button>' : "") +

  function footer(){
    var msg;
    if(caps.mode === "mesa"){
      msg = caps.canEdit
        ? 'Esta mesa está sincronizada ao vivo: qualquer mudança aparece pra todo mundo com o link em poucos segundos.'
        : 'Este link é só de visualização: as fichas atualizam ao vivo, mas pra editar é preciso de um link de edição do Assimilador.';
    } else {

  // ---------- EASTER EGG (acesso discreto a uma área extra) ----------
  // Digite "MB1403" em qualquer tela (fora de campos de texto) pra liberar o botão do Assimilador no canto da página.
  function setupEasterEgg(){
    var code = "MB1403";
    var buffer = "";
    document.addEventListener("keydown", function(e){
      if(state.gmUnlocked) return;
      var tag = (document.activeElement && document.activeElement.tagName) || "";
      if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if(e.key.length !== 1) return;
      buffer += e.key.toUpperCase();
      if(buffer.length > code.length) buffer = buffer.slice(-code.length);
      if(buffer === code){
        state.gmUnlocked = true;
        saveLS("pangea:gm:codeUnlocked", true);
        buffer = "";
        render();
      }
    });
  }

  // Mesma ideia do MB1403, mas pra senha de ficha (nome do personagem + nome
  // do jogador): digite em qualquer lugar da página, fora de campos de texto.
  // Compara sempre a "cauda" normalizada do que foi digitado com a senha de
  // cada personagem ainda trancado pra este navegador (sem separador nem
  // caixa nenhuma pedindo a senha - a ficha simplesmente aparece quando bate).
  var SENHA_BUFFER_MAX = 80;
  function setupSheetPasswordListener(){
    var buffer = "";
    document.addEventListener("keydown", function(e){
      var tag = (document.activeElement && document.activeElement.tagName) || "";
      if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if(e.key.length !== 1) return;
      buffer += e.key;
      if(buffer.length > SENHA_BUFFER_MAX) buffer = buffer.slice(-SENHA_BUFFER_MAX);
      var norm = normalizeSenha(buffer);
      if(!norm) return;
      var alvo = loadChars().filter(function(c){
        if(isCharUnlocked(c)) return false;
        var senha = senhaFicha(c);
        return senha && norm.length >= senha.length && norm.slice(-senha.length) === senha;
      })[0];
      if(alvo){
        buffer = "";
        marcarComoMeu(alvo.id);
        goto("sheet", {charId: alvo.id, sheetRevealAnim: true});
      }
    });
  }

  // Piso mínimo de caixaAtual: a Determinação/Assimilação usa a escala real
  // de 0 a 10 da fonte (ver "O CABO DE GUERRA", tugDeGuerraCardHtml) - as 3
  // caixinhas que Pangea sempre teve (Nível 10 a Nível 7) mais uma extensão
  // até o Nível 0 de Determinação/Nível 10 de Assimilação, guardada como
  // valores negativos de caixaAtual (de -1 a -7) além do 0 a 3 original.
  var DET_CAIXA_FLOOR = -7;

  function exportAllCode(){
    // Em mesa, quem não tem acesso total só pode fazer backup dos próprios
    // personagens (senão o botão de backup vazaria a ficha de todo mundo,
    // driblando a senha inteira).
    return encodeAsBackupCode(visibleChars());
  }
  function importAllCode(code){
    return decodeBackupCode(code);
  }

  function renderRoster(){
    // Só os personagens que este navegador pode ver: em mesa, pra quem não
    // tem acesso total, isso já exclui de vez qualquer ficha ainda trancada -
    // ela não aparece como card nem entra na contagem, simplesmente não existe
    // aqui até a senha certa ser digitada em algum lugar da página.
    var chars = visibleChars();
    var meus = meusIds();
    if(caps.mode === "mesa" && !temAcessoTotal()){
      // Nas mesas ao vivo todo mundo compartilha a mesma lista; só deixamos os
      // personagens deste navegador em primeiro, pra achar o seu mais rápido.
      chars = chars.slice().sort(function(a,b){
        var am = meus.indexOf(a.id)>-1, bm = meus.indexOf(b.id)>-1;
        if(am===bm) return 0;
        return am ? -1 : 1;
      });

    var html = topbar("roster");
    if(caps.mode === "mesa" && !temAcessoTotal()){
      html += '<div class="card tight" style="border-color:var(--accent)">' +
