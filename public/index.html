    html += tentarHtml("Itens achados", gmItensHtml);
    html += backupCardHtml();
    html += '<div class="row" style="justify-content:space-between;align-items:center;margin:20px 0 10px;gap:8px;flex-wrap:wrap"><h2 style="margin:0">Personagens da Mesa</h2><button type="button" class="btn secondary" data-nav="wizard-npc">+ Novo NPC</button></div>';
    var semConta = fichasSemConta();
    if(semConta.length){
      html += '<div class="card tight" style="border-color:var(--danger)"><h3 style="margin:0 0 4px">Ficha'+(semConta.length>1?'s':'')+' de jogador sem conta</h3>' +
        '<p class="hint" style="margin:0">'+semConta.map(function(c){ return '<b>'+esc(c.nomePersonagem||"Sem nome")+'</b>'; }).join(", ")+(semConta.length>1?' não estão':' não está')+' na conta de ninguém. No cartão de cada uma, passe para um jogador ou marque como NPC.</p></div>';
    }
    if(!roster.length){
      html += '<div class="card"><p class="hint">Nenhum personagem criado ainda nesta mesa.</p></div>';
    } else {
      roster.forEach(function(c){
        var camp = c.acampamento ? CAMPS[c.acampamento] : null;
        var cardStyle = (camp?'--camp-color:'+camp.cor+';':'')+'border-left:6px solid '+(camp?camp.cor:'var(--accent)')+';margin-bottom:12px;cursor:pointer';
        html += '<div class="card" style="'+cardStyle+'" data-gmopen="'+c.id+'">';
        html += '<div class="row" style="justify-content:space-between;align-items:flex-start">' +
          '<div><h3 style="color:'+(camp?camp.cor:'var(--ink)')+';font-size:17px;margin-bottom:2px">'+esc(c.nomePersonagem||"Sem nome")+npcBadgeHtml(c)+'</h3>' +
          '<span class="camp-tag">jogador(a): '+esc(c.nomeJogador||"não informado")+(camp?' · '+esc(camp.nome):(grupoLigado()?' · '+esc(grupoRotulo().toLowerCase())+' não definido':''))+'</span>' +
          '<div class="hint" style="margin-top:2px">'+(c.donoUid ? 'Conta: '+esc(c.donoEmail||c.donoNome||"vinculada") : (c.ehNpc ? 'NPC (só o Assimilador)' : '<span style="color:var(--danger)">Ficha de jogador sem conta</span>'))+'</div></div>' +
          '<div class="row gm-acoes" style="gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;min-width:0">' +
            '<label class="gm-npc" style="display:flex;align-items:center;gap:5px;text-transform:none;margin:0;font-size:12px"><input type="checkbox" style="width:auto" data-gmnpc="'+c.id+'"'+(c.ehNpc?' checked':'')+'> NPC</label>' +
            (!c.donoUid ? passarParaHtml(c) : '') +
            (caps.canEdit ? '<button class="btn secondary" data-gmdelmesa="'+c.id+'" style="padding:4px 10px;font-size:11px">excluir</button>' : '') +
          '</div>' +
        '</div>';
        html += gmCharCardBody(c);
        html += gmXpCardHtml(c);
        html += '</div>';
      });
    }
    html += '<div class="btn-row"><button class="btn secondary" data-nav="roster">Voltar</button></div>';

    app.innerHTML = html + caixaHtml();
    bindGlobal();
    tentar("Jogadores e convites", function(){ bindGmJogadores(renderGmMesa); });
    tentar("Configuração da campanha", function(){ bindGmConfig(renderGmMesa); });
    bindGmDryRoll();
    tentar("Bestiário", function(){ bindGmBestiario(renderGmMesa); });
    bindGmConflitos();
    bindGmXp();
    bindGmDocs(renderGmMesa);
    tentar("Itens achados", function(){ bindGmItens(renderGmMesa); });
    tentar("Backup", function(){ bindBackupCard(renderGmMesa); });
    app.querySelectorAll('[data-gmnpc]').forEach(function(el){
      el.addEventListener("click", function(e){ e.stopPropagation(); });
      el.addEventListener("change", function(){
        if(!temAcessoTotal()) return;
        var c = getChar(el.getAttribute("data-gmnpc")); if(!c) return;
        var marcar = el.checked;
        var aplicar = function(){
          c.ehNpc = marcar;
          // NPC é ficha da mesa, vista só pelo mestre: sai da conta que estava vinculada.
          if(c.ehNpc){ c.donoUid = null; c.donoEmail = null; c.donoNome = null; }
          updateChar(c);
          if(caps.mode==="mesa"){ clearTimeout(publishTimer); doPublish(); }
          renderGmMesa();
        };
        if(marcar && c.donoUid){
          el.checked = false; // só marca depois de confirmar
          askConfirm("Marcar "+(c.nomePersonagem||"esta ficha")+" como NPC? Ela sai da conta "+(c.donoEmail||"vinculada")+" e passa a ser vista só por você.", aplicar);
          return;
        }
        aplicar();
      });
    });
    app.querySelectorAll('[data-gmopen]').forEach(function(el){
      el.addEventListener("click", function(e){
        if(e.target.closest('[data-gmdelmesa]') || e.target.closest('[data-gmpassar]') || e.target.closest('.gm-xp') || e.target.closest('.gm-npc')) return;
        goto("sheet", {charId: el.getAttribute("data-gmopen")});
      });
    });
    app.querySelectorAll('[data-gmpassar]').forEach(function(sel){
      sel.addEventListener("click", function(e){ e.stopPropagation(); });
      sel.addEventListener("change", function(){
        var m = sel.value; if(!m) return;
        var c = getChar(sel.getAttribute("data-gmpassar")); if(!c){ sel.value = ""; return; }
        var q = nomeDoMembro(m), quem = q.nome || q.email || "este jogador";
        sel.value = "";
        askConfirm('Passar "'+(c.nomePersonagem||"esta ficha")+'" para '+quem+'? '+(c.ehNpc ? 'Ela deixa de ser NPC, passa' : 'Ela passa')+' a aparecer na conta de '+quem+' (que pode abrir e mexer nela) e ganha uma ficha-base lá. Você continua vendo e ajustando como mestre.', function(){
          passarParaJogador(c.id, m).then(function(){ renderGmMesa(); }).catch(function(err){
            console.error("[Pangea] passar ficha", err);
            alert("Não deu pra passar a ficha: " + (err && (err.code || err.message) || "erro desconhecido"));
          });
        });
      });
    });
    app.querySelectorAll('[data-gmdelmesa]').forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        if(!podeEditar()) return;
        var id = btn.getAttribute("data-gmdelmesa");
        var c = getChar(id);
        askConfirm('Excluir "'+(c?c.nomePersonagem:"este personagem")+'" da mesa pra sempre?', function(){
          deleteChar(id);
          renderGmMesa();
        });
      });
    });
  }

  // ---------- GLOBAL NAV BINDING ----------
  function bindGlobal(){
    app.querySelectorAll("[data-nav]").forEach(function(el){
      el.addEventListener("click", function(){
        var target = el.getAttribute("data-nav");
        // Etapa G: ficha criada pelo mestre nasce NPC (ele desmarca se for dele mesmo).
        if(target === "wizard-new"){ var nova = newCharacter(); if(caps.mode === "mesa" && temAcessoTotal()) nova.ehNpc = true; goto("wizard", {wizStep:0, draft:nova}); return; }
        if(target === "wizard-npc"){ var npc = newCharacter(); npc.ehNpc = true; goto("wizard", {wizStep:0, draft:npc}); return; }
        goto(target);
      });
    });
    var sairBtn = app.querySelector('[data-action="sair"]');
    if(sairBtn) sairBtn.addEventListener("click", function(){ flushPendente(); if(FB) FB.sair(); });
    app.querySelectorAll('[data-action="lobby"]').forEach(function(lobbyBtn){ lobbyBtn.addEventListener("click", voltarAoLobby); });
    var previewBtn = app.querySelector('[data-action="toggle-gm-preview"]');
    if(previewBtn) previewBtn.addEventListener("click", function(){
      state.gmPreviewJogador = !state.gmPreviewJogador;
      saveLS("pangea:gm:previewJogador", state.gmPreviewJogador);
      // Sai pra tela de Personagens ao alternar: evita ficar preso numa tela
      // (ex.: Painel do Assimilador) que deixou de fazer sentido pro modo novo.
      goto("roster");
    });
    app.querySelectorAll('[data-collapse-toggle]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-collapse-toggle");
        state.collapsed[id] = !state.collapsed[id];
        saveLS("pangea:collapsed", state.collapsed);
        render();
      });
    });
  }

  // ---------- INICIALIZAÇÃO ----------
  // Descobre se esta página está publicada como artifact com sincronização ao vivo
  // (modo mesa) ou rodando avulsa (modo local, como sempre funcionou). Nunca trava
  // a tela esperando a plataforma responder: depois de um tempo, segue do jeito
  // que já sabe (e se a resposta chegar depois, só re-renderiza com o que mudou).
  function boot(){
    var resumed = popStashedView();
    if(resumed && resumed.view){
      state.view = resumed.view; state.charId = resumed.charId;
      if(resumed.sheetTest && resumed.sheetTest.charId === resumed.charId){
        state.sheetTest = resumed.sheetTest;
        // Uma publicação de qualquer jogador recarrega a página inteira, mesmo no meio
        // da animação de "rolando"; sem isso, o campo "rolling" restaurado do
        // sessionStorage ficaria travado em true pra sempre. Como o JS reiniciou do
        // zero, nunca há rolagem de verdade em andamento após um reload, então é
        // sempre seguro voltar rolling pra false aqui.
        if(state.sheetTest.rolling){ state.sheetTest.rolling = false; state.sheetTest.rollingCount = 0; }
      }
      if(resumed.view === "sheet" && resumed.sheetEditing && resumed.sheetDraft && resumed.sheetDraft.id === resumed.charId){
        state.sheetEditing = true; state.sheetDraft = resumed.sheetDraft;
      }
      if(resumed.view === "wizard"){
        if(resumed.draft){ state.draft = resumed.draft; state.wizStep = resumed.wizStep || 0; }
        else { state.view = "roster"; } // sem rascunho salvo pra retomar, evita tela quebrada
      }
    } else if(caps.mode === "mesa" && !temAcessoTotal()){
      var meus = meusIds();
      var mine = loadChars().filter(function(c){ return meus.indexOf(c.id) > -1; });
      if(mine.length === 1){ state.view = "sheet"; state.charId = mine[0].id; }
    }
    render();
  }

  // ---------- INICIALIZAÇÃO (Fase 3: login com Google) ----------
  // Sem login, a ficha mostra só a tela "Entrar com Google". Depois do login:
  //  - o mestre (dono da campanha aberta) ouve TODOS os personagens, os resumos e as
  //    rolagens (inclusive as de NPC, em "rolagensNpc");
  //  - um jogador ouve só os personagens vinculados à conta dele (donoUid), os
  //    resumos dos outros que não são NPC e as rolagens comuns.
  // As regras do Firestore garantem isso no servidor; aqui é só o que cada um pede.
  var ouvintes = [];
  function pararOuvintes(){
    ouvintes.forEach(function(u){ try{ u(); }catch(e){} });
    ouvintes = [];
  }
  // Liga a mesa da campanha aberta (campanhaAtual): ouvintes do banco e, quando
  // tudo chegou, monta a ficha (boot).
  function ligarMesa(fb, u){
    caps.isOwner = ehMestre();
    var cid = campanhaAtual.id;
    // Mudanças no documento da campanha (membros, configurações) chegam ao vivo.
    ouvintes.push(fb.ouvirDoc("/campanhas", cid, function(cmp){
      if(usuario !== u || !campanhaAtual || campanhaAtual.id !== cid) return;
      if(!cmp){ avisoLobby = "Essa campanha não existe mais."; mostrarLobby(); return; }
      campanhaAtual = cmp;
      if(!ehMembro()){ avisoLobby = 'Você não faz mais parte de "'+(cmp.nome||"")+'".'; mostrarLobby(); return; }
      agendarRender();
    }, function(e){
      console.warn("[Pangea] campanha", e);
      if(e && e.code === "permission-denied" && usuario === u){ avisoLobby = "Você não faz mais parte dessa campanha."; mostrarLobby(); }
    }));
    var mestre = ehMestre();
    var chegou = { p:false, res:false, r:false, rn:!mestre };
    function talvezRevelar(){
      if(appPronto || !chegou.p || !chegou.res || !chegou.r || !chegou.rn) return;
      appPronto = true;
      boot();
      if(mestre) sincronizarResumos();
      garantirBases();
    }
    ouvintes.push(fb.ouvir("personagens", function(lista){
      aplicarSnapshotPersonagens(lista);
      chegou.p = true; talvezRevelar();
      if(appPronto && mestre){ sincronizarResumos(); sincronizarLeitoresDocs(); }
      if(appPronto) garantirBases();
      agendarRender();
    }, mostrarErroConexao, mestre ? null : ["donoUid", u.uid]));
    ouvintes.push(fb.ouvir("documentos", function(lista){
      shared.documentos = lista; agendarRender();
    }, function(e){ console.warn("[Pangea] documentos", e); }, mestre ? null : ["leitores", u.uid, "array-contains"]));
    ouvintes.push(fb.ouvir("encontrosMesa", function(lista){
      shared.encontrosMesa = lista; verificarRevelacoes(lista); agendarRender(); renderRollFeed();
    }, function(e){ console.warn("[Pangea] ameaças em cena", e); }));
    if(mestre){
      ouvintes.push(fb.ouvir("encontros", function(lista){
        shared.encontros = lista; agendarRender();
      }, function(e){ console.warn("[Pangea] bestiário", e); }));
      ouvintes.push(fb.ouvir("criaturas", function(lista){
        shared.criaturas = lista; agendarRender();
      }, function(e){ console.warn("[Pangea] criaturas", e); }));
      ouvintes.push(fb.ouvir("itensPool", function(lista){
        shared.itensPool = lista; agendarRender();
      }, function(e){ console.warn("[Pangea] itens achados", e); }));
      ouvintes.push(fb.ouvir("documentosNotas", function(lista){
        shared.documentosNotas = lista; agendarRender();
      }, function(e){ console.warn("[Pangea] notas dos documentos", e); }));
      ouvintes.push(fb.ouvir("pedidos", function(lista){
        shared.pedidos = lista; agendarRender();
      }, function(e){ console.warn("[Pangea] pedidos", e); }));
      ouvintes.push(fb.ouvir("convites", function(lista){
        shared.convites = lista; agendarRender();
      }, function(e){ console.warn("[Pangea] convites", e); }));
    }
    ouvintes.push(fb.ouvir("resumos", function(lista){
      shared.resumos = lista;
      chegou.res = true; talvezRevelar(); agendarRender();
    }, mostrarErroConexao, mestre ? null : ["ehNpc", false]));
    ouvintes.push(fb.ouvirRolagens("rolagens", 60, function(lista){
      rolagensComuns = lista; aplicarSnapshotRolagens();
      chegou.r = true; talvezRevelar(); agendarRender();
    }, mostrarErroConexao));
    if(mestre){
      ouvintes.push(fb.ouvirRolagens("rolagensNpc", 60, function(lista){
        rolagensNpc = lista; aplicarSnapshotRolagens();
        chegou.rn = true; talvezRevelar(); agendarRender();
      }, mostrarErroConexao));
    }
  }
  function initCapabilities(){
    var iniciou = false;
    function comFB(fb){
      if(iniciou) return;
      iniciou = true;
      FB = fb;
      app.innerHTML = '<p class="empty">Conectando à mesa…</p>';
      fb.quandoUsuario(function(u){
        pararOuvintes(); pararLobby(); lobby = null;
        appPronto = false; modoBase = null;
        limparMesaLocal();
        campanhaAtual = null; fb.abrirCampanha(null);
        if(!u || u.isAnonymous){
          usuario = null;
          caps.mode = "local"; caps.artifact = null; caps.isOwner = false;
          if(u && u.isAnonymous){ fb.sair(); return; } // sessões anônimas da Fase 1
          try{ sessionStorage.removeItem(CAMPANHA_ABERTA_KEY); }catch(e){}
          mostrarLogin();
          return;
        }
        usuario = u;
        caps.artifact = fb;
        caps.mode = "mesa";
        caps.canEdit = true;
        // Depois do login vem sempre a tela inicial; só um recarregar da aba volta
        // direto pra campanha que estava aberta nela.
        var reabrir = null;
        try{ reabrir = sessionStorage.getItem(CAMPANHA_ABERTA_KEY); }catch(e){}
        if(!reabrir){ mostrarLobby(); return; }
        app.innerHTML = '<p class="empty">Abrindo a campanha…</p>';
        fb.lerDoc("/campanhas", reabrir).then(function(cmp){
          if(usuario !== u) return;
          if(cmp && (!cmp.migracao || cmp.migracao.etapa === "ok") && ehMembroDe(cmp)) entrarNaCampanha(cmp);
          else mostrarLobby();
        }).catch(function(){ if(usuario === u) mostrarLobby(); });
      });
    }
    if(window.PANGEA_FB){ comFB(window.PANGEA_FB); return; }
    if(window.PANGEA_FB_ERRO){ mostrarErroConexao(window.PANGEA_FB_ERRO); return; }
    app.innerHTML = '<p class="empty">Conectando à mesa…</p>';
    window.addEventListener("pangea-fb-ready", function(){ comFB(window.PANGEA_FB); });
    window.addEventListener("pangea-fb-erro", function(){ mostrarErroConexao(window.PANGEA_FB_ERRO); });
    setTimeout(function(){ if(!iniciou) mostrarErroConexao(null); }, 20000);
  }

  initCapabilities();
})();
</script>
<script type="module">
// Ponte com o Firebase (site ficha-pangea.web.app). A ficha em si (script acima)
// só enxerga window.PANGEA_FB e nunca importa nada do Firebase diretamente.
// Fase 3 (login): entrada com conta Google; o Assimilador é reconhecido pelo e-mail.
const V = "10.12.2";
try {
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut } =
    await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const { getFirestore, collection, doc, onSnapshot, writeBatch, getDocs, getDoc, query, where, orderBy, limit } =
    await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);

  // No próprio site (web.app/firebaseapp.com) o login usa o domínio do site, o que
  // evita problemas de login por redirecionamento em Safari/iPhone.
  const noSiteFirebase = /\.(web\.app|firebaseapp\.com)$/.test(location.hostname);
  const firebaseConfig = {
    apiKey: "AIzaSyB4RpPYOuPe87Pw98aBNjjYPAMZtz3V0gI",
    authDomain: noSiteFirebase ? location.hostname : "ficha-pangea.firebaseapp.com",
    projectId: "ficha-pangea",
    storageBucket: "ficha-pangea.firebasestorage.app",
    messagingSenderId: "476574641686",
    appId: "1:476574641686:web:f078f9859ebe49af89cf37"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  getRedirectResult(auth).catch((e) => console.warn("[Pangea] retorno do login", e));

  const lista = (snap) => snap.docs.map((d) => d.data());

  // Campanhas (etapa A): o resto da ficha continua chamando as coleções pelos nomes
  // antigos ("personagens", "rolagens"...). Aqui elas viram subcoleções da campanha
  // aberta: personagens -> campanhas/{id}/fichas, as outras com o mesmo nome.
  // Um nome começando com "/" é um caminho direto (ex.: "/campanhas", "/fichas" ou
  // as coleções antigas da raiz, lidas só na migração).
  const DA_CAMPANHA = { personagens: "fichas", resumos: "resumos", rolagens: "rolagens", rolagensNpc: "rolagensNpc",
    documentos: "documentos", documentosNotas: "documentosNotas", encontros: "encontros", encontrosMesa: "encontrosMesa",
    itensPool: "itensPool", meta: "meta", notas: "notas", locais: "locais", convites: "convites", pedidos: "pedidos", criaturas: "criaturas" };
  let campanhaId = null;
  const caminho = (col) => {
    if (col.charAt(0) === "/") return col.slice(1);
    if (DA_CAMPANHA[col]) {
      if (!campanhaId) throw new Error("Nenhuma campanha aberta (" + col + ")");
      return "campanhas/" + campanhaId + "/" + DA_CAMPANHA[col];
    }
    return col;
  };

  window.PANGEA_FB = {
    quandoUsuario(cb) { return onAuthStateChanged(auth, cb); },
    async entrar() {
      const p = new GoogleAuthProvider();
      p.setCustomParameters({ prompt: "select_account" });
      try { await signInWithPopup(auth, p); }
      catch (e) {
        const usarRedirect = ["auth/popup-blocked", "auth/operation-not-supported-in-environment", "auth/cancelled-popup-request"];
        if (usarRedirect.includes(e.code)) return signInWithRedirect(auth, p);
        throw e;
      }
    },
    sair() { return signOut(auth); },
    // filtro opcional: [campo, valor] => só documentos com campo == valor
    abrirCampanha(id) { campanhaId = id || null; },
    campanhaAberta() { return campanhaId; },
    ouvir(col, cb, erro, filtro) {
      const c = caminho(col);
      const ref = filtro ? query(collection(db, c), where(filtro[0], filtro[2] || "==", filtro[1])) : collection(db, c);
      return onSnapshot(ref, (snap) => cb(lista(snap)), erro);
    },
    ouvirDoc(col, id, cb, erro) {
      return onSnapshot(doc(db, caminho(col), id), (s) => cb(s.exists() ? s.data() : null), erro);
    },
    ouvirRolagens(col, n, cb, erro) {
      const q = query(collection(db, caminho(col)), orderBy("ts", "desc"), limit(n));
      return onSnapshot(q, (snap) => cb(lista(snap)), erro);
    },
    async lerDoc(col, id) {
      const s = await getDoc(doc(db, caminho(col), id));
      return s.exists() ? s.data() : null;
    },
    // Lê uma coleção inteira com o id de cada documento (usado na migração).
    async lerColecao(col) {
      const snap = await getDocs(collection(db, caminho(col)));
      return snap.docs.map((d) => ({ id: d.id, data: d.data() }));
    },
    // Lê uma consulta (filtro [campo, valor, op?]) com o id de cada documento.
    async lerConsulta(col, filtro) {
      const q = query(collection(db, caminho(col)), where(filtro[0], filtro[2] || "==", filtro[1]));
      const snap = await getDocs(q);
      return snap.docs.map((d) => ({ id: d.id, data: d.data() }));
    },
    // ops: [{tipo:"set"|"update"|"del", col, id, data}] — gravadas em lotes de até 400.
    async escrever(ops) {
      for (let i = 0; i < ops.length; i += 400) {
        const b = writeBatch(db);
        ops.slice(i, i + 400).forEach((o) => {
          const ref = doc(db, caminho(o.col), o.id);
          if (o.tipo === "del") b.delete(ref);
          else if (o.tipo === "update") b.update(ref, o.data);
          else b.set(ref, o.data);
        });
        await b.commit();
      }
    },
    async limparColecao(col) {
      const snap = await getDocs(collection(db, caminho(col)));
      await this.escrever(snap.docs.map((d) => ({ tipo: "del", col, id: d.id })));
    }
  };
  window.dispatchEvent(new Event("pangea-fb-ready"));
} catch (e) {
  console.error("[Pangea] Firebase não carregou", e);
  window.PANGEA_FB_ERRO = e;
  window.dispatchEvent(new Event("pangea-fb-erro"));
}
