      ]]
    ]
  };
  // Conta quantos A/B/C tem numa string de custo (ex.: "BBA" -> {s:1,a:2,p:0}).
  function custoSimbolos(str){
    var s=0,a=0,p=0;
    (str||"").split("").forEach(function(ch){ if(ch==="A") s++; else if(ch==="B") a++; else if(ch==="C") p++; });
    return {s:s,a:a,p:p};
  }
  // Mesma leitura de custoSimbolos, mas em texto puro (sem HTML) com os mesmos
  // ✓/⟳/⚠ usados em custoChipHtml - pra usar dentro de <option> de <select>,
  // onde markup não renderiza (ex.: o seletor de nível no registro manual de
  // mutação, que antes mostrava a string de código crua tipo "BA").
  function custoSimbolosTexto(str){
    var s = custoSimbolos(str);
    var parts = [];
    if(s.s) parts.push("✓"+s.s);
    if(s.a) parts.push("⟳"+s.a);
    if(s.p) parts.push("⚠"+s.p);
    return parts.join(" ");
  }

  // ---- Símbolos nos TEXTOS DE EFEITO das cartas de Assimilação (MUT_DECKS) ----
  // custoSimbolos/custoSimbolosTexto (acima) já cuidam da string de CUSTO de cada
  // tier (ex. "BBA"), mas o texto do EFEITO em si (tier[2], livre, ex. "Some B
  // numa face de dado mantido...") ainda citava as mesmas letras A/B/C soltas, e
  // também "d"/"e" pros Pontos de Determinação/Assimilação que o livro definitivo
  // usa como atalho - a pedido do Marco (27/09/2026), agora viram os mesmos
  // símbolos/cores do resto da ficha em vez de letras. Duas letras exigem cuidado
  // extra pra não estragar frases comuns em português:
  // - "d"/"e" nunca podem casar com uma letra dentro de outra palavra (ex. "dúvida",
  //   "então") nem com uma unidade como "°C" - por isso as expressões abaixo usam a
  //   faixa de acentos do português (PT_LETRA) como fronteira, em vez do \b padrão
  //   do JS, que só entende [A-Za-z0-9_] e trataria "d" de "dúvida" como palavra
  //   solta.
  // - "e" sozinho (sem número na frente, tipo "1e") é ambíguo com a conjunção "e"
  //   ("e") que aparece o tempo todo no texto normal - não dá pra distinguir com uma
  //   regra geral sem arriscar trocar um "e" comum por um losango. Por isso, essa
  //   função só troca "e" isolado quando vem colado a um número (ex. "2e") ou
  //   quando o próprio MUT_DECKS já marca o ponto com "[E]" no lugar da letra (só
  //   nos ~10 casos genuínos identificados manualmente, tipo "Gasta todos os [E]");
  //   a conjunção "e" nunca é tocada. Já "d" sozinho é seguro de trocar sempre - não
  //   existe palavra de uma letra só "d" em português (exceto a contração "d'água",
  //   por isso o lookahead exclui apóstrofo).
  var PT_LETRA = "A-Za-zÀ-ÖØ-öø-ÿ";
  var RE_EFEITO_ABC = new RegExp("(?<![" + PT_LETRA + "0-9°])[ABCP]{1,6}(?![" + PT_LETRA + "0-9])", "g");
  // Nota: essas expressões rodam DEPOIS do esc() (ver formatEfeito), que já
  // converteu qualquer apóstrofo literal em "&#39;" - por isso a exclusão de
  // contrações tipo "d'água" testa "&" (início da entidade), não o apóstrofo
  // em si, que a essa altura já não existe mais no texto.
  var RE_EFEITO_DIGITO_DE = new RegExp("(?<![" + PT_LETRA + "0-9])(\\d+)([de])(?![" + PT_LETRA + "0-9&])", "g");
  var RE_EFEITO_D_SOLTO = new RegExp("(?<![" + PT_LETRA + "0-9])d(?![" + PT_LETRA + "0-9&])", "g");
  // Troca, num texto de descrição JÁ ESCAPADO (HTML), as menções a Nível e
  // Pontos de Determinação/Assimilação/Saúde pelos ícones oficiais (ver icoHtml).
  // "caixa de Saúde" é o mesmo que ponto de Saúde na ficha. O número na frente
  // ("1 Ponto de Determinação") fica, só a expressão vira ícone.
  var RE_ICO_TEXTO = [
    [/(Níveis|Nível|níveis|nível) de Determinação/g, "nd"],
    [/(Níveis|Nível|níveis|nível) de Assimilação/g, "na"],
    [/(Níveis|Nível|níveis|nível) de Saúde/g, "ns"],
    [/(Pontos|Ponto|pontos|ponto|Pts|pts|pt) de Determinação/g, "pd"],
    [/(Pontos|Ponto|pontos|ponto) de Assimilação/g, "pa"],
    [/(Pontos|Ponto|pontos|ponto|caixas|caixa) de Saúde/g, "ps"],
    [/(?<![A-Za-zÀ-ÿ])(Sucessos|Sucesso)(?![A-Za-zÀ-ÿ])/g, "ds"],
    [/(?<![A-Za-zÀ-ÿ])(Adaptações|Adaptação)(?![A-Za-zÀ-ÿ])/g, "da"],
    [/(?<![A-Za-zÀ-ÿ])(Pressões|Pressão)(?![A-Za-zÀ-ÿ])/g, "dp"]
  ];
  var DADO_TITULOS = { s:"Sucesso", a:"Adaptação", p:"Pressão" };
  function dadoHtml(k){
    return '<span class="dado dado-'+k+'" title="'+DADO_TITULOS[k]+'" role="img" aria-label="'+DADO_TITULOS[k]+'"></span>';
  }
  // Resultado de um dado com os ícones (ex.: [besouro]2 [cervo]1), pra botões,
  // chips e o painel de rolagens. diceResultLabel continua existindo pro texto puro.
  function diceResultHtml(d){
    var parts = [];
    if(d.s) parts.push(dadoHtml("s")+d.s);
    if(d.a) parts.push(dadoHtml("a")+d.a);
    if(d.p) parts.push(dadoHtml("p")+d.p);
    return parts.length ? parts.join(" ") : "em branco";
  }
  function iconizarTexto(html){
    // Só mexe no TEXTO, nunca dentro de tags já existentes (ex.: o title de um
    // ícone já inserido também diz "Pontos de Determinação").
    return String(html==null?"":html).split(/(<[^>]*>)/).map(function(parte){
      if(parte.charAt(0) === "<") return parte;
      var marcado = parte;
      RE_ICO_TEXTO.forEach(function(r){ marcado = marcado.replace(r[0], "\u0001"+r[1]+"\u0001"); });
      return marcado.replace(/\u0001(\w\w)\u0001/g, function(_, k){ return k.charAt(0)==="d" && DADO_TITULOS[k.charAt(1)] ? dadoHtml(k.charAt(1)) : icoHtml(k); });
    }).join("");
  }
  function formatEfeito(txt, htmlColor){
    function sym(color, ch){ return htmlColor ? '<span style="color:'+color+'">'+ch+'</span>' : ch; }
    // Pontos de Determinação ("d") e de Assimilação ("e"/[E]) viram os ícones
    // oficiais (triângulos) no HTML; no texto puro continuam sendo ♦.
    function symPts(k){ return htmlColor ? icoHtml(k) : "♦"; }
    var out = esc(txt);
    out = out.split("[E]").join(symPts("pa"));
    out = out.replace(RE_EFEITO_ABC, function(run){
      return run.split("").map(function(ch){
        if(ch==="A") return htmlColor ? dadoHtml("s") : "✓";
        if(ch==="B") return htmlColor ? dadoHtml("a") : "⟳";
        return htmlColor ? dadoHtml("p") : "⚠"; // C ou P (Pressão)
      }).join("");
    });
    out = out.replace(RE_EFEITO_DIGITO_DE, function(_, n, letra){
      return n + symPts(letra==="d" ? "pd" : "pa");
    });
    out = out.replace(RE_EFEITO_D_SOLTO, function(){ return symPts("pd"); });
    if(htmlColor) out = iconizarTexto(out);
    return out;
  }

  // ---------- STORAGE ----------
  function loadLS(key, fallback){
    try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  }
  function saveLS(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch(e){ return false; }
  }
  // Converte fichas salvas com Determinação em escala única de 0 a 10 pro formato
  // atual (3 caixas de 10 pontos cada, 0 a 30), preservando o preenchimento relativo.
  function migrateChar(c){
    if(c && c.determinacao && (c.determinacao.caixaAtual===undefined || c.determinacao.pontosAtual===undefined)){
      var oldMax = c.determinacao.max || 10;
      var oldAtual = c.determinacao.atual != null ? c.determinacao.atual : oldMax;
      var totalNovo = clamp(Math.round((oldAtual/oldMax)*30), 0, 30);
      var caixaAtual = totalNovo<=0 ? 0 : Math.ceil(totalNovo/10);
      var pontosAtual = caixaAtual<=0 ? 0 : totalNovo - (caixaAtual-1)*10;
      c.determinacao = { caixaAtual: caixaAtual, pontosAtual: pontosAtual };
    }
    // Fichas de antes do Bônus de Assimilação (21/09/2026, ver newCharacter/valorInstinto/
    // valorCP) não têm esses campos: preenche com 0 em tudo, sem mexer em nada que já exista.
    if(c){
      if(!c.instintosAssimBonus) c.instintosAssimBonus = {};
      INSTINTOS.forEach(function(i){ if(c.instintosAssimBonus[i[0]]==null) c.instintosAssimBonus[i[0]] = 0; });
      if(!c.conhPratAssimBonus) c.conhPratAssimBonus = {};
      CONH_PRAT.forEach(function(p){ if(c.conhPratAssimBonus[p[0]]==null) c.conhPratAssimBonus[p[0]] = 0; });
      // Recalcula o espaço de cada item (itemEspaco é sempre 1; "Espaçoso" só aumenta o
      // teto total via capacidadeInventarioMax, nunca o espaço do próprio item) toda vez
      // que a ficha carrega, pra fichas antigas se corrigirem sozinhas sem reabrir "Editar Ficha".
      if(c.equip) c.equip.espaco = itemEspaco(c.equip.traits);
      if(Array.isArray(c.inventarioExtra)){
        c.inventarioExtra.forEach(function(it){ it.espaco = itemEspaco(it.traits); });
      }
      // Fichas de antes do sistema de Assimilações/mutações (27/09/2026, ver
      // newCharacter/MUT_DECKS/renderMutacoesCard): preenche os campos novos sem
      // mexer em nada que já exista.
      if(c.testesAssimPendentes == null) c.testesAssimPendentes = 0;
      if(c.assimTesteAtual === undefined) c.assimTesteAtual = null;
      if(!Array.isArray(c.mutAdquiridas)) c.mutAdquiridas = [];
      if(c.assimPerdido == null) c.assimPerdido = false;
      recalcularPerdaAntiga(c);
      // Fichas de antes da tag "NPC" (27/09/2026, ver newCharacter/testLogVisivelPara): sem
      // marcação salva, o personagem é tratado como jogador comum (rolagens visíveis a todos).
      if(c.ehNpc == null) c.ehNpc = false;
      if(c.sistema !== "oficial" && c.determinacao && c.instintos) converterParaSistemaOficial(c);
      if(!c.caracEscolhas) c.caracEscolhas = {};
      if(c.equip && c.equip.qualidade == null){ c.equip.qualidade = 3; c.equip.pressao = 0; }
      (c.inventarioExtra||[]).forEach(function(it){ if(it.qualidade == null){ it.qualidade = 3; it.pressao = 0; } });
    }
    return c;
  }
  // ---------- CONVERSÃO PRO SISTEMA OFICIAL (livro definitivo) ----------
  // Fichas criadas antes (sistema Fastplay/Pangea) são convertidas uma vez: o que é da
  // história fica (nome, acampamento, origem, propósitos, Instintos, mutações, Cabo de
  // Guerra, notas); Conhecimentos/Práticas, Características e Artefato inicial zeram pra
  // serem refeitos pelas regras do livro (decisão do Marco, 28/09/2026). A Saúde passa
  // pra 6 Níveis. A ficha fica marcada com precisaRefazer até o jogador refazer.
  var MAPA_TRAIT_ANTIGO = { fragil:"fragil", improvisado:"improvisado", agil:"agil", iluminador:"iluminador", letal:"letal",
    discreta:"discreto", protetivo:"protetivo", nutritivo:"restaurador", tatica:"eficiente", duravel:"duravel",
    espacoso:"espacoso", explosivo:"explosivo", inflamavel:"inflamavel", medico:"medicinal", consumivel:"uso_unico" };
  var charsConvertidosAgora = {};
  function converterParaSistemaOficial(c){
    c.conhPrat = {}; c.conhPratAssimBonus = {};
    CONH_PRAT.forEach(function(p){ c.conhPrat[p[0]] = 0; c.conhPratAssimBonus[p[0]] = 0; });
    c.caracAntigas = (c.caracComp||[]).slice();
    c.caracComp = []; c.caracAumentos = {}; c.caracEscolhas = {};
    c.saudeNivel = clamp((c.saudeNivel!=null ? c.saudeNivel : 5) + 1, 0, 6);
    c.saudePontosAtuais = saudePontosMax(c);
    var eqAnt = c.equip || {};
    c.equipAntigo = { nome:eqAnt.nome||"", traits:(eqAnt.traits||[]).map(function(t){ return t.id; }) };
    c.equip = { nome:eqAnt.nome||"", desc:eqAnt.desc||"", traits:[], qualidade:3, pressao:0, usosMax:null, usosAtual:null, espaco:1 };
    c.inventarioExtra = (c.inventarioExtra||[]).map(function(it){
      var traits = (it.traits||[]).map(function(t){ var id = MAPA_TRAIT_ANTIGO[t.id]; return id ? {id:id, qtd:t.qtd||1} : null; }).filter(Boolean);
      return novoItem(it.nome, it.desc, traits, it.kitKey ? { qtd:it.qtd||1, kitKey:it.kitKey } : { qtd:it.qtd||1 });
    });
    var d = c.determinacao || (c.determinacao = { caixaAtual:3, pontosAtual:10 });
    d.pontosAtual = clamp(d.pontosAtual!=null ? d.pontosAtual : 10, 0, nivelDetAtual(c));
    d.suscetivel = d.pontosAtual <= 0;
    delete c.atributoSaude; delete c.caboDeGuerraAtivo; delete c.instintosDist;
    c.sistema = "oficial";
    c.precisaRefazer = true;
    c.convertidoEm = new Date().toISOString();
    charsConvertidosAgora[c.id] = true;
  }

  /* ===== Documentos de Pangea: desenha um papel a partir dos dados =====
     doc = { id, titulo, texto, escrita, papel, condicao, data, assinatura, carimbo, cabecalho }
     escrita:  manuscrito | rabisco | datilografado | relatorio | antigo
     papel:    liso | caderno
     condicao: preservado | gasto | amassado | rasgado | pedacos | queimado | molhado | mofado | ensanguentado
     Marcações no texto: linha em branco = novo parágrafo; [ilegível] = borrão;
     ~~riscado~~; {{apagado}}; **destaque**;
     parágrafo começando com "> " = anotação à mão de outra pessoa.
     Todo o estrago é sorteado a partir do id do documento: todo mundo vê o mesmo papel. */
  var PDOC_ESCRITAS = [["manuscrito","Manuscrito"],["rabisco","Rabisco apressado"],["datilografado","Máquina de escrever"],["relatorio","Relatório impresso"],["antigo","Documento antigo"]];
  var PDOC_CONDICOES = [["preservado","Preservado"],["gasto","Gasto"],["amassado","Amassado"],["rasgado","Rasgado"],["pedacos","Em pedaços"],["queimado","Queimado"],["molhado","Molhado"],["mofado","Mofado"],["ensanguentado","Manchado de sangue"]];

  function pdocHash(str){
    var h = 2166136261;
    for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function pdocRng(seed){
    var a = seed || 1;
    return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function pdocEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function pdocSvg(svg){ return "url('data:image/svg+xml,"+encodeURIComponent(svg).replace(/'/g,"%27")+"')"; }

  // Letra à mão: cada palavra ganha uma inclinação, um desnível e uma pressão de tinta
  // próprios (sorteados), pra não parecer fonte de computador alinhada.
  function pdocMaoTremida(html, rnd, forte){
    var giro = forte ? 4.2 : 1.3, sobe = forte ? 3.2 : 1.4;
    return html.split(/(<[^>]+>)/).map(function(parte){
      if(parte.charAt(0) === "<") return parte;
      return parte.replace(/[^\s]+/g, function(w){
        var r = ((rnd()-.5)*2*giro).toFixed(2), y = ((rnd()-.5)*2*sobe).toFixed(1);
        var o = (forte ? .80 : .86) + rnd()*(forte ? .20 : .14);
        var s = forte ? (0.93 + rnd()*0.14).toFixed(2) : 1;
        var peso = "";
        return '<span class="pdoc-palavra" style="transform:translateY('+y+'px) rotate('+r+'deg)'+(s!==1?' scale('+s+')':'')+(o<.995?';opacity:'+o.toFixed(2):'')+peso+'">'+w+'</span>';
      });
    }).join("");
  }

  function pdocTexto(txt, rnd, escrita){
    var t = pdocEsc(txt||"").replace(/\r/g,"");
    t = t.replace(/\[ileg[ií]vel\]/gi, '<span class="ilegivel" title="ilegível"></span>');
    t = t.replace(/~~([\s\S]+?)~~/g, "<s>$1</s>");
    t = t.replace(/\{\{([\s\S]+?)\}\}/g, '<span class="apagado">$1</span>');
    t = t.replace(/\*\*([\s\S]+?)\*\*/g, "<b>$1</b>");
    var mao = escrita === "manuscrito" || escrita === "rabisco";
    // Parágrafo começando com "> " = anotação à mão de outra pessoa (lápis, na margem/rodapé).
    return t.split(/\n\s*\n/).map(function(p){
      p = p.trim();
      if(p.indexOf("&gt; ") === 0) return '<p class="pdoc-nota">'+pdocMaoTremida(p.slice(5).replace(/\n/g,"<br>"), rnd, false)+"</p>";
      p = p.replace(/\n/g,"<br>");
      return "<p>"+(mao ? pdocMaoTremida(p, rnd, escrita === "rabisco") : p)+"</p>";
    }).join("");
  }

  // Borda irregular: pontos ao longo do perímetro, em %, com recuo sorteado.
  function pdocBordaPts(rnd, amp, lados, pedaco){
    var pts = [], n = 26;
    function j(lado){ return lados[lado] ? rnd()*amp[lado] : rnd()*0.35; }
    for(var i=0;i<=n;i++) pts.push([i/n*100, j("t")]);
    for(i=1;i<=n;i++) pts.push([100-j("r"), i/n*100]);
    for(i=n-1;i>=0;i--) pts.push([i/n*100, 100-j("b")]);
    for(i=n-1;i>=1;i--) pts.push([j("l"), i/n*100]);
    if(pedaco){
      var cx = pedaco.canto.indexOf("r")>-1 ? 100 : 0, cy = pedaco.canto.indexOf("b")>-1 ? 100 : 0;
      function dentro(p){ return Math.abs(p[0]-cx)/pedaco.w + Math.abs(p[1]-cy)/pedaco.h < 1; }
      var longe = 0, dmax = -1;
      pts.forEach(function(p, idx){ var d = Math.pow(p[0]-cx,2)+Math.pow(p[1]-cy,2); if(d>dmax){ dmax=d; longe=idx; } });
      pts = pts.slice(longe).concat(pts.slice(0, longe));
      var i0 = -1, i1 = -1;
      pts.forEach(function(p, idx){ if(dentro(p)){ if(i0<0) i0 = idx; i1 = idx; } });
      if(i0 > 0 && i1 < pts.length-1){
        var a = pts[i0-1], z = pts[i1+1], rasgo = [];
        for(var k=1;k<12;k++){
          var f = k/12, x = a[0]+(z[0]-a[0])*f, y = a[1]+(z[1]-a[1])*f;
          rasgo.push([Math.min(100,Math.max(0, x + (rnd()-.5)*4)), Math.min(100,Math.max(0, y + (rnd()-.5)*4))]);
        }
        pts = pts.slice(0, i0).concat(rasgo, pts.slice(i1+1));
      }
    }
    return pts;
  }
  function pdocPoly(pts){ return "polygon(" + pts.map(function(p){ return (typeof p[0]==="string"?p[0]:p[0].toFixed(2)+"%")+" "+(typeof p[1]==="string"?p[1]:p[1].toFixed(2)+"%"); }).join(",") + ")"; }
  function pdocBorda(rnd, amp, lados, pedaco){ return pdocPoly(pdocBordaPts(rnd, amp, lados, pedaco)); }

  // Borda gasta com uma "orelha" (canto dobrado) de s px no canto escolhido.
  function pdocBordaOrelha(rnd, canto, s){
    var pts = pdocBordaPts(rnd, {t:.9,r:.9,b:.9,l:.9}, {t:true,r:true,b:true,l:true}, null);
    // perto do canto dobrado a borda fica reta (sem desgaste), pra dobra encaixar certinho
    var kx = canto.indexOf("r")>-1 ? 100 : 0, ky = canto.indexOf("b")>-1 ? 100 : 0;
    pts = pts.map(function(p){
      if(Math.abs(p[0]-kx) < 22 && Math.abs(p[1]-ky) < 22){
        var q = [p[0], p[1]];
        if(Math.abs(q[1]-ky) < 1.2 || q[1] < 1.2 || q[1] > 98.8) q[1] = Math.round(q[1]/100)*100;
        if(Math.abs(q[0]-kx) < 1.2 || q[0] < 1.2 || q[0] > 98.8) q[0] = Math.round(q[0]/100)*100;
        return q;
      }
      return p;
    });
    var cx = canto.indexOf("r")>-1, cy = canto.indexOf("b")>-1;
    // tira os pontos do canto e troca pela diagonal da dobra (em px, com calc)
    var X = function(off){ return cx ? "calc(100% - "+off+"px)" : off+"px"; };
    var Y = function(off){ return cy ? "calc(100% - "+off+"px)" : off+"px"; };
    var alvoX = cx ? 100 : 0, alvoY = cy ? 100 : 0, idx = 0, dmin = 1e9;
    pts.forEach(function(p, i){ var d = Math.abs(p[0]-alvoX)+Math.abs(p[1]-alvoY); if(d<dmin){ dmin=d; idx=i; } });
    // o ponto do canto vira dois pontos (fim da dobra em cada lado); a ordem depende do sentido do contorno
    var horizontalPrimeiro = (canto==="tr" || canto==="bl");
    var p1 = horizontalPrimeiro ? [X(s), Y(0)] : [X(0), Y(s)], p2 = horizontalPrimeiro ? [X(0), Y(s)] : [X(s), Y(0)];
    pts.splice(idx, 1, p1, p2);
    return pdocPoly(pts);
  }

  function pdocManchas(rnd, qtd, cor1, cor2, raioMin, raioMax, anel){
    var g = [];
    for(var i=0;i<qtd;i++){
      var x = (8+rnd()*84).toFixed(1), y = (8+rnd()*84).toFixed(1), r = Math.round(raioMin + rnd()*(raioMax-raioMin));
      if(anel) g.push("radial-gradient(circle "+r+"px at "+x+"% "+y+"%, transparent "+(r-7)+"px, "+cor1+" "+(r-4)+"px, "+cor2+" "+(r-1)+"px, transparent "+r+"px)");
      else g.push("radial-gradient(ellipse "+r+"px "+Math.round(r*(.6+rnd()*.5))+"px at "+x+"% "+y+"%, "+cor1+", "+cor2+" 70%, transparent 72%)");
    }
    return g;
  }
  // Pintinhas de oxidação (o "foxing" de papel velho).
  function pdocPintas(rnd, qtd, cor){
    var g = [];
    for(var i=0;i<qtd;i++){
      var x = (3+rnd()*94).toFixed(1), y = (3+rnd()*94).toFixed(1), r = (1.5+rnd()*5).toFixed(1);
      g.push("radial-gradient(circle "+r+"px at "+x+"% "+y+"%, "+cor+", transparent)");
    }
    return g;
  }
  // Vinco: linha escura + reflexo claro, num ângulo qualquer.
  function pdocVinco(rnd, forte){
    var ang = Math.round(rnd()*180), pos = (20+rnd()*60).toFixed(1), a = forte ? .30 : .20;
    return "linear-gradient("+ang+"deg, transparent calc("+pos+"% - 2px), rgba(70,45,15,"+a+") "+pos+"%, rgba(255,250,235,"+(a+.15)+") calc("+pos+"% + 1.2px), transparent calc("+pos+"% + 3px))";
  }
  // Relevo de papel amassado: ruído + luz rasante (fica numa camada em "multiply").
  function pdocRelevo(rnd, freq, altura, octavas){
    var seed = Math.floor(rnd()*900)+1;
    return pdocSvg("<svg xmlns='http://www.w3.org/2000/svg' width='600' height='800'><filter id='r' x='0' y='0' width='100%' height='100%'>" +
      "<feTurbulence type='fractalNoise' baseFrequency='"+freq+"' numOctaves='"+octavas+"' seed='"+seed+"' result='n'/>" +
      "<feDiffuseLighting in='n' surfaceScale='"+altura+"' lighting-color='#fff' diffuseConstant='1.05'><feDistantLight azimuth='"+(200+Math.round(rnd()*60))+"' elevation='52'/></feDiffuseLighting>" +
      "</filter><rect width='100%' height='100%' filter='url(#r)'/></svg>");
  }
  // Mancha orgânica (água, mofo, sangue): ruído cortado num limiar, pintado de uma cor,
  // concentrado numa região (máscara radial) e com a borda mais escura.
  function pdocMancha(rnd, cor, freq, corte, borda, regiao){
    var seed = Math.floor(rnd()*900)+1;
    var cx = regiao ? regiao.x : 50, cy = regiao ? regiao.y : 50, raio = regiao ? regiao.r : 80;
    return pdocSvg("<svg xmlns='http://www.w3.org/2000/svg' width='600' height='800' viewBox='0 0 600 800' preserveAspectRatio='none'>" +
      "<defs><radialGradient id='g' cx='"+cx+"%' cy='"+cy+"%' r='"+raio+"%'><stop offset='0' stop-color='#fff'/><stop offset='.7' stop-color='#fff'/><stop offset='1' stop-color='#000'/></radialGradient>" +
      "<mask id='m'><rect width='100%' height='100%' fill='url(#g)'/></mask>" +
      "<filter id='f' x='0' y='0' width='100%' height='100%' color-interpolation-filters='sRGB'><feTurbulence type='fractalNoise' baseFrequency='"+freq+"' numOctaves='4' seed='"+seed+"'/>" +
      "<feColorMatrix type='matrix' values='0 0 0 0 "+cor[0]+"  0 0 0 0 "+cor[1]+"  0 0 0 0 "+cor[2]+"  2.4 0 0 0 -"+corte+"'/>" +
      "<feComponentTransfer><feFuncA type='table' tableValues='"+borda+"'/></feComponentTransfer><feGaussianBlur stdDeviation='1.2'/></filter></defs>" +
      "<rect width='100%' height='100%' filter='url(#f)' mask='url(#m)'/></svg>");
  }

  // Papel amassado e aberto de novo: uma malha irregular de facetas (triângulos)
  // com luz e sombra alternadas, e vincos curtos nas bordas de algumas facetas -
  // é o que dá a cara de papel amarrotado, em vez de linhas retas cruzando a folha.
  function pdocAmassado(rnd){
    var cols = 9, rows = 12, W = 600, H = 800, pts = [], r, c;
    for(r=0; r<=rows; r++){ pts.push([]); for(c=0; c<=cols; c++){
      var x = c*W/cols, y = r*H/rows;
      if(c>0 && c<cols) x += (rnd()-.5)*W/cols*.8;
      if(r>0 && r<rows) y += (rnd()-.5)*H/rows*.8;
      pts[r].push([x.toFixed(1), y.toFixed(1)]);
    } }
    var faces = "", vincos = "";
    function tri(a,b,c2){
      var luz = rnd(), fill = luz > .5 ? "rgba(255,252,240,"+(.04+(luz-.5)*.22).toFixed(3)+")" : "rgba(95,65,25,"+(.02+(.5-luz)*.16).toFixed(3)+")";
      faces += "<polygon points='"+a.join(",")+" "+b.join(",")+" "+c2.join(",")+"' fill='"+fill+"'/>";
    }
    function vinco(a,b){
      if(rnd() > .32) return;
      vincos += "<line x1='"+a[0]+"' y1='"+a[1]+"' x2='"+b[0]+"' y2='"+b[1]+"' stroke='rgba(80,52,18,.2)' stroke-width='.9'/>" +
        "<line x1='"+(+a[0]+1.2)+"' y1='"+(+a[1]+1.2)+"' x2='"+(+b[0]+1.2)+"' y2='"+(+b[1]+1.2)+"' stroke='rgba(255,250,235,.3)' stroke-width='.8'/>";
    }
    for(r=0; r<rows; r++) for(c=0; c<cols; c++){
      var p00 = pts[r][c], p10 = pts[r][c+1], p01 = pts[r+1][c], p11 = pts[r+1][c+1];
      if(rnd() < .5){ tri(p00,p10,p11); tri(p00,p11,p01); vinco(p00,p11); }
      else { tri(p00,p10,p01); tri(p10,p11,p01); vinco(p10,p01); }
      vinco(p00,p10); vinco(p00,p01);
    }
    return pdocSvg("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 800' preserveAspectRatio='none'><defs><filter id='t' x='-5%' y='-5%' width='110%' height='110%'><feTurbulence type='fractalNoise' baseFrequency='.018' numOctaves='2' seed='"+Math.floor(rnd()*900+1)+"'/><feDisplacementMap in='SourceGraphic' scale='26'/><feGaussianBlur stdDeviation='.9'/></filter>" +
      "<filter id='v' x='-5%' y='-5%' width='110%' height='110%'><feTurbulence type='fractalNoise' baseFrequency='.03' numOctaves='2' seed='"+Math.floor(rnd()*900+1)+"'/><feDisplacementMap in='SourceGraphic' scale='14'/></filter></defs>" +
      "<g filter='url(#t)'>"+faces+"</g><g filter='url(#v)'>"+vincos+"</g></svg>");
  }

  function renderDocumento(doc){
    doc = doc || {};
    var escrita = doc.escrita || "manuscrito", cond = doc.condicao || "gasto", papel = doc.papel || "liso";
    var rnd = pdocRng(pdocHash(String(doc.id || doc.titulo || "doc")));
    var giroMax = { preservado:.6, amassado:4, pedacos:1.5 }[cond] || 2.4;
    var giro = ((rnd()-.5) * giroMax).toFixed(2);
    var estilo = "--giro:"+giro+"deg;", sujeira = [], relevo = null, extras = "";

    if(cond === "gasto"){
      // manchas de uso, pintas de oxidação, dedos sujos, desbotado, dobras e orelha (sem o anel de xícara)
      sujeira = sujeira.concat(pdocManchas(rnd, 3, "rgba(95,65,30,.16)", "rgba(95,65,30,.06)", 30, 80, false));
      sujeira = sujeira.concat(pdocManchas(rnd, 2, "rgba(60,45,30,.20)", "rgba(60,45,30,.07)", 14, 26, false)); // dedos
      sujeira = sujeira.concat(pdocPintas(rnd, 22, "rgba(120,70,20,.55)"));
      sujeira.push("radial-gradient(ellipse "+Math.round(90+rnd()*80)+"px "+Math.round(60+rnd()*60)+"px at "+(20+rnd()*60).toFixed(0)+"% "+(20+rnd()*60).toFixed(0)+"%, rgba(240,228,195,.55), transparent 75%)"); // tinta desbotada
      sujeira.push(pdocVinco(rnd, true));
      relevo = pdocRelevo(rnd, 0.035, 1.6, 3);
      if(rnd() < .75){
        var cantoO = ["tl","tr","bl","br"][Math.floor(rnd()*4)], s = Math.round(34 + rnd()*22);
        estilo += "clip-path:"+pdocBordaOrelha(rnd, cantoO, s)+";";
        extras += '<div class="pdoc-orelha pdoc-orelha-'+cantoO+'" style="width:'+s+'px;height:'+s+'px"></div>';
      } else {
        estilo += "clip-path:"+pdocBorda(rnd, {t:.9,r:.9,b:.9,l:.9}, {t:true,r:true,b:true,l:true}, null)+";";
      }
    }
    if(cond === "amassado"){
      relevo = pdocRelevo(rnd, 0.02 + rnd()*0.01, 2.6, 4);
      sujeira.push(pdocAmassado(rnd));
      sujeira = sujeira.concat(pdocPintas(rnd, 8, "rgba(110,70,30,.35)"));
      estilo += "clip-path:"+pdocBorda(rnd, {t:1.4,r:1.4,b:1.4,l:1.4}, {t:true,r:true,b:true,l:true}, null)+";";
    }
    if(cond === "rasgado"){
      var lados = { t:rnd()<.5, r:rnd()<.5, b:rnd()<.6, l:rnd()<.4 };
      if(!lados.t && !lados.r && !lados.b && !lados.l) lados.b = true;
      var cantos = doc.titulo ? ["bl","br"] : ["tl","tr","bl","br"];  // não arranca o título
      estilo += "clip-path:"+pdocBorda(rnd, {t:3.5,r:3,b:4,l:3}, lados, { canto:cantos[Math.floor(rnd()*cantos.length)], w:18+rnd()*16, h:14+rnd()*14 })+";";
      sujeira = sujeira.concat(pdocPintas(rnd, 10, "rgba(120,70,20,.4)"));
      relevo = pdocRelevo(rnd, 0.03, 1.2, 3);
    }
    if(cond === "queimado"){
      estilo += "clip-path:"+pdocBorda(rnd, {t:4,r:4,b:5,l:4}, {t:true,r:true,b:true,l:true}, rnd()<.6 ? { canto:["tl","tr","bl","br"][Math.floor(rnd()*4)], w:14+rnd()*12, h:12+rnd()*12 } : null)+";";
      for(var q=0;q<5;q++){
        var lado = Math.floor(rnd()*4), pos = (10+rnd()*80).toFixed(1), rr = Math.round(40+rnd()*70);
        var xy = lado===0 ? pos+"% 0%" : lado===1 ? "100% "+pos+"%" : lado===2 ? pos+"% 100%" : "0% "+pos+"%";
        sujeira.push("radial-gradient(circle "+rr+"px at "+xy+", rgba(25,10,2,.95), rgba(80,35,8,.7) 45%, rgba(140,80,25,.25) 70%, transparent 80%)");
      }
      relevo = pdocRelevo(rnd, 0.03, 1.4, 3);
    }
    if(cond === "molhado"){
      sujeira.push(pdocMancha(rnd, [.42,.40,.34], (0.0028 + rnd()*0.0018).toFixed(4), .78, "0 0 0 0 0 0 .5 .2 .15 .14 .14", null));
      relevo = pdocRelevo(rnd, 0.008, 2.2, 2); // papel ondulado depois de secar
    }
    if(cond === "mofado"){
      var mx = Math.round(15+rnd()*70), my = Math.round(15+rnd()*70);
      sujeira.push(pdocMancha(rnd, [.30,.36,.22], "0.012", .55, "0 0 0 0 .35 .55 .45 .5 .55 .6 .6", { x:mx, y:my, r:55 }));
      sujeira.push(pdocMancha(rnd, [.12,.14,.10], "0.03", .85, "0 0 0 0 0 0 0 .6 .75 .8 .8", { x:mx, y:my, r:40 }));
      sujeira = sujeira.concat(pdocPintas(rnd, 40, "rgba(40,50,30,.55)"));
      relevo = pdocRelevo(rnd, 0.02, 1.2, 3);
    }
    if(cond === "ensanguentado"){
      // Cada documento sorteia seus próprios padrões: poça, borda encharcada, respingo em arco,
      // gotas escorridas ou dedos arrastados - nunca a mesma mancha em dois papéis.
      var sangue = "rgba(75,10,5,", tipos = [];
      tipos.push(rnd() < .55 ? "poca" : "borda");
      var extrasSangue = ["arco","escorrido","gotas","arco","gotas"];
      tipos.push(extrasSangue[Math.floor(rnd()*extrasSangue.length)]);
      if(rnd() < .35) tipos.push(extrasSangue[Math.floor(rnd()*extrasSangue.length)]);
      tipos.forEach(function(tipo){
        if(tipo === "poca"){
          var px = Math.round(12+rnd()*76), py = Math.round(12+rnd()*76);
          sujeira.push(pdocMancha(rnd, [.30,.04,.02], (0.005+rnd()*0.006).toFixed(4), (.86+rnd()*.12).toFixed(2), "0 0 0 0 0 .95 .82 .8 .8 .82 .85", { x:px, y:py, r:Math.round(20+rnd()*16) }));
        } else if(tipo === "borda"){
          var lado = Math.floor(rnd()*4), pos = Math.round(10+rnd()*80);
          var ex = lado===1 ? 100 : lado===3 ? 0 : pos, ey = lado===0 ? 0 : lado===2 ? 100 : pos;
          sujeira.push(pdocMancha(rnd, [.28,.04,.02], (0.005+rnd()*0.005).toFixed(4), .7, "0 0 0 0 .6 .9 .8 .78 .78 .8 .82", { x:ex, y:ey, r:Math.round(26+rnd()*16) }));
        } else if(tipo === "arco"){
          var ax = 10+rnd()*80, ay = 10+rnd()*80, ang = rnd()*Math.PI*2, curva = (rnd()-.5)*.08, n = 12+Math.floor(rnd()*10);
          for(var i=0;i<n;i++){
            var d = i*(2.2+rnd()*1.6), a2 = ang + curva*i;
            var gx = ax + Math.cos(a2)*d, gy = ay + Math.sin(a2)*d*1.3;
            if(gx<1||gx>99||gy<1||gy>99) continue;
            var gr = Math.max(1.2, (7.5 - i*.35) * (.5+rnd()*.7)), alon = (1+rnd()*.9);
            sujeira.push("radial-gradient(ellipse "+(gr*alon).toFixed(1)+"px "+gr.toFixed(1)+"px at "+gx.toFixed(1)+"% "+gy.toFixed(1)+"%, "+sangue+".9), "+sangue+".5) 70%, transparent)");
          }
        } else if(tipo === "escorrido"){
          var topo = 5+rnd()*50, n2 = 2+Math.floor(rnd()*3), base = 10+rnd()*70;
          for(var k=0;k<n2;k++){
            var sx = (base + k*(3+rnd()*5)).toFixed(1), comp = Math.round(25+rnd()*55), larg = (1.6+rnd()*1.8).toFixed(1);
            sujeira.push("radial-gradient(ellipse "+larg+"px "+comp+"px at "+sx+"% "+topo.toFixed(1)+"%, "+sangue+".75), "+sangue+".45) 60%, transparent)");
            sujeira.push("radial-gradient(circle "+(+larg+2.5).toFixed(1)+"px at "+sx+"% calc("+topo.toFixed(1)+"% + "+comp+"px), "+sangue+".9), transparent)");
          }
        } else if(tipo === "gotas"){
          var cx2 = 10+rnd()*80, cy2 = 10+rnd()*80, n3 = 6+Math.floor(rnd()*8);
          for(var g2=0; g2<n3; g2++){
            var gx2 = cx2 + (rnd()-.5)*30, gy2 = cy2 + (rnd()-.5)*30, gr2 = (1.5+rnd()*rnd()*9).toFixed(1);
            if(gx2<1||gx2>99||gy2<1||gy2>99) continue;
            sujeira.push("radial-gradient(circle "+gr2+"px at "+gx2.toFixed(1)+"% "+gy2.toFixed(1)+"%, "+sangue+".9), "+sangue+".55) 65%, transparent)");
          }
        }
      });
      sujeira = sujeira.concat(pdocPintas(rnd, 10, "rgba(110,70,30,.35)"));
      relevo = pdocRelevo(rnd, 0.03, 1.4, 3);
    }
    if(cond === "pedacos"){
      sujeira = sujeira.concat(pdocPintas(rnd, 14, "rgba(120,70,20,.45)"));
      sujeira.push(pdocVinco(rnd, false));
      relevo = pdocRelevo(rnd, 0.03, 1.6, 3);
    }

    var classes = "pdoc escrita-"+escrita+" cond-"+cond+(papel==="caderno"?" papel-caderno":"")+(doc.carimbo?" pdoc-com-carimbo":"")+(doc.titulo?"":" pdoc-sem-titulo");
    var bilhete = (doc.tamanho === "bilhete") || (!doc.tamanho && String(doc.texto||"").length < 140 && !doc.titulo);
    var miolo = "";
    if(doc.carimbo) miolo += '<div class="pdoc-carimbo">'+pdocEsc(doc.carimbo)+'</div>';
    miolo += '<div class="pdoc-corpo">';
    if(escrita === "relatorio" && doc.cabecalho && (doc.cabecalho[0]||doc.cabecalho[1])) miolo += '<div class="pdoc-cabecalho"><span>'+pdocEsc(doc.cabecalho[0]||"")+'</span><span>'+pdocEsc(doc.cabecalho[1]||"")+'</span></div>';
    if(doc.data) miolo += '<div class="pdoc-data">'+pdocEsc(doc.data)+'</div>';
    if(doc.titulo) miolo += '<div class="pdoc-titulo">'+(escrita==="manuscrito"||escrita==="rabisco" ? pdocMaoTremida(pdocEsc(doc.titulo), rnd, escrita==="rabisco") : pdocEsc(doc.titulo))+'</div>';
    miolo += '<div class="pdoc-texto">'+pdocTexto(doc.texto, rnd, escrita)+'</div>';
    if(doc.assinatura) miolo += '<div class="pdoc-assinatura">'+pdocEsc(doc.assinatura)+'</div>';
    miolo += '</div>';
    if(relevo) miolo += '<div class="pdoc-relevo" style="background-image:'+relevo+'"></div>';
    miolo += '<div class="pdoc-sujeira"'+(sujeira.length?' style="background-image:'+sujeira.join(",")+'"':'')+'></div>';
    miolo += extras;

    var html = '<div class="pdoc-wrap'+(bilhete?' pdoc-bilhete':'')+(cond==="pedacos"?' pdoc-wrap-pedacos':'')+'">';
    if(cond === "pedacos"){
      // Mesmo papel desenhado duas (ou três) vezes, cada cópia recortada num pedaço,
      // separadas por um rasgo irregular e um pouco afastadas umas das outras.
      var xt = 38 + rnd()*24, xb = 38 + rnd()*24, rasgo = [];
      for(var k=0;k<=18;k++){ var f = k/18; rasgo.push([Math.max(4, Math.min(96, xt + (xb-xt)*f + (rnd()-.5)*5)), f*100]); }
      var bordaFina = function(){ return rnd()*0.8; };
      var esq = [[0+bordaFina(),0+bordaFina()]].concat(rasgo, [[0+bordaFina(),100-bordaFina()]]);
      var dir = [[100-bordaFina(),0+bordaFina()]].concat(rasgo.slice(), [[100-bordaFina(),100-bordaFina()]]);
      var tres = rnd() < .5, pecas = [];
      if(tres){
        // o pedaço da direita se parte de novo, na horizontal
        var yc = 45 + rnd()*20, cortes = [];
        for(k=0;k<=10;k++){ cortes.push([null, yc + (rnd()-.5)*5]); }
        var xRasgoEm = function(y){ var best = rasgo[0]; rasgo.forEach(function(p){ if(Math.abs(p[1]-y) < Math.abs(best[1]-y)) best = p; }); return best[0]; };
        var x0 = xRasgoEm(yc);
        cortes = cortes.map(function(c, i){ return [x0 + (100-x0)*(i/10), c[1]]; });
        var rasgoCima = rasgo.filter(function(p){ return p[1] <= yc; }), rasgoBaixo = rasgo.filter(function(p){ return p[1] >= yc; });
        var dirCima = rasgoCima.concat(cortes, [[100-bordaFina(), 0+bordaFina()]]);
        var dirBaixo = [cortes[0]].concat(rasgoBaixo, [[100-bordaFina(),100-bordaFina()]], cortes.slice().reverse().slice(0, cortes.length-1));
        pecas = [ { poly:esq, t:"rotate("+(-1.2+rnd()*.8).toFixed(2)+"deg)" },
                  { poly:dirCima, t:"translate("+(14+rnd()*10).toFixed(0)+"px,"+(-4-rnd()*6).toFixed(0)+"px) rotate("+(1+rnd()*2).toFixed(2)+"deg)" },
                  { poly:dirBaixo, t:"translate("+(10+rnd()*10).toFixed(0)+"px,"+(10+rnd()*8).toFixed(0)+"px) rotate("+(-.5-rnd()*2).toFixed(2)+"deg)" } ];
      } else {
        pecas = [ { poly:esq, t:"rotate("+(-1.2+rnd()*.8).toFixed(2)+"deg)" },
                  { poly:dir, t:"translate("+(16+rnd()*12).toFixed(0)+"px,"+(4+rnd()*10).toFixed(0)+"px) rotate("+(1+rnd()*2).toFixed(2)+"deg)" } ];
      }
      pecas.forEach(function(pc, i){
        html += '<div class="'+classes+(i>0?' pdoc-peca-extra':'')+'" style="'+estilo+'clip-path:'+pdocPoly(pc.poly)+';transform:'+pc.t+'">'+miolo+'</div>';
      });
    } else {
      html += '<div class="'+classes+'" style="'+estilo+'">'+miolo+'</div>';
    }
    html += '</div>';
    return html;
  }

  // Filtros SVG usados pelos papéis: tinta escorrida (molhado) e traço de lápis (rabisco).
  function pdocInstalarFiltros(){
    if(document.getElementById("pdoc-filtros")) return;
    var d = document.createElement("div");
    d.id = "pdoc-filtros"; d.style.cssText = "position:absolute;width:0;height:0;overflow:hidden";
    d.innerHTML = '<svg width="0" height="0"><filter id="pdoc-tinta-escorrida" x="-5%" y="-5%" width="110%" height="110%">' +
      '<feTurbulence type="fractalNoise" baseFrequency="0.018 0.09" numOctaves="2" seed="7" result="t"/>' +

  // ---------- MODO MESA (Firebase) ----------
  // Versão do site próprio (ficha-pangea.web.app), 28/09/2026: os dados moram no
  // Firestore, UM DOCUMENTO POR PERSONAGEM (coleção "personagens") e um por rolagem
  // (coleção "rolagens"). Cada mudança grava só o documento do personagem mexido -
  // nunca mais a página inteira - e todo mundo com a ficha aberta recebe a mudança
  // em tempo real (onSnapshot), sem recarregar nada. Isso substitui o mecanismo
  // antigo do Claude Artifact (republicar o HTML inteiro a cada salvamento), que era
  // a causa dos dados sumindo/corrompendo quando dois jogadores mexiam juntos.
  //  - modo local: só usado se a página abrir sem o Firebase (nunca deveria no site).
  //  - modo mesa: Firebase conectado. "shared" é só o espelho em memória do banco.
  var caps = { artifact:null, mode:"local", isOwner:false, canEdit:true };

  var shared = { characters:[], testLog:[], resumos:[] }; // espelho em memória do banco (modo mesa)
  // Fase 3 (login): conta Google logada e quem é o Assimilador. A regra de verdade
  // fica no servidor (regras do Firestore); aqui é só pra montar a tela certa.
  // Campanhas (etapa A): tudo da mesa mora em campanhas/{id}/... e quem mestra é o
  // DONO da campanha (campo donoUid), não mais um e-mail fixo. O e-mail abaixo só
  // serve pra uma coisa: autorizar a migração única da mesa antiga para a
  // campanha Pangea (ver migrarParaCampanhas).
  var MIGRACAO_EMAIL = "marcoa.barreto14@gmail.com";
  var CAMPANHA_PADRAO = "pangea";
  var campanhaAtual = null; // documento campanhas/{id} da campanha aberta
  // Etapa H: ficha-base aberta fora de campanha (Criar ficha / Abrir em Minhas fichas).
  // { cmp: campanha de origem da ficha (só para a configuração da criação) ou null }.
  // Enquanto estiver ligado, campanhaAtual é null e as fichas vêm de fichas/{id} da conta.
  var modoBase = null;
  var usuario = null;
  function ehMestre(){ return !!(usuario && campanhaAtual && campanhaAtual.donoUid === usuario.uid); }
  function ehMembro(){ return !!(usuario && campanhaAtual && (campanhaAtual.donoUid === usuario.uid || (campanhaAtual.membros||[]).indexOf(usuario.uid) > -1)); }
  var rolagensComuns = [], rolagensNpc = [];

    // Etapa G: sem login não existe mais ficha guardada só no navegador.
    return caps.mode === "mesa" ? shared.characters : [];

  }

  // Personagens marcados como NPC (ver newCharacter/renderSheetEdit): suas
  // rolagens somem do Histórico de Rolagens (aba Mesa) e do painel flutuante
  // pra quem não tem acesso total à mesa (jogadores comuns) - o Assimilador
  // continua vendo tudo normalmente nos dois lugares (temAcessoTotal). Usa
  // sempre a lista COMPLETA de personagens (loadChars, não visibleChars):
  // o que decide aqui é a marcação NPC do personagem. Uma entrada cujo personagem não é
  // mais encontrado (por exemplo, já excluído) continua visível normalmente.
  function testLogVisivelPara(log){
    if(temAcessoTotal()) return log;
    var chars = loadChars();
    return log.filter(function(t){

  }

  // "Meus" personagens = os vinculados à conta Google logada (donoUid).
  function meusIds(){

  }

  // Acesso total (vê e mexe em tudo): o mestre da campanha aberta.
  // Exceção: o próprio Assimilador pode ligar o "Ver como Jogador" (abaixo)
  // pra testar a experiência de um jogador comum sem sair da própria conta;
  // enquanto isso estiver ligado, ele perde o acesso total (mas continua
  // podendo desligar a qualquer momento pelo botão que só ele vê).
  function temAcessoTotal(){
    if(caps.mode !== "mesa") return false;
    if(caps.isOwner && state.gmPreviewJogador) return false;
    return caps.isOwner;
  }
  // Jogador: só as fichas da própria conta.

  function visibleChars(){

  // ---------- GRAVAÇÃO NO FIRESTORE ----------
  // FB = ponte pro Firebase criada pelo script de módulo no fim da página
  // (window.PANGEA_FB). Cada gravação manda SÓ os documentos que esta aba mudou:
  // personagens tocados (dirtyCharIds), personagens excluídos (dirtyDeletedCharIds)
  // e rolagens novas (dirtyTestLogEntries). Como cada personagem é um documento
  // separado, a mudança de um jogador nunca apaga a de outro.
  var FB = null;
  var publishTimer = null;
  var dirtyCharIds = {};
  var dirtyDeletedCharIds = {};
  var dirtyTestLogEntries = [];
  var retryTimer = null;
  function temPendencias(){
    return Object.keys(dirtyCharIds).length>0 || Object.keys(dirtyDeletedCharIds).length>0 || dirtyTestLogEntries.length>0;
  }
  function marcarCharSujo(id){ dirtyCharIds[id] = true; delete dirtyDeletedCharIds[id]; }
  function marcarCharExcluido(id){ delete dirtyCharIds[id]; dirtyDeletedCharIds[id] = true; }
  function schedulePublish(){
    clearTimeout(publishTimer);
    publishTimer = setTimeout(doPublish, 500);
  }
  // O Firestore não aceita "undefined" em nenhum campo: a ida e volta por JSON
  // remove esses campos (e qualquer outra coisa que não seja dado puro).
  function paraFirestore(obj){ return JSON.parse(JSON.stringify(obj)); }
  function doPublish(){
    publishTimer = null;
    if(!FB || caps.mode !== "mesa") return;
    if(!temPendencias()) return;
    var idsChars = Object.keys(dirtyCharIds);
    var idsDel = Object.keys(dirtyDeletedCharIds);
    var entries = dirtyTestLogEntries.slice();
    var ops = [];
    // Etapa H: fora de campanha a ficha mexida é a ficha-base (fichas/{id} da conta).
    // Sem resumo, sem rolagens e sem exclusão (a ficha-base não é apagada daqui).
    if(modoBase){
      idsDel = []; entries = []; dirtyDeletedCharIds = {}; dirtyTestLogEntries = [];
      idsChars.forEach(function(id){
        var c = shared.characters.filter(function(x){ return x.id===id; })[0];
        if(c && usuario && c.donoUid === usuario.uid) ops.push({ tipo:"set", col:"/fichas", id:id, data:paraFirestore(c) });
      });
    }
    else idsChars.forEach(function(id){
      var c = shared.characters.filter(function(x){ return x.id===id; })[0];
      if(c){
        ops.push({ tipo:"set", col:"personagens", id:id, data:paraFirestore(c) });
        ops.push({ tipo:"set", col:"resumos", id:id, data:montarResumo(c) });
      }
    });
    idsDel.forEach(function(id){
      ops.push({ tipo:"del", col:"personagens", id:id });
      ops.push({ tipo:"del", col:"resumos", id:id });
    });
    entries.forEach(function(e){ ops.push({ tipo:"set", col:(e.npc ? "rolagensNpc" : "rolagens"), id:e.id, data:paraFirestore(e) }); });
    // Tira da fila já na hora (o Firestore guarda e reenvia sozinho se a rede
    // oscilar); só volta pra fila se o servidor RECUSAR de verdade a gravação.
    idsChars.forEach(function(id){ delete dirtyCharIds[id]; });
    idsDel.forEach(function(id){ delete dirtyDeletedCharIds[id]; });
    dirtyTestLogEntries = dirtyTestLogEntries.filter(function(e){ return entries.indexOf(e) === -1; });
    return FB.escrever(ops).then(function(){
      if(state.syncFalhou){ state.syncFalhou = false; renderSyncBanner(); }
    }).catch(function(err){
      console.error("[Pangea] falha ao gravar no Firestore", err);
      idsChars.forEach(function(id){ if(!dirtyDeletedCharIds[id]) dirtyCharIds[id] = true; });
      idsDel.forEach(function(id){ if(!dirtyCharIds[id]) dirtyDeletedCharIds[id] = true; });
      entries.forEach(function(e){ if(dirtyTestLogEntries.indexOf(e) === -1) dirtyTestLogEntries.push(e); });
      state.syncFalhou = true;
      renderSyncBanner();
      clearTimeout(retryTimer);
      retryTimer = setTimeout(doPublish, 5000);
    });
  }
  // Aplica uma mudança "em bloco" (hoje só o Limpar Histórico de Rolagens) e grava
  // na hora. Personagens que sumiram da lista viram exclusões; se o histórico ficou
  // vazio, apaga a coleção "rolagens" inteira no banco.
  function publicarAgoraComRetry(mutateFn){
    if(!FB || caps.mode !== "mesa") return;
    var idsAntes = shared.characters.map(function(c){ return c.id; });
    var logAntes = shared.testLog.map(function(e){ return e.id; });
    mutateFn(shared);
    var idsDepois = {}; shared.characters.forEach(function(c){ idsDepois[c.id] = true; });
    idsAntes.forEach(function(id){ if(!idsDepois[id]) marcarCharExcluido(id); });
    var p;
    if(!shared.testLog.length && logAntes.length){
      dirtyTestLogEntries = [];
      p = FB.limparColecao("rolagens").then(function(){ return ehMestre() ? FB.limparColecao("rolagensNpc") : null; });
    } else {
      p = Promise.resolve();
    }
    p.then(function(){ doPublish(); render(); }).catch(function(err){

  // ---------- RECEBENDO MUDANÇAS EM TEMPO REAL ----------
  var appPronto = false;
  var renderAdiado = false;
  function estaDigitando(){
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  }
  // Re-renderiza quando chega mudança de outra pessoa, mas nunca no meio de uma
  // digitação (espera o campo perder o foco).
  function agendarRender(){
    if(!appPronto) return;
    if(estaDigitando()){ renderAdiado = true; return; }
    renderAdiado = false;
    render();
  }
  document.addEventListener("focusout", function(){
    setTimeout(function(){ if(renderAdiado && !estaDigitando()) agendarRender(); }, 50);
  });
  // Personagens vindos do banco. Os que ESTA aba ainda está mexendo (pendência de
  // Saúde/Cabo de Guerra/Equipamento não confirmada, ou gravação na fila) mantêm a
  // versão local, pra uma mudança de outra pessoa não atropelar o que está sendo
  // feito aqui.
  function aplicarSnapshotPersonagens(lista){
    var locais = {};
    shared.characters.forEach(function(c){ locais[c.id] = c; });
    var protegidos = {};
    Object.keys(dirtyCharIds).forEach(function(id){ protegidos[id] = true; });
    if(state.pendenteCharId) protegidos[state.pendenteCharId] = true;
    var nova = lista.map(function(c){
      return (protegidos[c.id] && locais[c.id]) ? locais[c.id] : migrateChar(c);
    });
    Object.keys(protegidos).forEach(function(id){
      if(locais[id] && !nova.some(function(x){ return x.id===id; })) nova.push(locais[id]);
    });
    nova = nova.filter(function(c){ return !dirtyDeletedCharIds[c.id]; });
    nova.sort(function(a,b){ return String(a.criadoEm||"").localeCompare(String(b.criadoEm||"")); });
    shared.characters = nova;
    var convertidos = Object.keys(charsConvertidosAgora);
    if(convertidos.length && ehMestre()){
      convertidos.forEach(function(id){ if(nova.some(function(x){ return x.id===id; })) marcarCharSujo(id); });
      schedulePublish();
    }
    charsConvertidosAgora = {};
  }
  function aplicarSnapshotRolagens(){
    var lista = rolagensComuns.concat(rolagensNpc);
    var ids = {};
    lista.forEach(function(e){ ids[e.id] = true; });
    var extras = dirtyTestLogEntries.filter(function(e){ return !ids[e.id]; });
    var nova = extras.concat(lista);
    nova.sort(function(a,b){ return String(b.ts||"").localeCompare(String(a.ts||"")); });
    if(nova.length > 60) nova.length = 60;
    shared.testLog = nova;
    tentar("Teste de Assimilação", function(){ verificarAssimNovos(nova); });
  }
  // Semente única: se o banco está vazio e nunca foi semeado, copia pra lá os
  // personagens embutidos neste HTML (backup do artefato antigo) e marca meta/migracao.
  // Resumo público de um personagem (coleção "resumos"): só o que a aba Mesa mostra
  // pros outros jogadores - nome, jogador, acampamento, Saúde e Nível no Cabo de
  // Guerra. Instintos, anotações, inventário etc. nunca saem da ficha completa.
  function montarResumo(c){
    return paraFirestore({
      id: c.id, nomePersonagem: c.nomePersonagem||"", nomeJogador: c.nomeJogador||"",
      acampamento: c.acampamento||null, saudeNivel: c.saudeNivel!=null ? c.saudeNivel : 6,
      saudePontosAtuais: c.saudePontosAtuais!=null ? c.saudePontosAtuais : saudePontosMax(c),
      saudeMax: saudePontosMax(c),
      determinacao: { caixaAtual: c.determinacao && c.determinacao.caixaAtual!=null ? c.determinacao.caixaAtual : 3 },
      ehNpc: !!c.ehNpc, donoUid: c.donoUid || null, criadoEm: c.criadoEm || null
    });
  }
  // O Assimilador mantém os resumos em dia: cria os que faltam (fichas antigas) e
  // corrige os desatualizados. Roda ao entrar e a cada mudança nos personagens.
  var sincronizandoResumos = false, sincronizarDeNovo = false;
  function sincronizarResumos(){
    if(!FB || !ehMestre()) return;
    if(sincronizandoResumos){ sincronizarDeNovo = true; return; }
    var atuais = {};
    (shared.resumos||[]).forEach(function(r){ atuais[r.id] = JSON.stringify(r); });
    var ops = [];
    shared.characters.forEach(function(c){
      var r = montarResumo(c);
      var chaveOrdenada = function(o){ return JSON.stringify(Object.keys(o).sort().reduce(function(a,k){ a[k]=o[k]; return a; }, {})); };
      var atual = atuais[c.id] ? chaveOrdenada(JSON.parse(atuais[c.id])) : null;
      if(atual !== chaveOrdenada(r)) ops.push({ tipo:"set", col:"resumos", id:c.id, data:r });
    });
    var idsChars = {}; shared.characters.forEach(function(c){ idsChars[c.id] = true; });
    (shared.resumos||[]).forEach(function(r){ if(!idsChars[r.id]) ops.push({ tipo:"del", col:"resumos", id:r.id }); });
    if(!ops.length) return;
    sincronizandoResumos = true;
    // Depois de gravar, espera um instante pro espelho dos resumos se atualizar
    // antes de comparar de novo (evita gravar a mesma coisa duas vezes).
    FB.escrever(ops).catch(function(err){ console.error("[Pangea] falha ao atualizar resumos", err); })
      .then(function(){ setTimeout(function(){
        sincronizandoResumos = false;
        if(sincronizarDeNovo){ sincronizarDeNovo = false; sincronizarResumos(); }
      }, 1500); });
  }

  // Migração única: copia as coleções antigas da raiz para campanhas/pangea/... e
  // cria as fichas-base. Pode ser repetida sem estrago (as cópias são regravadas
  // iguais); a última gravação cria as fichas-base e marca a campanha como pronta
  // no mesmo lote, então ou tudo isso entra junto ou nada entra.
  function migrarParaCampanhas(fb, u, aviso){
    var cid = CAMPANHA_PADRAO;
    var antigos = {};
    var agora = new Date().toISOString();
    aviso("Lendo a mesa atual…");
    return Promise.all(COLECOES_ANTIGAS.map(function(col){
      return fb.lerColecao("/"+col).then(function(l){ antigos[col] = l; });
    })).then(function(){
      var r = montarMigracao(antigos, u, cid, agora);
      aviso("Criando a campanha Pangea…");
      return fb.escrever([{ tipo:"set", col:"/campanhas", id:cid, data:r.campanha }]).then(function(){
        fb.abrirCampanha(cid);
        aviso("Copiando "+r.ops.length+" registros para a campanha…");
        return fb.escrever(r.ops);
      }).then(function(){
        aviso("Criando as fichas-base dos jogadores…");
        var fim = r.bases.slice();
        fim.push({ tipo:"update", col:"/campanhas", id:cid, data:{ "migracao.etapa":"ok", "migracao.concluidaEm":new Date().toISOString() } });
        return fb.escrever(fim);
      }).then(function(){
        aviso("Pronto.");
        r.campanha.migracao.etapa = "ok";
        return r.campanha;
      });
    });
  }
  // Monta (sem gravar nada) o que a migração vai escrever. Separado pra poder testar.
  function montarMigracao(antigos, u, cid, agora){
    var limpo = function(o){ return JSON.parse(JSON.stringify(o)); };
    var pers = antigos.personagens || [];
    var membros = [u.uid];
    pers.forEach(function(p){
      var d = p.data || {};
      if(!d.ehNpc && d.donoUid && membros.indexOf(d.donoUid) < 0) membros.push(d.donoUid);
    });
    var contagem = {};
    COLECOES_ANTIGAS.forEach(function(col){ contagem[col] = (antigos[col]||[]).length; });
    var campanha = {
      id: cid, nome: "Pangea", sistema: "assimilacao",
      donoUid: u.uid, donoEmail: u.email || null, donoNome: u.displayName || null,
      membros: membros, criadaEm: agora, config: limpo(CONFIG_PANGEA),
      migracao: { etapa: "dados", iniciadaEm: agora, origem: "colecoes-da-raiz", contagem: contagem }
    };
    var npcs = {};
    pers.forEach(function(p){ if(p.data && p.data.ehNpc) npcs[p.id] = true; });
    var ops = [], bases = [];
    pers.forEach(function(p){
      var d = limpo(p.data || {});
      d.id = d.id || p.id;
      d.campanhaId = cid;
      if(d.ehNpc){
        // NPC: ficha da mesa, sem conta vinculada (só o mestre vê).
        d.donoUid = null; d.donoEmail = null; d.donoNome = null; d.baseId = null;
      } else if(d.donoUid){
        d.baseId = p.id;
        var base = limpo(p.data);
        base.id = p.id; base.ehBase = true; base.origemCampanha = cid; base.campanhas = [cid];
        base.baseCriadaEm = agora;
        delete base.campanhaId; delete base.baseId;
        bases.push({ tipo:"set", col:"/fichas", id:p.id, data:base });
      } else {
        d.baseId = null; // ficha de jogador ainda sem conta: ganha a base quando for vinculada
      }
      ops.push({ tipo:"set", col:"personagens", id:p.id, data:d });
    });
    (antigos.resumos || []).forEach(function(x){
      var d = limpo(x.data || {});
      if(npcs[x.id] || d.ehNpc){ d.donoUid = null; }
      ops.push({ tipo:"set", col:"resumos", id:x.id, data:d });
    });
    ["rolagens","rolagensNpc","documentos","documentosNotas","encontros","encontrosMesa","itensPool","meta"].forEach(function(col){
      (antigos[col] || []).forEach(function(x){ ops.push({ tipo:"set", col:col, id:x.id, data:limpo(x.data || {}) }); });
    });
    return { campanha: campanha, ops: ops, bases: bases };
  }

  function configBase(cmp){ return (cmp && cmp.id === CAMPANHA_PADRAO) ? CONFIG_PANGEA : (cmp ? CONFIG_PADRAO : CONFIG_PANGEA); }
  function completarConfig(cfg, base){
    cfg = cfg ? clonar(cfg) : {};
    base = clonar(base);
    var cr = cfg.criacao || {}, bc = base.criacao;
    Object.keys(bc).forEach(function(k){ if(cr[k] === undefined || cr[k] === null) cr[k] = bc[k]; });
    cr.valores = cr.valores || {};
    Object.keys(bc.valores).forEach(function(k){ var v = parseInt(cr.valores[k],10); cr.valores[k] = isNaN(v) ? bc.valores[k] : v; });
    if(!cr.grupo || !Array.isArray(cr.grupo.opcoes)) cr.grupo = bc.grupo;
    if(!cr.grupo.rotulo) cr.grupo.rotulo = bc.grupo.rotulo || "Grupo";
    if(cr.grupo.instrucao == null) cr.grupo.instrucao = bc.grupo.instrucao || "";
    if(!Array.isArray(cr.camposExtras)) cr.camposExtras = [];
    // Propósitos: só "livro" (padrão) ou "personalizado". Valores antigos viram personalizado.
    if(cr.propositos === "conexoes") cr.propositos = "personalizado";
    if(cr.propositos === "desligado"){ cr.propositos = "personalizado"; cr.propPers = { texto:"", nome1:"Propósitos", item1:"Propósito", qtd1:0, nome2:"", item2:"", qtd2:0 }; }
    if(cr.propositos !== "personalizado") cr.propositos = "livro";
    var pp = cr.propPers = cr.propPers || {}, bp = bc.propPers;
    Object.keys(bp).forEach(function(k){ if(pp[k] === undefined || pp[k] === null) pp[k] = bp[k]; });
    pp.qtd1 = clamp(parseInt(pp.qtd1,10)||0, 0, 3); pp.qtd2 = clamp(parseInt(pp.qtd2,10)||0, 0, 3);
    if(cr.geracao !== "texto") cr.geracao = "livro";
    cfg.criacao = cr;
    var au = cfg.automacoes || {};
    Object.keys(base.automacoes).forEach(function(k){ if(typeof au[k] !== "boolean") au[k] = base.automacoes[k]; });
    cfg.automacoes = au;
    if(!Array.isArray(cfg.locais)) cfg.locais = base.locais;
    return cfg;
  }
  var cfgCache = { chave:null, cfg:null };
  function cfgCampanha(){
    // Etapa H: fora de campanha vale a criação padrão do livro; uma ficha-base que
    // nasceu numa campanha continua com a configuração da campanha de origem.
    if(modoBase){
      var ref = modoBase.cmp || null;
      var chaveB = "base|" + (ref ? ref.id + "|" + JSON.stringify(ref.config || null) : "livro");
      if(cfgCache.chave !== chaveB){ cfgCache.chave = chaveB; cfgCache.cfg = completarConfig(ref && ref.config, ref ? configBase(ref) : CONFIG_PADRAO); }

  function codigoAleatorio(n){
    var abc = "abcdefghijkmnpqrstuvwxyz23456789", s = "", a = null;
    try{ a = new Uint8Array(n); crypto.getRandomValues(a); }catch(e){ a = null; }
    for(var i=0;i<n;i++) s += abc[(a ? a[i] : Math.floor(Math.random()*256)) % abc.length];

  // Ficha-base a partir de uma cópia de campanha, e cópia de campanha a partir de uma base.
  function baseDaCopia(c, cid){
    var b = clonar(c);
    b.ehBase = true; b.origemCampanha = cid; b.campanhas = [cid]; b.baseCriadaEm = agoraIso();
    delete b.campanhaId; delete b.baseId; delete b.guardadaEm;
    return b;
  }
  function copiaDaBase(base, cid, dono, complemento){
    var c = clonar(base);
    ["ehBase","origemCampanha","campanhas","baseCriadaEm","guardadaEm"].forEach(function(k){ delete c[k]; });
    c.baseId = base.id; c.id = uid(); c.campanhaId = cid; c.ehNpc = false;
    c.donoUid = dono.uid; c.donoEmail = dono.email || null; c.donoNome = dono.nome || null;
    if(complemento && complemento.acampamento) c.acampamento = complemento.acampamento;
    // Etapa H: campos extras preenchidos no convite (só os que estavam em branco na ficha).
    if(complemento && complemento.extras && typeof complemento.extras === "object"){
      c.extras = c.extras || {};
      Object.keys(complemento.extras).forEach(function(k){
        var v = complemento.extras[k];
        if(typeof v === "string" && v.trim() && !String(c.extras[k]||"").trim()) c.extras[k] = v;
      });
    }
    // A Experiência inicial é regra da campanha: a cópia não traz a da base (que o
    // jogador pode mexer na conta dele); vale a da campanha que está recebendo.
    delete c.xpInicial;
    c.entrouNaCampanhaEm = agoraIso(); c.atualizadoEm = agoraIso();
    return c;
  }

  // Toda ficha de jogador numa campanha tem a sua ficha-base na conta do dono.

  var basesEmCurso = {};
  function garantirBases(){
    if(!FB || !usuario || !campanhaAtual) return;
    var cid = campanhaAtual.id;
    shared.characters.forEach(function(c){
      if(c.ehNpc || c.baseId || c.donoUid !== usuario.uid || basesEmCurso[c.id]) return;
      basesEmCurso[c.id] = true;
      FB.escrever([{ tipo:"set", col:"/fichas", id:c.id, data:paraFirestore(baseDaCopia(c, cid)) }]).then(function(){
        var atual = getChar(c.id);
        if(!atual || FB.campanhaAberta() !== cid) return;
        atual.baseId = c.id;
        marcarCharSujo(c.id); schedulePublish();
      }).catch(function(err){
        console.warn("[Pangea] ficha-base", err);
        delete basesEmCurso[c.id];
      });
    });
  }

  // ---------- TELA INICIAL ----------
  function mostrarLobby(){
    if(!FB || !usuario) return;
    var u = usuario;
    pararOuvintes(); pararLobby();
    appPronto = false; caps.isOwner = false;
    modoBase = null; cfgCache.chave = null;
    campanhaAtual = null; FB.abrirCampanha(null);
    limparMesaLocal();
    try{ sessionStorage.removeItem(CAMPANHA_ABERTA_KEY); }catch(e){}
    document.getElementById("rollfeed").innerHTML = "";
    lobby = { campanhas:null, bases:null, copias:{}, guardadas:{}, pedidos:{}, convite:null, extras:false,
              form:{ escolha:null, acampamento:"", extras:{} }, criando:false, ocupado:false };
    renderLobby();
    // Primeira vez no formato de campanhas: a conta da migração ainda vê o botão de migrar.
    var antes = podeCriarCampanha()
      ? FB.lerDoc("/campanhas", CAMPANHA_PADRAO).then(function(cmp){
          if(usuario !== u) return true;
          if(!cmp) { mostrarMigracao(FB, u, entrarNaCampanha, null); return true; }
          if(!cmp.migracao || cmp.migracao.etapa !== "ok"){ mostrarMigracao(FB, u, entrarNaCampanha, cmp); return true; }
          return false;
        }).catch(function(){ return false; })
      : Promise.resolve(false);
    antes.then(function(desviou){
      if(desviou || usuario !== u || !lobby) return;
      lobbyOuvintes.push(FB.ouvir("/campanhas", function(lista){
        if(usuario !== u || !lobby) return;
        lobby.campanhas = lista.slice().sort(function(a,b){ return String(a.nome||"").localeCompare(String(b.nome||"")); });
        carregarExtrasLobby();
      }, function(e){
        // Plano B se a lista for recusada: abre uma a uma as campanhas já conhecidas neste aparelho.
        console.warn("[Pangea] campanhas", e);
        var ids = (loadLS(CONHECIDAS_KEY, [])||[]).concat([CAMPANHA_PADRAO]).filter(function(x, i, a){ return a.indexOf(x) === i; });
        Promise.all(ids.map(function(id){ return FB.lerDoc("/campanhas", id).catch(function(){ return null; }); })).then(function(l){
          if(usuario !== u || !lobby) return;
          lobby.campanhas = l.filter(function(c){ return c && ehMembroDe(c) && (!c.migracao || c.migracao.etapa === "ok"); });
          carregarExtrasLobby();
        });
      }, ["membros", u.uid, "array-contains"]));
      lobbyOuvintes.push(FB.ouvir("/fichas", function(lista){
        if(usuario !== u || !lobby) return;
        lobby.bases = lista.slice().sort(function(a,b){ return String(a.nomePersonagem||"").localeCompare(String(b.nomePersonagem||"")); });
        carregarExtrasLobby();
      }, function(e){ console.warn("[Pangea] fichas-base", e); if(lobby){ lobby.bases = []; carregarExtrasLobby(); } }, ["donoUid", u.uid]));
    });
  }
  function ehMembroDe(cmp){ return !!(cmp && usuario && (cmp.donoUid === usuario.uid || (cmp.membros||[]).indexOf(usuario.uid) > -1)); }
  function campanhaDoLobby(cid){ return lobby && lobby.campanhas ? lobby.campanhas.filter(function(c){ return c.id === cid; })[0] : null; }

  // Lê o que as listas ao vivo não trazem: minhas cópias em cada campanha, as
  // fichas guardadas, os pedidos enviados e o convite aberto.
  var extrasSeq = 0;
  function carregarExtrasLobby(){
    if(!lobby) return;
    if(lobby.campanhas === null || lobby.bases === null){ renderLobby(); return; }
    var seq = ++extrasSeq, u = usuario;
    var copias = {}, guardadas = {}, pedidos = {}, convite = null, pedidoDoConvite = null;
    var ps = [];
    lobby.campanhas.forEach(function(cmp){
      ps.push(FB.lerConsulta("/campanhas/"+cmp.id+"/fichas", ["donoUid", u.uid])
        .then(function(l){ copias[cmp.id] = l.map(function(x){ return x.data; }); })
        .catch(function(){ copias[cmp.id] = []; }));
    });
    lobby.bases.forEach(function(b){
      ps.push(FB.lerColecao("/fichas/"+b.id+"/guardadas")
        .then(function(l){ guardadas[b.id] = l.map(function(x){ return x.data; }); })
        .catch(function(){ guardadas[b.id] = []; }));
    });
    var cidsPedido = pedidosGuardados().map(function(p){ return p.cid; });
    // Etapa H2: pedido de levar mais uma ficha a uma campanha em que a conta já joga
    // (pode ter sido feito em outro aparelho).
    lobby.campanhas.forEach(function(cmp){ if(cmp.donoUid !== u.uid && cidsPedido.indexOf(cmp.id) < 0) cidsPedido.push(cmp.id); });
    cidsPedido.forEach(function(cid){
      ps.push(FB.lerDoc("/campanhas/"+cid+"/pedidos", u.uid)
        .then(function(d){ pedidos[cid] = d; })
        .catch(function(){ pedidos[cid] = null; }));
    });
    var conv = conviteGuardado();
    if(conv){
      ps.push(FB.lerDoc("/campanhas/"+conv.cid+"/convites", conv.codigo)
        .then(function(d){ convite = { cid:conv.cid, codigo:conv.codigo, doc:d }; })
        .catch(function(){ convite = { cid:conv.cid, codigo:conv.codigo, doc:null }; }));
      ps.push(FB.lerDoc("/campanhas/"+conv.cid+"/pedidos", u.uid)
        .then(function(d){ pedidoDoConvite = d; }).catch(function(){}));
    }
    Promise.all(ps).then(function(){
      if(seq !== extrasSeq || !lobby || usuario !== u) return;
      // Um convite cujo pedido já foi enviado vira só um pedido acompanhado aqui.
      var lista = pedidosGuardados();
      if(convite && pedidoDoConvite && !campanhaDoLobby(convite.cid)){
        if(!lista.some(function(p){ return p.cid === convite.cid; })) lista.push({ cid:convite.cid, uid:u.uid, nome:pedidoDoConvite.campanhaNome||"" });
        pedidos[convite.cid] = pedidoDoConvite;
        esquecerConvite(); convite = null;
      }
      // Pedido de levar ficha (etapa H2) de uma campanha em que já jogo, feito em outro aparelho.
      Object.keys(pedidos).forEach(function(cid){
        var d = pedidos[cid];
        if(d && d.membro && !lista.some(function(p){ return p.cid === cid; })) lista.push({ cid:cid, uid:u.uid, nome:d.campanhaNome||"" });
      });
      // Pedidos resolvidos (aprovado = virou membro ou a ficha entrou; cancelado/apagado) saem da lista.
      lista = lista.filter(function(p){ return pedidos[p.cid] && (!campanhaDoLobby(p.cid) || pedidos[p.cid].membro); });
      salvarPedidos(lista);
      lobby.copias = copias; lobby.guardadas = guardadas; lobby.pedidos = pedidos; lobby.convite = convite; lobby.extras = true;
      renderLobby();
    });
  }
