        '<p class="hint" style="margin:0">Pra abrir a ficha do seu personagem nesta mesa, digite em qualquer lugar desta página (fora de caixas de texto) o nome do personagem junto com o seu nome de jogador, sem espaço - por exemplo, se seu personagem é "Ruhanzito" e você é o "Buteco", digite <code>RuhanzitoButeco</code>. Não precisa clicar em nada antes: acertando, a ficha aparece sozinha na hora.</p>' +
      '</div>';
    }
    if(caps.mode === "mesa" && meus.length){
      html += '<div class="card tight"><h2>Personagens destravados neste navegador</h2>' +
        '<p class="hint">"Limpar personagens" esconde de novo, só aqui neste navegador, os personagens já destravados por senha - não apaga nada de ninguém, é só digitar a senha de novo pra ver de novo.</p>' +
        '<button class="btn secondary" data-action="clear-personagens">Limpar personagens</button>' +
      '</div>';
    }
    html += '<div class="card tight"><h2>Backup</h2>' +
      '<p class="hint">Guarde uma cópia de todos os seus personagens antes de fechar, ou restaure num aparelho novo.</p>' +
      '<div class="row" style="align-items:flex-start">' +
        '<div style="flex:1;min-width:220px">' +
          '<button class="btn secondary" data-backup="export">Gerar código de backup</button>' +
          '<textarea class="code-box" id="backup-export" readonly style="margin-top:8px;display:none"></textarea>' +
          '<div class="row" id="backup-copy-row" style="margin-top:6px;display:none"><button class="btn secondary" data-backup="copy">Copiar código</button></div>' +
        '</div>' +
        '<div style="flex:1;min-width:220px">' +
          '<textarea class="code-box" id="backup-import" placeholder="cole aqui um código de backup pra restaurar"></textarea>' +
          '<div class="row" style="margin-top:6px"><button class="btn secondary" data-backup="import">Restaurar backup</button></div>' +
        '</div>' +
      '</div>' +
    '</div>';
    if(chars.length === 0){
      html += '<div class="card empty"><p>Nenhum personagem por aqui ainda.</p>' +
        '<button class="btn accent" data-nav="wizard-new">Criar meu primeiro Sobrevivente</button></div>';
    } else {
      html += '<div class="roster-grid">';
      chars.forEach(function(c){
        var camp = c.acampamento ? CAMPS[c.acampamento] : null;
        var maxNivelRoster = saudePontosMax(c);
        var pontosRoster = c.saudePontosAtuais!=null ? c.saudePontosAtuais : maxNivelRoster;
        html += '<div class="char-card" style="--camp-color:'+(camp?camp.cor:'var(--accent)')+'" data-open="'+c.id+'">' +
          (camp ? '<img class="badge" src="'+camp.img+'" alt="">' : '') +
          '<h3>'+esc(c.nomePersonagem||"Sem nome")+npcBadgeHtml(c)+'</h3>' +
          '<div class="camp-tag">'+(camp?camp.nome:"acampamento não definido")+(c.nomeJogador?" · "+esc(c.nomeJogador):"")+'</div>' +
          '<div class="stat-row" style="align-items:flex-end;flex-wrap:wrap">' + tugMiniBarHtml(c) + '<span>Saúde nível '+c.saudeNivel+'/5 · '+pontosRoster+'/'+maxNivelRoster+' pts</span></div>' +
        '</div>';
      });
      html += '</div><div class="btn-row"><span></span><button class="btn accent" data-nav="wizard-new">+ Novo Personagem</button></div>';
    }
    html += footer();
    app.innerHTML = html;
    bindGlobal();
    app.querySelectorAll("[data-open]").forEach(function(el){
      el.addEventListener("click", function(){ goto("sheet", {charId: el.getAttribute("data-open")}); });
    });
    var clearCharsBtn = app.querySelector('[data-action="clear-personagens"]');
    if(clearCharsBtn) clearCharsBtn.addEventListener("click", limparPersonagensDesbloqueados);

    var expBtn = app.querySelector('[data-backup="export"]');
    if(expBtn) expBtn.addEventListener("click", function(){
      var box = app.querySelector('#backup-export');
      box.value = exportAllCode();
      box.style.display = "block";
      app.querySelector('#backup-copy-row').style.display = "flex";
    });
    var copyBtn = app.querySelector('[data-backup="copy"]');
    if(copyBtn) copyBtn.addEventListener("click", function(){
      var box = app.querySelector('#backup-export');
      box.select();
      try{ navigator.clipboard.writeText(box.value); copyBtn.textContent = "Copiado!"; setTimeout(function(){copyBtn.textContent="Copiar código";},1500); }
      catch(e){ document.execCommand('copy'); }
    });
    var impBtn = app.querySelector('[data-backup="import"]');
    if(impBtn) impBtn.addEventListener("click", function(){
      if(!podeEditar()) return;
      var code = app.querySelector('#backup-import').value;
      var data = importAllCode(code);
      if(!data || !Array.isArray(data)){ alert("Código inválido. Confira se copiou tudo certinho."); return; }
      var list = loadChars();
      data.forEach(function(nc){
        var idx = list.findIndex(function(x){return x.id===nc.id;});
        if(idx>-1) list[idx] = nc; else list.push(nc);
        marcarComoMeu(nc.id);
        if(caps.mode === "mesa") marcarCharSujo(nc.id);
      });
      saveChars(list);
      renderRoster();
    });
  }

  // ----- WIZARD -----
  function stepsBar(current){
    // A cor de todas as bolinhas vem do --camp-color herdado do wrapper (ver renderWizard); sem precisar de lógica extra aqui.
    var s = '<div class="steps">';
    WIZ_STEPS.forEach(function(label,i){
      var cls = i < current ? "done" : (i === current ? "current" : "");
      s += '<span class="'+cls+'" title="'+esc(label)+'">'+(i+1)+'</span>';
    });
    s += '</div>';
    return s;
  }

  function renderWizard(){
    var c = state.draft;
    var step = state.wizStep;
    var campColor = c.acampamento ? CAMPS[c.acampamento].cor : null;
    var html = topbar("wizard");
    html += '<div'+(campColor?' style="--camp-color:'+campColor+'"':'')+'>';
    html += '<div class="card">' + stepsBar(step) + '<h2'+(campColor?' style="color:'+campColor+'"':'')+'>Passo '+(step+1)+': '+WIZ_STEPS[step]+'</h2>';
    html += wizardStepBody(c, step);
    html += '</div>';
    html += '<div class="btn-row">';
    html += step>0 ? '<button class="btn secondary" data-wiz="back">Voltar</button>' : '<button class="btn secondary" data-wiz="cancel">Cancelar</button>';
    html += step < WIZ_STEPS.length-1 ? '<button class="btn accent" data-wiz="next">Avançar</button>' : '<button class="btn accent" data-wiz="finish">Concluir Ficha</button>';
    html += '</div>';
    html += '</div>';
    app.innerHTML = html;
    bindGlobal();
    bindWizardStep(c, step);

    app.querySelectorAll(".steps span").forEach(function(el, i){
      el.addEventListener("click", function(){ state.wizStep = i; render(); });
    });

    app.querySelectorAll("[data-wiz]").forEach(function(el){
      el.addEventListener("click", function(){
        var action = el.getAttribute("data-wiz");
        if(action === "cancel"){ goto("roster"); return; }
        if(action === "back"){ state.wizStep = Math.max(0, step-1); render(); return; }
        if(action === "next"){
          var v = validateStep(c, step);
          if(!v.ok){ alert(v.msg); return; }
          state.wizStep = Math.min(WIZ_STEPS.length-1, step+1);
          render();
          return;
        }
        if(action === "finish"){
          var vf = validateStep(c, step);
          if(!vf.ok){ alert(vf.msg); return; }
          if(!podeEditar()) return;
          c.atualizadoEm = new Date().toISOString();
          var list = loadChars(); list.push(c);
          if(caps.mode === "mesa") marcarCharSujo(c.id);
          saveChars(list);
          marcarComoMeu(c.id);
          goto("sheet", {charId:c.id});
        }
      });
    });
  }

  function validateStep(c, step){
    if(step === 0){
      if(!c.nomePersonagem || !c.nomePersonagem.trim()) return {ok:false, msg:"Dê um nome ao personagem pra continuar."};
      if(!c.acampamento) return {ok:false, msg:"Escolha um acampamento pra continuar."};
      return {ok:true};
    }
    if(step === 1){
      if(!c.origem.geracao || !c.origem.evento || !c.origem.ocupacao) return {ok:false, msg:"Preencha Geração, Evento Marcante e Ocupação."};
      return {ok:true};
    }
    if(step === 2){
      if(!c.propIndividuais[0] || !c.propIndividuais[1]) return {ok:false, msg:"Preencha os 2 Propósitos Individuais."};
      if(!c.propRelacionais[0] || !c.propRelacionais[1]) return {ok:false, msg:"Preencha as 2 Conexões (os NPCs ligados ao seu personagem ou ao seu acampamento)."};
      return {ok:true};
    }
    if(step === 3){
      var totalInst = sum(INSTINTOS.map(function(i){ return c.instintos[i[0]]||0; }));
      if(totalInst !== 9) return {ok:false, msg:"A soma dos Instintos precisa ser 9 (agora está em "+totalInst+")."};
      var badInst = INSTINTOS.filter(function(i){ var v = c.instintos[i[0]]||0; return v<0 || v>3; });
      if(badInst.length) return {ok:false, msg:"Cada Instinto deve ficar entre 0 e 3."};
      return {ok:true};
    }
    if(step === 4){
      var total = conhPratPontosGastos(c);
      if(total > 7) return {ok:false, msg:"Você gastou "+total+" de 7 pontos. Reduza algum valor."};
      var over = CONH_PRAT.filter(function(p){ return c.conhPrat[p[0]] > 2; });
      if(over.length) return {ok:false, msg:"Nessa etapa, o máximo por Conhecimento/Prática é 2."};
      return {ok:true};
    }
    if(step === 5){
      var tc = caracPontosGastos(c);
      if(tc > 7) return {ok:false, msg:"Você gastou "+tc+" de 7 pontos de característica. Ajuste suas escolhas."};
      return {ok:true};
    }
    if(step === 6){
      var ec = equipCusto(c);
      if(c.equip.traits.length && !c.equip.nome) return {ok:false, msg:"Você escolheu características pro equipamento: dê um nome a ele (ou remova as características se não quiser equipamento)."};
      if(ec > 3) return {ok:false, msg:"O equipamento icônico é Categoria 3: no máximo 3 pontos de característica (você usou "+ec+")."};
      return {ok:true};
    }
    return {ok:true};
  }

  function stepperField(kind, label, desc, id, value, min, max, disabled){
    return '<div class="field">' +
      '<label>'+label+'</label>' +
      (desc ? '<p class="hint attr-desc" style="margin-top:-2px">'+desc+'</p>' : '') +
      '<div class="stepper">' +
        '<button type="button" class="stepper-btn" data-stepbtn="'+kind+'" data-id="'+id+'" data-dir="-1"'+(disabled?' disabled':'')+'>&minus;</button>' +
        '<input type="number" min="'+min+'" max="'+max+'" data-'+kind+'="'+id+'" value="'+value+'"'+(disabled?' disabled':'')+'>' +
        '<button type="button" class="stepper-btn" data-stepbtn="'+kind+'" data-id="'+id+'" data-dir="1"'+(disabled?' disabled':'')+'>+</button>' +
      '</div>' +
    '</div>';
  }

  // Lista de checkboxes de características de equipamento/item: compartilhada
  // entre o equipamento icônico (wizard passo 6) e itens de inventário
  // (renderItemForm), que usam a mesma estrutura com prefixos de atributo
  // diferentes ("equip" / "item").
  function renderTraitList(selectedTraits, prefix){
    var html = "";
    EQUIP_TRAITS.forEach(function(t){
      var sel = selectedTraits.filter(function(s){return s.id===t.id;})[0];
      var checked = !!sel;
      html += '<label class="trait'+(checked?" checked":"")+'"><input type="checkbox" data-'+prefix+'trait="'+t.id+'" '+(checked?"checked":"")+'>' +
        '<span class="cost">'+(t.custo>0?"+":"")+t.custo+'pt</span><span class="txt"><b>'+t.nome+'</b> <span class="hint">(Categoria '+t.cat+(t.rep?", pode repetir":"")+')</span><span>'+iconizarTexto(t.txt)+'</span>';
      if(t.rep && checked){
        html += '<div class="row" style="margin-top:6px"><label style="margin:0">Quantas vezes:</label><select data-'+prefix+'traitqtd="'+t.id+'"><option value="1"'+(sel.qtd===1?" selected":"")+'>1x</option><option value="2"'+(sel.qtd===2?" selected":"")+'>2x</option></select></div>';
      }
      if(t.pedeAptidao && checked){
        html += '<div class="field" style="margin-top:6px"><label>Aptidão escolhida</label><input type="text" placeholder="ex: Ferramentas" data-'+prefix+'traitapt="'+t.id+'" value="'+esc(sel.aptidao||"")+'"></div>';
      }
      html += '</span></label>';
    });
    return html;
  }

  // onChange dispara na marcação/troca de quantidade (não no campo de
  // aptidão, que nunca precisa re-renderizar). O equipamento icônico usa
  // onChange pra recalcular usosMax/espaço antes de re-renderizar; o
  // formulário de item novo (draft, ainda não salvo) só re-renderiza.
  function bindTraitList(prefix, traits, onChange){
    app.querySelectorAll("[data-"+prefix+"trait]").forEach(function(el){
      el.addEventListener("change", function(){
        var id = el.getAttribute("data-"+prefix+"trait");
        var idx = traits.findIndex(function(s){return s.id===id;});
        if(el.checked && idx===-1) traits.push({id:id, qtd:1});
        if(!el.checked && idx>-1) traits.splice(idx,1);
        if(onChange) onChange();
      });
    });
    app.querySelectorAll("[data-"+prefix+"traitqtd]").forEach(function(el){
      el.addEventListener("change", function(){
        var id = el.getAttribute("data-"+prefix+"traitqtd");
        var sel = traits.filter(function(s){return s.id===id;})[0];
        if(sel) sel.qtd = parseInt(el.value,10);
        if(onChange) onChange();
      });
    });
    app.querySelectorAll("[data-"+prefix+"traitapt]").forEach(function(el){
      el.addEventListener("input", function(){
        var id = el.getAttribute("data-"+prefix+"traitapt");
        var sel = traits.filter(function(s){return s.id===id;})[0];
        if(sel) sel.aptidao = el.value;
      });
    });
  }

  // Botões +/- com clamp: usado pelos steppers de Instintos, Conhecimentos &
  // Práticas, bônus de Assimilação e Rolagem Seca. get/set acessam o valor
  // porque cada chamador guarda o número num formato de objeto diferente.
  function bindStepper(kind, get, set, min, max, onChange){
    app.querySelectorAll('[data-stepbtn="'+kind+'"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        var dir = parseInt(btn.getAttribute("data-dir"),10);
        set(id, clamp((get(id)||0)+dir, min, max));
        if(onChange) onChange();
      });
    });
  }

  function wizardStepBody(c, step){

    if(step === 2){
      return '<p><b>2 Propósitos Individuais:</b> o que move seu personagem, o que ele lutaria até a morte pra proteger.</p>' +
        '<div class="grid cols-2">' +
          '<div class="field"><label>Propósito Individual 1</label><input type="text" data-prop="ind0" value="'+esc(c.propIndividuais[0])+'"></div>' +
          '<div class="field"><label>Propósito Individual 2</label><input type="text" data-prop="ind1" value="'+esc(c.propIndividuais[1])+'"></div>' +
        '</div>' +
        '<p style="margin-top:14px"><b>2 Conexões:</b> NPCs ligados a você ou ao seu acampamento, como uma relação pessoal, uma dívida, uma promessa, ou até alguém que representa uma filosofia do acampamento que você quer manter viva.</p>' +
        '<div class="grid cols-2">' +
          '<div class="field"><label>Conexão 1</label><input type="text" data-prop="rel0" placeholder="nome do NPC e o que ele significa pra você" value="'+esc(c.propRelacionais[0])+'"></div>' +
          '<div class="field"><label>Conexão 2</label><input type="text" data-prop="rel1" placeholder="nome do NPC e o que ele significa pra você" value="'+esc(c.propRelacionais[1])+'"></div>' +
        '</div>';
    }
    if(step === 3){
      var got = INSTINTOS.map(function(i){ return c.instintos[i[0]]||0; });
      var totalInst = sum(got);
      var faltam = 9 - totalInst;
      var badRange = INSTINTOS.some(function(i){ var v = c.instintos[i[0]]||0; return v<0 || v>3; });
      var valid = totalInst===9 && !badRange;
      var html = '<p>Distribua 9 pontos entre os 6 Instintos, cada um entre 0 e 3.</p>';
      html += '<div class="budget '+(valid?"ok":"bad")+'">' +
        '<span>Pontos de Instinto</span><span class="num">'+totalInst+' / 9'+(faltam>0?' · faltam '+faltam:(faltam<0?' · '+(-faltam)+' acima do limite':' · completo ✓'))+'</span></div>';
      var attr = bestSaudeAttr(c);
      var vidaPorNivel = (c.instintos[attr]||0) + 2;
      html += '<div class="budget ok"><span>Saúde (usa automaticamente o maior entre Potência e Resolução: '+(attr==="potencia"?"Potência":"Resolução")+' + 2)</span>' +
        '<span class="num">'+vidaPorNivel+' pontos por estágio · '+(vidaPorNivel*5)+' pontos no total (5 estágios)</span></div>';
      html += '<div class="grid cols-3" style="margin-top:14px">';

            (atual<3?'<option value="3"'+(aum===3?" selected":"")+'>subir pra 3 (custa '+custoAumento(atual,3)+')</option>':'') +
          '</select></div>';

      html += '</div><h3 style="margin:16px 0 8px">Características únicas</h3><div class="trait-list">';
      CARACTERISTICAS.forEach(function(t){

        html += '<label class="trait'+(checked?" checked":"")+'"><input type="checkbox" data-carac="'+t.id+'" '+(checked?"checked":"")+'>' +

      html += '<div class="budget '+(ec>3?"bad":"ok")+'"><span>Pontos de característica</span><span class="num">'+ec+' / 3</span></div>';

      KITS_INICIAIS.forEach(function(k){

      });

  }

  function bindWizardStep(c, step, rerender){
    rerender = rerender || renderWizard;
    if(step === 0){
      app.querySelectorAll("[data-camp]").forEach(function(el){
        el.addEventListener("click", function(){ c.acampamento = el.getAttribute("data-camp"); rerender(); });
      });
      app.querySelectorAll("[data-basicinfo]").forEach(function(el){
        el.addEventListener("input", function(){ c[el.getAttribute("data-basicinfo")] = el.value; });
      });
    }
    if(step === 1){
      app.querySelectorAll("[data-origem]").forEach(function(el){
        el.addEventListener("input", function(){ c.origem[el.getAttribute("data-origem")] = el.value; });
      });
    }
    if(step === 2){
      app.querySelectorAll("[data-prop]").forEach(function(el){
        el.addEventListener("input", function(){
          var k = el.getAttribute("data-prop");
          if(k==="ind0") c.propIndividuais[0]=el.value;
          if(k==="ind1") c.propIndividuais[1]=el.value;
          if(k==="rel0") c.propRelacionais[0]=el.value;
          if(k==="rel1") c.propRelacionais[1]=el.value;
        });
      });
    }
    if(step === 3){
      app.querySelectorAll("[data-instinto]").forEach(function(el){
        el.addEventListener("input", function(){
          c.instintos[el.getAttribute("data-instinto")] = clamp(parseInt(el.value,10),0,3);
          c.atributoSaude = bestSaudeAttr(c);
          rerender();
        });
      });
      bindStepper("instinto", function(id){ return c.instintos[id]; }, function(id,v){ c.instintos[id] = v; }, 0, 3, function(){
        c.atributoSaude = bestSaudeAttr(c);
        rerender();
      });
    }
    if(step === 4){
      app.querySelectorAll("[data-cp]").forEach(function(el){
        el.addEventListener("input", function(){
          c.conhPrat[el.getAttribute("data-cp")] = clamp(parseInt(el.value,10),0,2);
          rerender();
        });
      });
      bindStepper("cp", function(id){ return c.conhPrat[id]; }, function(id,v){ c.conhPrat[id] = v; }, 0, 2, rerender);
    }
    if(step === 5){
      app.querySelectorAll("[data-aumento]").forEach(function(el){
        el.addEventListener("change", function(){
          var k = el.getAttribute("data-aumento"); var v = parseInt(el.value,10);
          if(v>0){ c.caracAumentos[k] = v; } else { delete c.caracAumentos[k]; }
          rerender();
        });
      });
      app.querySelectorAll("[data-carac]").forEach(function(el){
        el.addEventListener("change", function(){
          var id = el.getAttribute("data-carac");
          var idx = c.caracComp.indexOf(id);
          if(el.checked && idx===-1) c.caracComp.push(id);
          if(!el.checked && idx>-1) c.caracComp.splice(idx,1);
          rerender();
        });
      });
    }
    if(step === 6){
      app.querySelectorAll("[data-equip]").forEach(function(el){
        el.addEventListener("input", function(){ c.equip[el.getAttribute("data-equip")] = el.value; });
      });
      bindTraitList("equip", c.equip.traits, function(){
        c.equip.usosMax = equipUsosMax(c); c.equip.usosAtual = c.equip.usosMax; c.equip.espaco = equipEspaco(c);
        rerender();
      });
      app.querySelectorAll("[data-kit]").forEach(function(el){
        el.addEventListener("click", function(){
          aplicarKitInicial(c, el.getAttribute("data-kit") || null);
          rerender();
        });
      });
    }
  }

  // ----- SHEET (view/edit an existing character) -----
  function getChar(id){ return loadChars().filter(function(c){return c.id===id;})[0]; }
  function updateChar(c){
    if(!podeEditar()) return;
    c.atualizadoEm = new Date().toISOString();
    var list = loadChars();
    var idx = list.findIndex(function(x){return x.id===c.id;});
    if(idx>-1){
      list[idx]=c;
      if(caps.mode === "mesa") marcarCharSujo(c.id);
      saveChars(list);
    }
  }
  function deleteChar(id){
    if(!podeEditar()) return;
    var list = loadChars().filter(function(c){return c.id!==id;});
    if(caps.mode === "mesa") marcarCharExcluido(id);
    saveChars(list);
  }

  // ----- CONFIRMAÇÃO DE EDIÇÃO (Saúde, Cabo de Guerra e Equipamento/Inventário) -----
  // Esses campos mudam muitas vezes seguidas durante o jogo (ex.: um combate
  // inteiro só mexendo em Saúde), e cada clique publicando na hora - mesmo já
  // agrupado pelo debounce de schedulePublish - ainda gerava um recarregamento
  // de TODAS as abas a cada ~1,2s de pausa (ver o comentário grande acima de
  // dirtyCharIds/schedulePublish). Por isso, em modo mesa, esses campos não
  // chamam updateChar (e não publicam nada) a cada clique: só marcam que ESTE
  // personagem tem uma pendência (state.pendenteCharId, só nesta aba, nunca
  // salva) até o jogador clicar "Confirmar alterações" (pendingBannerHtml, na
  // própria ficha) - ou sair da ficha/fechar a aba, que confirmam sozinhos como
  // rede de segurança (ver goto/aoDescarregarAba). Em modo local (sem mesa),
  // cai direto pra updateChar, sem pendência nenhuma - não tem por que existir
  // sem sincronização com ninguém.
  //
  // Risco residual aceito: como QUALQUER publicação de QUALQUER jogador
  // recarrega a página inteira (ver mesmo comentário acima), se outra pessoa
  // publicar algo enquanto uma pendência local ainda não foi confirmada, essa
  // pendência pode se perder no recarregamento forçado. goto/aoDescarregarAba
  // reduzem bastante essa janela (confirmam ao sair da ficha ou fechar a aba),
  // mas não eliminam por completo - o mesmo é verdade, hoje, pro rascunho de
  // "Editar Ficha" e pro assistente de criação, que já tinham esse risco.
  // secao identifica qual card gerou a pendência ("saude"/"cabo"/"equip"/"inv") - só usado
  // pra decidir perto de qual seção mostrar o botão "Confirmar alterações"
  // (pendingSectionBannerHtml); a confirmação em si sempre publica o personagem inteiro
  // de uma vez (não dá granularidade por campo no modelo atual).
  function marcarPendenteOuSalvar(c, secao){
    if(caps.mode !== "mesa"){ updateChar(c); return; }
    if(!podeEditar()) return;
    state.pendenteCharId = c.id;
    if(secao) state.pendenteSecoes[secao] = true;
  }
  function temPendente(c){ return state.pendenteCharId === c.id; }
  function temPendenteSecao(c, secao){ return state.pendenteCharId === c.id && !!state.pendenteSecoes[secao]; }
  function confirmarPendente(c){
    if(state.pendenteCharId !== c.id) return;
    state.pendenteCharId = null;
    state.pendenteSecoes = {};
    updateChar(c);
    clearTimeout(publishTimer);
    doPublish();
  }
  function flushPendente(){
    if(state.pendenteCharId){
      var c = getChar(state.pendenteCharId);
      if(c) confirmarPendente(c);
    }
  }
  // Botão "Confirmar alterações" compacto, injetado perto da seção específica que tem
  // a pendência (ver renderSheet/tugDeGuerraCardHtml) em vez de um aviso genérico único
  // no topo da ficha - assim fica claro ONDE está a mudança ainda não confirmada,
  // mesmo com mais de uma seção pendente ao mesmo tempo.
  function pendingSectionBannerHtml(c, secao){
    if(!temPendenteSecao(c, secao)) return "";
    return '<div class="card tight pending-banner" style="border-color:var(--accent);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px">' +
      '<p class="hint" style="margin:0">Alteração ainda não confirmada com a mesa.</p>' +
      '<button type="button" class="btn accent" data-action="confirmar-pendente">Confirmar alterações</button>' +
    '</div>';
  }

  function renderSheet(){
    var c = getChar(state.charId);
    if(!c){ goto("roster"); return; }
    // Não deveria nunca acontecer (não existe card nem link em lugar nenhum
    // pra uma ficha trancada), mas por segurança: se de algum jeito o estado
    // apontar pra um personagem ainda não destravado, volta discretamente pro
    // início sem revelar nada, em vez de mostrar uma tela de senha.
    if(!isCharUnlocked(c)){ goto("roster"); return; }
    // Se essa ficha acabou de "aparecer" por causa da senha digitada em
    // qualquer lugar da página (ver setupSheetPasswordListener), a animação
    // roda uma vez só: consome a flag aqui pra que os próximos re-renders
    // (qualquer clique dentro da própria ficha) não repitam o efeito.
    var playReveal = !!state.sheetRevealAnim;
    state.sheetRevealAnim = false;
    var camp = c.acampamento ? CAMPS[c.acampamento] : null;
    var html = topbar("sheet");
    html += '<div'+(playReveal?' class="sheet-reveal"':'')+(camp?' style="--camp-color:'+camp.cor+'"':'')+'>';

    if(state.deleteConfirm){
      html += '<div class="card" style="border:3px solid var(--danger);background:rgba(162,58,58,.08)">' +
        '<h2 style="color:var(--danger)">Excluir "'+esc(c.nomePersonagem||"este personagem")+'" definitivamente?</h2>' +
        '<p style="font-weight:700;font-size:15.5px">Essa ação NÃO PODE SER DESFEITA. Todos os dados dessa ficha (Instintos, Conhecimentos, Práticas, Características, Equipamento, Inventário, Notas) serão apagados deste navegador pra sempre.</p>' +
        '<p class="hint">Se você já exportou um código de backup, ele continua guardado fora daqui. Sem um backup, não tem como recuperar essa ficha depois.</p>' +
        '<div class="btn-row"><button class="btn secondary" data-action="cancel-delete">Cancelar</button><button class="btn danger" data-action="confirm-delete">Sim, excluir definitivamente</button></div>' +
      '</div></div>';
      app.innerHTML = html;
      bindGlobal();
      app.querySelector('[data-action="cancel-delete"]').addEventListener("click", function(){ state.deleteConfirm = false; render(); });
      app.querySelector('[data-action="confirm-delete"]').addEventListener("click", function(){ deleteChar(c.id); state.deleteConfirm = false; goto("roster"); });
      return;
    }

    if(caps.mode === "mesa" && !caps.canEdit){
      html += '<div class="card tight" style="border-color:var(--danger)"><p class="hint" style="margin:0;color:var(--danger)">Modo somente leitura: este link não tem permissão de edição.</p></div>';
    }

    html += '<div class="card" style="border-left:6px solid '+(camp?camp.cor:'var(--accent)')+'">';
    html += '<div class="row" style="justify-content:space-between">';
    html += '<div><h2 style="margin-bottom:2px">'+esc(c.nomePersonagem||"Sem nome")+npcBadgeHtml(c)+'</h2><span class="camp-tag">'+(camp?camp.nome:"")+' · jogador(a): <input type="text" data-jogador value="'+esc(c.nomeJogador)+'" placeholder="seu nome" style="width:140px;display:inline-block"></span>' +
      (caps.mode === "mesa" && meusIds().indexOf(c.id)===-1 ? ' <button type="button" class="gm-link" data-action="claim">marcar como meu</button>' : '') +
      '</div>';
    if(camp) html += '<img src="'+camp.img+'" alt="" style="width:88px;height:88px">';
    html += '</div></div>';

    html += '<div class="grid cols-2">';

    // Origem / Propositos
    html += sectionCard("origem", "Origem, Propósitos &amp; Conexões",
      '<p><b>Geração:</b> '+esc(c.origem.geracao)+'</p>' +
      '<p><b>Evento Marcante:</b> '+esc(c.origem.evento)+'</p>' +
      '<p><b>Ocupação:</b> '+esc(c.origem.ocupacao)+'</p>' +
      '<p><b>Propósitos individuais:</b> '+esc(c.propIndividuais[0])+'; '+esc(c.propIndividuais[1])+'</p>' +
      '<p><b>Conexões:</b> '+esc(c.propRelacionais[0])+'; '+esc(c.propRelacionais[1])+'</p>');

    // Instintos (valor mostrado já inclui o Bônus de Assimilação, ver valorInstinto; a
    // divisão "base+bônus" só aparece como dica quando existe algum bônus, pra não poluir
    // a maioria das fichas, que nunca vai usar isso)
    var instintosBody = '<table><tbody>';
    INSTINTOS.forEach(function(i){
      var baseInstDisp = c.instintos[i[0]]||0;
      var bonusInstDisp = (c.instintosAssimBonus && c.instintosAssimBonus[i[0]])||0;
      instintosBody += '<tr><td>'+i[1]+'</td><td class="num">'+(baseInstDisp+bonusInstDisp)+(bonusInstDisp?' <span class="hint">('+baseInstDisp+'+'+bonusInstDisp+')</span>':'')+'</td></tr>';
    });
    instintosBody += '</tbody></table>';
    html += sectionCard("instintos", "Instintos", instintosBody);

    html += '</div>'; // end grid-2

    // Conhecimentos e praticas (mesma ideia: valor total com a dica "base+bônus" só quando há bônus)
    var cpBody = '<div class="table-wrap"><table><thead><tr><th>Conhecimentos</th><th class="num">Valor</th><th>Práticas</th><th class="num">Valor</th></tr></thead><tbody>';
    for(var i=0;i<6;i++){
      var kC = CONHECIMENTOS[i][0], kP = PRATICAS[i][0];
      var bC = (c.conhPratAssimBonus && c.conhPratAssimBonus[kC])||0, bP = (c.conhPratAssimBonus && c.conhPratAssimBonus[kP])||0;
      cpBody += '<tr><td>'+CONHECIMENTOS[i][1]+'</td><td class="num">'+valorCP(c,kC)+(bC?' <span class="hint">('+valorCPBase(c,kC)+'+'+bC+')</span>':'')+'</td>' +
        '<td>'+PRATICAS[i][1]+'</td><td class="num">'+valorCP(c,kP)+(bP?' <span class="hint">('+valorCPBase(c,kP)+'+'+bP+')</span>':'')+'</td></tr>';
    }
    cpBody += '</tbody></table></div>';
    html += sectionCard("conhprat", "Conhecimentos &amp; Práticas", cpBody);

    // Bônus de Assimilação: pra campanhas de nível mais alto, onde Assimilações aumentam
    // Instintos/Conhecimentos/Práticas além do teto normal de criação (3). Fica separado da
    // base; valorInstinto/valorCP somam isso automaticamente em todo lugar que importa
    // (tabelas acima, o testador, o Painel do Assimilador). Sem limite fixo de valor.
    var assimBonusBody = '<p class="hint">Quando uma Assimilação aumenta um Instinto, Conhecimento ou Prática além do normal, registre aqui: o valor soma direto em cima da base em todo lugar (tabelas acima, testes, Painel do Assimilador), sem contar no orçamento de pontos da criação.</p>';
    assimBonusBody += '<h3 style="margin-bottom:8px">Instintos</h3><div class="grid cols-3">';
    INSTINTOS.forEach(function(i){
      assimBonusBody += stepperField("instbonus", i[1], "", i[0], (c.instintosAssimBonus&&c.instintosAssimBonus[i[0]])||0, 0, 99, false);
    });
    assimBonusBody += '</div><h3 style="margin:14px 0 8px">Conhecimentos &amp; Práticas</h3><div class="grid cols-3">';
    CONH_PRAT.forEach(function(p){
      assimBonusBody += stepperField("cpbonus", p[1], "", p[0], (c.conhPratAssimBonus&&c.conhPratAssimBonus[p[0]])||0, 0, 99, false);
    });
    assimBonusBody += '</div>';
    html += sectionCard("assimbonus", "Bônus de Assimilação", assimBonusBody);

    // Teste (rolador integrado, puxa Instinto + Prática/Conhecimento direto da ficha)
    if(!state.sheetTest || state.sheetTest.charId !== c.id){
      state.sheetTest = { charId:c.id, instintoKey:INSTINTOS[0][0], cpKey:CONH_PRAT[0][0], instinto2Key:INSTINTOS[0][0], agir:false, extraDado:false, agirSnapshot:null, extraSnapshot:null, agirUsouAssim:false, results:[], rolling:false, rollingCount:0, keepN:0, registered:false };
    }
    html += renderSheetTest(c);

    // Caracteristicas
    var caracDetalhes = c.caracComp.map(function(id){ return CARACTERISTICAS.filter(function(x){return x.id===id;})[0]; }).filter(Boolean);
    var caracBody;
    if(caracDetalhes.length){
      caracBody = '<div class="trait-list">' + caracDetalhes.map(function(d){
        return '<div class="trait" style="cursor:default"><span class="cost">+'+d.custo+'pt</span><span class="txt"><b>'+esc(d.nome)+'</b><span>'+iconizarTexto(esc(d.txt))+'</span></span></div>';
      }).join('') + '</div>';
    } else {
      caracBody = '<p class="hint">Nenhuma característica única comprada.</p>';
    }
    html += sectionCard("caracteristicas", "Características", caracBody);

    // Saude e Determinacao
    var maxNivel = saudePontosMax(c);
    if(c.saudePontosAtuais==null) c.saudePontosAtuais = maxNivel;
    html += '<div class="grid cols-2">';
    html += '<div class="card"><h2>Saúde</h2>' +
      pendingSectionBannerHtml(c, "saude") +
      '<p class="hint">Base: '+(c.atributoSaude==="potencia"?"Potência":"Resolução")+' + 2 = '+maxNivel+' pontos por nível</p>' +
      '<div class="row"><label style="margin:0">Pontos atuais no nível:</label><div class="dots" data-dots="pontos">' + diamonds(c.saudePontosAtuais, maxNivel, "dsize-lg", "c-saude") + '</div></div>' +
      '<div class="row" style="margin-top:8px"><label style="margin:0">Nível (de 5):</label><div class="dots" data-dots="nivel">' + diamonds(c.saudeNivel,5,"dsize-sm","c-saude","ns") + '</div></div>' +
      '<div class="row" style="margin-top:10px"><button class="btn secondary" data-saude="menos">-1 ponto</button><button class="btn secondary" data-saude="mais">+1 ponto</button></div>' +
    '</div>';

    // Determinação/Assimilação (ver tugDeGuerraCardHtml): o Cabo de Guerra é
    // a única forma de calcular e mostrar isso, sempre visível na ficha.
    html += tugDeGuerraCardHtml(c);
    html += '</div>';

    // Assimilação: Teste de Assimilação, mutações adquiridas e Clareza de Propósito
    // (ver renderMutacoesCard) - livro definitivo, Cap. 4.
    html += renderMutacoesCard(c);

    // Equipamento
    var equipBody;
    if(!c.equip.nome && !c.equip.traits.length){
      equipBody = '<p class="hint">Esse personagem não tem equipamento icônico.</p>';
    } else {
      equipBody = '<p><b>'+esc(c.equip.nome||"(sem nome)")+':</b> '+esc(c.equip.desc)+'</p>';
      if(c.equip.traits.length){
        var equipTraitDetails = c.equip.traits.map(function(s){
          var d = EQUIP_TRAITS.filter(function(x){return x.id===s.id;})[0];
          if(!d) return "";
          return '<div class="trait" style="cursor:default"><span class="cost">'+(d.custo>0?"+":"")+d.custo+'pt</span><span class="txt"><b>'+d.nome+(s.qtd>1?" (2x)":"")+(s.aptidao?" ("+esc(s.aptidao)+")":"")+'</b><span>'+iconizarTexto(d.txt)+'</span></span></div>';
        }).join("");
        equipBody += '<p class="hint" style="margin-bottom:6px">Utilidade das características escolhidas:</p><div class="trait-list">'+equipTraitDetails+'</div>';
      } else {
        equipBody += '<p class="hint">Sem características especiais.</p>';
      }
      equipBody += '<div class="row" style="margin-top:10px"><label style="margin:0">Usos:</label><div class="dots" data-dots="equipusos">'+dotsRow(c.equip.usosAtual, c.equip.usosMax, "")+'</div>' +
        '<button class="btn secondary" data-equipuso="repor">Repor usos</button></div>' +
        '<p class="hint">Espaço de inventário ocupado: '+c.equip.espaco+'</p>';
    }
    html += sectionCard("equipamento", "Equipamento Icônico", pendingSectionBannerHtml(c, "equip") + equipBody);

    // Inventario extra
    var totalEspaco = c.equip.espaco + sum(c.inventarioExtra.map(function(it){ return it.espaco||0; }));
    var capMax = capacidadeInventarioMax(c);
    var espacoExtra = capMax - 8;
    var invBody = '<div id="inv-list">' + renderInventario(c) + '</div>' +
      '<p class="hint" style="margin-top:8px">Espaço total ocupado: <b>'+totalEspaco+'</b> de '+capMax+' (2 no corpo + 6 na mochila'+(espacoExtra>0?' + '+espacoExtra+' de equipamento Espaçoso':'')+')</p>';
    if(state.itemDraft){
      invBody += renderItemForm(state.itemDraft);
    } else {
      invBody += '<div class="row" style="margin-top:10px"><button class="btn secondary" data-inv="add">+ adicionar item</button></div>';
    }
    html += sectionCard("inventario", "Inventário adicional", pendingSectionBannerHtml(c, "inv") + invBody);

    // Notas
    html += sectionCard("notas", "Notas", '<textarea data-notas style="min-height:80px">'+esc(c.notas)+'</textarea>');

    // Export / actions (no modo mesa o Assimilador já vê tudo ao vivo; isso fica só como backup manual)
    html += sectionCard("exportar", "Exportar",
      '<p class="hint">'+(caps.mode==="mesa"?'O Assimilador já acompanha essa ficha ao vivo. Esse código serve só como backup manual, se quiser.':'Copie o código abaixo e envie pro Assimilador (fora desta ferramenta) pra ele acompanhar sua ficha.')+'</p>' +
      '<textarea class="code-box" readonly id="export-code">'+exportCode(c)+'</textarea>' +
      '<div class="row" style="margin-top:8px"><button class="btn secondary" data-action="copy">Copiar código</button></div>');

    html += '<div class="btn-row"><button class="btn secondary" data-nav="roster">Voltar pros personagens</button>' +
      '<div class="row"><button class="btn accent" data-action="edit">Editar Ficha</button><button class="btn danger" data-action="delete">Excluir personagem</button></div></div>';

    html += '</div>';

    app.innerHTML = html;
    bindGlobal();
    bindSheet(c, maxNivel);
  }

  function renderInventario(c){
    if(!c.inventarioExtra.length) return '<p class="hint">Nada além do equipamento icônico.</p>';
    var html = '<div class="table-wrap"><table><thead><tr><th>Item</th><th class="num">Usos</th><th class="num">Espaço</th><th></th></tr></thead><tbody>';
    c.inventarioExtra.forEach(function(it, idx){
      var traitTxt = (it.traits||[]).map(function(s){
        var d = EQUIP_TRAITS.filter(function(x){return x.id===s.id;})[0];
        return d ? d.nome+(s.qtd>1?" x2":"")+(s.aptidao?" ("+s.aptidao+")":"") : s.id;
      });
      html += '<tr><td><b>'+esc(it.nome)+(it.qtd>1?' (x'+it.qtd+')':'')+'</b>' +
        (it.desc?'<br><span class="hint">'+esc(it.desc)+'</span>':'') +
        (traitTxt.length?'<br><span class="hint">'+traitTxt.join(", ")+'</span>':'') +
        '</td><td class="num">' +
          '<div class="row" style="justify-content:flex-end;flex-wrap:nowrap;gap:4px">' +
            '<button class="btn secondary" data-invuso="menos" data-idx="'+idx+'" style="padding:1px 7px;font-size:11px" '+(it.usosAtual<=0?"disabled":"")+'>&minus;</button>' +
            '<span style="min-width:34px;text-align:center">'+it.usosAtual+'/'+it.usosMax+'</span>' +
            '<button class="btn secondary" data-invuso="mais" data-idx="'+idx+'" style="padding:1px 7px;font-size:11px" '+(it.usosAtual>=it.usosMax?"disabled":"")+'>+</button>' +
          '</div>' +
        '</td><td class="num">'+it.espaco+'</td>' +
        '<td><div class="row" style="justify-content:flex-end;flex-wrap:nowrap;gap:4px">' +
          '<button class="btn secondary" data-invuso="repor" data-idx="'+idx+'" style="padding:2px 8px;font-size:11px">repor</button>' +
          '<button class="btn secondary" data-inv="del" data-idx="'+idx+'" style="padding:2px 8px;font-size:11px">remover</button>' +
        '</div></td></tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  // ----- Formulário de item genérico do inventário -----
  function newItemDraft(){ return { nome:"", desc:"", traits:[] }; }

  function renderItemForm(draft){
    var custo = itemCusto(draft.traits);
    var usos = itemUsosMax(draft.traits);
    var espaco = itemEspaco(draft.traits);
    var html = '<div class="card" style="margin-top:12px;background:var(--surface-2)"><h3 style="margin-bottom:8px">Novo item</h3>';
    html += '<div class="field"><label>Nome do item</label><input type="text" id="item-nome" value="'+esc(draft.nome)+'"></div>';
    html += '<div class="field"><label>Descrição (opcional)</label><textarea id="item-desc">'+esc(draft.desc)+'</textarea></div>';
    html += '<p class="hint">Características são opcionais: pode deixar sem nenhuma. Quando usadas, seguem as mesmas regras do equipamento icônico (máximo 3 pontos).</p>';
    html += '<div class="budget '+(custo>3?"bad":"ok")+'"><span>Pontos de característica</span><span class="num">'+custo+' / 3</span></div>';
    html += '<div class="trait-list">' + renderTraitList(draft.traits, "item") + '</div>';
    var espacosoItem = espacosoBonus(draft.traits);
    html += '<p class="hint" style="margin-top:10px">Usos calculados: <b>'+usos+'</b> · Espaço que o item ocupa: <b>'+espaco+'</b>'+(espacosoItem>0?' · <b>+'+espacosoItem+'</b> no teto total de inventário (Espaçoso)':'')+'</p>';
    html += '<div class="btn-row"><button class="btn secondary" data-itemaction="cancel">Cancelar</button><button class="btn accent" data-itemaction="add">Adicionar ao inventário</button></div>';
    html += '</div>';

  function bindItemForm(c, draft){
    app.querySelector('#item-nome').addEventListener("input", function(e){ draft.nome = e.target.value; });
    app.querySelector('#item-desc').addEventListener("input", function(e){ draft.desc = e.target.value; });
    bindTraitList("item", draft.traits, renderSheet);
    app.querySelector('[data-itemaction="cancel"]').addEventListener("click", function(){ state.itemDraft = null; renderSheet(); });
    app.querySelector('[data-itemaction="add"]').addEventListener("click", function(){
      var nome = draft.nome.trim();
      if(!nome){ alert("Dê um nome ao item."); return; }
      var usos = itemUsosMax(draft.traits);
      c.inventarioExtra.push({ nome:nome, desc:draft.desc||"", traits:draft.traits, usosMax:usos, usosAtual:usos, espaco:itemEspaco(draft.traits) });
      marcarPendenteOuSalvar(c, "inv");
      state.itemDraft = null;
      renderSheet();
    });
  }

  function dotsRow(atual, max, extraClass){
    var html = "";
    for(var i=1;i<=max;i++){ html += '<span class="dot '+extraClass+(i<=atual?" filled":"")+'" data-dotval="'+i+'"></span>'; }
    return html;
  }

  // Fileira de 10 laços (⋈) do Cabo de Guerra, um por Nível da escala 0-10: os
  // primeiros nivelDet ficam do lado de Determinação, os restantes do lado de
  // Assimilação. Reaproveitada tanto na versão grande e clicável da ficha
  // (tugDeGuerraCardHtml, clicavel=true: cada laço vira data-tuglvl e aciona
  // bindSheet) quanto nas versões pequenas e só de leitura usadas no card da
  // tela de Personagens, na mini-ficha da aba Mesa (tugMiniBarHtml) e no
  // Painel do Assimilador (gmCharCardBody) - essas últimas com clicavel=false,
  // sem data-tuglvl (não fazem nada ao clicar) e com a classe "mini" (CSS
  // menor). Unificado em 27/09/2026 a pedido do Marco, que apontou que essas
  // mini-fichas ainda mostravam o modelo antigo (barra de preenchimento única)
  // mesmo depois do resto da ficha ter migrado pro visual do livro.
  function tugLacosHtml(nivelDet, clicavel){
    var lacos = "";
    for(var li=1; li<=10; li++){
      lacos += '<span class="tug-lace'+(clicavel?"":" mini")+' '+(li<=nivelDet?"det":"assim")+'"'+
        (clicavel?' data-tuglvl="'+li+'"':'')+
        ' title="Nível '+li+' de Determinação / '+(10-li)+' de Assimilação">⋈</span>';
    }
    return '<div class="tug-track'+(clicavel?"":" mini")+'">' +
      '<span class="tug-endcap'+(clicavel?"":" mini")+'" style="border-color:var(--royal)"></span>' +
      lacos +
      '<span class="tug-endcap'+(clicavel?"":" mini")+'" style="border-color:var(--assim)"></span>' +
    '</div>';
  }

  // Card de Determinação/Assimilação: única forma de calcular e mostrar isso
  // na ficha (Cabo de Guerra, ver "O CABO DE GUERRA" na fonte - Assimilação
  // RPG Fastplay, pág. 18). Determinação e Assimilação têm cada uma um
  // NÍVEL, e os dois níveis sempre somam 10 (Determinação 6 = Assimilação 4,
  // por exemplo). O NÍVEL também é o teto de PONTOS que dá pra gastar como
  // recurso: assim que o nível sobe ou desce, os pontos daquele nível voltam
  // a ficar completos. Cada caixa inteira de 10 pontos que a versão de
  // Pangea sempre teve (caixaAtual caindo de 3 pra 2, de 2 pra 1, etc.)
  // representa a perda de 1 NÍVEL de Determinação inteiro nessa escala de 0
  // a 10 - não um terço de 3, é sempre -1 nível a partir de uma base 10.
  // Zerar essas 3 caixinhas já deixa o Sobrevivente Suscetível pra valer
  // (ver determinacaoZerada/marcarFlashSuscetivel/detZeroEffectHtml) - dali
  // em diante, caixaAtual continua descendo (ver DET_CAIXA_FLOOR) até o
  // Nível 0 de Determinação/Nível 10 de Assimilação, o piso absoluto da
  // escala. Os pontos "ao vivo" de Determinação usam o mesmo pontosAtual
  // (0-10) que a ficha já guarda, só limitado ao teto do nível atual (em vez
  // de sempre 10); os pontos de Assimilação têm seu próprio controle
  // (assimPontosAtual, ver funções auxiliares logo abaixo), sempre limitado
  // ao teto do nível atual de Assimilação. A bolinha do cabo pode ser
  // arrastada (ver bindSheet) pra ajustar o NÍVEL na mão, em qualquer ponto
  // da escala de 0 a 10, e os pontos de cada lado têm botões -/+ próprios.
  function tugDeGuerraCardHtml(c){
    var caixaAtual = clamp(c.determinacao.caixaAtual!=null ? c.determinacao.caixaAtual : 3, DET_CAIXA_FLOOR, 3);
    var nivelAssim = 3 - caixaAtual; // caixas/níveis inteiros já esgotados = níveis de Assimilação ganhos
    var nivelDet = 10 - nivelAssim; // os dois níveis sempre somam 10
    var ptsDetBruto = clamp(c.determinacao.pontosAtual!=null ? c.determinacao.pontosAtual : 10, 0, 10);
    var ptsDet = clamp(ptsDetBruto, 0, nivelDet); // teto de pontos = nível atual, não sempre 10
    var ptsAssim = assimPontosAtuais(c);
    // "zerada" cobre os dois casos que acionam o efeito Suscetível: o piso
    // absoluto da escala (persistente, ver determinacaoZerada) ou um flash
    // temporário de alguns segundos (ver marcarFlashSuscetivel/state.detFlash)
    // porque os pontos do Nível atual acabaram de zerar e cascatear.
    var zerada = determinacaoZerada(c) || !!state.detFlash[c.id];
    var detEffect = detZeroEffectHtml(c, zerada);
    return '<div class="card tug-card'+detEffect.cls+'">' +
      detEffect.stamp +
      '<h2>Determinação / Assimilação</h2>' +
      pendingSectionBannerHtml(c, "cabo") +
      '<p class="hint" style="margin-top:2px">Determinação e Assimilação têm cada uma um Nível, e os dois sempre somam 10. Clique num laço da trilha pra ajustar o Nível atual.</p>' +
      '<div class="tug-wrap">' +
        '<div class="tug-row">' +
          '<span class="tug-tag" style="color:var(--royal)">Determinação</span>' +
          tugLacosHtml(nivelDet, true) +
          '<span class="tug-tag" style="color:var(--assim)">Assimilação</span>' +
        '</div>' +
        '<div class="tug-nums"><span>'+icoHtml("nd")+' Nível '+nivelDet+'</span><span>Nível '+nivelAssim+' '+icoHtml("na")+'</span></div>' +
      '</div>' +
      '<div class="row" style="margin-top:12px;gap:16px;flex-wrap:wrap;align-items:center">' +
        '<div class="row" style="gap:6px;align-items:center;flex-wrap:nowrap">' +
          '<button type="button" class="btn secondary" data-tugpts="det-menos" style="padding:1px 7px;font-size:11px" '+(ptsDet<=0?"disabled":"")+'>&minus;</button>' +
          '<span class="gm-compact-line" style="margin:0">'+icoHtml("pd")+' <b style="color:var(--royal)">'+ptsDet+'</b> de '+nivelDet+' pontos de Determinação</span>' +
          '<button type="button" class="btn secondary" data-tugpts="det-mais" style="padding:1px 7px;font-size:11px" '+(ptsDet>=nivelDet?"disabled":"")+'>+</button>' +
        '</div>' +
        '<div class="row" style="gap:6px;align-items:center;flex-wrap:nowrap">' +
          '<button type="button" class="btn secondary" data-tugpts="assim-menos" style="padding:1px 7px;font-size:11px" '+(ptsAssim<=0?"disabled":"")+'>&minus;</button>' +
          '<span class="gm-compact-line" style="margin:0">'+icoHtml("pa")+' <b style="color:var(--assim)">'+ptsAssim+'</b> de '+nivelAssim+' '+(nivelAssim===1?'ponto':'pontos')+' de Assimilação</span>' +
          '<button type="button" class="btn secondary" data-tugpts="assim-mais" style="padding:1px 7px;font-size:11px" '+(ptsAssim>=nivelAssim?"disabled":"")+'>+</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // Losangos ♦ pros medidores de Saúde e Determinação: sizeClass ("dsize-lg"/"dsize-sm")
  // controla o tamanho do ícone, colorClass ("c-saude"/"c-det") a cor quando preenchido.
  // Ícone oficial (ver CSS .ico): k = "nd"/"na"/"ns" (Nível, círculo) ou
  // "pd"/"pa"/"ps" (Pontos, triângulo) de Determinação/Assimilação/Saúde.
  var ICO_TITULOS = { nd:"Nível de Determinação", pd:"Pontos de Determinação", na:"Nível de Assimilação",
    pa:"Pontos de Assimilação", ns:"Nível de Saúde", ps:"Pontos de Saúde" };
  function icoHtml(k, extraClass){
    return '<span class="ico ico-'+k+(k.charAt(0)==="p"?" tri":"")+(extraClass?" "+extraClass:"")+'" title="'+ICO_TITULOS[k]+'" role="img" aria-label="'+ICO_TITULOS[k]+'"></span>';
  }
  // Medidores de Saúde (e Determinação): antes eram losangos ♦, agora usam os
  // ícones oficiais - icoKey escolhe qual (padrão: Pontos da cor do medidor).
  function diamonds(atual, max, sizeClass, colorClass, icoKey){
    var k = icoKey || (colorClass === "c-det" ? "pd" : "ps");
    var html = "";
    for(var i=1;i<=max;i++){
      html += '<span class="diamond ico ico-'+k+(k.charAt(0)==="p"?" tri":"")+' '+sizeClass+' '+colorClass+(i<=atual?" filled":"")+'" data-dotval="'+i+'" title="'+ICO_TITULOS[k]+' '+i+'"></span>';
    }
    return html;
  }

  // Gasta n pontos de Determinação (botão "-1 ponto" do Cabo de Guerra - ver
  // bindSheet/tugpts "det-menos" - e "Agir por Instinto"/"dado extra" quando
  // não sobra Assimilação, ver bindSheetTest): perde uma caixa (e passa a
  // esvaziar a próxima, já cheia) quando a caixa atual chega a 0 - isso é a
  // própria mecânica de "O CABO DE GUERRA" na fonte, o Nível de Determinação
  // descendo/Assimilação subindo em tempo real conforme os pontos daquele
  // Nível se esgotam. Não trava em caixaAtual=0: continua descendo (ver
  // DET_CAIXA_FLOOR) até o Nível 0 de verdade. Retorna true quando um Nível
  // desceu de verdade nesta chamada (mesmo que os pontos já tenham
  // cascateado de volta pro cheio do próximo Nível) - quem chama usa isso
  // pra acionar o flash do efeito Suscetível (ver marcarFlashSuscetivel).
  function gastarDeterminacao(c, n){
    n = n||1;
    var desceuNivel = false;
    for(var i=0;i<n;i++){
      if(c.determinacao.pontosAtual > 0 || c.determinacao.caixaAtual > DET_CAIXA_FLOOR){
        c.determinacao.pontosAtual = Math.max(0, (c.determinacao.pontosAtual||0)-1);
        if(c.determinacao.pontosAtual === 0 && c.determinacao.caixaAtual > DET_CAIXA_FLOOR){
          c.determinacao.caixaAtual -= 1;
          desceuNivel = true;
          // Perder uma caixa de Determinação é subir um NÍVEL de Assimilação
          // de verdade (ver "O CABO DE GUERRA" na fonte): os pontos de
          // Assimilação do novo nível voltam a ficar completos, por isso o
          // valor guardado é zerado aqui (a leitura em assimPontosAtuais volta
          // a cair no "cheio" automaticamente enquanto ninguém gastar de novo).
          c.determinacao.assimPontosAtual = null;
          // Ainda sobra Nível pra descer: a próxima caixa começa cheia. No
          // piso de vez (Nível 0), não sobra teto nenhum, então os pontos
          // ficam em 0 mesmo (não há Determinação nenhuma pra ter).
          c.determinacao.pontosAtual = c.determinacao.caixaAtual > DET_CAIXA_FLOOR ? 10 : 0;
          // Todo Nível de Determinação perdido de verdade dispara um Teste de Assimilação
          // (livro definitivo, pág. 124, "EVOLUINDO E ASSIMILANDO") - fica pendente até
          // alguém rolar (ver renderMutacoesCard/iniciarTesteAssimilacao), sem travar nada.
          if(c.testesAssimPendentes == null) c.testesAssimPendentes = 0;
          c.testesAssimPendentes += 1;
        }
      }
    }
    return desceuNivel;
  }
  // Liga o flash local (não sincronizado) do efeito Suscetível por alguns
  // segundos - ver detZeroEffectHtml/state.detFlash. Chamado sempre que
  // gastarDeterminacao informa que um Nível desceu nesta ação; um novo
  // disparo reinicia a contagem se o anterior ainda não tiver terminado.
  function marcarFlashSuscetivel(c){
    state.detFlash[c.id] = true;
    if(state.detFlashTimers[c.id]) clearTimeout(state.detFlashTimers[c.id]);
    state.detFlashTimers[c.id] = setTimeout(function(){
      state.detFlash[c.id] = false;
      if(state.view === "sheet" && state.charId === c.id) renderSheet();
    }, 3000);
  }
  // Determinação disponível pra "Manter +1 dado extra" (ver extraDadoDisponivel):
  // simplesmente pontosAtual>0 - gastarDeterminacao já garante que isso só
  // fica em 0 de verdade no piso absoluto da escala (fora disso, a cascata
  // sempre reenche pra um valor positivo no mesmo instante).
  function determinacaoDisponivel(c){
    return (c.determinacao.pontosAtual||0) > 0;
  }

  // ----- Pontos de Assimilação -----
  // Nível de Determinação/Assimilação na escala real de 0 a 10 da fonte (ver
  // tugDeGuerraCardHtml): cada caixa que Pangea já esgotou tira 1 nível de
  // Determinação e dá 1 nível de Assimilação, sempre somando 10 no total.
  function nivelDetAtual(c){
    return 10 - nivelAssimAtual(c);
  }
  function nivelAssimAtual(c){
    return 3 - clamp(c.determinacao.caixaAtual!=null ? c.determinacao.caixaAtual : 3, DET_CAIXA_FLOOR, 3);
  }
  // Determinação zerada é o piso absoluto da escala (Nível 0, ver
  // DET_CAIXA_FLOOR): como gastarDeterminacao cascateia e reenche pontosAtual
  // assim que uma caixa se esgota, esse é o único jeito de pontosAtual ficar
  // persistentemente em 0. É um dos dois gatilhos do efeito Suscetível (ver
  // detZeroEffectHtml/tugDeGuerraCardHtml) - o outro é o flash temporário de
  // marcarFlashSuscetivel, pra cobrir o instante (não-persistente) em que um
  // Nível intermediário zera e cascateia.
  function determinacaoZerada(c){
    return (c.determinacao.pontosAtual!=null ? c.determinacao.pontosAtual : 10) <= 0;
  }
  // Monta a classe CSS e o carimbo "SUSCETÍVEL" do estado zerado (ver CSS
  // .det-zerada/.det-stamp), a partir do booleano "zerada" que cada card já
  // calculou (ver renderSheet/tugDeGuerraCardHtml). A "chacoalhada" de entrada
  // (.det-shake) só toca na primeira vez que a Determinação daquele
  // personagem aparece zerada nesta aba (state.detShakeSeen); o estado em si
  // (borda + carimbo) fica sempre visível enquanto durar, e some sozinho
  // assim que os pontos forem recalculados de novo pra cima (a checagem
  // abaixo já limpa a flag nesse caso).
  function detZeroEffectHtml(c, zerada){
    if(!zerada){
      state.detShakeSeen[c.id] = false;
      return { cls:"", stamp:"" };
    }
    var primeiraVez = !state.detShakeSeen[c.id];
    state.detShakeSeen[c.id] = true;
    return {
      cls: " det-zerada" + (primeiraVez ? " det-shake" : ""),
      stamp: '<div class="det-stamp">Suscetível</div>'
    };
  }
  // Pontos de Assimilação disponíveis agora: assimPontosAtual guarda o valor
  // só a partir da primeira vez que alguém gasta ou devolve um ponto por essa
  // via; enquanto isso (ou logo depois de um nível mudar - ver gastarDeterminacao
  // e o arrastar da bolinha do Cabo de Guerra), fica sempre cheio no teto do
  // nível atual, do mesmo jeito que a Determinação fica ao subir/descer de nível.
  function assimPontosAtuais(c){
    var nivel = nivelAssimAtual(c);
    var v = c.determinacao.assimPontosAtual;
    if(v==null) return nivel;
    return clamp(v, 0, nivel);
  }
  function gastarAssimilacao(c, n){
    n = n||1;
    c.determinacao.assimPontosAtual = Math.max(0, assimPontosAtuais(c)-n);
  }
  function devolverAssimilacao(c, n){
    n = n||1;
    c.determinacao.assimPontosAtual = Math.min(nivelAssimAtual(c), assimPontosAtuais(c)+n);
  }
  function assimilacaoDisponivel(c){
    return assimPontosAtuais(c) > 0;
  }
  // "Manter +1 dado extra" é o Empenho do livro definitivo (pág. 59): "Antes
  // de qualquer rolagem o(a) Infectado(a) pode gastar 1 Ponto de Determinação
  // para manter um dado adicional." Só gasta Determinação - não tem
  // substituto de Assimilação, ao contrário de Agir por Instinto (ver
  // agirPorInstintoDisponivel logo abaixo).
  // Correção de 27/09/2026: antes disso, esta caixa tentava gastar Assimilação
  // primeiro, o que na verdade é a regra de OUTRA mecânica (Agir por
  // Instinto/Rolagem Assimilada); as duas custavam do jeito errado.
  function extraDadoDisponivel(c){
    return determinacaoDisponivel(c);
  }
  // Agir por Instinto = Rolagem Assimilada (livro definitivo, pág. 41/60): custa
  // 1 Ponto de Assimilação; sem nenhum sobrando, é permitido pagar com 2 Pontos
  // de Determinação em substituição. Diferente de "Manter +1 dado extra" (Empenho),
  // que só usa Determinação - ver extraDadoDisponivel acima.
  function agirPorInstintoDisponivel(c){
    if(assimilacaoDisponivel(c)) return true;
    return determinacaoDisponivel(c);
  }
  // Devolve pontos de Determinação só até o teto do NÍVEL atual.
  function devolverDeterminacaoNivel(c, n){
    n = n||1;
    c.determinacao.pontosAtual = Math.min(nivelDetAtual(c), (c.determinacao.pontosAtual||0)+n);
  }

  // ----- ASSIMILAÇÃO: TESTE, CARTAS DE MUTAÇÃO E PRESSÃO (livro definitivo, Cap. 4) -----
  // Pressão acumulada de verdade: soma, entre as mutações de Assimilações Inoportunas (H)
  // já adquiridas, os C do custo de cada uma menos os já neutralizados por Clareza de
  // Propósito (ver neutralizarPressao). Atingir 10 é perda de controle definitiva (pág. 124).
  function pressaoTotal(c){
    var t = 0;
    (c.mutAdquiridas||[]).forEach(function(m){
      if(m.cat !== "H") return;
      var simb = custoSimbolos(m.custo);
      t += Math.max(0, simb.p - (m.neutralizadas||0));
    });
    return t;
  }
  function perdidoParaAssimilacao(c){
    if(c.assimPerdido) return true;
    if(pressaoTotal(c) >= 10){ c.assimPerdido = true; return true; }
    return false;
  }
  // Sorteia n cartas distintas (índices 0-12) de uma categoria - simula puxar do baralho
  // físico daquele naipe sem repetir na mesma rolagem (repete só entre rolagens diferentes,
  // já que mutações da mesma carta são independentes entre si - pág. 125).
  function sortearCartas(cat, n){
    var total = MUT_DECKS[cat].length;
    var idxs = []; for(var i=0;i<total;i++) idxs.push(i);
    for(var j=idxs.length-1;j>0;j--){ var k = Math.floor(Math.random()*(j+1)); var tmp=idxs[j]; idxs[j]=idxs[k]; idxs[k]=tmp; }
    if(n <= total) return idxs.slice(0,n);
    // Mais pontos do que cartas no baralho (raro, pool grande): completa repetindo ao acaso.
    var extra = []; for(var e=0;e<n-total;e++) extra.push(Math.floor(Math.random()*total));
    return idxs.concat(extra);
  }
  // Rola o Teste de Assimilação (pág. 124 do livro definitivo): 1d10 + 1d12 por Nível de
  // Assimilação (E) já atingido (incluindo o novo Nível, se foi isso que disparou o teste),
  // soma os símbolos ABC obtidos e puxa cartas: 1 de Evolutivas (F) por A, 1 de Adaptativas
  // (G) por B, 1 de Inoportunas (H) por C. O resultado vira um "pool" de pontos pra gastar
  // em qualquer carta puxada (ver adquirirTier) - todos os pontos devem ser gastos, mas a
  // ferramenta não obriga: sobras ficam visíveis pro Assimilador arbitrar (pág. 124).
  function iniciarTesteAssimilacao(c){
    var e = Math.max(0, nivelAssimAtual(c));
    var dados = [rollDie(10)];
    for(var i=0;i<e;i++) dados.push(rollDie(12));
    var totS = sum(dados.map(function(d){return d.s;}));
    var totA = sum(dados.map(function(d){return d.a;}));
    var totP = sum(dados.map(function(d){return d.p;}));
    var cartas = { F: sortearCartas("F", totS), G: sortearCartas("G", totA), H: sortearCartas("H", totP) };
    c.assimTesteAtual = { e:e, dados:dados, sPool:totS, aPool:totA, pPool:totP, cartas:cartas, ts:new Date().toISOString() };
    c.testesAssimPendentes = Math.max(0, (c.testesAssimPendentes||0) - 1);
    perdidoParaAssimilacao(c); // já soma qualquer P vindo de Inoportunas anteriores; a rolagem em si só conta pra perda quando os pontos forem GASTOS numa mutação Inoportuna (pág. 124 conta C "mantidas no resultado", ou seja, efetivamente adquiridas)
  }
  function encerrarTesteAssimilacao(c){ c.assimTesteAtual = null; }
  function tierJaAdquirido(c, cat, cardIdx, tierIdx){
    return (c.mutAdquiridas||[]).some(function(m){ return m.cat===cat && m.cardIdx===cardIdx && m.tierIdx===tierIdx; });
  }
  function podeAdquirirTier(c, cat, cardIdx, tierIdx){
    if(!c.assimTesteAtual) return false;
    var tier = MUT_DECKS[cat][cardIdx][2][tierIdx];
    if(tierJaAdquirido(c, cat, cardIdx, tierIdx)) return false;
    if(tier[3] && nivelAssimAtual(c) < tier[3]) return false;
    var custo = custoSimbolos(tier[0]);
    var pool = c.assimTesteAtual;
    return pool.sPool >= custo.s && pool.aPool >= custo.a && pool.pPool >= custo.p;
  }
  function adquirirTier(c, cat, cardIdx, tierIdx){
    if(!podeAdquirirTier(c, cat, cardIdx, tierIdx)) return false;
    var tier = MUT_DECKS[cat][cardIdx][2][tierIdx];
    var custo = custoSimbolos(tier[0]);
    var pool = c.assimTesteAtual;
    pool.sPool -= custo.s; pool.aPool -= custo.a; pool.pPool -= custo.p;
    c.mutAdquiridas.push({ id:uid(), cat:cat, cardIdx:cardIdx, tierIdx:tierIdx, custo:tier[0], neutralizadas:0, ts:new Date().toISOString() });
    perdidoParaAssimilacao(c);
    return true;
  }
  // Clareza de Propósito (pág. 62 do livro definitivo): ao concluir um arco satisfatoriamente,
  // cumprir um Propósito ou algo maravilhoso/inesperado acontecer, o(a) Infectado(a) escolhe
  // entre recuperar um Nível de Determinação completo OU anular 1 C de uma mutação Inoportuna
  // já adquirida (uma C por vez; zerar todas as C daquela mutação cessa seus efeitos negativos,
  // mesmo que a mutação física em si permaneça).
  function clarezaRecuperarNivel(c){
    var novoCaixa = clamp((c.determinacao.caixaAtual!=null?c.determinacao.caixaAtual:3) + 1, DET_CAIXA_FLOOR, 3);
    c.determinacao.caixaAtual = novoCaixa;
    c.determinacao.pontosAtual = nivelDetAtual(c);
    c.determinacao.assimPontosAtual = null;
  }
  function clarezaNeutralizarPressao(c, mutId){
    var m = (c.mutAdquiridas||[]).filter(function(x){return x.id===mutId;})[0];
    if(!m || m.cat!=="H") return false;
    var total = custoSimbolos(m.custo).p;
    if((m.neutralizadas||0) >= total) return false;
    m.neutralizadas = (m.neutralizadas||0) + 1;
    return true;
  }

  // Emblemas compactos de símbolos ABC (Sucesso/Adaptação/Pressão) a partir de uma string
  // de custo tipo "BBA" - reaproveita as mesmas cores/ícones de resultBadges, só menores.
  function custoChipHtml(custo){
    var s = custoSimbolos(custo);
    var parts = [];
    if(s.s) parts.push('<span class="rbadge rb-s" style="padding:1px 7px;font-size:11px">'+dadoHtml("s")+s.s+'</span>');
    if(s.a) parts.push('<span class="rbadge rb-a" style="padding:1px 7px;font-size:11px">'+dadoHtml("a")+s.a+'</span>');
    if(s.p) parts.push('<span class="rbadge rb-p" style="padding:1px 7px;font-size:11px">'+dadoHtml("p")+s.p+'</span>');
    return '<span class="result-badges">'+parts.join('')+'</span>';
  }
  // Uma carta (com todos os tiers) dentro do Teste de Assimilação em andamento - mostra
  // cada tier com seu custo e nome, e um botão "Adquirir" habilitado só se o pool atual
  // cobrir o custo exato, o tier ainda não tiver sido comprado e o Nível de Assimilação
  // (E) mínimo (se houver) já tiver sido atingido (tiers são independentes entre si).
  function mutCardHtml(c, cat, cardIdx, opts){
    opts = opts || {};
    var card = MUT_DECKS[cat][cardIdx];
    var collapseId = "mutcard-"+cat+"-"+cardIdx;
    var collapsed = !!state.collapsed[collapseId];
    var html = '<div class="card tight" style="margin-bottom:8px">' +
      '<div class="row" style="justify-content:space-between;cursor:pointer" data-mutcardtoggle="'+collapseId+'">' +
        '<b>'+esc(card[0])+'</b><span class="hint" style="margin:0">'+esc(card[1])+' · '+(collapsed?"▸":"▾")+'</span>' +
      '</div>';
    if(!collapsed){
      html += '<div class="trait-list" style="margin-top:8px">';
      card[2].forEach(function(tier, tierIdx){
        var owned = tierJaAdquirido(c, cat, cardIdx, tierIdx);
        var pode = opts.comPool ? podeAdquirirTier(c, cat, cardIdx, tierIdx) : false;
        html += '<div class="trait'+(owned?" checked":"")+'" style="cursor:default;align-items:center">' +
          '<span style="min-width:74px">'+custoChipHtml(tier[0])+'</span>' +
          '<span class="txt"><b>'+esc(tier[1])+(tier[3]?' <span class="hint">(E'+tier[3]+'+)</span>':'')+'</b><span>'+formatEfeito(tier[2], true)+'</span></span>' +
          (owned ? '<span class="badge-pill good" style="flex:none">adquirida</span>' :
            (opts.comPool ? '<button type="button" class="btn secondary" style="flex:none" data-mutbuy="'+cat+'|'+cardIdx+'|'+tierIdx+'" '+(pode?'':'disabled')+'>Adquirir</button>' : '')) +
        '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }
  // Card "Assimilação" da ficha: Pressão acumulada, Testes de Assimilação pendentes/em
  // andamento (com as cartas sorteadas e o pool de símbolos ainda por gastar), Clareza de
  // Propósito, mutações Singulares oferecidas pelo Assimilador, e a lista de mutações já
  // adquiridas por categoria - livro definitivo, Cap. 4 (págs. 122-165).
  function renderMutacoesCard(c){
    var pendentes = c.testesAssimPendentes||0;
    var pressao = pressaoTotal(c);
    var perdido = perdidoParaAssimilacao(c);
    var pool = c.assimTesteAtual;
    var clarezaAberta = !!state.clarezaAberta && state.clarezaAberta[c.id];

    var body = pendingSectionBannerHtml(c, "assim");

    if(perdido){
      body += '<div class="card tight" style="border-color:var(--blood);background:rgba(143,29,29,.08)">' +
        '<h2 style="color:var(--blood);margin-bottom:4px">Perdido(a) para a Assimilação</h2>' +
        '<p class="hint" style="margin:0">A Pressão acumulada em Assimilações Inoportunas atingiu 10. O(a) jogador(a) perde o controle da personagem pra sempre: ela passa a ser controlada pelo(a) Assimilador(a).</p>' +
      '</div>';
    }

    var pressaoClass = pressao>=10 ? "warn" : "";
    body += '<div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px">' +
      '<span class="gm-compact-line" style="margin:0">Pressão acumulada (Assimilações Inoportunas): <b'+(pressao>=7?' style="color:var(--danger)"':'')+'>'+pressao+'</b> / 10'+(pressao>=7&&pressao<10?' <span class="badge-pill warn">atenção</span>':'')+'</span>' +
    '</div>';

    if(pendentes>0 && !perdido){
      body += '<div class="card tight" style="border-color:var(--suscet);margin-top:10px"><p class="hint" style="margin:0">O Nível de Determinação caiu <b>'+pendentes+'</b> '+(pendentes===1?'vez':'vezes')+' sem o Teste de Assimilação correspondente ter sido rolado ainda.</p></div>';
    }

    if(!perdido){
      body += '<div class="row" style="margin-top:12px;gap:10px;flex-wrap:wrap">';
      if(!pool){
        body += '<button type="button" class="btn accent" data-action="assim-testar">Fazer Teste de Assimilação (1d10'+(nivelAssimAtual(c)>0?' + '+nivelAssimAtual(c)+'d12':'')+')</button>';
      }
      body += '<button type="button" class="btn secondary" data-action="assim-clareza-toggle">'+(clarezaAberta?"Fechar Clareza de Propósito":"Clareza de Propósito")+'</button>';
      body += '</div>';
    }

    if(clarezaAberta && !perdido){
      var inoportunasComC = (c.mutAdquiridas||[]).filter(function(m){ return m.cat==="H" && (m.neutralizadas||0) < custoSimbolos(m.custo).p; });
      body += '<div class="card tight" style="margin-top:10px;background:var(--surface-2)">' +
        '<p class="hint" style="margin-top:0">Ao concluir um arco satisfatoriamente, cumprir um Propósito ou algo maravilhoso/inesperado acontecer: escolha uma das opções abaixo.</p>' +
        '<div class="row" style="gap:10px;flex-wrap:wrap">' +
          '<button type="button" class="btn secondary" data-action="assim-clareza-nivel">Recuperar 1 Nível de Determinação completo</button>' +
        '</div>';
      if(inoportunasComC.length){
        body += '<p class="hint" style="margin:10px 0 6px">Ou anule 1 Pressão ('+dadoHtml("p")+') de uma mutação Inoportuna já adquirida:</p><div class="row" style="gap:8px;flex-wrap:wrap">';
        inoportunasComC.forEach(function(m){
          var card = MUT_DECKS.H[m.cardIdx]; var tier = card[2][m.tierIdx];
          var total = custoSimbolos(m.custo).p;
          body += '<button type="button" class="btn secondary" data-action="assim-clareza-c" data-mutid="'+m.id+'">'+esc(card[0]+" — "+tier[1])+' ('+(total-(m.neutralizadas||0))+'/'+total+' '+dadoHtml("p")+')</button>';
        });
        body += '</div>';
      } else {
        body += '<p class="hint" style="margin:10px 0 0">Nenhuma mutação Inoportuna com Pressão pra anular no momento.</p>';
      }
      body += '</div>';
    }

    if(pool){
      body += '<div class="card tight" style="margin-top:10px;border-color:var(--assim)">' +
        '<h3 style="margin-bottom:8px">Teste de Assimilação em andamento</h3>' +
        '<p class="hint">Dados rolados: '+pool.dados.map(function(d){ return 'd'+d.sides+':'+d.face; }).join(', ')+'</p>' +
        '<div class="budget ok"><span>Pool ainda disponível</span><span class="num">'+custoChipHtml("A".repeat(pool.sPool)+"B".repeat(pool.aPool)+"C".repeat(pool.pPool))+'</span></div>';
      MUT_CATS.filter(function(cat){ return cat!=="I"; }).forEach(function(cat){
        var idxs = pool.cartas[cat] || [];
        if(!idxs.length) return;
        body += '<h4 style="margin:12px 0 6px;text-transform:uppercase;font-family:\'Oswald\',sans-serif;font-size:12.5px;color:var(--ink-muted)">'+esc(MUT_SUITS[cat])+' ('+MUT_SIGLA[cat]+') sorteadas</h4>';
        idxs.forEach(function(idx){ body += mutCardHtml(c, cat, idx, {comPool:true}); });
      });
      body += '<div class="row" style="margin-top:8px"><button type="button" class="btn secondary" data-action="assim-encerrar">Encerrar este Teste (descarta o que sobrar do pool)</button></div>';
      body += '</div>';
    }

    // Registro manual de mutação: cobre dois casos - (1) Assimilações Singulares, que
    // cabe ao(à) Assimilador(a) oferecer e nunca são sorteadas pelo Teste, e (2) lançar
    // retroativamente qualquer mutação (de qualquer categoria) que a personagem já tinha
    // antes desse sistema existir na ficha, sem precisar simular um Teste de Assimilação
    // pra "sortear" a carta certa. Pedido do Marco em 27/09/2026.
    body += '<div class="card tight" style="margin-top:10px">' +
      '<h3 style="margin-bottom:8px">Adicionar mutação manualmente</h3>' +
      '<p class="hint">Use para registrar uma Assimilação Singular concedida pelo(a) Assimilador(a) (elas nunca são sorteadas pelo Teste) ou para lançar retroativamente uma mutação de qualquer categoria que a personagem já tinha antes desse sistema existir na ficha.</p>' +
      '<div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">' +
        '<select data-mancat style="max-width:220px">' + MUT_CATS.map(function(cat){ return '<option value="'+cat+'"'+(cat==="I"?' selected':'')+'>'+esc(MUT_SUITS[cat])+' ('+MUT_SIGLA[cat]+')</option>'; }).join('') + '</select>' +
        '<select data-mancard style="max-width:220px"></select>' +
        '<select data-mantier style="max-width:260px"></select>' +
        '<button type="button" class="btn secondary" data-action="assim-add-manual">Registrar mutação</button>' +
      '</div>' +
    '</div>';

    // Mutações já adquiridas, por categoria.
    var temAlguma = (c.mutAdquiridas||[]).length>0;
    body += '<h3 style="margin:14px 0 8px">Mutações adquiridas</h3>';
    if(!temAlguma){
      body += '<p class="hint">Nenhuma mutação de Assimilação adquirida ainda.</p>';
    } else {
      MUT_CATS.forEach(function(cat){
        var lista = (c.mutAdquiridas||[]).filter(function(m){ return m.cat===cat; });
        if(!lista.length) return;
        body += '<p class="hint" style="margin:8px 0 4px;text-transform:uppercase;letter-spacing:.05em">'+esc(MUT_SUITS[cat])+' ('+MUT_SIGLA[cat]+')</p><div class="trait-list">';
        lista.forEach(function(m){
          var card = MUT_DECKS[cat][m.cardIdx], tier = card[2][m.tierIdx];
          var pInfo = "";
          if(cat==="H"){
            var total = custoSimbolos(m.custo).p, neut = m.neutralizadas||0;
            pInfo = neut>0 ? ' <span class="hint">('+(total-neut)+'/'+total+' '+dadoHtml("p")+' restantes'+(neut>=total?" · efeito cessado":"")+')</span>' : '';
          }
          body += '<div class="trait" style="cursor:default;align-items:center"><span style="min-width:74px">'+custoChipHtml(m.custo)+'</span>' +
            '<span class="txt"><b>'+esc(card[0]+" — "+tier[1])+'</b>'+pInfo+'<span>'+formatEfeito(tier[2], true)+'</span></span>' +
            '<button type="button" class="btn secondary" style="flex:none" data-action="assim-remover" data-mutid="'+m.id+'">Remover</button></div>';
        });
        body += '</div>';
      });
    }

    return sectionCard("assimilacao", "Assimilação (Mutações)", body);
  }
  function bindMutacoesCard(c){
    app.querySelectorAll('[data-mutcardtoggle]').forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-mutcardtoggle");
        state.collapsed[id] = !state.collapsed[id];
        saveLS("pangea:collapsed", state.collapsed);
        renderSheet();
      });
    });
    var testarBtn = app.querySelector('[data-action="assim-testar"]');
    if(testarBtn) testarBtn.addEventListener("click", function(){
      iniciarTesteAssimilacao(c);
      marcarPendenteOuSalvar(c, "assim");
      renderSheet();
    });
    var clarezaToggle = app.querySelector('[data-action="assim-clareza-toggle"]');
    if(clarezaToggle) clarezaToggle.addEventListener("click", function(){
      if(!state.clarezaAberta) state.clarezaAberta = {};
      state.clarezaAberta[c.id] = !state.clarezaAberta[c.id];
      renderSheet();
    });
    var clarezaNivel = app.querySelector('[data-action="assim-clareza-nivel"]');
    if(clarezaNivel) clarezaNivel.addEventListener("click", function(){
      clarezaRecuperarNivel(c);
      state.clarezaAberta[c.id] = false;
      marcarPendenteOuSalvar(c, "assim");
      renderSheet();
    });
    app.querySelectorAll('[data-action="assim-clareza-c"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        clarezaNeutralizarPressao(c, btn.getAttribute("data-mutid"));
        state.clarezaAberta[c.id] = false;
        marcarPendenteOuSalvar(c, "assim");
        renderSheet();
      });
    });
    app.querySelectorAll('[data-mutbuy]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var parts = btn.getAttribute("data-mutbuy").split("|");
        adquirirTier(c, parts[0], parseInt(parts[1],10), parseInt(parts[2],10));
        marcarPendenteOuSalvar(c, "assim");
        renderSheet();
      });
    });
    var encerrarBtn = app.querySelector('[data-action="assim-encerrar"]');
    if(encerrarBtn) encerrarBtn.addEventListener("click", function(){
      encerrarTesteAssimilacao(c);
      marcarPendenteOuSalvar(c, "assim");
      renderSheet();
    });
    var manCatSel = app.querySelector('[data-mancat]');
    var manCardSel = app.querySelector('[data-mancard]');
    var manTierSel = app.querySelector('[data-mantier]');
    function refreshManTiers(){
      if(!manCatSel || !manCardSel || !manTierSel) return;
      var cat = manCatSel.value;
      var idx = parseInt(manCardSel.value,10);
      var card = MUT_DECKS[cat][idx];
      manTierSel.innerHTML = card[2].map(function(tier,ti){ return '<option value="'+ti+'">'+esc(tier[1])+' ('+custoSimbolosTexto(tier[0])+')</option>'; }).join('');
    }
    function refreshManCards(){
      if(!manCatSel || !manCardSel) return;
      var cat = manCatSel.value;
      manCardSel.innerHTML = MUT_DECKS[cat].map(function(card,idx){ return '<option value="'+idx+'">'+esc(card[0])+' ('+card[1]+')</option>'; }).join('');
      refreshManTiers();
    }
    if(manCatSel){
      refreshManCards();
      manCatSel.addEventListener("change", refreshManCards);
      manCardSel.addEventListener("change", refreshManTiers);
    }
    var addManBtn = app.querySelector('[data-action="assim-add-manual"]');
    if(addManBtn) addManBtn.addEventListener("click", function(){
      var cat = manCatSel.value;
      var cardIdx = parseInt(manCardSel.value,10), tierIdx = parseInt(manTierSel.value,10);
      if(tierJaAdquirido(c, cat, cardIdx, tierIdx)){ alert("Essa mutação já foi registrada."); return; }
      var tier = MUT_DECKS[cat][cardIdx][2][tierIdx];
      c.mutAdquiridas.push({ id:uid(), cat:cat, cardIdx:cardIdx, tierIdx:tierIdx, custo:tier[0], neutralizadas:0, ts:new Date().toISOString() });
      perdidoParaAssimilacao(c);
      marcarPendenteOuSalvar(c, "assim");
      renderSheet();
    });
    app.querySelectorAll('[data-action="assim-remover"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var mutId = btn.getAttribute("data-mutid");
        // Usa o modal de confirmação próprio da ficha (askConfirm), não o confirm()
        // nativo do navegador - dentro do iframe isolado onde o artifact roda, o
        // confirm() nativo pode ser bloqueado silenciosamente (mesma causa raiz já
        // corrigida na versão 73 pros botões "Limpar"/"excluir"; este botão novo
        // tinha ficado de fora daquela correção). Bug relatado pelo Marco em 27/09/2026.
        askConfirm("Remover esta mutação da ficha? Essa ação não pode ser desfeita.", function(){
          c.mutAdquiridas = (c.mutAdquiridas||[]).filter(function(m){ return m.id!==mutId; });
          marcarPendenteOuSalvar(c, "assim");
          renderSheet();
        });
      });
    });
  }

  function exportCode(c){
    return encodeAsBackupCode(c);
  }
  function importCode(code){
    return decodeBackupCode(code);
  }

  function bindSheet(c, maxNivel){
    // Nome do jogador e Notas: só atualizam o objeto local a cada tecla (sem
    // publicar nada ainda) e só chamam updateChar/schedulePublish no "change"
    // (quando o campo perde o foco) - ver o comentário grande acima de
    // dirtyCharIds/schedulePublish: TODA publicação recarrega a página de
    // TODAS as abas abertas, inclusive a de quem está digitando. Publicar a
    // cada tecla (no "input") fazia o campo perder o foco e "travar" sempre
    // que a pessoa parava de digitar por mais de ~1 segundo (o tempo do
    // debounce). Assim, a mesa só vê a mudança quando a pessoa termina de
    // escrever e sai do campo, mas dá pra digitar um texto inteiro sem
    // interrupção.
    var jogadorInput = app.querySelector("[data-jogador]");
    jogadorInput.addEventListener("input", function(e){ c.nomeJogador = e.target.value; });
    jogadorInput.addEventListener("change", function(){ updateChar(c); });
    var notasInput = app.querySelector("[data-notas]");
    notasInput.addEventListener("input", function(e){ c.notas = e.target.value; });
    notasInput.addEventListener("change", function(){ updateChar(c); });
    var claimBtn = app.querySelector('[data-action="claim"]');
    if(claimBtn) claimBtn.addEventListener("click", function(){ marcarComoMeu(c.id); renderSheet(); });
    // Pode haver mais de um botão "Confirmar alterações" na tela ao mesmo tempo (uma
    // seção pendente por card - ver pendingSectionBannerHtml), mas todos confirmam o
    // personagem inteiro de uma vez só (não tem granularidade por campo).
