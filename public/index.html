  // Card de Determinação/Assimilação: única forma de calcular e mostrar isso
  // na ficha (Cabo de Guerra, ver "O CABO DE GUERRA" na fonte - Assimilação
  // RPG Fastplay, pág. 18). Determinação e Assimilação têm cada uma um
  // NÍVEL, e os dois níveis sempre somam 10 (Determinação 6 = Assimilação 4,
  // por exemplo). O NÍVEL também é o teto de PONTOS que dá pra gastar como
  // recurso: assim que o nível sobe ou desce, os pontos daquele nível voltam
  // a ficar completos. Cada caixa inteira de 10 pontos que a versão de
  // Pangea sempre teve (caixaAtual caindo de 3 pra 2, de 2 pra 1, etc.)
  // representa a perda de 1 NÍVEL de Determinação inteiro nessa escala de 0
  // a 10 - não um terço de 3, é sempre -1 nível a partir de uma base 10.
  // Zerar essas 3 caixinhas já deixa o Sobrevivente Suscetível pra valer
  // (ver determinacaoZerada/marcarFlashSuscetivel/detZeroEffectHtml) - dali
  // em diante, caixaAtual continua descendo (ver DET_CAIXA_FLOOR) até o
  // Nível 0 de Determinação/Nível 10 de Assimilação, o piso absoluto da
  // escala. Os pontos "ao vivo" de Determinação usam o mesmo pontosAtual
  // (0-10) que a ficha já guarda, só limitado ao teto do nível atual (em vez
  // de sempre 10); os pontos de Assimilação têm seu próprio controle
  // (assimPontosAtual, ver funções auxiliares logo abaixo), sempre limitado
  // ao teto do nível atual de Assimilação. A bolinha do cabo pode ser
  // arrastada (ver bindSheet) pra ajustar o NÍVEL na mão, em qualquer ponto
  // da escala de 0 a 10, e os pontos de cada lado têm botões -/+ próprios.
  function tugDeGuerraCardHtml(c){
    var caixaAtual = clamp(c.determinacao.caixaAtual!=null ? c.determinacao.caixaAtual : 3, DET_CAIXA_FLOOR, 3);
    var nivelAssim = 3 - caixaAtual; // caixas/níveis inteiros já esgotados = níveis de Assimilação ganhos
    var nivelDet = 10 - nivelAssim; // os dois níveis sempre somam 10
    var ptsDetBruto = clamp(c.determinacao.pontosAtual!=null ? c.determinacao.pontosAtual : 10, 0, 10);
    var ptsDet = clamp(ptsDetBruto, 0, nivelDet); // teto de pontos = nível atual, não sempre 10
    var ptsAssim = assimPontosAtuais(c);
    // "zerada" cobre os dois casos que acionam o efeito Suscetível: o piso
    // absoluto da escala (persistente, ver determinacaoZerada) ou um flash
    // temporário de alguns segundos (ver marcarFlashSuscetivel/state.detFlash)
    // porque os pontos do Nível atual acabaram de zerar e cascatear.
    var zerada = determinacaoZerada(c) || !!state.detFlash[c.id];
    var detEffect = detZeroEffectHtml(c, zerada);
    return '<div class="card tug-card'+detEffect.cls+'" data-secid="determinacao">' +
      detEffect.stamp +
      '<h2>Determinação / Assimilação</h2>' +
      pendingSectionBannerHtml(c, "cabo") +
      '<p class="hint" style="margin-top:2px">Determinação e Assimilação têm cada uma um Nível, e os dois sempre somam 10. Clique num laço da trilha pra ajustar o Nível atual.</p>' +
      (c.determinacao.suscetivel ? '<p class="hint" style="margin-top:2px;color:var(--suscet)"><b>Estado Suscetível:</b> não pode gastar Pontos de Determinação até completar a Assimilação'+((c.testesAssimPendentes>0||c.assimTesteAtual)?' (faça o Teste de Assimilação)':' ou recuperar Determinação')+'. Qualquer nova perda com os pontos zerados derruba um Nível.</p>' : '') +
      '<div class="tug-wrap">' +
        '<div class="tug-row">' +
          '<span class="tug-tag" style="color:var(--royal)">Determinação</span>' +
          tugLacosHtml(nivelDet, true) +
          '<span class="tug-tag" style="color:var(--assim)">Assimilação</span>' +
        '</div>' +
        '<div class="tug-nums"><span>'+icoHtml("nd")+' Nível '+nivelDet+'</span><span>Nível '+nivelAssim+' '+icoHtml("na")+'</span></div>' +
      '</div>' +
      '<div class="row" style="margin-top:12px;gap:16px;flex-wrap:wrap;align-items:center">' +
        '<div class="row" style="gap:6px;align-items:center;flex-wrap:nowrap">' +
          '<button type="button" class="btn secondary" data-tugpts="det-menos" style="padding:1px 7px;font-size:11px" '+(ptsDet<=0 && c.determinacao.caixaAtual<=DET_CAIXA_FLOOR?"disabled":"")+(ptsDet<=0?' title="Perda com os pontos zerados: desce um Nível de Determinação"':'')+'>&minus;</button>' +
          '<span class="gm-compact-line" style="margin:0">'+icoHtml("pd")+' <b style="color:var(--royal)">'+ptsDet+'</b> de '+nivelDet+' pontos de Determinação</span>' +
          '<button type="button" class="btn secondary" data-tugpts="det-mais" style="padding:1px 7px;font-size:11px" '+(ptsDet>=nivelDet?"disabled":"")+'>+</button>' +
        '</div>' +
        '<div class="row" style="gap:6px;align-items:center;flex-wrap:nowrap">' +
          '<button type="button" class="btn secondary" data-tugpts="assim-menos" style="padding:1px 7px;font-size:11px" '+(ptsAssim<=0?"disabled":"")+'>&minus;</button>' +
          '<span class="gm-compact-line" style="margin:0">'+icoHtml("pa")+' <b style="color:var(--assim)">'+ptsAssim+'</b> de '+nivelAssim+' '+(nivelAssim===1?'ponto':'pontos')+' de Assimilação</span>' +
          '<button type="button" class="btn secondary" data-tugpts="assim-mais" style="padding:1px 7px;font-size:11px" '+(ptsAssim>=nivelAssim?"disabled":"")+'>+</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // Losangos ♦ pros medidores de Saúde e Determinação: sizeClass ("dsize-lg"/"dsize-sm")
  // controla o tamanho do ícone, colorClass ("c-saude"/"c-det") a cor quando preenchido.
  // Ícone oficial (ver CSS .ico): k = "nd"/"na"/"ns" (Nível, círculo) ou
  // "pd"/"pa"/"ps" (Pontos, triângulo) de Determinação/Assimilação/Saúde.
  var ICO_TITULOS = { nd:"Nível de Determinação", pd:"Pontos de Determinação", na:"Nível de Assimilação",
    pa:"Pontos de Assimilação", ns:"Nível de Saúde", ps:"Pontos de Saúde" };
  function icoHtml(k, extraClass){
    return '<span class="ico ico-'+k+(k.charAt(0)==="p"?" tri":"")+(extraClass?" "+extraClass:"")+'" title="'+ICO_TITULOS[k]+'" role="img" aria-label="'+ICO_TITULOS[k]+'"></span>';
  }
  // Medidores de Saúde (e Determinação): antes eram losangos ♦, agora usam os
  // ícones oficiais - icoKey escolhe qual (padrão: Pontos da cor do medidor).
  function diamonds(atual, max, sizeClass, colorClass, icoKey){
    var k = icoKey || (colorClass === "c-det" ? "pd" : "ps");
    var html = "";
    for(var i=1;i<=max;i++){
      html += '<span class="diamond ico ico-'+k+(k.charAt(0)==="p"?" tri":"")+' '+sizeClass+' '+colorClass+(i<=atual?" filled":"")+'" data-dotval="'+i+'" title="'+ICO_TITULOS[k]+' '+i+'"></span>';
    }
    return html;
  }

  // Gasta n pontos de Determinação (botão "-1 ponto" do Cabo de Guerra - ver
  // bindSheet/tugpts "det-menos" - e "Agir por Instinto"/"dado extra" quando
  // não sobra Assimilação, ver bindSheetTest): perde uma caixa (e passa a
  // esvaziar a próxima, já cheia) quando a caixa atual chega a 0 - isso é a
  // própria mecânica de "O CABO DE GUERRA" na fonte, o Nível de Determinação
  // descendo/Assimilação subindo em tempo real conforme os pontos daquele
  // Nível se esgotam. Não trava em caixaAtual=0: continua descendo (ver
  // DET_CAIXA_FLOOR) até o Nível 0 de verdade. Retorna true quando um Nível
  // desceu de verdade nesta chamada (mesmo que os pontos já tenham
  // cascateado de volta pro cheio do próximo Nível) - quem chama usa isso
  // pra acionar o flash do efeito Suscetível (ver marcarFlashSuscetivel).
  // Livro pág. 59/81: gastar ou perder o último Ponto de Determinação deixa o Infectado
  // Suscetível (não pode gastar Determinação). Qualquer perda com os pontos zerados
  // derruba um Nível de Determinação (sobe um de Assimilação): o novo Nível começa
  // cheio, mas continua Suscetível até completar a Assimilação (Teste de Assimilação).
  // Retorna true quando um Nível desceu de verdade.
  function gastarDeterminacao(c, n){
    n = n||1;
    var desceuNivel = false;
    for(var i=0;i<n;i++){
      var d = c.determinacao;
      if((d.pontosAtual||0) > 0){
        d.pontosAtual -= 1;
        if(d.pontosAtual === 0) d.suscetivel = true;
      } else if(d.caixaAtual > DET_CAIXA_FLOOR){
        d.caixaAtual -= 1;
        desceuNivel = true;
        d.assimPontosAtual = null; // o novo Nível de Assimilação começa cheio
        d.pontosAtual = d.caixaAtual > DET_CAIXA_FLOOR ? nivelDetAtual(c) : 0;
        d.suscetivel = true;
        if(c.testesAssimPendentes == null) c.testesAssimPendentes = 0;
        c.testesAssimPendentes += 1;
      }
    }
    return desceuNivel;
  }
  // Sai do Estado Suscetível quando há Pontos de Determinação e nenhuma Assimilação
  // pendente (nem Teste por rolar, nem Teste em andamento).
  function atualizarSuscetivel(c){
    var d = c.determinacao;
    if(!d || !d.suscetivel) return;
    if((d.pontosAtual||0) > 0 && !(c.testesAssimPendentes>0) && !c.assimTesteAtual) d.suscetivel = false;
  }
  // Liga o flash local (não sincronizado) do efeito Suscetível por alguns
  // segundos - ver detZeroEffectHtml/state.detFlash. Chamado sempre que
  // gastarDeterminacao informa que um Nível desceu nesta ação; um novo
  // disparo reinicia a contagem se o anterior ainda não tiver terminado.
  function marcarFlashSuscetivel(c){
    state.detFlash[c.id] = true;
    if(state.detFlashTimers[c.id]) clearTimeout(state.detFlashTimers[c.id]);
    state.detFlashTimers[c.id] = setTimeout(function(){
      state.detFlash[c.id] = false;
      if(state.view === "sheet" && state.charId === c.id) renderSheet();
    }, 3000);
  }
  // Determinação disponível pra "Manter +1 dado extra" (ver extraDadoDisponivel):
  // simplesmente pontosAtual>0 - gastarDeterminacao já garante que isso só
  // fica em 0 de verdade no piso absoluto da escala (fora disso, a cascata
  // sempre reenche pra um valor positivo no mesmo instante).
  function determinacaoDisponivel(c){
    return (c.determinacao.pontosAtual||0) > 0 && !c.determinacao.suscetivel;
  }

  // ----- Pontos de Assimilação -----
  // Nível de Determinação/Assimilação na escala real de 0 a 10 da fonte (ver
  // tugDeGuerraCardHtml): cada caixa que Pangea já esgotou tira 1 nível de
  // Determinação e dá 1 nível de Assimilação, sempre somando 10 no total.
  function nivelDetAtual(c){
    return 10 - nivelAssimAtual(c);
  }
  function nivelAssimAtual(c){
    return 3 - clamp(c.determinacao.caixaAtual!=null ? c.determinacao.caixaAtual : 3, DET_CAIXA_FLOOR, 3);
  }
  // Determinação zerada é o piso absoluto da escala (Nível 0, ver
  // DET_CAIXA_FLOOR): como gastarDeterminacao cascateia e reenche pontosAtual
  // assim que uma caixa se esgota, esse é o único jeito de pontosAtual ficar
  // persistentemente em 0. É um dos dois gatilhos do efeito Suscetível (ver
  // detZeroEffectHtml/tugDeGuerraCardHtml) - o outro é o flash temporário de
  // marcarFlashSuscetivel, pra cobrir o instante (não-persistente) em que um
  // Nível intermediário zera e cascateia.
  function determinacaoZerada(c){
    return !!c.determinacao.suscetivel || (c.determinacao.pontosAtual!=null ? c.determinacao.pontosAtual : 10) <= 0;
  }
  // Monta a classe CSS e o carimbo "SUSCETÍVEL" do estado zerado (ver CSS
  // .det-zerada/.det-stamp), a partir do booleano "zerada" que cada card já
  // calculou (ver renderSheet/tugDeGuerraCardHtml). A "chacoalhada" de entrada
  // (.det-shake) só toca na primeira vez que a Determinação daquele
  // personagem aparece zerada nesta aba (state.detShakeSeen); o estado em si
  // (borda + carimbo) fica sempre visível enquanto durar, e some sozinho
  // assim que os pontos forem recalculados de novo pra cima (a checagem
  // abaixo já limpa a flag nesse caso).
  function detZeroEffectHtml(c, zerada){
    if(!zerada){
      state.detShakeSeen[c.id] = false;
      return { cls:"", stamp:"" };
    }
    var primeiraVez = !state.detShakeSeen[c.id];
    state.detShakeSeen[c.id] = true;
    return {
      cls: " det-zerada" + (primeiraVez ? " det-shake" : ""),
      stamp: '<div class="det-stamp">Suscetível</div>'
    };
  }
  // Pontos de Assimilação disponíveis agora: assimPontosAtual guarda o valor
  // só a partir da primeira vez que alguém gasta ou devolve um ponto por essa
  // via; enquanto isso (ou logo depois de um nível mudar - ver gastarDeterminacao
  // e o arrastar da bolinha do Cabo de Guerra), fica sempre cheio no teto do
  // nível atual, do mesmo jeito que a Determinação fica ao subir/descer de nível.
  function assimPontosAtuais(c){
    var nivel = nivelAssimAtual(c);
    var v = c.determinacao.assimPontosAtual;
    if(v==null) return nivel;
    return clamp(v, 0, nivel);
  }
  function gastarAssimilacao(c, n){
    n = n||1;
    c.determinacao.assimPontosAtual = Math.max(0, assimPontosAtuais(c)-n);
  }
  function devolverAssimilacao(c, n){
    n = n||1;
    c.determinacao.assimPontosAtual = Math.min(nivelAssimAtual(c), assimPontosAtuais(c)+n);
  }
  function assimilacaoDisponivel(c){
    return assimPontosAtuais(c) > 0;
  }
  // "Manter +1 dado extra" é o Empenho do livro definitivo (pág. 59): "Antes
  // de qualquer rolagem o(a) Infectado(a) pode gastar 1 Ponto de Determinação
  // para manter um dado adicional." Só gasta Determinação - não tem
  // substituto de Assimilação, ao contrário de Agir por Instinto (ver
  // agirPorInstintoDisponivel logo abaixo).
  // Correção de 27/09/2026: antes disso, esta caixa tentava gastar Assimilação
  // primeiro, o que na verdade é a regra de OUTRA mecânica (Agir por
  // Instinto/Rolagem Assimilada); as duas custavam do jeito errado.
  function extraDadoDisponivel(c){
    return determinacaoDisponivel(c);
  }
  // Agir por Instinto = Rolagem Assimilada (livro definitivo, pág. 41/60): custa
  // 1 Ponto de Assimilação; sem nenhum sobrando, é permitido pagar com 2 Pontos
  // de Determinação em substituição. Diferente de "Manter +1 dado extra" (Empenho),
  // que só usa Determinação - ver extraDadoDisponivel acima.
  function agirPorInstintoDisponivel(c){
    if(assimilacaoDisponivel(c)) return true;
    return determinacaoDisponivel(c);
  }
  // Devolve pontos de Determinação só até o teto do NÍVEL atual.
  function devolverDeterminacaoNivel(c, n){
    n = n||1;
    c.determinacao.pontosAtual = Math.min(nivelDetAtual(c), (c.determinacao.pontosAtual||0)+n);
    atualizarSuscetivel(c);
  }

  // ----- ASSIMILAÇÃO: TESTE, CARTAS DE MUTAÇÃO E PRESSÃO (livro definitivo, Cap. 4) -----
  // Regra das Pressões (livro págs. 62, 124 e 144; corrigida na etapa C, 08/10/2026,
  // revertendo a decisão de 04/10): para a perda da ficha contam só as Pressões das
  // Assimilações INOPORTUNAS (espadas, cat. H) já adquiridas, menos as anuladas por
  // Clareza de Propósito, SOMADAS às Pressões tiradas no Teste de Assimilação daquele
  // momento (o teste mantém todos os dados). Atingir 10 é a perda definitiva.
  // Pressão em Adaptativas/Singulares não conta mais.
  function pressaoInoportunas(c){
    var t = 0;
    (c.mutAdquiridas||[]).forEach(function(m){
      if(m.cat !== "H") return;
      var simb = custoSimbolos(m.custo);
      t += Math.max(0, simb.p - (m.neutralizadas||0));
    });
    return t;
  }
  function pressaoTotal(c){ return pressaoInoportunas(c); }
  function marcarPerdido(c, motivo){
    c.assimPerdido = true;
    c.assimPerdidoMotivo = motivo;
  }
  function perdidoParaAssimilacao(c){
    if(c.assimPerdido) return true;
    var acum = pressaoInoportunas(c);
    if(acum >= 10){ marcarPerdido(c, { tipo:"acumulada", acumulada:acum, em:new Date().toISOString() }); return true; }
    return false;
  }
  function perdaMotivoTexto(c){
    var m = c.assimPerdidoMotivo || {};
    if(m.tipo === "teste") return 'No Teste de Assimilação, as '+(m.noTeste||0)+' Pressões tiradas somadas às '+(m.acumulada||0)+' das Assimilações Inoportunas chegaram a 10.';
    return 'As Pressões das Assimilações Inoportunas chegaram a 10.';
  }
  // Fichas marcadas como perdidas pela conta antiga (somava todas as cartas) e sem o
  // motivo novo: refaz a conta. A conta antiga nunca olhava o teste, então se as
  // Inoportunas sozinhas não chegam a 10, a perda não valia pela regra do livro.
  function recalcularPerdaAntiga(c){
    if(!c || !c.assimPerdido || c.assimPerdidoMotivo) return;
    var acum = pressaoInoportunas(c);
    if(acum >= 10) c.assimPerdidoMotivo = { tipo:"acumulada", acumulada:acum, recalculadaEm:new Date().toISOString() };
    else { c.assimPerdido = false; c.assimPerdidaRevertida = new Date().toISOString(); }
  }
  // Sorteia n cartas distintas (índices 0-12) de uma categoria - simula puxar do baralho
  // físico daquele naipe sem repetir na mesma rolagem (repete só entre rolagens diferentes,
  // já que mutações da mesma carta são independentes entre si - pág. 125).
  function sortearCartas(cat, n){
    var total = MUT_DECKS[cat].length;
    var idxs = []; for(var i=0;i<total;i++) idxs.push(i);
    for(var j=idxs.length-1;j>0;j--){ var k = Math.floor(Math.random()*(j+1)); var tmp=idxs[j]; idxs[j]=idxs[k]; idxs[k]=tmp; }
    if(n <= total) return idxs.slice(0,n);
    // Mais pontos do que cartas no baralho (raro, pool grande): completa repetindo ao acaso.
    var extra = []; for(var e=0;e<n-total;e++) extra.push(Math.floor(Math.random()*total));
    return idxs.concat(extra);
  }
  // Rola o Teste de Assimilação (pág. 124 do livro definitivo): 1d10 + 1d12 por Nível de
  // Assimilação (E) já atingido (incluindo o novo Nível, se foi isso que disparou o teste),
  // soma os símbolos ABC obtidos e puxa cartas: 1 de Evolutivas (F) por A, 1 de Adaptativas
  // (G) por B, 1 de Inoportunas (H) por C. O resultado vira um "pool" de pontos pra gastar
  // em qualquer carta puxada (ver adquirirTier) - todos os pontos devem ser gastos, mas a
  // ferramenta não obriga: sobras ficam visíveis pro Assimilador arbitrar (pág. 124).
  function iniciarTesteAssimilacao(c){
    var e = Math.max(0, nivelAssimAtual(c));
    var dados = [rollDie(10)];
    for(var i=0;i<e;i++) dados.push(rollDie(12));
    var totS = sum(dados.map(function(d){return d.s;}));
    var totA = sum(dados.map(function(d){return d.a;}));
    var totP = sum(dados.map(function(d){return d.p;}));
    var cartas = { F: sortearCartas("F", totS), G: sortearCartas("G", totA), H: sortearCartas("H", totP) };
    c.assimTesteAtual = { e:e, dados:dados, sPool:totS, aPool:totA, pPool:totP, cartas:cartas, ts:new Date().toISOString() };
    c.testesAssimPendentes = Math.max(0, (c.testesAssimPendentes||0) - 1);
    // Pág. 124: Inoportunas anteriores + Pressões mantidas nesta rolagem (todas) >= 10 = perda.
    var acum = pressaoInoportunas(c);
    c.assimTesteAtual.pressaoAntes = acum;
    if(!c.assimPerdido && acum + totP >= 10){
      marcarPerdido(c, { tipo:"teste", acumulada:acum, noTeste:totP, em:c.assimTesteAtual.ts });
    } else perdidoParaAssimilacao(c);
  }
  // ---------- TESTE DE ASSIMILAÇÃO: ANIMAÇÃO E HISTÓRICO ----------
  // Pedido do Marco (01/10/2026): o Teste de Assimilação entra no Histórico de
  // Rolagens com destaque e aparece no centro da tela de TODO MUNDO da mesa, com
  // os dados rolando antes de revelar o resultado (é uma rolagem rara e marcante).
  var assimVistos = {}, assimLogPronto = false;
  function assimEntradaDoTeste(c){
    var t = c.assimTesteAtual;
    return { tipo:"assim", charId:c.id, nomePersonagem:c.nomePersonagem, nomeJogador:c.nomeJogador, acampamento:c.acampamento,
      label:"Teste de Assimilação (1d10"+(t.e>0?" + "+t.e+"d12":"")+")",
      resultado:t.sPool+" Suc · "+t.aPool+" Adap · "+t.pPool+" Press",
      totS:t.sPool, totA:t.aPool, totP:t.pPool,
      cartas:{ F:t.cartas.F.length, G:t.cartas.G.length, H:t.cartas.H.length },
      dados:t.dados.map(function(d){ return {sides:d.sides, face:d.face, s:d.s, a:d.a, p:d.p, kept:true}; }) };
  }
  function assimCartasTexto(cartas){
    if(!cartas) return "";
    var partes = [];
    if(cartas.F) partes.push(cartas.F+" Evolutiva"+(cartas.F>1?"s":""));
    if(cartas.G) partes.push(cartas.G+" Adaptativa"+(cartas.G>1?"s":""));
    if(cartas.H) partes.push(cartas.H+" Inoportuna"+(cartas.H>1?"s":""));
    return partes.length ? "Cartas puxadas: "+partes.join(", ") : "Nenhuma carta puxada.";
  }
  function mostrarAnimAssim(e, aoRevelar){
    var reduz = false;
    try{ reduz = window.matchMedia("(prefers-reduced-motion: reduce)").matches || animacoesReduzidas(); }catch(_){}
    var velho = document.getElementById("assim-overlay"); if(velho) velho.remove();
    var dados = e.dados || [];
    var ov = document.createElement("div"); ov.id = "assim-overlay"; ov.className = "assim-ov";
    var destaque = e.tipo === "destaque";
    var kicker = destaque ? "Rolagem do Assimilador" : "Teste de Assimilação";
    ov.innerHTML = '<div class="assim-box'+(destaque?' destaque':'')+'" role="dialog" aria-live="polite" aria-label="'+kicker+'">' +
      '<div class="assim-kicker">'+kicker+'</div>' +
      '<div class="assim-nome">'+esc(e.nomePersonagem||"?")+'</div>' +
      '<p class="assim-sub">'+esc(destaque ? (e.subtitulo||"") : (e.label||"").replace("Teste de Assimilação ",""))+(e.nomeJogador?' · '+esc(e.nomeJogador):'')+'</p>' +
      '<div class="assim-dados">' + dados.map(function(d){
        return '<div class="assim-die d'+d.sides+(d.kept===false?' solto':'')+'" data-lados="'+d.sides+'"><span class="assim-face">?</span><span class="assim-tipo">d'+d.sides+'</span></div>';
      }).join('') + '</div>' +
      '<div class="assim-res" hidden>' + (e.exibicao === "numeros"
          ? '<div class="assim-soma">'+((e.dados||[]).filter(function(d){ return d.kept!==false; }).length > 1 ? 'Soma <b>'+(e.somaFaces||0)+'</b>' : '')+'</div>'
          : resultBadges(e.totS||0, e.totA||0, e.totP||0)) +
        (e.cartas ? '<p class="assim-cartas">'+esc(assimCartasTexto(e.cartas))+'</p>' : '') + '</div>' +
      '<button type="button" class="btn secondary assim-fechar">Fechar</button>' +
    '</div>';
    document.body.appendChild(ov);
    var dieEls = ov.querySelectorAll(".assim-die");
    var tick = setInterval(function(){
      Array.prototype.forEach.call(dieEls, function(el){
        if(!el.classList.contains("parou")) el.querySelector(".assim-face").textContent = String(1 + Math.floor(Math.random()*(parseInt(el.getAttribute("data-lados"),10)||10)));
      });
    }, 80);
    var auto = null, revelado = false;
    function revelar(){
      if(revelado) return; revelado = true;
      clearInterval(tick);
      var res = ov.querySelector(".assim-res"); res.hidden = false; res.classList.add("aparece");
      if(e.totP && e.exibicao !== "numeros") ov.querySelector(".assim-box").classList.add("pressao");
      if(e.tipo !== "destaque" && e.exibicao !== "numeros") fundoPressaoSe(e.totP); // easter egg do fundo
      if(aoRevelar) tentar("Teste de Assimilação", aoRevelar);
      auto = setTimeout(fechar, 10000);
    }
    function fechar(){
      revelar();
      clearTimeout(auto);
      ov.classList.add("saindo");
      setTimeout(function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); }, 260);
    }
    ov.querySelector(".assim-fechar").addEventListener("click", fechar);
    ov.addEventListener("click", function(ev){ if(ev.target === ov) fechar(); });
    var base = reduz ? 200 : 1300, passo = reduz ? 0 : (dados.length > 6 ? 260 : 500);
    dados.forEach(function(d, i){
      setTimeout(function(){
        var el = dieEls[i]; if(!el || revelado) return;
        el.classList.add("parou");
        if(e.exibicao === "numeros"){
          el.classList.add("so-numero");
          el.querySelector(".assim-face").textContent = String(d.face);
          el.querySelector(".assim-tipo").textContent = "d"+d.sides;
          return;
        }
        if(d.p) el.classList.add("tem-p");
        var r = diceResultHtml(d);
        el.querySelector(".assim-face").innerHTML = (r === "em branco" ? '<span style="opacity:.5">—</span>' : r);
        el.querySelector(".assim-tipo").textContent = "d"+d.sides+" · "+d.face;
      }, base + i*passo);
    });
    setTimeout(revelar, base + Math.max(0, dados.length-1)*passo + 450);
  }
  // Chamado a cada atualização do histórico vinda do banco: mostra a animação
  // pros testes novos de outras pessoas. Na primeira carga, só marca o que já
  // existia (nada de animar testes antigos ao abrir a página).
  function verificarAssimNovos(lista){
    var vis = testLogVisivelPara(lista);
    if(!assimLogPronto){
      vis.forEach(function(e){ if(e.tipo === "assim" || e.tipo === "destaque") assimVistos[e.id] = true; });
      assimLogPronto = true; return;
    }
    vis.forEach(function(e){
      if((e.tipo !== "assim" && e.tipo !== "destaque") || assimVistos[e.id]) return;
      assimVistos[e.id] = true;
      var idade = Date.now() - (Date.parse(e.ts||"") || 0);
      if(idade < 120000) mostrarAnimAssim(e);
    });
  }
  function encerrarTesteAssimilacao(c){ c.assimTesteAtual = null; atualizarSuscetivel(c); }
  function tierJaAdquirido(c, cat, cardIdx, tierIdx){
    return (c.mutAdquiridas||[]).some(function(m){ return m.cat===cat && m.cardIdx===cardIdx && m.tierIdx===tierIdx; });
  }
  function podeAdquirirTier(c, cat, cardIdx, tierIdx){
    if(!c.assimTesteAtual) return false;
    var tier = MUT_DECKS[cat][cardIdx][2][tierIdx];
    if(tierJaAdquirido(c, cat, cardIdx, tierIdx)) return false;
    if(tier[3] && nivelAssimAtual(c) < tier[3]) return false;
    var custo = custoSimbolos(tier[0]);
    var pool = c.assimTesteAtual;
    return pool.sPool >= custo.s && pool.aPool >= custo.a && pool.pPool >= custo.p;
  }
  function adquirirTier(c, cat, cardIdx, tierIdx){
    if(!podeAdquirirTier(c, cat, cardIdx, tierIdx)) return false;
    var tier = MUT_DECKS[cat][cardIdx][2][tierIdx];
    var custo = custoSimbolos(tier[0]);
    var pool = c.assimTesteAtual;
    pool.sPool -= custo.s; pool.aPool -= custo.a; pool.pPool -= custo.p;
    c.mutAdquiridas.push({ id:uid(), cat:cat, cardIdx:cardIdx, tierIdx:tierIdx, custo:tier[0], neutralizadas:0, ts:new Date().toISOString() });
    perdidoParaAssimilacao(c);
    return true;
  }
  // Clareza de Propósito (pág. 62 do livro definitivo): ao concluir um arco satisfatoriamente,
  // cumprir um Propósito ou algo maravilhoso/inesperado acontecer, o(a) Infectado(a) escolhe
  // entre subir 1 Nível de Determinação (voltando 1 Nível de Assimilação) OU anular 1 C de
  // uma Assimilação Inoportuna já adquirida (uma C por vez; zerar todas as C daquela mutação cessa seus efeitos negativos,
  // mesmo que a mutação física em si permaneça).
  function clarezaRecuperarNivel(c){
    var novoCaixa = clamp((c.determinacao.caixaAtual!=null?c.determinacao.caixaAtual:3) + 1, DET_CAIXA_FLOOR, 3);
    c.determinacao.caixaAtual = novoCaixa;
    c.determinacao.pontosAtual = nivelDetAtual(c);
    c.determinacao.assimPontosAtual = null;
    atualizarSuscetivel(c);
  }
  function clarezaNeutralizarPressao(c, mutId){
    var m = (c.mutAdquiridas||[]).filter(function(x){return x.id===mutId;})[0];
    if(!m || m.cat !== "H") return false; // só Inoportunas (pág. 62, item 2)
    var total = custoSimbolos(m.custo).p;
    if((m.neutralizadas||0) >= total) return false;
    m.neutralizadas = (m.neutralizadas||0) + 1;
    return true;
  }

  // Emblemas compactos de símbolos ABC (Sucesso/Adaptação/Pressão) a partir de uma string
  // de custo tipo "BBA" - reaproveita as mesmas cores/ícones de resultBadges, só menores.
  function custoChipHtml(custo){
    var s = custoSimbolos(custo);
    var parts = [];
    if(s.s) parts.push('<span class="rbadge rb-s" style="padding:1px 7px;font-size:11px">'+dadoHtml("s")+s.s+'</span>');
    if(s.a) parts.push('<span class="rbadge rb-a" style="padding:1px 7px;font-size:11px">'+dadoHtml("a")+s.a+'</span>');
    if(s.p) parts.push('<span class="rbadge rb-p" style="padding:1px 7px;font-size:11px">'+dadoHtml("p")+s.p+'</span>');
    return '<span class="result-badges">'+parts.join('')+'</span>';
  }
  // Uma carta (com todos os tiers) dentro do Teste de Assimilação em andamento - mostra
  // cada tier com seu custo e nome, e um botão "Adquirir" habilitado só se o pool atual
  // cobrir o custo exato, o tier ainda não tiver sido comprado e o Nível de Assimilação
  // (E) mínimo (se houver) já tiver sido atingido (tiers são independentes entre si).
  function mutCardHtml(c, cat, cardIdx, opts){
    opts = opts || {};
    var card = MUT_DECKS[cat][cardIdx];
    var collapseId = "mutcard-"+cat+"-"+cardIdx;
    var collapsed = !!state.collapsed[collapseId];
    var html = '<div class="card tight" style="margin-bottom:8px">' +
      '<div class="row" style="justify-content:space-between;cursor:pointer" data-mutcardtoggle="'+collapseId+'">' +
        '<b>'+esc(card[0])+'</b><span class="hint" style="margin:0">'+esc(card[1])+' · '+(collapsed?"▸":"▾")+'</span>' +
      '</div>';
    if(!collapsed){
      html += '<div class="trait-list" style="margin-top:8px">';
      card[2].forEach(function(tier, tierIdx){
        var owned = tierJaAdquirido(c, cat, cardIdx, tierIdx);
        var pode = opts.comPool ? podeAdquirirTier(c, cat, cardIdx, tierIdx) : false;
        html += '<div class="trait mut-tier'+(owned?" checked":"")+'">' +
          '<span class="mut-custo">'+custoChipHtml(tier[0])+'</span>' +
          '<span class="txt"><b>'+esc(tier[1])+(tier[3]?' <span class="hint">(E'+tier[3]+'+)</span>':'')+'</b><span>'+formatEfeito(tier[2], true)+'</span></span>' +
          (owned ? '<span class="badge-pill good mut-acao">adquirida</span>' :
            (opts.comPool ? '<button type="button" class="btn secondary mut-acao" data-mutbuy="'+cat+'|'+cardIdx+'|'+tierIdx+'" '+(pode?'':'disabled')+'>Adquirir</button>' : '')) +
        '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }
  // Card "Assimilação" da ficha: Pressão acumulada, Testes de Assimilação pendentes/em
  // andamento (com as cartas sorteadas e o pool de símbolos ainda por gastar), Clareza de
  // Propósito, mutações Singulares oferecidas pelo Assimilador, e a lista de mutações já
  // adquiridas por categoria - livro definitivo, Cap. 4 (págs. 122-165).
  function renderMutacoesCard(c){
    var pendentes = c.testesAssimPendentes||0;
    var pressao = pressaoTotal(c);
    var perdido = perdidoParaAssimilacao(c);
    var pool = c.assimTesteAtual;
    var clarezaAberta = !!state.clarezaAberta && state.clarezaAberta[c.id];

    var body = pendingSectionBannerHtml(c, "assim");

    if(perdido){
      body += '<div class="card tight" style="border-color:var(--blood);background:rgba(143,29,29,.08)">' +
        '<h2 style="color:var(--blood);margin-bottom:4px">Perdido(a) para a Assimilação</h2>' +
        '<p class="hint" style="margin:0">'+perdaMotivoTexto(c)+' O(a) jogador(a) perde o controle da personagem pra sempre: ela passa a ser controlada pelo(a) Assimilador(a).</p>' +
      '</div>';
    }

    var pressaoClass = pressao>=10 ? "warn" : "";
    body += '<div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px">' +
      '<span class="gm-compact-line" style="margin:0">Pressão acumulada (Assimilações Inoportunas): <b'+(pressao>=7?' style="color:var(--danger)"':'')+'>'+pressao+'</b> / 10'+(pressao>=7&&pressao<10?' <span class="badge-pill warn">atenção</span>':'')+'</span>' +
    '</div>';

    if(pendentes>0 && !perdido){
      body += '<div class="card tight" style="border-color:var(--suscet);margin-top:10px"><p class="hint" style="margin:0">O Nível de Determinação caiu <b>'+pendentes+'</b> '+(pendentes===1?'vez':'vezes')+' sem o Teste de Assimilação correspondente ter sido rolado ainda.</p></div>';
    }

    if(!perdido){
      body += '<div class="row" style="margin-top:12px;gap:10px;flex-wrap:wrap">';
      if(!pool && !modoBase){
        body += '<button type="button" class="btn accent" data-action="assim-testar">Fazer Teste de Assimilação (1d10'+(nivelAssimAtual(c)>0?' + '+nivelAssimAtual(c)+'d12':'')+')</button>';
      }
      body += '<button type="button" class="btn secondary" data-action="assim-clareza-toggle">'+(clarezaAberta?"Fechar Clareza de Propósito":"Clareza de Propósito")+'</button>';
      body += '</div>';
    }

      var inoportunasComC = (c.mutAdquiridas||[]).filter(function(m){ return m.cat === "H" && MUT_DECKS[m.cat] && (m.neutralizadas||0) < custoSimbolos(m.custo).p; });
      var caixaClareza = c.determinacao && c.determinacao.caixaAtual!=null ? c.determinacao.caixaAtual : 3;
      body += '<div class="card tight" style="margin-top:10px;background:var(--surface-2)">' +
        '<p class="hint" style="margin-top:0">Ao concluir um arco satisfatoriamente, cumprir um Propósito ou algo maravilhoso/inesperado acontecer: escolha uma das opções abaixo.</p>' +
        '<div class="row" style="gap:10px;flex-wrap:wrap">' +
          '<button type="button" class="btn secondary" data-action="assim-clareza-nivel"'+(caixaClareza>=3?' disabled title="Nenhum Nível de Assimilação pra voltar"':'')+'>Subir 1 Nível de Determinação (volta 1 Nível de Assimilação)</button>' +
        '</div>';
      if(inoportunasComC.length){
        body += '<p class="hint" style="margin:10px 0 6px">Ou retire 1 Pressão ('+dadoHtml("p")+') de uma Assimilação Inoportuna já adquirida:</p><div class="row" style="gap:8px;flex-wrap:wrap">';
        inoportunasComC.forEach(function(m){
          var card = MUT_DECKS[m.cat][m.cardIdx]; var tier = card[2][m.tierIdx];
          var total = custoSimbolos(m.custo).p;
          body += '<button type="button" class="btn secondary" data-action="assim-clareza-c" data-mutid="'+m.id+'">'+esc(card[0]+" — "+tier[1])+' ('+(total-(m.neutralizadas||0))+'/'+total+' '+dadoHtml("p")+')</button>';
        });
        body += '</div>';
      } else {
        body += '<p class="hint" style="margin:10px 0 0">Nenhuma Assimilação Inoportuna com Pressão pra retirar no momento.</p>';
      }

    if(pool){

        '<h3 style="margin-bottom:8px">Teste de Assimilação em andamento</h3>' +
        '<p class="hint">Dados rolados: '+pool.dados.map(function(d){ return 'd'+d.sides+':'+d.face; }).join(', ')+'</p>' +
        (pool.pressaoAntes!=null ? '<p class="hint">Pressões para a perda: '+pool.pressaoAntes+' das Inoportunas + '+(pool.dados||[]).reduce(function(t,d){ return t+(d.p||0); },0)+' deste teste = <b>'+(pool.pressaoAntes+(pool.dados||[]).reduce(function(t,d){ return t+(d.p||0); },0))+'</b> / 10</p>' : '') +
        '<div class="budget ok"><span>Pool ainda disponível</span><span class="num">'+custoChipHtml("A".repeat(pool.sPool)+"B".repeat(pool.aPool)+"C".repeat(pool.pPool))+'</span></div>';
      MUT_CATS.filter(function(cat){ return cat!=="I"; }).forEach(function(cat){
        var idxs = pool.cartas[cat] || [];
        if(!idxs.length) return;
        body += '<h4 style="margin:12px 0 6px;text-transform:uppercase;font-family:\'Oswald\',sans-serif;font-size:12.5px;color:var(--ink-muted)">'+esc(MUT_SUITS[cat])+' ('+MUT_SIGLA[cat]+') sorteadas</h4>';
        idxs.forEach(function(idx){ body += mutCardHtml(c, cat, idx, {comPool:true}); });
      });
      body += '<div class="row" style="margin-top:8px"><button type="button" class="btn secondary" data-action="assim-encerrar">Encerrar este Teste (descarta o que sobrar do pool)</button></div>';
      body += '</div>';
    }

    // Registro manual de mutação: cobre dois casos - (1) Assimilações Singulares, que
    // cabe ao(à) Assimilador(a) oferecer e nunca são sorteadas pelo Teste, e (2) lançar
    // retroativamente qualquer mutação (de qualquer categoria) que a personagem já tinha
    // antes desse sistema existir na ficha, sem precisar simular um Teste de Assimilação
    // pra "sortear" a carta certa. Pedido do Marco em 27/09/2026.
    body += '<div class="card tight" style="margin-top:10px">' +
      '<h3 style="margin-bottom:8px">Adicionar mutação manualmente</h3>' +
      '<p class="hint">Use para registrar uma Assimilação Singular concedida pelo(a) Assimilador(a) (elas nunca são sorteadas pelo Teste) ou para lançar retroativamente uma mutação de qualquer categoria que a personagem já tinha antes desse sistema existir na ficha.</p>' +
      '<div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">' +
        '<select data-mancat style="max-width:220px">' + MUT_CATS.map(function(cat){ return '<option value="'+cat+'"'+(cat==="I"?' selected':'')+'>'+esc(MUT_SUITS[cat])+' ('+MUT_SIGLA[cat]+')</option>'; }).join('') + '</select>' +
        '<select data-mancard style="max-width:220px"></select>' +
        '<select data-mantier style="max-width:260px"></select>' +
        '<button type="button" class="btn secondary" data-action="assim-add-manual">Registrar mutação</button>' +
      '</div>' +
    '</div>';

    // Mutações já adquiridas, por categoria.
    var temAlguma = (c.mutAdquiridas||[]).length>0;
    body += '<h3 style="margin:14px 0 8px">Mutações adquiridas</h3>';
    if(!temAlguma){
      body += '<p class="hint">Nenhuma mutação de Assimilação adquirida ainda.</p>';
    } else {
      MUT_CATS.forEach(function(cat){
        var lista = (c.mutAdquiridas||[]).filter(function(m){ return m.cat===cat; });
        if(!lista.length) return;
        body += '<p class="lx-sub">'+esc(MUT_SUITS[cat])+' ('+MUT_SIGLA[cat]+')</p><div class="lx-lista">';
        lista.forEach(function(m){
          var card = MUT_DECKS[cat][m.cardIdx], tier = card[2][m.tierIdx];
          var totalP = custoSimbolos(m.custo).p, neutP = m.neutralizadas||0;
          var extra = custoChipHtml(m.custo) + (totalP && neutP>0 && m.cat==="H" ? '<span class="lx-sel">'+(totalP-neutP)+'/'+totalP+' '+dadoHtml("p")+'</span>' : '');
          body += caixaLinha("mut", m.id, esc(card[0]+" — "+tier[1]), formatEfeito(tier[2], false), extra);
        });
        body += '</div>';
      });
    }

    return sectionCard("assimilacao", "Assimilação (Mutações)", body);
  }
  CAIXAS.mut = function(id){
    var c = fichaAtual(); if(!c) return null;
    var m = (c.mutAdquiridas||[]).filter(function(x){ return x.id===id; })[0]; if(!m || !MUT_DECKS[m.cat]) return null;
    var card = MUT_DECKS[m.cat][m.cardIdx], tier = card[2][m.tierIdx];

      '<p>'+formatEfeito(tier[2], true)+'</p>' +
      (totalP && m.cat==="H" ? '<p class="hint">'+(totalP-neutP)+' de '+totalP+' '+dadoHtml("p")+' ainda contam para a perda'+(neutP>=totalP?' · efeito cessado':'')+'. A Clareza de Propósito retira Pressão.</p>' : '') +
      (totalP && m.cat!=="H" ? '<p class="hint">Pressão de carta que não é Inoportuna não conta para a perda da ficha (livro, pág. 124).</p>' : '') +
      '<div class="cx-acoes"><button type="button" class="btn secondary" data-action="assim-remover" data-mutid="'+m.id+'">Remover mutação</button></div>';

      el.addEventListener("click", function(){

    var manCatSel = app.querySelector('[data-mancat]');
    var manCardSel = app.querySelector('[data-mancard]');
    var manTierSel = app.querySelector('[data-mantier]');
    function refreshManTiers(){
      if(!manCatSel || !manCardSel || !manTierSel) return;
      var cat = manCatSel.value;
      var idx = parseInt(manCardSel.value,10);
      var card = MUT_DECKS[cat][idx];
      manTierSel.innerHTML = card[2].map(function(tier,ti){ return '<option value="'+ti+'">'+esc(tier[1])+' ('+custoSimbolosTexto(tier[0])+')</option>'; }).join('');
    }
    function refreshManCards(){
      if(!manCatSel || !manCardSel) return;
      var cat = manCatSel.value;
      manCardSel.innerHTML = MUT_DECKS[cat].map(function(card,idx){ return '<option value="'+idx+'">'+esc(card[0])+' ('+card[1]+')</option>'; }).join('');
      refreshManTiers();

      manCardSel.addEventListener("change", refreshManTiers);

    var addManBtn = app.querySelector('[data-action="assim-add-manual"]');

      if(tierJaAdquirido(c, cat, cardIdx, tierIdx)){ alert("Essa mutação já foi registrada."); return; }
      var tier = MUT_DECKS[cat][cardIdx][2][tierIdx];

      perdidoParaAssimilacao(c);
      marcarPendenteOuSalvar(c, "assim");
      renderSheet();
    });
    app.querySelectorAll('[data-action="assim-remover"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var mutId = btn.getAttribute("data-mutid");
        // Usa o modal de confirmação próprio da ficha (askConfirm), não o confirm()
        // nativo do navegador - dentro do iframe isolado onde o artifact roda, o
        // confirm() nativo pode ser bloqueado silenciosamente (mesma causa raiz já
        // corrigida na versão 73 pros botões "Limpar"/"excluir"; este botão novo
        // tinha ficado de fora daquela correção). Bug relatado pelo Marco em 27/09/2026.
        askConfirm("Remover esta mutação da ficha? Essa ação não pode ser desfeita.", function(){
          c.mutAdquiridas = (c.mutAdquiridas||[]).filter(function(m){ return m.id!==mutId; });
          marcarPendenteOuSalvar(c, "assim");
          renderSheet();
        });
      });
    });
  }


  function evoluirHtml(c){
    var x = xpDados(c), saldo = xpSaldo(c), gm = temAcessoTotal();
    var html = '<div class="budget '+(saldo<0?"bad":"ok")+'"><span>Experiência disponível</span><span class="num">'+saldo+'</span></div>';
    html += '<p class="hint">'+xpInicialDe(c)+' da criação + <b>'+x.recebida+'</b> recebidos do Assimilador − '+xpGasto(c)+' gastos. Só o Assimilador dá Experiência (no fim da sessão, pelo Painel).</p>';

      html += '<div class="row" style="gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 8px"><span class="hint" style="margin:0">Ajustar:</span>' +
        '<input type="number" min="1" max="50" value="1" data-evolxpqtd style="width:70px">' +
        '<input type="text" placeholder="motivo (opcional)" data-evolxpdet style="flex:1 1 140px">' +

    var baratoI = Math.min.apply(null, INSTINTOS.map(function(i){ return 3*(instintoBase(c, i[0])+1); }));
    html += '<div class="lx-lista" style="margin-top:6px">' +
      caixaLinha("evol", "cp", "Conhecimentos e Práticas", "Custa o dobro do nível que vai atingir", '<span class="lx-sel'+(baratoCP<=saldo?' forte':'')+'">a partir de '+baratoCP+' XP</span>') +
      caixaLinha("evol", "inst", "Instintos", (x.liberarInstinto ? "Liberado pelo Assimilador · custa o triplo do nível" : (gm ? "Ainda não liberado pro jogador" : "Só depois de uma sessão com mutação")), '<span class="lx-sel'+(x.liberarInstinto&&baratoI<=saldo?' forte':'')+'">'+(x.liberarInstinto||gm ? 'a partir de '+baratoI+' XP' : 'bloqueado')+'</span>') +
      caixaLinha("evol", "carac", "Características", gm ? "Conceder ou devolver Características" : "Pedir ao Assimilador", pedidasN ? '<span class="lx-sel alerta">'+pedidasN+' pedido'+(pedidasN>1?'s':'')+'</span>' : '') +

    '</div>';
    return html;

      '</select><button type="button" class="btn accent" data-evolpedir>'+(gm?'Conceder':'Pedir ao Assimilador')+'</button></div>';

  CAIXAS.evol = function(k){

  function bindEvoluir(c){
    function salvar(){ updateChar(c); if(caps.mode==="mesa"){ clearTimeout(publishTimer); doPublish(); } renderSheet(); }
    app.querySelectorAll('[data-evol]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var k = btn.getAttribute("data-id"), tipo = btn.getAttribute("data-evol");
        if(tipo === "cp"){
          var atual = valorCPBase(c,k), custo = 2*(atual+1);
          askConfirm('Subir '+nomeAtributo(k)+' de '+atual+' pra '+(atual+1)+' gastando '+custo+' de Experiência?', function(){
            if(xpSaldo(c) < custo) return;
            if(!c.caracAumentos) c.caracAumentos = {};
            c.caracAumentos[k] = atual+1; salvar();
          });
        } else {
          var atualI = instintoBase(c,k), custoI = 3*(atualI+1);
          askConfirm('Subir '+nomeAtributo(k)+' de '+atualI+' pra '+(atualI+1)+' gastando '+custoI+' de Experiência?', function(){
            if(xpSaldo(c) < custoI) return;
            if(!c.instintosEvol) c.instintosEvol = {};
            c.instintosEvol[k] = atualI+1; salvar();
          });
        }
      });
    });
    // Desfazer compras (só o Assimilador vê esses botões): pra quando alguém
    // comprou sem querer. A Experiência volta sozinha, porque o gasto é sempre
    // recalculado a partir do que está comprado. Fica anotado no histórico.
    function anotar(txt){
      if(!temAcessoTotal()) return;
      var x = c.xp || {}; x.historico = (x.historico||[]).concat([{ qtd:0, motivo:txt, ts:new Date().toISOString() }]);
      if(x.recebida == null) x.recebida = 0;
      c.xp = x;
    }
    app.querySelectorAll('[data-evolxp]').forEach(function(btn){
      btn.addEventListener("click", function(){
        if(!temAcessoTotal()) return;
        var q = Math.abs(parseInt((app.querySelector('[data-evolxpqtd]')||{}).value,10)||0); if(!q) return;
        var sinal = parseInt(btn.getAttribute("data-evolxp"),10);
        var det = ((app.querySelector('[data-evolxpdet]')||{}).value||"").trim();
        var motivo = "Ajuste do Assimilador" + (det ? ": "+det : "");
        askConfirm((sinal>0?'Dar ':'Retirar ')+q+' de Experiência '+(sinal>0?'pra ':'de ')+(c.nomePersonagem||"este personagem")+'?', function(){
          darExperiencia(c, sinal*q, motivo); salvar();
        });
      });
    });
    app.querySelectorAll('[data-evolmenos]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var k = btn.getAttribute("data-id"), tipo = btn.getAttribute("data-evolmenos");
        if(tipo === "cp"){
          var atual = valorCPBase(c,k), base = (c.conhPrat&&c.conhPrat[k])||0;
          askConfirm('Voltar '+nomeAtributo(k)+' de '+atual+' pra '+(atual-1)+' e devolver '+(2*atual)+' de Experiência?', function(){
            if(atual-1 <= base) delete c.caracAumentos[k]; else c.caracAumentos[k] = atual-1;
            anotar('Desfeito: '+nomeAtributo(k)+' '+atual+' → '+(atual-1)+' (devolveu '+(2*atual)+')');
            salvar();
          });
        } else {
          var atualI = instintoBase(c,k), baseI = (c.instintos&&c.instintos[k])||0;
          askConfirm('Voltar '+nomeAtributo(k)+' de '+atualI+' pra '+(atualI-1)+' e devolver '+(3*atualI)+' de Experiência?', function(){
            if(atualI-1 <= baseI) delete c.instintosEvol[k]; else c.instintosEvol[k] = atualI-1;
            anotar('Desfeito: '+nomeAtributo(k)+' '+atualI+' → '+(atualI-1)+' (devolveu '+(3*atualI)+')');
            salvar();
          });
        }
      });
    });
    app.querySelectorAll('[data-evolremover]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-evolremover"), d = carDef(id); if(!d) return;
        askConfirm('Remover "'+d.nome+'" de '+(c.nomePersonagem||"este personagem")+' e devolver '+d.custo+' de Experiência?', function(){
          c.caracComp = (c.caracComp||[]).filter(function(x){ return x!==id; });
          if(c.caracEscolhas) delete c.caracEscolhas[id];
          anotar('Desfeito: removida a Característica '+d.nome+' (devolveu '+d.custo+')');
          salvar();
        });
      });
    });
    var pedir = app.querySelector('[data-evolpedir]');
    if(pedir) pedir.addEventListener("click", function(){
      var sel = app.querySelector('#evol-carac'); var id = sel ? sel.value : "";
      var d = carDef(id); if(!d) return;
      if(temAcessoTotal()){
        askConfirm('Conceder "'+d.nome+'" pra '+(c.nomePersonagem||"este personagem")+', gastando '+d.custo+' de Experiência?', function(){
          if(xpSaldo(c) < d.custo) return;
          c.caracComp.push(id); salvar();
        });
      } else {
        c.caracPedidas = (c.caracPedidas||[]).concat([id]); salvar();
      }
    });
    app.querySelectorAll('[data-evolaprovar]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-evolaprovar"), d = carDef(id);
        if(!d || xpSaldo(c) < d.custo) return;
        c.caracPedidas = (c.caracPedidas||[]).filter(function(x){ return x!==id; });
        if(!temCarac(c,id)) c.caracComp.push(id);

  function bindSheetCampos(c, maxNivel){
    // Nome do jogador e Notas: só atualizam o objeto local a cada tecla (sem
    // publicar nada ainda) e só chamam updateChar/schedulePublish no "change"
    // (quando o campo perde o foco) - ver o comentário grande acima de
    // dirtyCharIds/schedulePublish: TODA publicação recarrega a página de
    // TODAS as abas abertas, inclusive a de quem está digitando. Publicar a
    // cada tecla (no "input") fazia o campo perder o foco e "travar" sempre
    // que a pessoa parava de digitar por mais de ~1 segundo (o tempo do
    // debounce). Assim, a mesa só vê a mudança quando a pessoa termina de
    // escrever e sai do campo, mas dá pra digitar um texto inteiro sem
    // interrupção.
    // Os dois campos podem não existir (seção Notas minimizada): sem eles, só pula.
    var jogadorInput = app.querySelector("[data-jogador]");
    if(jogadorInput){
      jogadorInput.addEventListener("input", function(e){ c.nomeJogador = e.target.value; });
      jogadorInput.addEventListener("change", function(){ updateChar(c); });
    }
    var notasInput = app.querySelector("[data-notas]");
    if(notasInput){
      notasInput.addEventListener("input", function(e){ c.notas = e.target.value; });
      notasInput.addEventListener("change", function(){ updateChar(c); });
    }
    var claimBtn = app.querySelector('[data-action="claim"]');
    if(claimBtn) claimBtn.addEventListener("click", function(){ marcarComoMeu(c.id); renderSheet(); });
    // Pode haver mais de um botão "Confirmar alterações" na tela ao mesmo tempo (uma
    // seção pendente por card - ver pendingSectionBannerHtml), mas todos confirmam o
    // personagem inteiro de uma vez só (não tem granularidade por campo).
    app.querySelectorAll('[data-action="confirmar-pendente"]').forEach(function(btn){
      btn.addEventListener("click", function(){ confirmarPendente(c); renderSheet(); });
    });

    // Bônus de Assimilação (ver seção "assimbonus" em renderSheet): steppers +/- e digitação
    // direta, sem teto fixo (só o mínimo de 0 - Assimilação não devolve pontos abaixo da base).
    if(!c.instintosAssimBonus) c.instintosAssimBonus = {};
    if(!c.conhPratAssimBonus) c.conhPratAssimBonus = {};
    bindStepper("instbonus", function(id){ return c.instintosAssimBonus[id]; }, function(id,v){ c.instintosAssimBonus[id] = v; }, 0, 99, function(){ updateChar(c); renderSheet(); });
    app.querySelectorAll('[data-instbonus]').forEach(function(el){
      // Mesma ideia do nome do jogador/Notas acima: só grava local a cada
      // tecla, só publica (updateChar) no "change" (ao sair do campo), pra
      // não recarregar a página no meio da digitação de um número.
      el.addEventListener("input", function(){
        c.instintosAssimBonus[el.getAttribute("data-instbonus")] = clamp(parseInt(el.value,10)||0, 0, 99);
      });
      el.addEventListener("change", function(){ updateChar(c); renderSheet(); });
    });
    bindStepper("cpbonus", function(id){ return c.conhPratAssimBonus[id]; }, function(id,v){ c.conhPratAssimBonus[id] = v; }, 0, 99, function(){ updateChar(c); renderSheet(); });
    app.querySelectorAll('[data-cpbonus]').forEach(function(el){
      el.addEventListener("input", function(){
        c.conhPratAssimBonus[el.getAttribute("data-cpbonus")] = clamp(parseInt(el.value,10)||0, 0, 99);
      });
      el.addEventListener("change", function(){ updateChar(c); renderSheet(); });
    });

    // Clicar num laço da trilha do Cabo de Guerra (ver tugDeGuerraCardHtml)
    // ajusta o Nível de Determinação/Assimilação direto pro laço clicado (11
    // posições de verdade, Nível 0 a 10 - ver nivelDetAtual/caixaAtual/
    // DET_CAIXA_FLOOR), enchendo os pontos dos dois lados de novo, igual a
    // regra da fonte manda sempre que um Nível sobe ou desce. Substitui o
    // controle de arrastar-e-soltar de antes (mais fiel ao visual da ficha
    // oficial, ver imagem anexada pelo Marco em 27/09/2026) - e, por ser um
    // clique único em vez de um gesto de arrasto, não tem a classe de bug do
    // "rollback" que existia com pointercancel em arrastos rápidos.
    app.querySelectorAll('[data-tuglvl]').forEach(function(el){
      el.addEventListener("click", function(){
        var novoNivelDet = parseInt(el.getAttribute("data-tuglvl"),10);
        var novoCaixa = clamp(novoNivelDet - 7, DET_CAIXA_FLOOR, 3);
        if(novoCaixa === c.determinacao.caixaAtual) return;
        c.determinacao.caixaAtual = novoCaixa;
        c.determinacao.pontosAtual = nivelDetAtual(c);
        c.determinacao.assimPontosAtual = null;
        atualizarSuscetivel(c);
        updateChar(c);
        renderSheet();
      });

    app.querySelectorAll('[data-tugpts]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var acao = btn.getAttribute("data-tugpts");
        if(acao === "det-menos"){ if(gastarDeterminacao(c,1)) marcarFlashSuscetivel(c); }
        else if(acao === "det-mais") devolverDeterminacaoNivel(c,1);
        else if(acao === "assim-menos") gastarAssimilacao(c,1);
        else if(acao === "assim-mais") devolverAssimilacao(c,1);
        marcarPendenteOuSalvar(c, "cabo"); renderSheet();
      });
    });

    app.querySelectorAll('[data-dots="nivel"] .diamond').forEach(function(dot){
      dot.addEventListener("click", function(){ c.saudeNivel = clamp(parseInt(dot.getAttribute("data-dotval"),10),0,6); marcarPendenteOuSalvar(c, "saude"); renderSheet(); });
    });
    app.querySelectorAll('[data-dots="pontos"] .diamond').forEach(function(dot){
      dot.addEventListener("click", function(){ c.saudePontosAtuais = clamp(parseInt(dot.getAttribute("data-dotval"),10),0,maxNivel); marcarPendenteOuSalvar(c, "saude"); renderSheet(); });
    });
    var bMenos = app.querySelector('[data-saude="menos"]'), bMais = app.querySelector('[data-saude="mais"]');
    if(bMenos) bMenos.addEventListener("click", function(){
      c.saudePontosAtuais = clamp((c.saudePontosAtuais||maxNivel)-1,0,maxNivel);
      if(c.saudePontosAtuais===0 && c.saudeNivel>0){ c.saudeNivel -= 1; c.saudePontosAtuais = maxNivel; }
      marcarPendenteOuSalvar(c, "saude"); renderSheet();
    });
    if(bMais) bMais.addEventListener("click", function(){
      c.saudePontosAtuais = clamp((c.saudePontosAtuais||0)+1,0,maxNivel); marcarPendenteOuSalvar(c, "saude"); renderSheet();
    });

    app.querySelectorAll('[data-dots="equipusos"] .dot').forEach(function(dot){
      dot.addEventListener("click", function(){ c.equip.usosAtual = clamp(parseInt(dot.getAttribute("data-dotval"),10),0,c.equip.usosMax); marcarPendenteOuSalvar(c, "equip"); renderSheet(); });
    });
    var repor = app.querySelector('[data-equipuso="repor"]');
    if(repor) repor.addEventListener("click", function(){ c.equip.usosAtual = c.equip.usosMax; marcarPendenteOuSalvar(c, "equip"); renderSheet(); });
    // Qualidade do Artefato e dos itens: -/+ muda o nível direto (reparo, melhoria,
    // decisão do Assimilador); "+1 Pressão" acumula até derrubar um nível (pág. 95).
    app.querySelectorAll('[data-equipq]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var q = c.equip.qualidade!=null ? c.equip.qualidade : 3;
        c.equip.qualidade = clamp(q + (btn.getAttribute("data-equipq")==="mais"?1:-1), 0, 6); c.equip.pressao = 0;
        marcarPendenteOuSalvar(c, "equip"); renderSheet();
      });
    });
    app.querySelectorAll('[data-equipp]').forEach(function(btn){
      btn.addEventListener("click", function(){ investirPressaoItem(c.equip, 1); marcarPendenteOuSalvar(c, "equip"); renderSheet(); });
    });
    app.querySelectorAll('[data-invq]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var it = c.inventarioExtra[parseInt(btn.getAttribute("data-idx"),10)]; if(!it) return;
        var q = it.qualidade!=null ? it.qualidade : 3;
        it.qualidade = clamp(q + (btn.getAttribute("data-invq")==="mais"?1:-1), 0, 6); it.pressao = 0;
        marcarPendenteOuSalvar(c, "inv"); renderSheet();
      });
    });
    app.querySelectorAll('[data-invp]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var it = c.inventarioExtra[parseInt(btn.getAttribute("data-idx"),10)]; if(!it) return;
        investirPressaoItem(it, 1); marcarPendenteOuSalvar(c, "inv"); renderSheet();
      });
    });
    var refazerBtn = app.querySelector('[data-action="refazer"]');
    if(refazerBtn) refazerBtn.addEventListener("click", function(){
      state.sheetEditing = true;
      state.sheetDraft = JSON.parse(JSON.stringify(c));
      render(); window.scrollTo(0,0);
    });

    var addInv = app.querySelector('[data-inv="add"]');
    if(addInv) addInv.addEventListener("click", function(){ state.itemDraft = newItemDraft(); renderSheet(); });
    if(state.itemDraft) bindItemForm(c, state.itemDraft);
    app.querySelectorAll('[data-inv="del"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        c.inventarioExtra.splice(parseInt(btn.getAttribute("data-idx"),10),1);
        if(state.caixa && state.caixa.indexOf("inv|") === 0) fecharCaixa();
        marcarPendenteOuSalvar(c, "inv"); renderSheet();
      });
    });
    app.querySelectorAll('[data-invuso="menos"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var it = c.inventarioExtra[parseInt(btn.getAttribute("data-idx"),10)];
        if(it) it.usosAtual = clamp((it.usosAtual||0)-1, 0, it.usosMax);
        marcarPendenteOuSalvar(c, "inv"); renderSheet();

  function pickBestIndices(results, n){
    var idxs = results.map(function(_,i){ return i; });
    idxs.sort(function(a,b){
      var A = results[a], B = results[b];
      if(B.s !== A.s) return B.s - A.s;
      if(B.a !== A.a) return B.a - A.a;
      return A.p - B.p;
    });
    return idxs.slice(0, n);
  }

    var agirIndisponivel = !t.agir && !agirPorInstintoDisponivel(c);

    if(!t.rolling && (agirIndisponivel || extraIndisponivel)) body += '<p class="hint">Alguma opção está bloqueada por falta de pontos. Veja em <b>Como funciona</b>.</p>';

      for(var k=0;k<n;k++){ spins += '<span class="die-spin">?</span>'; }
      body += '<div class="dice-anim">'+spins+'</div>';
    } else if(t.results.length){
      var kept = t.results.filter(function(d){ return d.kept; });
      var totS = sum(kept.map(function(d){return d.s;}));
      var totA = sum(kept.map(function(d){return d.a;}));

        '<div class="row" style="flex-wrap:wrap;gap:8px">';
      t.results.forEach(function(d, idx){
        body += '<button type="button" class="btn secondary" data-testtoggle="'+idx+'" '+(t.registered?'disabled':'')+' style="font-family:\'IBM Plex Mono\',monospace'+(d.kept?'':';opacity:.4;text-decoration:line-through')+(t.registered?';cursor:default':'')+'">d'+d.sides+':'+d.face+' ('+diceResultHtml(d)+')</button>';
      });
      body += '</div>';
      body += '<div class="budget ok" style="margin-top:12px"><span>Resultado '+(t.registered?"registrado":"mantido (ainda não registrado)")+'</span><span class="num">'+resultBadges(totS,totA,totP)+'</span></div>';
      if(t.registered){
        body += '<p class="hint" style="margin-top:8px">✓ Este resultado já foi registrado no Histórico de Testes.</p>';
      } else {
        body += '<div class="row" style="margin-top:10px"><button class="btn accent" data-testaction="confirm"'+(kept.length?'':' disabled title="Marque pelo menos um dado"')+'>Confirmar escolha e registrar no histórico</button></div>';
      }
      body += '</div>';
    }
    return sectionCard("testar", "Testar", body);
  }

  CAIXAS.testar = function(){
    var c = fichaAtual(); if(!c) return null;
    var corpo = '<p>Escolha o <b>Instinto</b> e a <b>Prática ou Conhecimento</b> do teste: a pilha de dados é montada sozinha com os valores da ficha (1d6 por ponto de Instinto, 1d10 por ponto de Prática/Conhecimento).</p>' +
      '<p><b>Agir por Instinto (Rolagem Assimilada):</b> escolha dois Instintos no lugar de Instinto + Prática/Conhecimento (pode repetir o mesmo nos dois). Os dados desses Instintos viram d12 e você mantém 1 dado a mais. Gasta 1 ponto de Assimilação, ou 2 de Determinação se não houver Assimilação disponível.</p>' +
      '<p><b>Empenho (dado extra):</b> pra manter um dado a mais nessa rolagem, declare antes de rolar. Gasta 1 ponto de Determinação.</p>' +
      '<p>'+(autoLigada("dadosMantidosAuto") ? 'Depois que os dados caírem, os melhores já vêm marcados; clique num dado pra manter ou soltar outro (ex.: tensionando uma Origem) e confirme pra registrar no histórico.' : 'Depois que os dados caírem, clique nos dados que quer manter (quantos foram declarados antes de rolar) e confirme pra registrar no histórico.')+'</p>' +
      '<p class="hint">Os pontos de Agir por Instinto e do dado extra são gastos assim que a caixa é marcada (só voltam se for desmarcada antes de rolar), por isso uma opção pode ficar bloqueada se não sobrar recurso pra ela. Esse gasto só vai pra mesa quando o teste é confirmado no botão "Confirmar escolha e registrar no histórico".</p>';
    return { titulo:"Testar: como funciona", corpo:corpo, lado:"direita", largura:440 };
  };
  function bindSheetTest(c){
    var t = state.sheetTest;
    if(t.rolling){ iniciarTickerDados(); }
    var instSel = app.querySelector('[data-test="instinto"]');
    if(instSel) instSel.addEventListener("change", function(){ t.instintoKey = instSel.value; t.results = []; t.registered = false; renderSheet(); });
    var segSel = app.querySelector('[data-test="segundo"]');
    if(segSel) segSel.addEventListener("change", function(){
      if(t.agir) t.instinto2Key = segSel.value; else t.cpKey = segSel.value;
      t.results = [];
      t.registered = false;
      renderSheet();
    });
    // "Agir por Instinto" e "Manter +1 dado extra": o(s) ponto(s) de recurso
    // são gastos (ou devolvidos) NA HORA que a caixa é marcada/desmarcada,
    // pra já refletir no HUD desta aba e bloquear gasto duplo - mas isso fica
    // só como PENDÊNCIA local (marcarPendenteOuSalvar, o mesmo mecanismo já
    // usado por Saúde/Cabo de Guerra/Equipamento), nunca sincronizado com a
    // mesa nesse momento. Só quando o teste é de fato confirmado (ver
    // confirmBtn abaixo) é que esse gasto é publicado - junto com a entrada
    // nova no Histórico de Testes, numa publicação só. Isso evita que só
    // marcar/desmarcar essas caixas (ou rolar, ou trocar qual dado fica
    // mantido) já dispare uma atualização/recarregamento pra mesa inteira
    // antes do jogador terminar de decidir o teste. A pendência tem a mesma
    // rede de segurança das outras seções: sair da ficha ou fechar a aba
    // confirma sozinho (ver goto/aoDescarregarAba).
    // Um "snapshot" de antes do gasto é guardado em t.agirSnapshot/extraSnapshot
    // pra permitir desfazer com exatidão (inclusive uma caixa de Determinação
    // que tenha virado no meio do caminho) se a pessoa desmarcar antes de
    // rolar; rolar de fato limpa esses snapshots (ver rollBtn abaixo), o que
    // OFICIALIZA o gasto localmente - a partir daí desmarcar não devolve mais
    // nada (mas a sincronização com a mesa continua esperando o confirmar).
    // Gastar 1 ponto de Determinação por essas caixas é o mesmo gasto do botão
    // "-1 ponto" do Cabo de Guerra (gastarDeterminacao, que cascateia o Nível
    // e sinaliza pra marcarFlashSuscetivel quando isso acontece).
    // Agir por Instinto (Rolagem Assimilada, livro definitivo pág. 41/60): custa 1
    // ponto de Assimilação primeiro; sem nenhum sobrando, cai pra 2 pontos de
    // Determinação em substituição - ver agirPorInstintoDisponivel. Corrigido em
    // 27/09/2026 (antes gastava sempre 1 de Determinação, sem nunca tocar
    // Assimilação - o oposto da regra oficial).
    var agirChk = app.querySelector('[data-test="agir"]');
    if(agirChk) agirChk.addEventListener("change", function(){
      var ligar = agirChk.checked;
      if(ligar){
        if(!agirPorInstintoDisponivel(c)){ agirChk.checked = false; alert("Sem Pontos de Assimilação nem de Determinação: não dá pra Agir por Instinto agora."); return; }
        if(assimilacaoDisponivel(c)){
          t.agirUsouAssim = true;
          gastarAssimilacao(c,1);
        } else {
          t.agirUsouAssim = false;
          t.agirSnapshot = { caixaAtual:c.determinacao.caixaAtual, pontosAtual:c.determinacao.pontosAtual };
          if(gastarDeterminacao(c,2)) marcarFlashSuscetivel(c);
        }
      } else {
        if(t.agirUsouAssim){ devolverAssimilacao(c,1); }
        else if(t.agirSnapshot){ c.determinacao.caixaAtual = t.agirSnapshot.caixaAtual; c.determinacao.pontosAtual = t.agirSnapshot.pontosAtual; }
        t.agirSnapshot = null;
      }
      marcarPendenteOuSalvar(c, "teste");
      t.agir = ligar; t.results = []; t.registered = false; renderSheet();
    });
    // Manter +1 dado extra é o Empenho (livro definitivo pág. 59): só gasta
    // Determinação, nunca Assimilação - ver extraDadoDisponivel.
    var extraChk = app.querySelector('[data-test="extra"]');
    if(extraChk) extraChk.addEventListener("change", function(){
      var ligar = extraChk.checked;
      if(ligar){
        if(!extraDadoDisponivel(c)){ extraChk.checked = false; alert("Sem pontos de Determinação: não dá pra manter um dado extra agora."); return; }
        t.extraSnapshot = { caixaAtual:c.determinacao.caixaAtual, pontosAtual:c.determinacao.pontosAtual };
        if(gastarDeterminacao(c,1)) marcarFlashSuscetivel(c);
      } else if(t.extraSnapshot){
        c.determinacao.caixaAtual = t.extraSnapshot.caixaAtual;
        c.determinacao.pontosAtual = t.extraSnapshot.pontosAtual;
        t.extraSnapshot = null;
      }
      marcarPendenteOuSalvar(c, "teste");
      t.extraDado = ligar; renderSheet();
    });
    var rollBtn = app.querySelector('[data-testaction="roll"]');
    if(rollBtn) rollBtn.addEventListener("click", function(){
      var instintoDado = t.agir ? 12 : 6;
      var baseInst = t.instintoKey ? valorInstinto(c,t.instintoKey) : 0;
      var baseInst2 = (t.agir && t.instinto2Key) ? valorInstinto(c,t.instinto2Key) : 0;
      var dInst = baseInst + baseInst2;
      var d10 = (!t.agir && t.cpKey) ? valorCP(c,t.cpKey) : 0;
      if(dInst+d10 <= 0){ alert("Esse Instinto (e Prática/Conhecimento, se não for Agir por Instinto) está em 0: não há dados pra rolar."); return; }
      // O número de dados mantidos (keepN) é decidido AQUI, antes da rolagem: base de
      // 1 (ou 2, Agir por Instinto) mais 1 se "manter +1 dado extra" foi declarado
      // antes de rolar. Isso é o que o jogador vai poder ajustar (trocar QUAIS dados,
      // não QUANTOS) depois que os dados caírem, antes de confirmar pro histórico.
      var keepN = (t.agir ? 2 : 1) + (t.extraDado ? 1 : 0);
      // Os pontos de "Agir por Instinto"/"dado extra" já foram gastos
      // localmente (mas ainda como pendência, não sincronizados com a mesa -
      // ver os handlers de "agir"/"extra" acima) no momento em que as caixas
      // foram marcadas. Rolar de fato só OFICIALIZA esse gasto localmente:
      // limpa os snapshots, então desmarcar essas caixas depois daqui não
      // devolve mais nada - mas a sincronização com a mesa continua esperando
      // o "Confirmar escolha e registrar no histórico" (ver confirmBtn abaixo).
      t.agirSnapshot = null;
      t.extraSnapshot = null;
      t.agirUsouAssim = false;
      t.keepN = keepN;
      t.extraDado = false;
      t.registered = false;
      pararAnimacaoDados();
      t.rolling = true;
      t.rollingCount = dInst + d10;
      renderSheet();
      diceAnimTimeout = setTimeout(function(){
        diceAnimTimeout = null;
        pararAnimacaoDados();
        var results = [];
        var i;
        for(i=0;i<dInst;i++) results.push(rollDie(instintoDado));
        for(i=0;i<d10;i++) results.push(rollDie(10));
        results.forEach(function(d){ d.kept = false; });
        // Automação da campanha: marca sozinho os melhores dados; desligada, o jogador escolhe.
        if(autoLigada("dadosMantidosAuto")) pickBestIndices(results, Math.min(keepN, results.length)).forEach(function(idx){ results[idx].kept = true; });
        t.results = results;
        t.rolling = false;
        renderSheet();
        // Easter egg do fundo: 2+ Pressões nos dados mantidos.
        fundoPressaoSe(sum(results.filter(function(d){ return d.kept; }).map(function(d){ return d.p; })));
      }, 650);
    });
    app.querySelectorAll('[data-testtoggle]').forEach(function(btn){
      btn.addEventListener("click", function(){
        if(t.registered) return;
        var idx = parseInt(btn.getAttribute("data-testtoggle"),10);
        t.results[idx].kept = !t.results[idx].kept;
        renderSheet();
        if(t.results[idx].kept && t.results[idx].p) fundoPressaoSe(sum(t.results.filter(function(d){ return d.kept; }).map(function(d){ return d.p; })));
      });
    });
    // Só quando o jogador confirma a escolha final de quais dados ficam mantidos
    // é que o teste entra pro Histórico de Testes - nunca automaticamente assim
    // que os dados caem (pra dar tempo de tensionar uma Origem, trocar qual dado
    // fica, etc. antes de registrar de vez). Esse clique também é o ÚNICO
    // momento em que o teste inteiro (a entrada no Histórico e, se for o caso,
    // o gasto de Agir por Instinto/Empenho ainda pendente neste personagem -
    // ver marcarPendenteOuSalvar acima) é de fato sincronizado com a mesa,
    // numa publicação só: nem marcar/desmarcar as caixas, nem rolar, nem
    // trocar qual dado fica mantido disparam nenhuma atualização por conta
    // própria (pedido do Marco em 27/09/2026, pra parar de atualizar a mesa
    // inteira a cada ação declarada durante um teste).
    var confirmBtn = app.querySelector('[data-testaction="confirm"]');
    if(confirmBtn) confirmBtn.addEventListener("click", function(){
      var keptNow = t.results.filter(function(d){return d.kept;});
      if(!keptNow.length){ alert("Marque pelo menos um dado pra manter."); return; }
      var totS = sum(keptNow.map(function(d){return d.s;}));
      var totA = sum(keptNow.map(function(d){return d.a;}));
      var totP = sum(keptNow.map(function(d){return d.p;}));
      var instLbl = (INSTINTOS.filter(function(i){return i[0]===t.instintoKey;})[0]||[null,t.instintoKey])[1];
      var segLbl = t.agir
        ? (INSTINTOS.filter(function(i){return i[0]===t.instinto2Key;})[0]||[null,t.instinto2Key])[1]
        : (CONH_PRAT.filter(function(p){return p[0]===t.cpKey;})[0]||[null,t.cpKey])[1];
      registrarTeste({
        charId: c.id, nomePersonagem: c.nomePersonagem, nomeJogador: c.nomeJogador,
        acampamento: c.acampamento,
        label: instLbl+" + "+segLbl+(t.agir?" (Agir por Instinto)":""),
        resultado: totS+" Suc · "+totA+" Adap · "+totP+" Press",
        totS: totS, totA: totA, totP: totP,
        dados: t.results.map(function(d){ return {sides:d.sides, face:d.face, s:d.s, a:d.a, p:d.p, kept:d.kept}; })
      });
      // registrarTeste já marcou o teste como pendência (schedulePublish, modo
      // mesa) - se este personagem também tinha um gasto de Agir por
      // Instinto/Empenho ainda pendente (marcarPendenteOuSalvar acima),
      // confirmarPendente publica os dois juntos agora, na hora, em vez de
      // esperar o debounce de schedulePublish. Sem gasto pendente, força a
      // mesma publicação imediata (em vez de esperar até 1,2s) - confirmar é
      // uma ação deliberada, não precisa de debounce.
      if(temPendente(c)){ confirmarPendente(c); }
      else { clearTimeout(publishTimer); doPublish(); }
      t.registered = true;
      renderSheet();
    });
  }

  // Caixa "É um NPC": só aparece pro Assimilador (jogador não esconde a própria ficha).
  function npcCheckboxHtml(c, attr){
    if(!temAcessoTotal()) return '';
    return '<label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;margin:10px 0 0"><input type="checkbox" style="width:auto" '+attr+(c.ehNpc?" checked":"")+'> É um NPC (personagem controlado pelo Assimilador): a ficha e as rolagens dele ficam escondidas dos jogadores (aba Mesa, Histórico de Rolagens e painel flutuante) — só o Assimilador vê.</label>' +
      '<p class="hint" style="margin:4px 0 0">Desmarcado, a ficha fica na sua própria conta. Pra dar a ficha a um jogador, deixe como NPC e depois use <b>Passar para um jogador</b> no Painel do Assimilador.</p>';
  }
  // Na edição comum (fora do "Refazer"), só o Assimilador mexe no passo de Experiência.
  function editPassos(c){
    var vis = wizEtapas();
    // Passo 6 continua aparecendo pra quem já tem Artefato, mesmo com a etapa desligada.
    if(vis.indexOf(6) < 0 && c && c.equip && c.equip.nome) vis.push(6);
    var temExtras = (cfgCriacao().camposExtras||[]).length > 0 || (c && !c.acampamento && grupoOpcoes().length > 0);
    if(temAcessoTotal()) return vis;
    // Textos da ficha (Origem, Propósitos e Conexões) sempre editáveis pelo jogador.
    // Características também editáveis pelo jogador (pedido do Marco, 30/09/2026);
    // o limite de Experiência e os requisitos continuam valendo ao salvar.
    // Etapa C: os campos extras da campanha (passo 0) também.
    return vis.filter(function(st){ return st !== 0 || temExtras; });
  }
  // ----- SHEET EDIT MODE (reaproveita a UI do assistente pra Instintos/Conh.Prat/Caracteristicas/Equipamento) -----
  function renderSheetEdit(){
    var draft = state.sheetDraft;
    if(!draft){ goto("sheet"); return; }
    if(!isCharUnlocked(draft)){ goto("sheet", {charId: draft.id}); return; }
    var camp = draft.acampamento ? CAMPS[draft.acampamento] : null;
    var html = topbar("sheet");
    html += '<div'+(camp?' style="--camp-color:'+camp.cor+'"':'')+'>';
    var passosEdit = editPassos(draft);
    var livre = temAcessoTotal();
    html += '<div class="card"><h2>'+(draft.precisaRefazer?'Refazendo no sistema oficial: ':'Editando: ')+esc(draft.nomePersonagem||"personagem")+'</h2>' +
      (livre ? '<p class="hint" style="margin:0">Como Assimilador, você pode mudar qualquer coisa: os limites da criação (Instinto até 3, Conhecimento/Prática até 2, pontos exatos, Escassez do Artefato, requisitos) não travam nada aqui. Se algo sair das regras, o site só avisa antes de salvar.</p>' :
      '<div class="field" style="max-width:320px"><label>Nome do personagem</label><input type="text" data-editnome value="'+esc(draft.nomePersonagem)+'"></div>' +
      npcCheckboxHtml(draft, 'data-editnpc')) +
    '</div>';

    passosEdit.forEach(function(step){
      html += '<div class="card"><h2>'+esc(step === 0 && !livre ? "Campos da campanha" : wizRotulo(step))+'</h2>' + wizardStepBody(draft, step) + '</div>';
    });
    if(passosEdit.indexOf(5) === -1) html += '<div class="card"><h2>'+esc(wizRotulo(5))+'</h2><p class="hint" style="margin:0">Depois da criação, a Experiência é gasta na seção <b>Evoluir</b> da ficha: Conhecimentos e Práticas direto, Características com autorização do Assimilador.</p></div>';

    html += '<div class="btn-row"><button class="btn secondary" data-editaction="cancel">Cancelar edição</button><button class="btn accent" data-editaction="save">Salvar alterações</button></div>';
    html += '</div>';

    app.innerHTML = html + caixaHtml();
    bindGlobal();

    var nomeEdit = app.querySelector('[data-editnome]');
    if(nomeEdit) nomeEdit.addEventListener("input", function(e){ draft.nomePersonagem = e.target.value; });
    var npcEdit = app.querySelector('[data-editnpc]');
    if(npcEdit) npcEdit.addEventListener("change", function(e){ draft.ehNpc = e.target.checked; });
    passosEdit.forEach(function(step){ bindWizardStep(draft, step, renderSheetEdit); });

    app.querySelector('[data-editaction="cancel"]').addEventListener("click", function(){
      var id = draft.id;
      state.sheetEditing = false; state.sheetDraft = null;
      goto("sheet", {charId:id});
    });
    app.querySelector('[data-editaction="save"]').addEventListener("click", function(){
      if(!draft.nomePersonagem || !draft.nomePersonagem.trim()){ alert("Dê um nome ao personagem."); return; }
      var semReqMsg = caracSemRequisitoMsg(draft);
      if(semReqMsg){ alert(semReqMsg); return; }
      var problemas = [];
      for(var s=3;s<=6;s++){
        var v = validateStep(draft, s);
        if(!v.ok){
          if(!livre){ alert(v.msg); return; }
          problemas.push(v.msg);
        }
      }
      if(problemas.length){
        askConfirm("Essa ficha fica fora das regras de criação: " + problemas.join(" ") + " Salvar mesmo assim?", salvarEdicao);
        return;
      }
      salvarEdicao();
    });
    function salvarEdicao(){
      draft.precisaRefazer = false;
      draft.equip.usosMax = equipUsosMax(draft); if(draft.equip.usosAtual==null || draft.equip.usosAtual > (draft.equip.usosMax||0)) draft.equip.usosAtual = draft.equip.usosMax;
      draft.equip.espaco = equipEspaco(draft);
      if(draft.saudePontosAtuais!=null && draft.saudePontosAtuais > saudePontosMax(draft)) draft.saudePontosAtuais = saudePontosMax(draft);
      updateChar(draft);
      var id = draft.id;
      state.sheetEditing = false; state.sheetDraft = null;
      goto("sheet", {charId:id});
    }
  }

  // ----- ROLADOR DE DADOS -----
  function rollDie(sides){
    var face = 1 + Math.floor(Math.random()*sides);
    var conv = DICE_TABLE[sides][face] || {s:0,a:0,p:0};
    return { sides:sides, face:face, s:conv.s, a:conv.a, p:conv.p, kept:true };
  }
  function diceResultLabel(d){
    var parts = [];
    if(d.s) parts.push("✓"+d.s);
    if(d.a) parts.push("⟳"+d.a);
    if(d.p) parts.push("⚠"+d.p);
    return parts.length ? parts.join(" ") : "em branco";
  }
  // Emblemas coloridos de Sucesso/Adaptação/Pressão: usados em vez de só números
  // soltos sempre que mostramos o resultado de uma rolagem (na ficha e no histórico).
  function resultBadges(totS, totA, totP){
    return '<span class="result-badges">' +
      '<span class="rbadge rb-s" title="Sucesso">'+dadoHtml("s")+' '+totS+'</span>' +
      '<span class="rbadge rb-a" title="Adaptação">'+dadoHtml("a")+' '+totA+'</span>' +
      '<span class="rbadge rb-p" title="Pressão">'+dadoHtml("p")+' '+totP+'</span>' +
    '</span>';
  }
  // Losangos pequenos e só decorativos (sem clique) pra mini-ficha da aba Mesa.
  function diamondsMini(atual, max, colorClass){
    return '<div class="dots mini">' + diamonds(atual, max, "", colorClass) + '</div>';
  }

  // Trilha compacta e só-leitura (sem clique) do Cabo de Guerra, mesmo visual
  // de laços do livro usado no Painel do Assimilador (ver gmCharCardBody) e na
  // ficha principal (tugDeGuerraCardHtml) - usada nos cards da tela de
  // Personagens e na mini-ficha da aba Mesa no lugar da antiga barra de

  function tugMiniBarHtml(c){

      '<span class="hint" style="display:block;margin-bottom:3px">Determinação/Assimilação (Nível '+nivelDet+'/10)</span>' +
